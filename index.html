// Kiralık gönderme/alma sırasında maaş paylaşımı ve satın alma opsiyonu
// şartlarının belirlendiği pazarlık ekranı.
function renderLoanNegotiationModal(){
  if(!loanNegotiation) return '';
  const n = loanNegotiation;
  const p = state.players[n.pid];
  if(!p){ loanNegotiation = null; return ''; }
  const isOut = n.direction === 'out';
  const ownerLabel = isOut ? 'Siz' : (state.clubs[p.club] ? state.clubs[p.club].name : 'Sahibi kulüp');
  const borrowerLabel = isOut ? 'Kiralayan kulüp' : 'Siz';
  const ownerPays = n.wageSharePct;
  const borrowerPays = 100 - n.wageSharePct;
  const feeBase = loanFeeFor(p);
  const buyTypeBtn = (val,label) => `<button class="btn ${n.buyType===val?'buy':'secondary'}" style="flex:1;" onclick="setLoanNegField('buyType','${val}')">${label}</button>`;
  return `<div class="champ-overlay" style="z-index:9999;">
    <div class="champ-card" style="max-width:600px;background:linear-gradient(135deg, #1a3a52 0%, #0f2433 100%);border-color:var(--cyan);">
      <div class="champ-trophy">🔄</div>
      <div class="champ-title">${isOut ? 'KİRALIĞA GÖNDER' : 'KİRALA'}</div>
      <div class="champ-sub" style="font-size:13px;">${p.flag} ${p.name} · ${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · Maaş: ${fmtMoney(p.wage)}/yıl</div>

      <div style="margin:16px 0;text-align:left;">
        <div class="slot-label" style="margin-bottom:6px;">Maaş Paylaşımı — ${ownerLabel} %${ownerPays} · ${borrowerLabel} %${borrowerPays}</div>
        <input type="range" min="0" max="100" step="5" value="${n.wageSharePct}" oninput="setLoanNegField('wageSharePct', this.value)" style="width:100%;">
        <div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px;">Sahibi kulüp maaşın ne kadarını üstlenirse, teklif o kadar cazip olur.</div>
      </div>

      <div style="margin:16px 0;text-align:left;">
        <div class="slot-label" style="margin-bottom:6px;">Satın Alma Opsiyonu</div>
        <div style="display:flex;gap:8px;">
          ${buyTypeBtn('none','Yok')}
          ${buyTypeBtn('optional','Opsiyonel')}
          ${buyTypeBtn('mandatory','Zorunlu')}
        </div>
      </div>

      ${n.buyType!=='none' ? `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;text-align:left;">
        <div>
          <div class="slot-label" style="margin-bottom:3px;">Satın Alma Bedeli</div>
          <input type="text" inputmode="numeric" value="${fmtThousands(n.buyFee)}" style="width:150px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:8px 10px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setLoanNegField('buyFee', v))">
        </div>
        ${n.buyType==='mandatory' ? `
        <div>
          <div class="slot-label" style="margin-bottom:3px;">Şart: Kaç Maça Çıkarsa</div>
          <input type="text" inputmode="numeric" value="${n.requiredApps}" style="width:90px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:8px 10px;border-radius:6px;" oninput="setLoanNegField('requiredApps', this.value)">
        </div>` : ''}
      </div>
      <div style="font-size:11px;color:var(--ink-faint);margin-bottom:10px;">${n.buyType==='mandatory' ? 'Oyuncu bu sezon içinde belirtilen maç sayısına ulaşırsa transfer otomatik ve zorunlu olarak gerçekleşir.' : 'Kiralayan kulüp, sezon içinde dilediği an bu bedelle kalıcı satın alma hakkına sahip olur — zorunlu değildir.'}</div>
      ` : ''}

      <div style="margin:16px 0;text-align:left;">
        <div class="slot-label" style="margin-bottom:3px;">Kiralama Bedeli (peşin)</div>
        <input type="text" inputmode="numeric" value="${fmtThousands(n.feeAmount)}" style="width:150px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:8px 10px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setLoanNegField('feeAmount', v))">
        <div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px;">Piyasa değerine göre önerilen bedel: ${fmtMoney(feeBase)}. ${isOut ? 'Talep ettiğiniz bedel yükseldikçe kiralayan kulübün teklifi kabul etme olasılığı düşer.' : 'Sunduğunuz bedel arttıkça sahibi kulübün teklifi kabul etme olasılığı yükselir.'}</div>
      </div>

      <div style="display:flex;gap:10px;">
        <button class="btn buy" style="flex:1;" onclick="${isOut?'confirmLoanOut()':'confirmLoanIn()'}">✅ Teklifi Sun</button>
        <button class="btn secondary" style="flex:1;" onclick="cancelLoanNegotiation()">Vazgeç</button>
      </div>
    </div>
  </div>`;
}

function renderLoans(){
  const myClub = state.clubs[state.playerClubId];
  const winStatus = transferWindowStatus();
  const windowBanner = `<div class="banner" style="${winStatus.open?'':'color:var(--red-neg);border-color:var(--red-neg);'}">${winStatus.open?'🟢':'🔒'} ${winStatus.label}</div>`;

  // ---- Kadromdan kiralığa gönderilebilecek oyuncular (benim, sakat olmayan,
  // başkasından kiralık olmayan oyuncularım) ----
  const eligibleToSend = myClub.squad
    .map(id=>state.players[id])
    .filter(p=>p && !p.injured && !p.loanFromClub);

  const sendRows = eligibleToSend.map(p=>`
    <tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag} ${p.name}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span></div></div></div></td>
      <td class="mono">${p.rating}</td>
      <td class="mono">${fmtMoney(p.wage)}/yıl</td>
      <td><button class="btn secondary" ${winStatus.open?'':'disabled'} onclick="loanOutPlayer(${p.id})">🔄 Kiralığa Gönder</button></td>
    </tr>`).join("");

  // ---- Kiralıktaki kendi oyuncularım (şu an başka kulüpte) ----
  const myPlayersAway = Object.values(state.players).filter(p=>p.loanFromClub === myClub.id);
  const awayRows = myPlayersAway.map(p=>{
    const dest = state.clubs[p.club];
    const shareNote = p.loanWageSharePct>0 ? `Maaşın %${p.loanWageSharePct}'i sizden` : '';
    const optNote = p.loanBuyOption ? (p.loanBuyOption.type==='mandatory' ? `🔒 Zorunlu opsiyon: ${p.loanAppsCount||0}/${p.loanBuyOption.requiredApps} maç` : `Opsiyonel satın alma: ${fmtMoney(p.loanBuyOption.fee)}`) : '';
    return `<tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag} ${p.name}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · ${dest?dest.name:"—"}</div></div></div></td>
      <td class="mono">${p.rating}</td>
      <td style="font-size:11px;">Sezon sonunda döner${shareNote?'<br>'+shareNote:''}${optNote?'<br>'+optNote:''}</td>
      <td><button class="btn secondary" onclick="recallLoanPlayer(${p.id})">↩️ Geri Çağır</button></td>
    </tr>`;
  }).join("");

  // ---- Kiralık alınabilecek oyuncular (diğer kulüplerin genç/yedek oyuncuları) ----
  // 80+ OVR oyuncular sadece (a) kendi kulübünün muhtemel ilk 11'inde yer
  // almıyorsa (yani zaten oynamıyorsa) havuza girebilir, ve (b) havuzda
  // toplamda en fazla birkaç tane (tek tük) gösterilir. Sabit (id'ye bağlı)
  // bir sıralama kullanılır ki hangi oyuncuların seçildiği her render'da aynı
  // kalsın (flicker olmasın).
  const loanBasePool = Object.values(state.players).filter(p=>
    p.club && p.club !== state.playerClubId && p.club !== "retired" && p.club !== "sold" &&
    !p.loanFromClub && !p.injured && p.age <= 24
  );
  const normalLoanPool = loanBasePool
    .filter(p=>p.rating < LOAN_HIGH_OVR_THRESHOLD)
    .map(p=>({ p, seed: (p.id * 2654435761) % 100000 }))
    .sort((a,b)=>a.seed-b.seed)
    .slice(0, LOAN_NORMAL_MAX_COUNT)
    .map(x=>x.p);
  const highOvrLoanPool = loanBasePool
    .filter(p=>p.rating >= LOAN_HIGH_OVR_THRESHOLD && !lineupEffectiveXIIds(p.club).includes(p.id))
    .map(p=>({ p, seed: (p.id * 2654435761) % 100000 }))
    .sort((a,b)=>a.seed-b.seed)
    .slice(0, LOAN_HIGH_OVR_MAX_COUNT)
    .map(x=>x.p);
  let loanPool = normalLoanPool.concat(highOvrLoanPool);
  if(loanFilters.pos !== "ALL") loanPool = loanPool.filter(p=>p.pos===loanFilters.pos);
  if(loanFilters.q){
    const q = loanFilters.q.toLowerCase();
    loanPool = loanPool.filter(p=>p.name.toLowerCase().includes(q));
  }
  loanPool.sort((a,b)=>b.rating-a.rating);

  const totalItems = loanPool.length;
  const totalPages = Math.max(1, Math.ceil(totalItems / LOAN_PAGE_SIZE));
  if(loanPage > totalPages) loanPage = totalPages;
  if(loanPage < 1) loanPage = 1;
  const startIdx = (loanPage-1) * LOAN_PAGE_SIZE;
  const shownPool = loanPool.slice(startIdx, startIdx + LOAN_PAGE_SIZE);

  const poolRows = shownPool.map(p=>{
    const clubLabel = state.clubs[p.club] ? state.clubs[p.club].name : "-";
    const fee = loanFeeFor(p);
    const canAfford = myClub.budget >= fee;
    return `<tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag} ${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · ${clubLabel}</div></div></div></td>
      <td class="mono">${p.rating}</td>
      <td class="mono">${p.potential}</td>
      <td class="mono">${fmtMoney(fee)}</td>
      <td><button class="btn buy" ${(winStatus.open&&canAfford)?'':'disabled'} onclick="loanInPlayer(${p.id})" title="${!canAfford?'Bütçeniz yetersiz':''}">${winStatus.open?'🔄 Kirala (1 sezon)':'Pencere Kapalı'}</button></td>
    </tr>`;
  }).join("");
  const paginationHtml = renderPagination(loanPage, totalPages, "setLoanPage", totalItems, LOAN_PAGE_SIZE);

  // ---- Bende kiralık olan (başkasının) oyuncular ----
  const loanedInPlayers = myClub.squad.map(id=>state.players[id]).filter(p=>p && p.loanFromClub);
  const loanedInRows = loanedInPlayers.map(p=>{
    const owner = state.clubs[p.loanFromClub];
    const shareNote = p.loanWageSharePct>0 ? `Maaşın %${p.loanWageSharePct}'i ${owner?owner.name:"sahibi"}'den` : '';
    const optNote = p.loanBuyOption ? (p.loanBuyOption.type==='mandatory' ? `🔒 Zorunlu opsiyon: ${p.loanAppsCount||0}/${p.loanBuyOption.requiredApps} maç (${fmtMoney(p.loanBuyOption.fee)})` : `Opsiyonel satın alma: ${fmtMoney(p.loanBuyOption.fee)}`) : '';
    const buyOptBtn = (p.loanBuyOption && p.loanBuyOption.type==='optional') ? `<button class="btn buy" style="margin-top:4px;" onclick="exerciseLoanBuyOption(${p.id})">💰 Opsiyonu Kullan</button>` : '';
    return `<tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag} ${p.name}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · Sahibi: ${owner?owner.name:"—"}</div></div></div></td>
      <td class="mono">${p.rating}</td>
      <td style="font-size:11px;">Sezon sonunda döner${shareNote?'<br>'+shareNote:''}${optNote?'<br>'+optNote:''}</td>
      <td><button class="btn sell" onclick="returnLoanEarly(${p.id})">↩️ Erken İade Et</button>${buyOptBtn}</td>
    </tr>`;
  }).join("");

  return `<div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>Kiralık Transferler</h2></div>
    ${windowBanner}
    <p style="color:var(--ink-dim);font-size:12.5px;margin:-6px 0 14px;">Kiralıklar her zaman 1 sezonluktur ve sezon sonunda otomatik olarak sahibi kulübe geri döner. Her kiralamada maaşın yüzde kaçını sahibi kulübün üstleneceğini ve isteğe bağlı bir satın alma opsiyonu (opsiyonel ya da belirli maç sayısı sonunda otomatik/zorunlu) belirleyebilirsiniz.</p>
  </div>

  ${loanedInPlayers.length ? `
  <div class="panel">
    <div class="panel-head"><h2>Kiralık Aldığım Oyuncular</h2></div>
    <div style="overflow-x:auto;"><table>
      <thead><tr><th>Oyuncu</th><th>Güç</th><th>Durum</th><th>Eylem</th></tr></thead>
      <tbody>${loanedInRows}</tbody>
    </table></div>
  </div>` : ''}

  ${myPlayersAway.length ? `
  <div class="panel">
    <div class="panel-head"><h2>Kiralıktaki Oyuncularım</h2></div>
    <div style="overflow-x:auto;"><table>
      <thead><tr><th>Oyuncu</th><th>Güç</th><th>Durum</th><th>Eylem</th></tr></thead>
      <tbody>${awayRows}</tbody>
    </table></div>
  </div>` : ''}

  <div class="panel">
    <div class="panel-head"><h2>Kadromdan Kiralığa Gönder</h2></div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-6px 0 14px;">İlgilenen bir kulüp otomatik bulunur (pozisyon açığı olan, genelde alt seviye kulüpler daha istekli). "Kiralığa Gönder"e tıklayınca maaş paylaşımı yüzdesini ve isteğe bağlı satın alma opsiyonunu (opsiyonel/zorunlu) belirleyeceğiniz bir teklif ekranı açılır — kulüp şartları beğenmezse teklifi reddedebilir.</p>
    <div style="overflow-x:auto;"><table>
      <thead><tr><th>Oyuncu</th><th>Güç</th><th>Maaş</th><th>Eylem</th></tr></thead>
      <tbody>${sendRows || '<tr><td colspan="4" class="empty">Kiralığa gönderilebilecek uygun oyuncu yok.</td></tr>'}</tbody>
    </table></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Kiralık Alınabilir Oyuncular</h2></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <select onchange="setLoanFilterPos(this.value)">
        <option value="ALL" ${loanFilters.pos==='ALL'?'selected':''}>Tüm Pozisyonlar</option>
        ${POSITIONS.map(pos=>`<option value="${pos.code}" ${loanFilters.pos===pos.code?'selected':''}>${pos.label}</option>`).join("")}
      </select>
      <input type="text" placeholder="Oyuncu ara..." value="${loanFilters.q}" oninput="setLoanFilterQ(this.value)" style="flex:1;min-width:160px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:8px 12px;border-radius:8px;">
    </div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-4px 0 14px;">24 yaş ve altı, sakat olmayan ve zaten kiralık olmayan oyuncular listelenir.</p>
    <div style="overflow-x:auto;"><table>
      <thead><tr><th>Oyuncu</th><th>Güç</th><th>Potansiyel</th><th>Kiralama Bedeli</th><th>Eylem</th></tr></thead>
      <tbody>${poolRows || '<tr><td colspan="5" class="empty">Aramaya uygun kiralık oyuncu bulunamadı.</td></tr>'}</tbody>
    </table></div>
    ${paginationHtml}
  </div>`;
}

function setTableCountry(code){ tableCountry=code; tableTierIdx=0; statsSubView.league=null; render(); }

function renderLeagueHub(){
  // ŞL ve AL artık kendi başına sekme değil; "Lig" ekranının üstündeki bu
  // alt-sekme çubuğuyla seçiliyor.
  const subTabs = [
    ["league","📊","Puan Durumu"],
    ["cl","🏆","ŞL"],
    ["el","🥈","AL"],
    ["co","🥉","KL"],
    ["sk","⚡","Süper Kupa"]
  ];
  const subNav = `<div class="league-toggle" style="margin-bottom:14px;">
    ${subTabs.map(([k,icon,l])=>`<button class="${tableSubView===k?'active':''}" onclick="setTableSubView('${k}')">${icon} ${l}</button>`).join("")}
  </div>`;
  let body;
  if(tableSubView === "cl") body = renderChampionsLeague();
  else if(tableSubView === "el") body = renderEuropaLeague();
  else if(tableSubView === "co") body = renderConferenceLeague();
  else if(tableSubView === "sk") body = renderSuperCup();
  else body = renderTable();
  return subNav + body;
}
function renderTable(){
  const country = countryByCode(tableCountry) || countryByCode(state.clubs[state.playerClubId].country);
  const tierIdx = Math.min(tableTierIdx, country.tiers.length-1);
  const tier = country.tiers[tierIdx];
  const leagueKey = country.code+"-"+tierIdx;
  const myClub = state.clubs[state.playerClubId];
  const isLiveLeague = state.seasonInProgress && leagueKey === myClub.leagueKey;
  const standings = isLiveLeague
    ? Object.values(state.currentTable).sort((a,b)=> (b.Pts-a.Pts) || ((b.GF-b.GA)-(a.GF-a.GA)) || (b.GF-a.GF))
    : state.standingsByLeague[leagueKey];

  const countryOptions = COUNTRIES.map(c=>`<option value="${c.code}" ${c.code===country.code?'selected':''}>${c.flag} ${c.name}</option>`).join("");
  const tierToggle = country.tiers.length>1 ? `
    <div class="league-toggle" style="margin-bottom:0;">
      ${country.tiers.map((t,idx)=>`<button class="${tierIdx===idx?'active':''}" onclick="setTableTierIdx(${idx})">${t.name}</button>`).join("")}
    </div>` : "";

  const rows = standings ? standings.map((r, idx) => {
    const club = state.clubs[r.id];
    const isMe = r.id === state.playerClubId;
    let rowClass = isMe ? 'me' : '';
    const curLevel = tierLevelOf(tier, tierIdx);
    const hasLevelBelow = country.tiers.some((t2,i2)=> tierLevelOf(t2,i2) > curLevel);
    const hasLevelAbove = country.tiers.some((t2,i2)=> tierLevelOf(t2,i2) < curLevel);
    if(hasLevelBelow && idx >= standings.length - 3) rowClass += ' releg';
    if(hasLevelAbove && idx < 3) rowClass += ' promo';
    const av = r.GF - r.GA;

    return `<tr class="${rowClass}">
      <td><span class="pos-num">${idx+1}.</span> ${crestSVG(club,19)} <strong>${club.name}</strong></td>
      <td class="mono">${r.P}</td>
      <td class="mono">${r.W}</td>
      <td class="mono">${r.D}</td>
      <td class="mono">${r.L}</td>
      <td class="mono">${r.GF}:${r.GA} (${av > 0 ? '+'+av : av})</td>
      <td class="mono" style="color:var(--gold);font-weight:600;">${r.Pts}</td>
    </tr>`;
  }).join("") : '';

  return `
  ${renderStatsBlock('league', `${country.name} ${tier.name}`, Object.values(state.clubs).filter(c => c.leagueKey === leagueKey).map(c => c.id))}
  <div class="panel">
    <div class="panel-head">
      <h2><span class="kickoff-dot"></span>${country.name} — ${tier.name} Puan Durumu</h2>
    </div>
    <div class="table-select-row" style="margin-bottom:14px;">
      <select onchange="setTableCountry(this.value)">${countryOptions}</select>
      ${tierToggle}
    </div>
    ${standings ? `
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${country.tiers.length>1 ? `
    <div class="legend">
      <span><i style="background:var(--green-pos)"></i> Yükselme Bölgesi (İlk 3)</span>
      <span><i style="background:var(--red-neg)"></i> Küme Düşme Bölgesi (Son 3)</span>
    </div>` : `<div class="legend"><span>Bu ülkede tek kademeli lig sistemi var — terfi/küme düşme yok.</span></div>`}
    ` : '<div class="empty">Henüz lig maçı oynanmadı. Sezonu oynatmak için Kulüp sekmesine gidin.</div>'}
  </div>`;
}

function renderCLInProgress(cs){
  const stageLabels = {group:'Grup Aşaması', playoff:'Play-Off', r16:'Son 16', qf:'Çeyrek Final', sf:'Yarı Final', final:'Final'};
  const groupsHtml = cs.groups.map(g=>{
    const st = groupStandings(g);
    const rows = st.map((r,idx)=>{
      const clubR = state.clubs[r.id];
      if(!clubR) return "";
      const isMe = r.id===state.playerClubId;
      const tag = idx===0 ? `<span class="mono" style="color:var(--gold);font-size:10px;margin-left:6px;">DOĞRUDAN S16</span>`
        : idx<3 ? `<span class="mono" style="color:var(--silver);font-size:10px;margin-left:6px;">PLAY-OFF</span>` : '';
      return `<tr class="${isMe?'me':''} ${idx<3?'promo':''}">
        <td><span class="pos-num">${idx+1}.</span> ${crestSVG(clubR,18)} <strong>${clubR.name}</strong>${tag}</td>
        <td class="mono">${r.P}</td><td class="mono">${r.W}</td><td class="mono">${r.D}</td><td class="mono">${r.L}</td>
        <td class="mono">${r.GF}:${r.GA}</td><td class="mono" style="color:var(--gold);font-weight:600;">${r.Pts}</td>
      </tr>`;
    }).join("");
    return `<div class="panel"><div class="panel-head"><h2>Grup ${g.name}${g.name===cs.myGroupName?' (Sizin Grubunuz)':''}</h2></div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join("");

  function koRoundLive(title, ties){
    if(!ties || !ties.length) return "";
    const rows = ties.map(t=>{
      const h=state.clubs[t.home], a=state.clubs[t.away];
      if(!h||!a) return "";
      if(!t.played) return `<div class="log-entry"><span class="desc" style="color:var(--ink-dim)">${h.name} vs ${a.name} — henüz oynanmadı</span></div>`;
      const w = state.clubs[t.winner];
      const isMe = t.home===state.playerClubId||t.away===state.playerClubId;
      return `<div class="log-entry" style="${isMe?'border-left-color:var(--green-pos);':''}"><span class="desc" style="color:var(--ink)">${h.name} <b class="mono">${t.gh}-${t.ga}</b> ${a.name} <span style="color:var(--gold);">→ ${w?w.name:'?'}</span></span></div>`;
    }).join("");
    return `<div class="panel"><div class="panel-head"><h2>${title}</h2></div>${rows}</div>`;
  }

  const statusHtml = cs.eliminated
    ? `<div class="banner" style="color:var(--red-neg);border-color:var(--red-neg);">Kulübünüz bu sezon Şampiyonlar Ligi'nden elendi.</div>`
    : `<div class="banner">Şu an: <strong>${stageLabels[cs.stage]||cs.stage}</strong> aşamasındasınız.</div>`;

  return `
    ${renderStatsBlock('cl', 'ŞL', cs.groups.flatMap(g=>g.clubs))}
    <div class="panel"><div class="panel-head"><h2><span class="kickoff-dot"></span>Şampiyonlar Ligi ${seasonLabel(cs.year)}</h2></div>${statusHtml}</div>
    ${groupsHtml}
    ${koRoundLive("Play-Off", cs.roundResults.playoff)}
    ${koRoundLive("Son 16", cs.roundResults.r16)}
    ${koRoundLive("Çeyrek Final", cs.roundResults.qf)}
    ${koRoundLive("Yarı Final", cs.roundResults.sf)}
    ${koRoundLive("Final", cs.roundResults.final)}
  `;
}

function renderSuperCup(){
  const sc = state.superCup;
  const historyHtml = (state.superCupHistory||[]).map(h=>{
    const w = state.clubs[h.winnerId];
    const cl = state.clubs[h.clId], el = state.clubs[h.elId];
    const scoreTxt = h.penalties ? `${h.gh}-${h.ga} (pen. ${h.penalties.ph}-${h.penalties.pa})` : `${h.gh}-${h.ga}`;
    return `<div class="log-entry"><span class="yr">Sezon ${seasonLabel(h.year)}</span><div class="desc">${cl?cl.name:'—'} ${scoreTxt} ${el?el.name:'—'} — <strong>${w?w.name:'—'}</strong> kazandı.</div></div>`;
  }).join("");

  if(!sc){
    return `<div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Süper Kupa</h2></div>
      <p style="color:var(--ink-dim);font-size:13px;line-height:1.6;">Gerçek hayattaki UEFA Süper Kupa gibi: bir önceki sezonun Şampiyonlar Ligi
      şampiyonu ile Avrupa Ligi şampiyonu, yeni sezon başlamadan önce tek maçlık bir final oynar. Beraberlik durumunda kazanan penaltılarla belirlenir.</p>
      <div class="empty">Henüz Süper Kupa oynanmadı. İlk sezonunuzu tamamlayıp yeni sezona başlayın.</div>
    </div>`;
  }

  const clClub = state.clubs[sc.clId], elClub = state.clubs[sc.elId];
  const winnerClub = state.clubs[sc.winner];
  const pensHtml = sc.penalties ? `<div class="sc-pens">Penaltılar: ${sc.penalties.ph}-${sc.penalties.pa}</div>` : "";

  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Süper Kupa ${seasonLabel(sc.year)}</h2></div>
      <div class="sc-teams" style="margin-top:6px;">
        <div class="sc-team ${sc.winner===sc.clId?'winner':''}">
          ${clClub?crestSVG(clClub,36):''}
          <span class="sc-team-name">${clClub?clClub.name:'—'}</span>
          <span class="sc-tag">ŞL Şampiyonu</span>
        </div>
        <div>
          <div class="sc-score">${sc.gh} - ${sc.ga}</div>
          ${pensHtml}
        </div>
        <div class="sc-team ${sc.winner===sc.elId?'winner':''}">
          ${elClub?crestSVG(elClub,36):''}
          <span class="sc-team-name">${elClub?elClub.name:'—'}</span>
          <span class="sc-tag">AL Şampiyonu</span>
        </div>
      </div>
      <div class="empty" style="padding-top:14px;"><strong>${winnerClub?winnerClub.name:'—'}</strong> Süper Kupa'yı kazandı.</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Geçmiş Süper Kupalar</h2></div>
      ${historyHtml || '<div class="empty">Kayıt yok.</div>'}
    </div>`;
}

/* ---- Milli Takım ekranı: kullanıcının kulübünün bağlı olduğu ülkenin o anki
   milli takım kadrosunu (kendi oyuncularınız vurgulanmış olarak), bir sonraki
   turnuvanın ne zaman olacağını, en son oynanan Dünya Kupası/Kıtasal
   Şampiyona'nın grup+eleme detaylarını ve geçmiş şampiyonlar listesini gösterir. ---- */
function nextInternationalTournamentInfo(){
  const y = state.year;
  for(let k=0; k<8; k++){
    const yy = y+k;
    if(yy % 4 === 0) return {yearsAway:k, kind:"world", label:"Dünya Kupası"};
    if(yy % 4 === 2) return {yearsAway:k, kind:"continental", label:"Kıtasal Şampiyona"};
  }
  return null;
}
function renderNationalTeamKORound(title, matches){
  if(!matches || !matches.length) return "";
  const rows = matches.map(m=>{
    const h = countryByCode(m.home), a = countryByCode(m.away), w = countryByCode(m.winner);
    if(!h || !a) return "";
    const isMe = state.playerClubId && (m.home===((state.clubs[state.playerClubId]||{}).country) || m.away===((state.clubs[state.playerClubId]||{}).country));
    const pensTxt = m.penalties ? ` (pen. ${m.penalties.ph}-${m.penalties.pa})` : "";
    return `<div class="log-entry" style="${isMe?'border-left-color:var(--green-pos);':''}"><span class="desc" style="color:var(--ink)">${h.flag} ${h.name} <b class="mono">${m.gh}-${m.ga}</b>${pensTxt} ${a.name} ${a.flag} <span style="color:var(--gold);">→ ${w?w.flag+' '+w.name:'?'}</span></span></div>`;
  }).join("");
  return `<div class="panel"><div class="panel-head"><h2>${title}</h2></div>${rows}</div>`;
}
function renderNationalTeam(){
  const club = state.clubs[state.playerClubId];
  const myCountryCode = club ? club.country : null;
  const myCountry = myCountryCode ? countryByCode(myCountryCode) : null;
  const nextInfo = nextInternationalTournamentInfo();

  // ---- O anki milli takım kadrosu (kendi ülkenizin) ----
  let squadHtml = '<div class="empty">Kulübünüzün bağlı olduğu bir ülke bulunamadı.</div>';
  if(myCountryCode){
    const squad = nationalSquadPlayers(myCountryCode);
    const rows = squad.map((p,i)=>{
      const mine = p.club === state.playerClubId;
      const ownerClub = state.clubs[p.club];
      return `<tr class="${mine?'me':''}">
        <td><span class="pos-num">${i+1}.</span></td>
        <td><span class="pos-pill">${posFullLabel(p.pos)}</span></td>
        <td><span style="cursor:pointer;" onclick="openPlayerCard(${p.id})">${p.flag||""} ${p.name}</span> ${mine?'<span class="mono" style="color:var(--green-pos);font-size:10px;">SİZİN OYUNCUNUZ</span>':''}</td>
        <td class="mono">${p.age}</td>
        <td class="mono" style="color:var(--gold);font-weight:600;">${p.rating}</td>
        <td style="color:var(--ink-dim);font-size:12px;">${ownerClub ? ownerClub.name : '—'}</td>
      </tr>`;
    }).join("");
    const strength = Math.round(nationalTeamStrength(myCountryCode));
    squadHtml = `
      <p style="color:var(--ink-dim);font-size:13px;margin:0 0 10px;">${myCountry.flag} <strong>${myCountry.name}</strong> milli takımının o anki en iyi ${squad.length} oyuncusu — kulübünüzde forma giyen oyuncular vurgulanmıştır. Tahmini milli takım gücü: <b class="mono" style="color:var(--gold);">${strength}</b></p>
      <div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Mevki</th><th>Oyuncu</th><th>Yaş</th><th>Güç</th><th>Kulüp</th></tr></thead><tbody>${rows || ''}</tbody></table></div>
      ${squad.length===0 ? '<div class="empty">Bu ülkeden henüz bir kulüpte forma giyen oyuncu yok.</div>' : ''}
    `;
  }

  const nextHtml = nextInfo
    ? `<p style="color:var(--ink-dim);font-size:13px;margin:0;">${nextInfo.yearsAway===0 ? 'Bu yaz' : nextInfo.yearsAway+' sezon sonra'} oynanacak turnuva: <strong>${nextInfo.icon||(nextInfo.kind==='world'?'🌍':'🏆')} ${nextInfo.label}</strong></p>`
    : "";

  // ---- Geçmiş turnuvalar ----
  const historyHtml = (state.internationalHistory||[]).map(h=>{
    const w = countryByCode(h.winner);
    const meTag = h.myWon ? ' <span class="mono" style="color:var(--green-pos);font-size:10px;">🎉 SİZİN ÜLKENİZ</span>' : (h.myParticipated ? '' : ' <span class="mono" style="color:var(--ink-faint);font-size:10px;">(ülkeniz katılmadı)</span>');
    return `<div class="log-entry"><span class="yr">${seasonLabel(h.year)}</span><div class="desc">${h.icon} ${h.label}: ${w?w.flag+' '+w.name:'?'} şampiyon oldu.${meTag}</div></div>`;
  }).join("");

  // ---- En son oynanan turnuvanın detayları (gruplar + eleme) ----
  const last = state.lastInternationalResult;
  let lastHtml = '<div class="empty">Henüz bir Dünya Kupası ya da Kıtasal Şampiyona oynanmadı.</div>';
  if(last){
    const groupsHtml = last.groups.map(g=>{
      const rows = g.standings.map((r,idx)=>{
        const c = countryByCode(r.id);
        if(!c) return "";
        const isMe = r.id===myCountryCode;
        return `<tr class="${isMe?'me':''} ${idx<2?'promo':''}">
          <td><span class="pos-num">${idx+1}.</span> ${c.flag} <strong>${c.name}</strong></td>
          <td class="mono">${r.P}</td><td class="mono">${r.W}</td><td class="mono">${r.D}</td><td class="mono">${r.L}</td>
          <td class="mono">${r.GF}:${r.GA}</td><td class="mono" style="color:var(--gold);font-weight:600;">${r.Pts}</td>
        </tr>`;
      }).join("");
      return `<div class="panel"><div class="panel-head"><h2>Grup ${g.name}</h2></div>
        <div style="overflow-x:auto;"><table><thead><tr><th>Ülke</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }).join("");
    const champCountry = countryByCode(last.winner);
    const scorer = last.topScorer ? state.players[last.topScorer.id] : null;
    lastHtml = `
      <div class="panel">
        <div class="panel-head"><h2><span class="kickoff-dot"></span>${last.icon} ${last.label} ${seasonLabel(last.year)}</h2></div>
        <p style="color:var(--ink-dim);font-size:13.5px;">🏆 Şampiyon: <strong style="color:var(--gold);">${champCountry?champCountry.flag+' '+champCountry.name:'—'}</strong></p>
        ${scorer ? `<p style="color:var(--ink-dim);font-size:13px;">⚽ Gol Kralı: <span style="cursor:pointer;color:var(--ink);" onclick="openPlayerCard(${scorer.id})">${scorer.flag||''} ${scorer.name}</span> (${last.topScorer.goals} gol)</p>` : ''}
      </div>
      ${groupsHtml}
      ${renderNationalTeamKORound("Çeyrek Final", last.qf)}
      ${renderNationalTeamKORound("Yarı Final", last.sf)}
      ${renderNationalTeamKORound("Final", [last.final])}
    `;
  }

  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Milli Takım</h2></div>
      <p style="color:var(--ink-dim);font-size:13px;line-height:1.6;margin:0 0 10px;">Her ülkenin milli takımı, o an bir kulüpte forma giyen ve o ülke vatandaşı olan en iyi ${NT_SQUAD_SIZE} oyuncudan anlık olarak kurulur — kadronuzda geliştirdiğiniz bir oyuncu, ülkesinin milli takımını da gerçekten güçlendirir. Dünya Kupası 4 yılda bir, Kıtasal Şampiyona ise arada kalan yıllarda yaz arasında otomatik oynanır.</p>
      ${nextHtml}
    </div>
    <div class="panel">
      <div class="panel-head"><h2>${myCountry?myCountry.flag+' '+myCountry.name:''} Milli Takım Kadrosu</h2></div>
      ${squadHtml}
    </div>
    ${lastHtml}
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Geçmiş Şampiyonlar</h2></div>
      ${historyHtml || '<div class="empty">Kayıt yok.</div>'}
    </div>
  `;
}

function renderChampionsLeague(){
  if(state.clSeason && state.clSeason.active){
    return renderCLInProgress(state.clSeason);
  }
  const cl = state.championsLeague;
  const historyHtml = (state.clHistory||[]).map(h=>{
    const c = state.clubs[h.winnerId];
    return `<div class="log-entry"><span class="yr">Sezon ${seasonLabel(h.year)}</span><div class="desc">${c ? c.name+" ("+countryFlag(c.country)+" "+c.countryName+")" : "—"} şampiyon oldu.</div></div>`;
  }).join("");

  if(!cl){
    return `<div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Şampiyonlar Ligi</h2></div>
      <p style="color:var(--ink-dim);font-size:13px;line-height:1.6;">Her ülkenin en üst kademesindeki en prestijli 32 kulüp arasından
      8 grup (4'er takım) oynanır. Grup birincileri doğrudan Son 16'ya yükselir; grup 2. ve 3.leri Son 16 bileti için tek maçlık bir
      Play-Off turunda karşılaşır (4.ler elenir). Ardından tek maçlık eleme turları (Son 16 → Çeyrek Final → Yarı Final → Final) ile devam edilir.
      Turnuva, sezon sonunda diğer ligler gibi otomatik simüle edilir — kulübünüz üst kademedeyse kadro düzeninize göre bu maçlara da dahil olur.</p>
      <div class="empty">Henüz Şampiyonlar Ligi oynanmadı. İlk sezonunuzu tamamlayın.</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Geçmiş Şampiyonlar</h2></div>
      ${historyHtml || '<div class="empty">Kayıt yok.</div>'}
    </div>
    ${renderStatsBlock('cl', 'ŞL')}`;
  }

  const groupsHtml = cl.groups.map(g=>{
    const rows = g.standings.map((r,idx)=>{
      const club = state.clubs[r.id];
      if(!club) return "";
      const isMe = r.id===state.playerClubId;
      const qualified = idx<3;
      const tag = idx===0 ? `<span class="mono" style="color:var(--gold);font-size:10px;margin-left:6px;">DOĞRUDAN S16</span>`
        : idx<3 ? `<span class="mono" style="color:var(--silver);font-size:10px;margin-left:6px;">PLAY-OFF</span>` : '';
      return `<tr class="${isMe?'me':''} ${qualified?'promo':''}">
        <td><span class="pos-num">${idx+1}.</span> ${crestSVG(club,18)} <strong>${club.name}</strong>${tag}</td>
        <td class="mono">${r.P}</td><td class="mono">${r.W}</td><td class="mono">${r.D}</td><td class="mono">${r.L}</td>
        <td class="mono">${r.GF}:${r.GA}</td><td class="mono" style="color:var(--gold);font-weight:600;">${r.Pts}</td>
      </tr>`;
    }).join("");
    return `<div class="panel">
      <div class="panel-head"><h2>Grup ${g.name}</h2></div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }).join("");

  function koRound(title, matches){
    const rows = matches.map(m=>{
      const h = state.clubs[m.home], a = state.clubs[m.away], w = state.clubs[m.winner];
      if(!h || !a) return "";
      const isMe = m.home===state.playerClubId || m.away===state.playerClubId;
      return `<div class="log-entry" style="${isMe?'border-left-color:var(--green-pos);':''}"><span class="desc" style="color:var(--ink)">${h.name} <b class="mono">${m.gh}-${m.ga}</b> ${a.name} <span style="color:var(--gold);">→ ${w?w.name:'?'}</span></span></div>`;
    }).join("");
    return `<div class="panel"><div class="panel-head"><h2>${title}</h2></div>${rows || '<div class="empty">Veri yok.</div>'}</div>`;
  }

/* ================= SPONSORLUK ANLAŞMALARI =================
   İki bağımsız sponsorluk yuvası vardır: forma (kit) ve stadyum isim hakkı.
   Her kategoride 5 seviye teklif sunulur; üst seviyeler kulüp prestiji
   belirli bir eşiği geçmeden kilitli kalır (küçük bir kulüp küresel bir
   markayı forma sponsoru yapamaz). Gösterilen rakamlar ülke gücü ve lig
   kademesine göre ölçeklenir — tıpkı transfer/lig gelirlerinde olduğu gibi.
   Anlaşma imzalanınca peşin bir imza bonusu hemen bütçeye eklenir; yıllık
   gelir ise her sezon sonunda (finishSeason içinde) otomatik yatırılır ve
   sözleşme süresi biter bitmez yuva tekrar boşa düşer. ---- */
const SPONSOR_CATEGORIES = {
  kit: {
    label: "Forma Sponsoru", icon: "👕",
    desc: "Formanızın göğsünde yer alacak marka — sezon boyunca sabit yıllık gelir sağlar.",
    tiers: [
      {name:"Yerel İşletme",      baseAnnual: 300000,   baseBonus: 150000,  prestigeMin: 0},
      {name:"Bölgesel Marka",     baseAnnual: 900000,   baseBonus: 450000,  prestigeMin: 35},
      {name:"Ulusal Marka",       baseAnnual: 2500000,  baseBonus: 1300000, prestigeMin: 70},
      {name:"Uluslararası Marka", baseAnnual: 6000000,  baseBonus: 3200000, prestigeMin: 105},
      {name:"Küresel Dev",        baseAnnual: 15000000, baseBonus: 8000000, prestigeMin: 140}
    ]
  },
  stadium: {
    label: "Stadyum İsim Sponsoru", icon: "🏟️",
    desc: "Stadyumunuza adını verecek sponsor — kit sponsorundan daha mütevazı ama düzenli bir gelir.",
    tiers: [
      {name:"Yerel İsim Hakkı",         baseAnnual: 200000,   baseBonus: 100000,  prestigeMin: 0},
      {name:"Bölgesel İsim Hakkı",      baseAnnual: 600000,   baseBonus: 300000,  prestigeMin: 35},
      {name:"Ulusal İsim Hakkı",        baseAnnual: 1700000,  baseBonus: 900000,  prestigeMin: 70},
      {name:"Uluslararası İsim Hakkı",  baseAnnual: 4200000,  baseBonus: 2200000, prestigeMin: 105},
      {name:"Küresel İsim Hakkı",       baseAnnual: 11000000, baseBonus: 6000000, prestigeMin: 140}
    ]
  }
};
const SPONSOR_BRAND_WORDS = {
  kit: ["Atlas","Vertex","Falcon","Orion","Nova","Titan","Zenith","Aegis","Comet","Halcyon","Pinnacle","Meridian"],
  stadium: ["Kristal","Panorama","Volt","Anadolu","Marina","Kartal","Zirve","Kaynak","Bulut","Liman","Vadi","Ufuk"]
};
const SPONSOR_SUFFIXES = {
  kit: ["Spor","Giyim","Enerji","Teknoloji","Sigorta","Havayolları","Bankası","Motors","Telekom","Elektronik"],
  stadium: ["Arena","Park","Sigorta","Enerji","Bankası","Telekom","Holding","Grup","İnşaat","Market"]
};
function pickSponsorName(category){
  const words = SPONSOR_BRAND_WORDS[category];
  const suffixes = SPONSOR_SUFFIXES[category];
  return `${pick(words)} ${pick(suffixes)}`;
}
// Ülke gücü ve lig kademesine göre teklif rakamlarını ölçekler — düşük
// kademe kulüpleri küçük, elit kulüpler dev rakamlar görür.
function sponsorScaleFactor(club){
  const country = countryByCode(club.country);
  const strength = country ? country.strength : 0.5;
  const tierFactor = club.tierIdx===0 ? 1 : Math.max(0.15, 0.4*Math.pow(0.6, club.tierIdx-1));
  return strength * tierFactor;
}
function sponsorTierValues(club, category, tierIdx){
  const tier = SPONSOR_CATEGORIES[category].tiers[tierIdx];
  const factor = sponsorScaleFactor(club);
  const annualIncome = Math.max(50000, Math.round(tier.baseAnnual * factor / 10000) * 10000);
  const signingBonus = Math.max(25000, Math.round(tier.baseBonus * factor / 10000) * 10000);
  return { annualIncome, signingBonus };
}
function signSponsor(category, tierIdx, years){
  years = parseInt(years, 10) || 3;
  const club = state.clubs[state.playerClubId];
  ensureSponsors(club);
  if(club.sponsors[category]){
    showToast("Bu kategoride zaten aktif bir sponsorluk anlaşmanız var.");
    return;
  }
  const cat = SPONSOR_CATEGORIES[category];
  const tier = cat.tiers[tierIdx];
  if((club.prestige||0) < tier.prestigeMin){
    showToast("Kulübünüzün prestiji bu sponsoru ikna etmeye yetmiyor.");
    return;
  }
  const {annualIncome, signingBonus} = sponsorTierValues(club, category, tierIdx);
  const name = pickSponsorName(category);
  club.sponsors[category] = { name, tierIdx, tierName: tier.name, annualIncome, signingBonus, years, yearsLeft: years };
  club.budget += signingBonus;
  showToast(`${name} ile ${cat.label.toLowerCase()} anlaşması imzalandı! İmza bonusu: ${fmtMoney(signingBonus)} · Yıllık gelir: ${fmtMoney(annualIncome)} · Süre: ${years} yıl.`);
  render();
}
function terminateSponsor(category){
  const club = state.clubs[state.playerClubId];
  ensureSponsors(club);
  const deal = club.sponsors[category];
  if(!deal) return;
  club.sponsors[category] = null;
  showToast(`${deal.name} ile olan anlaşma feshedildi.`);
  render();
}

  {key:"europe", name:"Avrupa", flag:"🌍", scoutCost:2000000},
  {key:"africa", name:"Afrika", flag:"🌍", scoutCost:2500000},
  {key:"middleeast", name:"Orta Doğu", flag:"🌏", scoutCost:2800000},
  {key:"asia", name:"Asya", flag:"🌏", scoutCost:3000000},
  {key:"northamerica", name:"Kuzey Amerika", flag:"🌎", scoutCost:3500000},
  {key:"southamerica", name:"Güney Amerika", flag:"🌎", scoutCost:4000000},
  {key:"oceania", name:"Okyanusya", flag:"🌏", scoutCost:5000000}
];

// Hangi yetenek avcısının kıta seçim ekranı açık — sadece o avcının kartında gösterilir.
let scoutPickerFor = null;

/* ---- Yetenek avcıları oyuncular gibi çok yıllık sözleşmeyle kiralanır
   (1-5 yıl). Yıllık maaş, sözleşme süresi boyunca her sezon sonunda diğer
   maaşlarla birlikte bütçeden düşülür (clubWageBill üzerinden). Otomatik
   arama YOK: her sözleşmeli avcı sezon başına bir kez, sizin seçtiğiniz
   bir kıtaya elle gönderilir ("Kıta Seç ve Gönder"). O kıtadan, henüz
   transfer pazarında olmayan (kimsenin bilmediği) en fazla 6 gizli
   yetenek adayı bulup getirir. Transfer ettiğiniz aday oyuna kalıcı
   olarak eklenir; pas geçtiğiniz ya da hiç ilgilenmediğiniz adaylar
   kaybolur. Her avcı, bir sonraki sezon başına kadar tekrar gönderilemez. ---- */
function hireScout(tierIdx, years){
  if(tierIdx < 0 || tierIdx >= SCOUT_TIERS.length) return;
  years = Math.min(5, Math.max(1, parseInt(years) || 1));
  const tier = SCOUT_TIERS[tierIdx];
  const club = state.clubs[state.playerClubId];
  if(club.scouts.some(s => s.tierIdx === tierIdx)){
    showToast(`${tier.name} seviyesinde zaten aktif bir yetenek avcınız var.`);
    return;
  }
  const currentBill = clubWageBill(state.playerClubId);
  if(currentBill + tier.annualWage > club.budget){
    showToast(`❌ Bütçeniz yetersiz! ${tier.name} Yetenek Avcısı yıllık ${fmtMoney(tier.annualWage)} maaş ister.`);
    return;
  }
  club.scouts.push({id: rid(), tierIdx, contractYears: years, contractUntil: state.year + years, sendCount: 0});
  showToast(`${tier.name} Yetenek Avcısı ile ${years} yıllık sözleşme imzalandı! Yıllık maaş: ${fmtMoney(tier.annualWage)} (toplam ${fmtMoney(tier.annualWage*years)}). Sezon başına iki kez gönderebilirsiniz (başı ve ortası).`);
  render();
}

// Her sezon başında (finishSeason içinde) tüm avcıların gönderim hakkını sıfırlar.
function resetScoutAvailability(){
  Object.values(state.clubs).forEach(club=>{
    (club.scouts||[]).forEach(sc=>{ sc.sendCount = 0; });
  });
}

function openScoutContinentPicker(scoutId){
  scoutPickerFor = Number(scoutId);
  render();
}
function closeScoutContinentPicker(){
  scoutPickerFor = null;
  render();
}

// Transfer pazarında olmayan, tamamen yeni ve gizli bir yetenek üretir.
// register:false sayesinde oyuncu, transfer edilene kadar state.players'a
// (dolayısıyla transfer pazarına) hiç girmez.
function generateHiddenTalent(continentKey, tier){
  const countries = COUNTRIES.filter(c => c.continent === continentKey);
  const country = countries.length ? pick(countries) : pick(COUNTRIES);
  const skew = clamp(0.95 - tier.quality*0.55, 0.25, 0.95);
  const wonderkidChance = clamp(0.05 + tier.quality*0.15, 0.05, 0.25);
  const p = generatePlayer({minAge:16, maxAge:23, ageWeights:AGE_WEIGHTS, skew, wonderkidChance, register:false, countryCode:country.code});
  // O ülkedeki gerçek bir kulübe bağlı olsun; oyuncu, o kulübün gizli/kadro dışı
  // bir yeteneği olarak bulunur ve transfer edilmek istenirse o kulüpten bonservisle alınır.
  const countryClubs = Object.values(state.clubs).filter(c => c.country === country.code);
  const homeClub = countryClubs.length ? pick(countryClubs) : null;
  p.club = homeClub ? homeClub.id : null;
  p.isYouth = false;
  p.scoutHidden = true;
  p.countryCode = country.code;
  p.countryName = country.name;
  p.flag = country.flag;
  if(!p.askingPrice) p.askingPrice = homeClub ? computeAskingPrice(p) : 0;
  state.players[p.id] = p;
  return p;
}

// Bir sonucun içinden tek bir adayı kaldırır (kayboldu); liste boşalırsa sonucu da siler.
function removeScoutedPlayerRef(pid){
  state.scoutResults.forEach(res=>{
    res.foundPlayers = res.foundPlayers.filter(id=>id!==pid);
  });
  state.scoutResults = state.scoutResults.filter(res=>res.foundPlayers.length>0);
}

function discardScoutPlayer(resultId, pid){
  resultId = Number(resultId);
  pid = Number(pid);
  const res = state.scoutResults.find(r=>r.id===resultId);
  if(!res) return;
  res.foundPlayers = res.foundPlayers.filter(id=>id!==pid);
  const p = state.players[pid];
  if(p && p.scoutHidden) delete state.players[pid];
  if(res.foundPlayers.length === 0){
    state.scoutResults = state.scoutResults.filter(r=>r.id!==resultId);
  }
  showToast("Oyuncu pas geçildi, gizli yetenek kayboldu.");
  render();
}

function sendScoutToContinent(scoutId, continentKey){
  scoutId = Number(scoutId);
  const club = state.clubs[state.playerClubId];
  if(!club || !club.scouts) return;
  const scout = club.scouts.find(s => s.id === scoutId);
  if(!scout) return;
  if(scout.sendCount >= 2){
    showToast("❌ Bu yetenek avcısı bu sezon zaten iki kez gönderildi (sezon başı ve sezon ortası). Gelecek sezon tekrar gönderebilirsiniz.");
    return;
  }
  const continent = CONTINENTS.find(c => c.key === continentKey);
  if(!continent) return;
  const tripCost = continent.scoutCost || 0;
  if(club.budget < tripCost){
    showToast(`❌ Yetersiz bütçe! ${continent.flag} ${continent.name}'a gönderim ${fmtMoney(tripCost)} tutuyor, bütçenizde ${fmtMoney(club.budget)} var.`);
    return;
  }
  club.budget -= tripCost;
  const tier = SCOUT_TIERS[scout.tierIdx];
  const weeks = tier.findWeeks || 3;

  scout.sendCount++;
  scoutPickerFor = null;

  state.scoutMissions.push({id: rid(), scoutId: scout.id, tierIdx: scout.tierIdx, continent: continentKey, weeksLeft: weeks});
  showToast(`${tier.name} Yetenek Avcısı ${continent.flag} ${continent.name}'a gönderildi. Sonuç ${weeks} hafta içinde gelecek. (Gönderim ücreti: ${fmtMoney(tripCost)})`);
  render();
}

// Her hafta (playNextRound / quickSimSeason içinde) çağrılır: bekleyen avcı
// görevlerinin süresini azaltır, süresi dolanları sonuçlandırıp scoutResults'a ekler.
function processScoutMissionsWeek(){
  if(!state.scoutMissions || state.scoutMissions.length === 0) return;
  const stillPending = [];
  state.scoutMissions.forEach(mission=>{
    mission.weeksLeft--;
    if(mission.weeksLeft > 0){
      stillPending.push(mission);
      return;
    }
    const tier = SCOUT_TIERS[mission.tierIdx];
    const continent = CONTINENTS.find(c => c.key === mission.continent);
    if(!tier || !continent) return;
    const findChance = clamp(0.55 + tier.quality*0.45, 0.1, 0.98);
    const foundIds = [];
    for(let i = 0; i < 6; i++){
      if(Math.random() < findChance){
        const p = generateHiddenTalent(mission.continent, tier);
        foundIds.push(p.id);
      }
    }
    if(foundIds.length > 0){
      state.scoutResults.unshift({id: rid(), scoutId: mission.scoutId, tierIdx: mission.tierIdx, continent: mission.continent, foundPlayers: foundIds});
      if(state.scoutResults.length > 20){
        const overflow = state.scoutResults.slice(20);
        state.scoutResults.length = 20; // eski sonuçları sınırla
        overflow.forEach(res=>{
          res.foundPlayers.forEach(pid=>{
            const p = state.players[pid];
            if(p && p.scoutHidden) delete state.players[pid];
          });
        });
      }
      showToast(`${tier.name} Yetenek Avcısı ${continent.flag} ${continent.name}'dan ${foundIds.length} gizli yetenek buldu!`);
    } else {
      showToast(`${tier.name} Yetenek Avcısı ${continent.flag} ${continent.name}'da dikkat çeken bir yetenek bulamadı.`);
    }
  });
  state.scoutMissions = stillPending;
}

/* ================= DÜKKAN =================
   Kulüp bütçesine anında para eklemeye yarayan basit paketler.
   Gerçek bir ödeme sistemi yok — tıklanınca bütçeye direkt ekleniyor. */
const SHOP_PACKS = [
  {id:"p1", amount:1000000,   label:"Başlangıç Paketi", icon:"🪙", tag:null},
  {id:"p2", amount:5000000,   label:"Küçük Paket",      icon:"💵", tag:null},
  {id:"p3", amount:15000000,  label:"Orta Paket",       icon:"💰", tag:"Popüler"},
  {id:"p4", amount:40000000,  label:"Büyük Paket",      icon:"💎", tag:null},
  {id:"p5", amount:100000000, label:"Dev Paket",        icon:"🏆", tag:"En İyi Değer"}
];
function buyShopPack(id){
  const pack = SHOP_PACKS.find(p=>p.id===id);
  if(!pack) return;
  const club = state.clubs[state.playerClubId];
  club.budget += pack.amount;
  state.shopPurchases = (state.shopPurchases || 0) + 1;
  showToast(`${pack.icon} ${pack.label} satın alındı! Bütçene ${fmtMoney(pack.amount)} eklendi.`);
  render();
  saveGame(false);
}
function renderShop(){
  const club = state.clubs[state.playerClubId];
  const purchaseCount = state.shopPurchases || 0;
  const cards = SHOP_PACKS.map(p=>`
    <div class="shop-card">
      ${p.tag ? `<span class="shop-tag">${p.tag}</span>` : ""}
      <div class="shop-card-icon">${p.icon}</div>
      <h3>${p.label}</h3>
      <div class="shop-card-amount">+${fmtMoney(p.amount)}</div>
      <button class="btn-save-primary" onclick="buyShopPack('${p.id}')">Satın Al</button>
    </div>
  `).join("");
  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>🛒 Dükkan</h2></div>
      <p class="muted" style="margin:0 0 16px;">Bütçeni anında artıracak paketler. Şu anki bütçen: <b class="mono">${fmtMoney(club.budget)}</b>${purchaseCount ? ` · Şimdiye kadar ${purchaseCount} paket alındı.` : ""}</p>
      <div class="shop-grid">${cards}</div>
      <p class="footnote" style="margin-top:18px;">Bu dükkan tamamen kurgusaldır, gerçek bir ödeme içermez — sadece kulüp bütçeni oyun içinde hızlandırmak içindir.</p>
    </div>`;
}

/* ================= TESİS YÜKSELTMELERİ =================
   Antrenman tesisi ve akademi 30 seviyeye kadar, stadyum 5 seviyeye kadar
   kulüp bütçesiyle yükseltilir. Her tesisin somut bir oyun içi etkisi var:
   - Antrenman Tesisi: clubStrength()'e sabit bir güç bonusu ekler ve
     sakatlık riskini düşürür (bkz. facilityStrengthBonus / effectiveInjuryRisk).
   - Stadyum: ev sahibi olunan her lig maçında ekstra maç günü geliri sağlar
     (bkz. playLeagueMatch).
   - Akademi: sezonluk genç oyuncu alımında ekstra kontenjan ve daha
     yüksek güç/potansiyelli adaylar getirir (bkz. applyAcademyBoost).
   Antrenman ve Akademi 30 seviyeye yayıldığı için maliyet merdiveni katlanarak
   artıyor (buildCostLadder) — böylece uzun vadeli, sezonlar süren bir
   yatırım hedefi oluyor; ilk seviyeler ucuz, son seviyeler kulüp bütçesinin
   büyük bir kısmını gerektiriyor. */
function buildCostLadder(baseCost, growth, count){
  const arr = [];
  let cost = baseCost;
  for(let i=0;i<count;i++){
    arr.push(Math.round(cost/50000)*50000);
    cost *= growth;
  }
  return arr;
}
const FACILITY_DEFS = {
  training: {
    label: "Antrenman Tesisi", icon:"🏋️", maxLevel:30,
    costs: buildCostLadder(6000000, 1.16, 30),
    effectLine: lvl => `Takım gücüne +${(lvl*FACILITY_STRENGTH_PER_LEVEL).toFixed(2)} bonus · Sakatlık riski -%${(lvl*FACILITY_INJURY_REDUCTION_PER_LEVEL*100).toFixed(0)}`
  },
  stadium: {
    label: "Stadyum", icon:"🏟️", maxLevel:30,
    costs: buildCostLadder(4000000, 1.155, 30),
    effectLine: lvl => lvl>0 ? `Ev sahibi olunan her lig maçında taraftar desteğine göre en fazla ${fmtMoney(Math.round(lvl*150000))} maç günü geliri` : "Maç günü geliri yok — yükselt ve kazanmaya başla"
  },
  academy: {
    label: "Akademi", icon:"🎓", maxLevel:30,
    costs: buildCostLadder(5000000, 1.15, 30),
    effectLine: lvl => `Genç oyuncularda +${(lvl*ACADEMY_RATING_PER_LEVEL).toFixed(2)} güç / +${(lvl*ACADEMY_POTENTIAL_PER_LEVEL).toFixed(2)} potansiyel bonusu${lvl>=ACADEMY_LEVELS_PER_EXTRA_INTAKE?` · Sezonda +${Math.floor(lvl/ACADEMY_LEVELS_PER_EXTRA_INTAKE)} ekstra genç oyuncu alımı`:""}`
  }
};
/* ================= STADYUM GÖRSELİ =================
   Stadyum tesis seviyesi (0-5) yükseldikçe, aşağı bakan stilize bir stadyum
   çizimi kademeli olarak büyüyor: önce tribünler ekleniyor, sonra stadyum
   çevreleniyor, sonra çatı ve flood-ışıkları geliyor, en üst seviyede ise
   çift katlı tribünler ve dolu bir taraftar kitlesi ile "mega" bir stadyum
   görünümü oluşuyor. Bu tamamen kozmetik bir görselleştirme; gerçek maç günü
   geliri FACILITY_DEFS.stadium ve playLeagueMatch() içindeki hesaplamadan
   geliyor, burada sadece o ilerlemeyi gözle görülür kılıyoruz. */
const STADIUM_MAX_LEVEL = 30;
const STADIUM_NAMES_SUFFIX = ["Sahası", "Stadı", "Arena", "Park Stadı", "Arenası", "Katedrali"];
function stadiumCapacity(level){
  const lvl = Math.max(0, Math.min(level, STADIUM_MAX_LEVEL));
  return Math.round((8000 + (110000-8000) * (lvl/STADIUM_MAX_LEVEL)) / 500) * 500;
}
function stadiumNameSuffix(level){
  const idx = Math.min(STADIUM_NAMES_SUFFIX.length-1, Math.floor(level / (STADIUM_MAX_LEVEL/STADIUM_NAMES_SUFFIX.length)));
  return STADIUM_NAMES_SUFFIX[idx];
}
// Taraftar desteği (fanApproval, 0-100) stadyumun doluluk oranını belirler:
// taraftar ne kadar yüksekse tribünler o kadar dolu olur ve maç günü geliri
// stadyum seviyesinin izin verdiği maksimuma o kadar yaklaşır. Destek düşükse
// tribünler boş kalır ve gelir düşer — ama tamamen sıfırlanmaz (taban %15
// doluluk garantisi var, en sadık taraftarlar her koşulda gelir).
function stadiumAttendanceRate(fanApproval){
  const fa = (fanApproval===undefined||fanApproval===null) ? 60 : fanApproval;
  return clamp(0.15 + (fa/100)*0.85, 0.15, 1);
}
function stadiumIncomeEstimate(level, fanApproval){
  if(!level) return 0;
  return Math.round(level*150000 * stadiumAttendanceRate(fanApproval));
}
// lite=true -> önizleme şeridindeki küçük ikonlar için: tek tek koltuk noktası
// çizmez, sadece dolgu renginin yoğunluğuyla tribün hissi verir (30 seviye x
// çok sayıda küçük ikon aynı anda render edildiği için performans amaçlı).
function stadiumSVG(level, club, size, lite){
  size = size || 320;
  const w = 400, h = 280;
  const cx = 200, cy = 140;
  const c1 = club ? club.color : "#00D9FF";
  const c2 = shadeColor(c1, -30);
  const L = Math.max(0, Math.min(level, STADIUM_MAX_LEVEL));
  const progress = L / STADIUM_MAX_LEVEL; // 0..1 — kademeler arasında sürekli büyüme için

  // Seviye eşikleri 30'a yayılmış: tribünler -> tam çevrilme -> flood ışıkları
  // -> çatı + dev ekranlar -> ikinci kat (çift katlı mega stadyum).
  const hasStandNS = L >= 1;
  const hasStandEW = L >= 6;
  const hasLights  = L >= 12;
  const hasRoof    = L >= 18;
  const tier2Progress = L > 24 ? Math.min(1, (L-24)/6) : 0; // 24->30 arası ikinci kat büyür
  const hasMega    = L >= 30;

  const thick = 14 + Math.min(L,24)/24*16; // 14 -> 30 arası kademeli kalınlaşma
  const gap = 4;

  function standBand(orientation, tier, tierThick, tierAlpha){
    let x,y,bw,bh;
    if(orientation==='top'){ x=70-tier*gap; y=34-tier*(tierThick+gap); bw=260+tier*gap*2; bh=tierThick; }
    if(orientation==='bottom'){ x=70-tier*gap; y=214+tier*(tierThick+gap); bw=260+tier*gap*2; bh=tierThick; }
    if(orientation==='left'){ x=34-tier*(tierThick+gap); y=60-tier*gap; bw=tierThick; bh=160+tier*gap*2; }
    // Sağ tribün, sol tribünün merkez ekseninde (x=200) tam simetrik yansıması
    // olacak şekilde hesaplanıyor (400 - solX - genişlik). Önceki sabit
    // "x=214" değeri pitch'in (x:100-300) içine giriyordu; bu yüzden sağ
    // tribün her zaman yeşil sahanın altında kalıp görünmüyordu.
    if(orientation==='right'){ x=400-(34-tier*(tierThick+gap))-tierThick; y=60-tier*gap; bw=tierThick; bh=160+tier*gap*2; }
    const seatColor = tier===1 ? "#FFD700" : c1;
    const seatColor2 = tier===1 ? "#B8860B" : c2;
    const horizontal = orientation==='top'||orientation==='bottom';
    let seats = "";
    if(!lite){
      const step = 7;
      if(horizontal){
        for(let sx=x+4; sx<x+bw-4; sx+=step){
          for(let sy=y+4; sy<y+bh-4; sy+=7){
            seats += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="1.5" fill="${(sx+sy)%14<7?seatColor:seatColor2}" opacity="0.85"/>`;
          }
        }
      } else {
        for(let sy=y+4; sy<y+bh-4; sy+=step){
          for(let sx=x+4; sx<x+bw-4; sx+=7){
            seats += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="1.5" fill="${(sx+sy)%14<7?seatColor:seatColor2}" opacity="0.85"/>`;
          }
        }
      }
    }
    return `<g opacity="${tierAlpha!==undefined?tierAlpha:1}">
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${lite?seatColor:'#1A2333'}" fill-opacity="${lite?0.55:1}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      ${seats}
    </g>`;
  }

  let standsHtml = "";
  if(hasStandNS){ standsHtml += standBand('top',0,thick) + standBand('bottom',0,thick); }
  if(hasStandEW){ standsHtml += standBand('left',0,thick) + standBand('right',0,thick); }
  if(tier2Progress > 0){
    const t2thick = 12 + tier2Progress*18;
    standsHtml += standBand('top',1,t2thick,0.35+tier2Progress*0.65) + standBand('bottom',1,t2thick,0.35+tier2Progress*0.65)
      + standBand('left',1,t2thick,0.35+tier2Progress*0.65) + standBand('right',1,t2thick,0.35+tier2Progress*0.65);
  }

  // Flood ışıkları (4 köşe)
  let lightsHtml = "";
  if(hasLights){
    const corners = [[40,40],[360,40],[40,240],[360,240]];
    lightsHtml = corners.map(([lx,ly])=>`
      <line x1="${lx}" y1="${ly}" x2="${lx>200?lx+14:lx-14}" y2="${ly>140?ly+14:ly-14}" stroke="#3A4658" stroke-width="3"/>
      <circle cx="${lx>200?lx+14:lx-14}" cy="${ly>140?ly+14:ly-14}" r="6" fill="#FFF6C8">
        ${lite?'':'<animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>'}
      </circle>
    `).join("");
  }

  // Çatı halkası + dev ekranlar
  let roofHtml = "";
  if(hasRoof){
    roofHtml = `
      <rect x="18" y="18" width="364" height="244" rx="26" fill="none" stroke="url(#roofGrad)" stroke-width="5" opacity="0.9"/>
      <rect x="150" y="8" width="100" height="14" rx="3" fill="#0A0F16" stroke="${c1}" stroke-width="1.5"/>
      <rect x="150" y="258" width="100" height="14" rx="3" fill="#0A0F16" stroke="${c1}" stroke-width="1.5"/>
    `;
  }

  // Taraftar parıltısı / konfeti (sadece maksimum seviye)
  let megaFx = "";
  if(hasMega){
    megaFx = `
      <circle cx="200" cy="140" r="150" fill="url(#glowGrad)" opacity="0.35"/>
      ${lite ? "" : [...Array(10)].map((_,i)=>`<circle cx="${30+i*36}" cy="${18+ (i%2)*250}" r="2.2" fill="${i%2? '#FFD700':'#00D9FF'}"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="${1.6+i*0.15}s" repeatCount="indefinite"/></circle>`).join("")}
    `;
  } else if(progress > 0.5 && !lite){
    megaFx = `<circle cx="200" cy="140" r="150" fill="url(#glowGrad)" opacity="${((progress-0.5)*0.5).toFixed(2)}"/>`;
  }

  const pitchX = 100, pitchY = 68, pitchW = 200, pitchH = 144;

  return `<svg viewBox="0 0 ${w} ${h}" width="${size}" height="${Math.round(size*h/w)}" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;overflow:visible;">
    <defs>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${c1}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${c1}" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="#FFD700"/>
      </linearGradient>
      <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">

function upgradeFacility(key){
  const def = FACILITY_DEFS[key];
  if(!def) return;
  const club = state.clubs[state.playerClubId];
  ensureFacilities(club);
  const level = club.facilities[key];
  if(level >= def.maxLevel){ showToast(`${def.label} zaten maksimum seviyede!`); return; }
  const cost = def.costs[level];
  // Maaş bordrosu düşüldükten sonra kalan, gerçekten harcanabilir bütçeye göre kontrol.
  const availableBudget = Math.max(0, club.budget - clubWageBill(state.playerClubId));
  if(availableBudget < cost){
    showToast(`❌ Yeterli bütçe yok! ${def.label} seviye ${level+1} için ${fmtMoney(cost)} gerekli, kullanılabilir bütçen: ${fmtMoney(availableBudget)}.`);
    return;
  }
  club.budget -= cost;
  club.facilities[key] = level+1;
  showToast(`✅ ${def.icon} ${def.label} seviye ${level+1}'e yükseltildi!`);
  render();
  saveGame(false);
}
function renderFacilities(){
  const club = state.clubs[state.playerClubId];
  ensureFacilities(club);
  // Maaşlar (yıllık maaş bordrosu) düşüldükten sonra gerçekten harcanabilecek
  // bütçe — topbar'daki "Transfer Kap." ile aynı mantık.
  const wageBill = clubWageBill(state.playerClubId);
  const availableBudget = Math.max(0, club.budget - wageBill);
  const cards = Object.keys(FACILITY_DEFS).map(key=>{
    const def = FACILITY_DEFS[key];
    const level = club.facilities[key];
    const maxed = level >= def.maxLevel;
    const cost = maxed ? null : def.costs[level];
    const canAfford = !maxed && availableBudget >= cost;
    // 30 seviyeli tesislerde noktalar hep aynı boyutta, satır başına 10 tane
    // olacak şekilde CSS grid ile düzenli 3 satıra sığdırılıyor (Stadyum'da
    // zaten 5 seviye olduğu için tek satır yeterli).
    const dotSize = 10;
    const perRow = Math.min(def.maxLevel, 10);
    const progressHtml = `<div style="display:grid;grid-template-columns:repeat(${perRow},${dotSize}px);gap:4px;">${
      Array.from({length:def.maxLevel}).map((_,i)=>
        `<span style="display:inline-block;width:${dotSize}px;height:${dotSize}px;border-radius:50%;background:${i<level?'var(--gold)':'rgba(255,255,255,0.12)'};"></span>`
      ).join("")
    }</div>`;
    return `<div class="shop-card">
      <div class="shop-card-icon">${def.icon}</div>
      <h3>${def.label}</h3>
      <div class="pmeta" style="margin:6px 0 8px;">Seviye ${level}/${def.maxLevel}</div>
      <div style="margin-bottom:10px;">${progressHtml}</div>
      <div class="pmeta" style="margin-bottom:12px;line-height:1.5;min-height:34px;">${def.effectLine(level)}</div>
      ${maxed
        ? `<span class="tier-pill" style="color:var(--gold);border-color:var(--gold);">Maksimum Seviye</span>`
        : `<button class="btn-save-primary" ${canAfford?'':'disabled'} onclick="upgradeFacility('${key}')">${canAfford?`Yükselt · ${fmtMoney(cost)}`:`Yetersiz Bütçe (${fmtMoney(cost)})`}</button>`
      }
      ${key==='stadium' ? `<button class="back-link" style="width:100%;margin-top:8px;" onclick="setTab('stadium')">🏟️ Stadyumu Görüntüle</button>` : ""}
    </div>`;
  }).join("");
  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>🏗️ Tesis Yükseltmeleri</h2></div>
      <p class="muted" style="margin:0 0 16px;">Kulüp bütçenle antrenman tesisini, stadyumunu ve akademini yükselt. Her seviye takım performansını, sakatlık direncini, maç günü gelirini ve genç yetenek kalitesini kalıcı olarak artırır. Kullanılabilir bütçen (maaş bordrosu düşülmüş): <b class="mono">${fmtMoney(availableBudget)}</b></p>
      <div class="shop-grid">${cards}</div>
      <p class="footnote" style="margin-top:18px;">Yükseltmeler kalıcıdır ve sezonlar arası korunur; hiçbir zaman geri alınamaz veya düşürülemez.</p>
    </div>`;
}

function renderStadium(){
  const club = state.clubs[state.playerClubId];
  ensureFacilities(club);
  const level = club.facilities.stadium || 0;
  const def = FACILITY_DEFS.stadium;
  const maxed = level >= def.maxLevel;
  const wageBill = clubWageBill(state.playerClubId);
  const availableBudget = Math.max(0, club.budget - wageBill);
  const cost = maxed ? null : def.costs[level];
  const canAfford = !maxed && availableBudget >= cost;
  const stadiumName = `${club.name} ${stadiumNameSuffix(level)}`;
  const capacity = stadiumCapacity(level);
  const nextCapacity = maxed ? null : stadiumCapacity(level+1);
  ensureManagerProfile();
  const fanApproval = state.fanApproval;
  const fanInfo = fanApprovalInfo(fanApproval);
  const attendanceRate = stadiumAttendanceRate(fanApproval);
  const currentIncomeEstimate = stadiumIncomeEstimate(level, fanApproval);
  const maxIncomeAtFullSupport = level>0 ? Math.round(level*150000) : 0;
  const lastIncomeHtml = state.lastStadiumIncome
    ? `<div class="pmeta" style="margin-top:2px;">Son ev sahibi maçında kazanılan maç günü geliri: <b class="mono" style="color:var(--green-pos);">${fmtMoney(state.lastStadiumIncome)}</b>${state.lastStadiumAttendanceRate?` · Doluluk ~%${Math.round(state.lastStadiumAttendanceRate*100)}`:''}</div>`
    : "";

  // Seviye 0'dan maksimuma (30) kadar küçük önizleme şeridi — kullanıcı hem
  // şu anki görünümü hem de bir sonraki seviyelerde stadyumun nasıl
  // büyüyeceğini önceden görebiliyor. Sabit genişlikli flex öğeleri +
  // overflow-x:auto kullanıyoruz ki sağ taraftaki (üst seviye) kartlar
  // #app'in overflow:hidden'ı yüzünden kesilip kaybolmasın, düzgün yatay
  // kaydırma ile görünür kalsın. Performans için "lite" (koltuk noktasız)
  // mod kullanılıyor.
  const previewItemW = 78;
  const previewStrip = Array.from({length: def.maxLevel+1}).map((_,lvl)=>{
    const active = lvl === level;
    const locked = lvl > level;
    return `<div style="flex:0 0 ${previewItemW}px;width:${previewItemW}px;text-align:center;opacity:${locked?0.45:1};">
      <div style="background:${active?'rgba(255,215,0,0.08)':'rgba(31,42,61,0.4)'};border:1px solid ${active?'var(--gold)':'var(--line-strong)'};border-radius:10px;padding:5px;box-shadow:${active?'0 0 14px rgba(255,215,0,0.25)':'none'};">
        ${stadiumSVG(lvl, club, previewItemW-10, true)}
      </div>
      <div class="pmeta mono" style="margin-top:4px;font-size:10px;">Sv.${lvl}${active?' ★':''}</div>
    </div>`;
  }).join("");

  return `
    <div class="panel">
      <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <h2><span class="kickoff-dot"></span>🏟️ ${stadiumName}</h2>
        <span class="tier-pill" style="color:var(--gold);border-color:var(--gold-dim);">Seviye ${level}/${def.maxLevel}</span>
      </div>
      <div style="background:radial-gradient(ellipse at 50% 0%, rgba(0,217,255,0.08), transparent), var(--panel);border:1px solid var(--line-strong);border-radius:16px;padding:14px;margin-bottom:16px;">
        ${stadiumSVG(level, club, 420)}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;">
        <div class="shop-card" style="text-align:center;">
          <div class="shop-card-icon">🎟️</div>
          <div class="pmeta">Kapasite</div>
          <div class="mono" style="font-size:18px;font-weight:700;">${capacity.toLocaleString('tr-TR')}</div>
        </div>
        <div class="shop-card" style="text-align:center;">
          <div class="shop-card-icon">${fanInfo.emoji}</div>
          <div class="pmeta">Taraftar Desteği · Doluluk</div>
          <div class="mono" style="font-size:18px;font-weight:700;color:${fanInfo.color};">${fanApproval} · %${Math.round(attendanceRate*100)}</div>
        </div>
        <div class="shop-card" style="text-align:center;">
          <div class="shop-card-icon">💰</div>
          <div class="pmeta">Maç Günü Geliri (mevcut doluluk)</div>
          <div class="mono" style="font-size:18px;font-weight:700;color:var(--green-pos);">${level>0?fmtMoney(currentIncomeEstimate):'—'}</div>
          ${level>0?`<div class="pmeta" style="margin-top:2px;font-size:10.5px;">Taraftar %100 desteklerse maks. ${fmtMoney(maxIncomeAtFullSupport)}</div>`:''}
        </div>
        <div class="shop-card" style="text-align:center;">
          <div class="shop-card-icon">📈</div>
          <div class="pmeta">${maxed?'Maksimum Seviye':'Sonraki Seviye Kapasitesi'}</div>
          <div class="mono" style="font-size:18px;font-weight:700;">${maxed?'—':nextCapacity.toLocaleString('tr-TR')}</div>
        </div>
      </div>
      ${lastIncomeHtml}
      <p class="muted" style="margin:12px 0 10px;">Stadyumunu yükselttikçe tribünler büyür, çevresi tamamen kapanır, flood ışıkları ve çatı eklenir; seviye 25'ten itibaren ikinci kat tribünler yükselmeye başlar ve en üst seviyede (30) dolup taşan bir "mega stadyum" haline gelir. Maç günü geliri hem stadyum seviyene hem de taraftar desteğine bağlı: taraftar ne kadar yüksekse tribünler o kadar dolar ve gelirin stadyumun izin verdiği maksimuma o kadar yaklaşır — destek düşükse tribünler boş kalır ve gelir düşer. Aşağıdaki şeridi kaydırarak seviye 0'dan ${def.maxLevel}'e kadar bu gelişimi önizleyebilirsin.</p>
      <div style="display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:18px;overflow-x:auto;overflow-y:hidden;width:100%;padding-bottom:6px;-webkit-overflow-scrolling:touch;">
        ${previewStrip}
      </div>
      <div style="text-align:center;">
        ${maxed
          ? `<span class="tier-pill" style="color:var(--gold);border-color:var(--gold);padding:10px 22px;">Stadyum Maksimum Seviyede</span>`
          : `<button class="btn-save-primary" ${canAfford?'':'disabled'} onclick="upgradeFacility('stadium')">${canAfford?`🏗️ Stadyumu Yükselt · ${fmtMoney(cost)}`:`Yetersiz Bütçe (${fmtMoney(cost)})`}</button>`
        }
      </div>
    </div>`;
}

function renderCareerHistory(){

  if(state.playerClubId) clubsManaged.add(state.playerClubId);
  const titleCount = history.filter(e=>e.champion).length + history.filter(e=>e.euroTitle).length;
  const promotionCount = history.filter(e=>e.promoted).length;

  const summaryHtml = `
    <div class="trophy-summary-grid">

      <div class="trophy-summary-card">

        <div class="trophy-summary-count">${titleCount}</div>
        <div class="trophy-summary-label">Şampiyonluk</div>
      </div>
      <div class="trophy-summary-card">
        <div class="trophy-summary-icon">⬆️</div>
        <div class="trophy-summary-count">${promotionCount}</div>
        <div class="trophy-summary-label">Yükselme</div>
      </div>
    </div>`;

  const rowsHtml = history.length > 0 ? history.map(e=>{
    const badges = [];
    if(e.euroTitle) badges.push(`<span class="tier-pill" style="color:var(--gold);border-color:var(--gold);">🏆 ${e.euroTitle}</span>`);
    if(e.champion) badges.push(`<span class="tier-pill" style="color:var(--gold);border-color:var(--gold);">🏆 Lig Şampiyonu</span>`);
    if(e.promoted) badges.push(`<span class="tier-pill" style="color:var(--green-pos);border-color:var(--green-pos);">⬆️ Yükseldi</span>`);
    if(e.relegated) badges.push(`<span class="tier-pill" style="color:var(--red-neg);border-color:var(--red-neg);">⬇️ Küme Düştü</span>`);
    if(e.fired) badges.push(`<span class="tier-pill" style="color:var(--red-neg);border-color:var(--red-neg);">🚪 Kovuldu</span>`);
    return `
    <div class="trophy-row">
      <div class="trophy-row-icon">${e.champion || e.euroTitle ? '🏆' : (e.fired ? '🚪' : (e.promoted ? '⬆️' : (e.relegated ? '⬇️' : '📋')))}</div>

        <div class="trophy-row-sub">${e.finishPos}. sıra / ${e.totalTeams} takım${badges.length ? ' · ' + badges.join(' ') : ''}</div>

      <div class="trophy-row-year mono">${seasonLabel(e.year)}</div>

  }).join("") : '<div class="empty" style="padding:30px;">Henüz tamamlanmış bir sezon yok. İlk sezonunuzu bitirdiğinizde kariyer geçmişiniz burada birikmeye başlayacak.</div>';

  const unlockedAch = state.achievements || [];
