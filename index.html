};

// O an her ülke kodu için forma giyebilecek (kulüpte, emekli/satılık olmayan)
// oyuncuları reytinge göre sıralayıp tek seferde gruplayan önbellek — turnuva
// başına binlerce oyuncuyu tek tek taramak yerine bunu bir kez kurup kullanırız.
function buildCountrySquadCache(){
  const cache = {};
  Object.values(state.players).forEach(p=>{
    if(!p || !p.countryCode || !p.club || p.club==="retired" || p.club==="sold") return;
    (cache[p.countryCode] = cache[p.countryCode] || []).push(p);
  });
  Object.keys(cache).forEach(code=>{
    cache[code].sort((a,b)=>b.rating-a.rating);
    if(cache[code].length > NT_SQUAD_SIZE) cache[code].length = NT_SQUAD_SIZE;
  });
  return cache;
}
// Belirli bir ülkenin o anki en iyi 23'ünü döndürür (ekranda gösterim için;
// önbellek verilmemişse anlık kurar).
function nationalSquadPlayers(countryCode, squadCache){
  if(squadCache) return squadCache[countryCode] || [];
  return Object.values(state.players)
    .filter(p=>p && p.countryCode===countryCode && p.club && p.club!=="retired" && p.club!=="sold")
    .sort((a,b)=>b.rating-a.rating)
    .slice(0, NT_SQUAD_SIZE);
}
// Milli takım gücü: ilk 11'in ortalama reytingi (ağırlıklı) + ülkenin genel
// futbol kültürü/derinliğini temsil eden "strength" değeri (COUNTRIES'ten).
function nationalTeamStrength(countryCode, squadCache){
  const country = countryByCode(countryCode);
  const baseline = (country ? country.strength : 0.5) * 82;
  const squad = nationalSquadPlayers(countryCode, squadCache);
  if(!squad.length) return baseline * 0.75;
  const xi = squad.slice(0, 11);
  const avg = xi.reduce((s,p)=>s+p.rating,0) / xi.length;
  return avg*0.82 + baseline*0.18;
}
function simulateNationalMatch(codeA, codeB, squadCache){
  const sa = nationalTeamStrength(codeA, squadCache), sb = nationalTeamStrength(codeB, squadCache);
  const lamA = clamp(1.3 + (sa-sb)*0.05, 0.2, 4.2);
  const lamB = clamp(1.0 + (sb-sa)*0.05, 0.15, 3.8);
  return { gh: poisson(lamA), ga: poisson(lamB) };
}
// Bir maçtaki golleri, o ülkenin mevcut kadrosundan mevkiye göre ağırlıklı
// seçilen oyunculara dağıtır (kulüp maçlarındaki golcü seçim mantığıyla aynı) —
// turnuva gol krallığı gerçek, tanıdık oyunculardan oluşsun diye.
function pickNationalScorers(countryCode, goalCount, tally, squadCache){
  const squad = nationalSquadPlayers(countryCode, squadCache);
  if(!squad.length || goalCount<=0) return;
  for(let i=0;i<goalCount;i++){
    const scorer = pickWeighted(squad, p=>(GOAL_POS_WEIGHT[p.pos]||1) * ((p.rating||70)/70));
    if(!scorer) continue;
    tally[scorer.id] = (tally[scorer.id]||0) + 1;
  }
}
// Ağırlıklı ve TEKRARSIZ seçim: havuzdan `count` kadar farklı öğeyi, ağırlığı
// yüksek olan daha sık seçilecek şekilde art arda çeker (katılımcı ülke seçimi için).
function pickWeightedUnique(pool, weightFn, count){
  let remaining = pool.slice();
  const chosen = [];
  for(let i=0; i<count && remaining.length; i++){
    const pick = pickWeighted(remaining, weightFn);
    if(!pick) break;
    chosen.push(pick);
    remaining = remaining.filter(x=>x!==pick);
  }
  return chosen;
}
// Dünya Kupası'na katılacak 16 ülkeyi belirler: en güçlü ~%40'ı doğrudan
// (tohum başları), kalanı ise gücüyle orantılı ağırlıklı kurayla — yani zayıf
// bir ülke de sürpriz yaparak katılabilir, güçlü bir ülke de bazen ıskalayabilir.
function selectWorldCupEntrants(squadCache){
  const size = WC_GROUP_SIZE * WC_GROUP_COUNT;
  const codes = COUNTRIES.map(c=>c.code);
  const strengths = {};
  codes.forEach(c=>{ strengths[c] = nationalTeamStrength(c, squadCache); });
  const sorted = codes.slice().sort((a,b)=>strengths[b]-strengths[a]);
  const autoCount = Math.round(size*0.4);
  const auto = sorted.slice(0, autoCount);
  const restPool = sorted.slice(autoCount);
  const picked = pickWeightedUnique(restPool, c=>Math.pow(1.05, strengths[c]), size-auto.length);
  return auto.concat(picked);
}
// Kıtasal Şampiyona: öncelik o kıtadaki ülkelerde. Kıtada yeterli ülke yoksa
// (ör. Okyanusya, Kuzey Amerika) kalan kontenjan diğer kıtalardan en güçlü
// ülkelerle doldurulur — "konfederasyonlar arası play-off" kurgusu gibi düşünülebilir.
function selectContinentalEntrants(continentKey, squadCache){
  let pool = COUNTRIES.filter(c=>c.continent===continentKey).map(c=>c.code);
  const target = pool.length >= 16 ? 16 : 8;
  if(pool.length < target){
    const strengths = {};
    const others = COUNTRIES.filter(c=>c.continent!==continentKey).map(c=>c.code);
    others.forEach(c=>{ strengths[c] = nationalTeamStrength(c, squadCache); });
    const fillers = others.sort((a,b)=>strengths[b]-strengths[a]).slice(0, target-pool.length);
    pool = pool.concat(fillers);
  }
  const strengths = {};
  pool.forEach(c=>{ strengths[c] = nationalTeamStrength(c, squadCache); });
  const sorted = pool.slice().sort((a,b)=>strengths[b]-strengths[a]);
  const autoCount = Math.round(target*0.5);
  const auto = sorted.slice(0, autoCount);
  const restPool = sorted.slice(autoCount);
  const picked = pickWeightedUnique(restPool, c=>Math.pow(1.05, strengths[c]), target-auto.length);
  return auto.concat(picked).slice(0, target);
}
// Katılımcıları güce göre 4 torbaya ayırıp her gruba bir torbadan bir ülke
// düşecek şekilde (gerçek kura mantığı gibi) gruplara dağıtır.
function buildNationalGroups(entrantCodes, squadCache){
  const groupCount = entrantCodes.length / 4;
  const strengths = {};
  entrantCodes.forEach(c=>{ strengths[c] = nationalTeamStrength(c, squadCache); });
  const sorted = entrantCodes.slice().sort((a,b)=>strengths[b]-strengths[a]);
  const groups = Array.from({length:groupCount}, ()=>[]);
  for(let pot=0; pot<4; pot++){
    const potCodes = shuffleArray(sorted.slice(pot*groupCount, (pot+1)*groupCount));
    potCodes.forEach((code,i)=>{ groups[i].push(code); });
  }
  return groups;
}
// Bir grubun tek devreli round-robin'ini oynar (4 takım -> 3 tur, 6 maç) ve
// hem puan tablosunu hem oynanan maçları döndürür.
function playNationalGroup(groupCodes, scorersTally, squadCache){
  const table = buildEmptyGroupTable(groupCodes);
  const rounds = generateRoundRobinPairs(groupCodes).slice(0, groupCodes.length-1);
  const matches = [];
  rounds.forEach(round=>{
    round.forEach(([h,a])=>{
      const {gh,ga} = simulateNationalMatch(h, a, squadCache);
      applyMatchToTable(table, h, a, gh, ga);
      pickNationalScorers(h, gh, scorersTally, squadCache);
      pickNationalScorers(a, ga, scorersTally, squadCache);
      matches.push({home:h, away:a, gh, ga});
    });
  });
  const standings = Object.values(table).sort((x,y)=>(y.Pts-x.Pts)||((y.GF-y.GA)-(x.GF-x.GA))||(y.GF-x.GF));
  return { clubs: groupCodes, standings, qualifiers: standings.slice(0,2).map(r=>r.id), matches };
}
// Tek maçlık eleme turu: berabere biterse Süper Kupa'daki gibi penaltılarla kazanan belirlenir.
function playNationalKO(pairs, scorersTally, squadCache){
  return pairs.map(([h,a])=>{
    const {gh,ga} = simulateNationalMatch(h, a, squadCache);
    pickNationalScorers(h, gh, scorersTally, squadCache);
    pickNationalScorers(a, ga, scorersTally, squadCache);
    let penalties = null, winner;
    if(gh===ga){
      let ph=randInt(3,5), pa=randInt(3,5);
      while(ph===pa){ ph=randInt(3,5); pa=randInt(3,5); }
      penalties = {ph, pa};
      winner = ph>pa ? h : a;
    } else winner = gh>ga ? h : a;
    return {home:h, away:a, gh, ga, penalties, winner};
  });
}
// Turnuvanın tamamını (katılımcı seçimi -> gruplar -> eleme turları) tek seferde
// simüle eder, sonucu state'e kalıcı olarak işler ve haber/moral/kupa
// etkilerini uygular. finishSeason() içinden, sezon sonunda çağrılır.
function runInternationalTournament(kind){
  const year = state.year;
  const club = state.clubs[state.playerClubId];
  const myCountryCode = club ? club.country : null;
  const squadCache = buildCountrySquadCache();

  let entrants, label, icon = kind==="world" ? "🌍" : "🏆";
  if(kind === "world"){
    entrants = selectWorldCupEntrants(squadCache);
    label = "Dünya Kupası";
  } else {
    const continentKey = (myCountryCode && countryByCode(myCountryCode)) ? countryByCode(myCountryCode).continent : "europe";
    entrants = selectContinentalEntrants(continentKey, squadCache);
    label = CONTINENT_CUP_NAMES[continentKey] || "Kıtasal Şampiyona";
  }

  const groups = buildNationalGroups(entrants, squadCache);
  const scorersTally = {};
  const groupResults = groups.map((g,gi)=>Object.assign({name:String.fromCharCode(65+gi)}, playNationalGroup(g, scorersTally, squadCache)));

  let qf = [], sf, final;
  if(groupResults.length === 4){
    const [A,B,C,D] = groupResults;
    qf = playNationalKO([
      [A.qualifiers[0], B.qualifiers[1]],
      [C.qualifiers[0], D.qualifiers[1]],
      [B.qualifiers[0], A.qualifiers[1]],
      [D.qualifiers[0], C.qualifiers[1]]
    ], scorersTally, squadCache);
    sf = playNationalKO([[qf[0].winner, qf[1].winner],[qf[2].winner, qf[3].winner]], scorersTally, squadCache);
  } else {
    const [A,B] = groupResults;
    sf = playNationalKO([
      [A.qualifiers[0], B.qualifiers[1]],
      [B.qualifiers[0], A.qualifiers[1]]
    ], scorersTally, squadCache);
  }
  final = playNationalKO([[sf[0].winner, sf[1].winner]], scorersTally, squadCache)[0];

  const winnerCode = final.winner;
  const winnerCountry = countryByCode(winnerCode);
  const topScorerId = Object.keys(scorersTally).sort((a,b)=>scorersTally[b]-scorersTally[a])[0] || null;
  const myParticipated = myCountryCode ? entrants.includes(myCountryCode) : false;

  const result = {
    year, kind, label, icon,
    groups: groupResults, qf, sf, final,
    winner: winnerCode,
    topScorer: topScorerId ? {id: topScorerId, goals: scorersTally[topScorerId]} : null,
    myCountryCode, myParticipated
  };
  state.internationalHistory = state.internationalHistory || [];
  state.internationalHistory.unshift({year, kind, label, icon, winner: winnerCode, myParticipated, myWon: myCountryCode===winnerCode});
  if(state.internationalHistory.length > 20) state.internationalHistory.length = 20;
  state.lastInternationalResult = result;

  state.lastInternationalNote = `${icon} ${label} ${seasonLabel(year)} sona erdi — şampiyon: ${winnerCountry?winnerCountry.flag+" "+winnerCountry.name:"?"}. Detaylar için Milli Takım ekranına bakabilirsin.`;
  addNews(`${icon} ${label} ${seasonLabel(year)}: ${winnerCountry?winnerCountry.flag+" "+winnerCountry.name:"?"} şampiyon oldu.`, "award");

  if(myCountryCode){
    if(!myParticipated){
      addNews(`😕 ${club.countryName}, ${label}'na katılamadı.`, "flavor");
    } else if(winnerCode === myCountryCode){
      addNews(`🎉 ${club.countryName}, ${label}'nı kazandı! Ülke çapında büyük bir kutlama var.`, "award");
      adjustReputation(4);
      adjustFanApproval(6);
      unlockAchievement('milli_sampiyon');
      nationalSquadPlayers(myCountryCode, squadCache).forEach(p=>{
        if(p.club === state.playerClubId){
          adjustMorale(p.id, 12);
          addPlayerTrophy({type:"nationalteam", icon, title: label+" Şampiyonu", subtitle: club.countryName, key:"nt:"+year+":"+kind});
        }
      });
    }
  }

  if(topScorerId){
    const scorer = state.players[topScorerId];
    if(scorer){
      addNews(`⚽ ${scorer.flag||""} ${scorer.name}, ${label}'nda ${scorersTally[topScorerId]} golle gol kralı oldu.`, "award");
      if(scorer.club === state.playerClubId){
        adjustMorale(scorer.id, 8);
        addPlayerTrophy({type:"nationalteam", icon:"⚽", title: label+" Gol Kralı", subtitle: seasonLabel(year), key:"ntscorer:"+year+":"+kind});
      }
    }
  }
}

/* ================= SÜPER KUPA =================
   Gerçek hayattaki UEFA Süper Kupa gibi: bir önceki sezonun Şampiyonlar Ligi
   şampiyonu ile Avrupa Ligi şampiyonu, yeni sezon başlamadan önce tek maçlık
   bir Süper Kupa finalinde karşılaşır. Beraberlik durumunda penaltılarla
   kazanan belirlenir. startSeason() içinde, o sezonun ŞL/AL grupları
   kurulmadan hemen önce çağrılır. */
function runSuperCup(){
  const clWinnerId = state.clHistory && state.clHistory[0] ? state.clHistory[0].winnerId : null;
  const elWinnerId = state.elHistory && state.elHistory[0] ? state.elHistory[0].winnerId : null;
  state.superCupModal = null;
  if(!clWinnerId || !elWinnerId || clWinnerId === elWinnerId) return;
  const clClub = state.clubs[clWinnerId];
  const elClub = state.clubs[elWinnerId];
  if(!clClub || !elClub) return;

  let {gh, ga} = simulateMatch(clWinnerId, elWinnerId);
  let penalties = null;
  let winnerId;
  if(gh === ga){
    let ph = randInt(3,5), pa = randInt(3,5);
    while(ph === pa){ ph = randInt(3,5); pa = randInt(3,5); }
    penalties = {ph, pa};
    winnerId = ph > pa ? clWinnerId : elWinnerId;
  } else {
    winnerId = gh > ga ? clWinnerId : elWinnerId;
  }
  const winnerClub = state.clubs[winnerId];

  state.superCup = { year: state.year, clId: clWinnerId, elId: elWinnerId, gh, ga, penalties, winner: winnerId };
  state.superCupHistory = state.superCupHistory || [];
  state.superCupHistory.unshift({ year: state.year, winnerId, clId: clWinnerId, elId: elWinnerId, gh, ga, penalties });
  if(state.superCupHistory.length > 20) state.superCupHistory = state.superCupHistory.slice(0,20);

  const playerInvolved = winnerId === state.playerClubId || clWinnerId === state.playerClubId || elWinnerId === state.playerClubId;
  let amount = null;
  if(winnerId === state.playerClubId){
    addPlayerTrophy({type:'supercup', icon:'⭐', title:"Süper Kupa", subtitle:"Şampiyon"});
    const country = countryByCode(winnerClub.country);
    const factor = country ? country.strength : 0.5;
    amount = Math.round(randInt(4,8) * factor) * 1000000;
    state.clubs[state.playerClubId].budget += amount;
    adjustSquadMorale(state.playerClubId, 10);
  } else if(state.playerClubId===clWinnerId || state.playerClubId===elWinnerId){
    adjustSquadMorale(state.playerClubId, -6);
  }

  state.superCupModal = {
    clName: clClub.name, elName: elClub.name,
    clId: clWinnerId, elId: elWinnerId,
    gh, ga, penalties,
    winnerId, winnerName: winnerClub.name,
    playerInvolved, amount
  };
}
function closeSuperCupModal(){
  state.superCupModal = null;
  render();
}
function renderSuperCupModal(){
  const s = state.superCupModal;
  if(!s) return "";
  const clClub = state.clubs[s.clId], elClub = state.clubs[s.elId];
  const pensHtml = s.penalties ? `<div class="sc-pens">Penaltılar: ${s.penalties.ph}-${s.penalties.pa}</div>` : "";
  return `<div class="champ-overlay" onclick="if(event.target===this) closeSuperCupModal()">
    <div class="champ-card sc-card">
      <div class="sc-trophy">🏆</div>
      <div class="champ-title sc-title">SÜPER KUPA</div>
      <div class="champ-sub">Şampiyonlar Ligi şampiyonu ile Avrupa Ligi şampiyonu, yeni sezon öncesi Süper Kupa'da karşı karşıya geldi.</div>
      <div class="sc-teams">
        <div class="sc-team ${s.winnerId===s.clId?'winner':''}">
          ${clClub?crestSVG(clClub,40):''}
          <span class="sc-team-name">${s.clName}</span>
          <span class="sc-tag">ŞL Şampiyonu</span>

          ${elClub?crestSVG(elClub,40):''}
          <span class="sc-team-name">${s.elName}</span>
          <span class="sc-tag">AL Şampiyonu</span>
        </div>
      </div>
      <div class="champ-sub" style="margin-bottom:${s.amount?'6px':'18px'};"><strong>${s.winnerName}</strong> Süper Kupa'yı kazandı!</div>
      ${s.amount ? `<div class="champ-amount-label">Süper Kupa Primi</div><div class="champ-amount">+${fmtMoney(s.amount)}</div>` : ''}
      <button class="btn" onclick="closeSuperCupModal()">Harika!</button>
    </div>
  </div>`;
}

// Bir takımın kadrosunu (11) mevkiye göre sıralı listeler; gol atanların yanında
// ⚽, asist yapanların yanında 🎯 rozeti gösterilir (maç günü ekranı için).
const MDL_POS_ORDER = { KL:0, DF:1, SB:1, SLB:1, DOS:2, OS:2, OOS:2, SK:2, SLK:2, FV:3 };
// Maç günü ekranında "Sağ" tarafı belirten kısaltmalar (SB, SK) Ğ harfini
// içermediği için "Sol" tarafındakilerden (SLB, SLK) ayırt etmesi zor
// oluyordu; burada sadece görüntüleme amaçlı SĞB / SĞK kısaltmaları kullanılıyor.
const MDL_POS_DISPLAY = { SB:"SĞB", SK:"SĞK", DF:"STP", FV:"ST" };
function mdlPosAbbr(code){ return MDL_POS_DISPLAY[code] || code; }
function matchDayEventBadges(playerId, events){
  if(!events || !events.length) return "";
  const goals = events.filter(e=>e.scorerId===playerId).length;
  const assists = events.filter(e=>e.assistId===playerId).length;
  if(goals===0 && assists===0) return "";
  let out = `<span class="mdl-badges">`;
  if(goals>0) out += `<span class="mdl-badge goal">⚽${goals>1?'×'+goals:''}</span>`;
  if(assists>0) out += `<span class="mdl-badge assist">🎯${assists>1?'×'+assists:''}</span>`;
  out += `</span>`;
  return out;
}
function matchDayLineupList(xiIds, events, slotMap){
  const players = (xiIds||[]).map(id=>state.players[id]).filter(Boolean)
    .map(p=>({ p, dispPos: (slotMap && slotMap[p.id]) ? slotMap[p.id] : p.pos }))
    .sort((a,b)=> (MDL_POS_ORDER[a.dispPos]??2)-(MDL_POS_ORDER[b.dispPos]??2) || b.p.rating-a.p.rating);
  if(!players.length) return `<div class="mdl-player" style="color:var(--ink-faint);">Kadro bilgisi yok</div>`;
  return players.map(({p, dispPos})=>`
    <div class="mdl-player">
      <span class="mdl-pname">${p.flag ? p.flag+' ' : ''}${p.name}</span>
      ${matchDayEventBadges(p.id, events)}
      <span class="mdl-ppos">${mdlPosAbbr(dispPos)}</span>
    </div>
  `).join("");
}
// Gerçek maç sonucu (matchDayModal'daki gol/asist olayları) zaten
// hesaplanmış durumda — burada onları sadece 1-90. dakikalar arasına
// rastgele dağıtıp kronolojik bir "canlı maç" akışı haline getiriyoruz.
// ============================================
// CANLI MAÇ MOTORU v2 — gerçek etkili şut/pas + zengin olay akışı
// ------------------------------------------------------------
// Eskiden: skor maç başlamadan simulateMatch() ile tamamen belirleniyor,
// canlı ekran sadece bu sabit sonucu dakika dakika "oynatıyordu" — kullanıcının
// PAS/ŞUT'u sonucu hiç etkilemiyordu.
// Şimdi: arka planda hesaplanan sonuç (backendGh/backendGa) hâlâ maçın
// istatistiksel omurgası (lig tablosu, oyuncu istatistikleri, ekonomi bu
// sayılar üzerinden ZATEN işlendi ve değişmiyor) — ama kullanıcı kendi
// golleri için gerçek bir nişan+güç şutu deniyor:
//   • Takımının sırada bekleyen (henüz uygulanmamış) bir golü varsa, şutu
//     tutturursan o gol SENİN vuruşunla oluyor; ıskalarsan gol iptal olmaz,
//     birkaç dakika sonra otomatik gerçekleşir (takım golü garantili kalır,
//     ama "senin golün olma" ihtimali senin becerine bağlı).
//   • Ayrıca maç başına sınırlı sayıda "Altın Fırsat" bonus şutu var — bunu
//     çevirirsen GERÇEKTEN skor tablosuna ekstra bir gol eklenir (lig
//     maçlarında puan durumuna, dostluk/istatistiklere de yansır).
// Pas atmak "Ritim" barını doldurur; ritim yükseldikçe şut isabet ihtimali
// artar ve belirli eşiklerde ekstra Altın Fırsat kazanılır — böylece sadece
// şuta basıp beklemek değil, oyunu inşa etmek de ödüllendiriliyor.
// ============================================

function lmResultCategory(gh, ga){ return gh > ga ? 'W' : (gh < ga ? 'L' : 'D'); }

// Takımın (kullanıcının) henüz uygulanmamış en yakın gol olayını bulur.
// Kullanıcının sahada yönettiği (santrafor pozisyonundaki) gerçek kadro
// oyuncusunu bulur — maç kurulurken kullanılan başlangıç XI'sindeki
// forvet slotuyla (index 10) birebir aynı oyuncu, böylece istatistiklere
// işlenen golle ekranda gösterilen isim hep tutarlı olur.
function lmGetUserPlayerIdentity(a){
  if(!a) return null;
  try {
    const isHome = a.isUserHome;
    const xi = a.sourceMatch ? (isHome ? a.sourceMatch.homeXI : a.sourceMatch.awayXI) : null;
    const pid = Array.isArray(xi) ? xi[10] : null;
    const p = pid ? state.players[pid] : null;
    if(p) return { id: p.id, name: (p.flag ? p.flag+' ' : '') + p.name };
  } catch(err){ /* isim çözülemezse aşağıdaki varsayılana düşülür */ }
  return null;
}

function lmFindPendingOwnGoal(a){
  if(!lmUserPlayer) return null;
  const mySide = lmUserPlayer.team;
  let best = null;
  a.timeline.forEach(ev=>{
    if(ev.side !== mySide || ev.applied) return;
    if(!best || ev.minute < best.minute) best = ev;
  });
  return best;
}

// Akışa (feed) yeni bir satır ekler — hem gol hem "renkli" olaylar burada birikir.
function lmPushFeed(a, html){
  a.feed = a.feed || [];
  a.feed.push({ minute: a.minute, html });
  if(a.feed.length > 24) a.feed.shift();
  a.lastFeedMinute = a.minute;
  lmRefreshFeedDOM(a);
}

function lmRefreshFeedDOM(a){
  const eventsEl = document.getElementById("lm-events");
  if(!eventsEl) return;
  const recent = a.feed.slice(-4).reverse();
  eventsEl.innerHTML = recent.length ? recent.map(f=>`<div class="live-match-event">${f.html}</div>`).join("") : `<div class="live-match-event" style="color:var(--ink-faint);">Maç devam ediyor…</div>`;
}

function lmGoalFeedLine(a, ev, special){
  const scorerLine = `⚽ <b class="mono">${ev.minute}'</b> <b>${ev.scorerName}</b>${ev.assistName?` <span style="color:var(--ink-dim);">(asist: ${ev.assistName})</span>`:''} <span style="color:var(--ink-faint);">— ${ev.side==='home'?a.homeName:a.awayName}</span>`;
  return special ? `<span style="color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,0.6);">🌟 SENİN GOLÜN!</span> ${scorerLine}` : scorerLine;
}

// Bir gol olayını (ticker'dan ya da kullanıcı şutundan) uygular ve kutlamayı tetikler.
function lmApplyGoalEvent(a, ev, special){
  ev.applied = true;
  ev.minute = a.minute;
  if(ev.side === 'home') a.curGh++; else a.curGa++;
  a.lastEvent = ev;
  lmPushFeed(a, lmGoalFeedLine(a, ev, special));
  lmFlashScreen();
  lmSpawnConfetti();
  lmShowBanner(special ? '🌟 SENİN GOLÜN!' : 'GOOOL!', { gold: special, hold: special ? 1500 : 1100 });
  lmRefreshStatusDOM(a);
  if(lm3D){ lm3D.goalZoomUntil = matchFrameTime + 85; lm3D.goalZoomSide = ev.side; }
}

// Bonus (arka planda hiç öngörülmemiş) bir gol — sadece kullanıcının kendi
// takımı için, gerçekten skora eklenir.
function lmApplyBonusGoal(a){
  a.userBonusGoals = (a.userBonusGoals||0) + 1;
  a.bonusAttemptsLeft = Math.max(0, (a.bonusAttemptsLeft||0) - 1);
  if(lmUserPlayer.team === 'home') a.curGh++; else a.curGa++;
  const identity = lmGetUserPlayerIdentity(a);
  const fakeEv = { minute: a.minute, side: lmUserPlayer.team, scorerName: identity ? identity.name : 'Sen', assistName: null, applied: true };
  a.lastEvent = fakeEv;
  lmPushFeed(a, lmGoalFeedLine(a, fakeEv, true) + ' <span style="color:var(--gold);">(BONUS GOL)</span>');
  lmFlashScreen();
  lmSpawnConfetti();
  lmShowBanner('🌟 BONUS GOL! +1', { gold: true, hold: 1500 });
  lmRefreshStatusDOM(a);
  if(lm3D){ lm3D.goalZoomUntil = matchFrameTime + 85; lm3D.goalZoomSide = lmUserPlayer.team; }
}

function lmRefreshStatusDOM(a){
  const scoreEl = document.getElementById("lm-score");

  const barEl = document.getElementById("lm-progress-bar");
  const momEl = document.getElementById("lm-momentum-fill");

  if(minuteEl) minuteEl.textContent = a.minute < 90 ? a.minute+"'" : "MAÇ SONU";

}

function buildLiveMatchAnim(m){
  const homeEvents = (m.homeEvents||[]).map(e=>Object.assign({}, e, {side:'home'}));
  const awayEvents = (m.awayEvents||[]).map(e=>Object.assign({}, e, {side:'away'}));
  const usedMinutes = new Set();
  const timeline = homeEvents.concat(awayEvents).map(e=>{
    let minute;
    do { minute = 1 + Math.floor(Math.random()*90); } while(usedMinutes.has(minute));
    usedMinutes.add(minute);
    const scorer = state.players[e.scorerId];
    const assist = e.assistId ? state.players[e.assistId] : null;
    return {
      minute,
      side: e.side,
      scorerName: scorer ? ((scorer.flag ? scorer.flag+' ' : '')+scorer.name) : '?',
      assistName: assist ? assist.name : null,
      applied: false
    };
  }).sort((a,b)=>a.minute-b.minute);
  return {
    homeName: m.home, awayName: m.away,
    homeId: m.homeId, awayId: m.awayId,
    isUserHome: m.homeId === state.playerClubId,
    minute: 0, curGh: 0, curGa: 0,
    timeline, lastEvent: null,
    feed: [], lastFeedMinute: 0,
    momentum: 25,
    bonusAttemptsLeft: 3,
    userBonusGoals: 0,
    halfTimeShown: false,
    matchKind: m.matchKind || null,
    backendGh: m.gh, backendGa: m.ga,
    sourceMatch: m,
    personalStats: { shots: 0, goals: 0, passes: 0 }
  };
}

// Overlay'in tamamını değil, sadece skor/dakika/ilerleme çubuğu/olay
// listesini günceller
function updateLiveMatchDOM(){
  const a = liveMatchAnim;
  if(!a) return;
  lmRefreshStatusDOM(a);
}

function startLiveMatchTicker(){
  if(liveMatchTimer) clearInterval(liveMatchTimer);
  liveMatchTimer = setInterval(()=>{
    if(!liveMatchAnim){ clearInterval(liveMatchTimer); return; }
    const a = liveMatchAnim;
    a.minute++;

    // Devre arası (45. dakika) — kısa bir mola ve bilgilendirme
    if(a.minute === 45 && !a.halfTimeShown){
      a.halfTimeShown = true;
      lmPushFeed(a, `<span style="color:var(--cyan);">🟨 İlk yarı sona erdi — ${a.curGh}-${a.curGa}</span>`);
      lmShowBanner('DEVRE ARASI', { hold: 1300 });
      a.momentum = Math.max(0, (a.momentum||0) - 10);
      clearInterval(liveMatchTimer);
      liveMatchTimer = null;
      setTimeout(()=>{ if(liveMatchAnim) startLiveMatchTicker(); }, 1600);
      lmRefreshStatusDOM(a);
      return;
    }

    a.timeline.forEach(ev=>{
      if(ev.minute === a.minute && !ev.applied){
        lmApplyGoalEvent(a, ev, false);
      }
    });

    // Ritim doğal olarak zamanla azalır — pasla beslenmesi gerekir
    a.momentum = Math.max(0, (a.momentum||0) - 0.4);

    lmAmbientTick(a);
    lmRefreshStatusDOM(a);

    if(a.minute >= 90){
      clearInterval(liveMatchTimer);
      liveMatchTimer = null;

// Bonus gollerin lig tablosuna / istatistiklere / maç günü özetine işlenmesi.
function lmApplyBonusGoalCorrection(a){
  const bonus = a.userBonusGoals || 0;
  if(bonus <= 0) return;
  try {
    const myId = state.playerClubId;
    const isHome = a.homeId === myId;
    const oppId = isHome ? a.awayId : a.homeId;
    const oldGh = a.backendGh, oldGa = a.backendGa;
    if(typeof oldGh !== 'number' || typeof oldGa !== 'number') return;
    const newGh = isHome ? oldGh + bonus : oldGh;
    const newGa = isHome ? oldGa : oldGa + bonus;

    if(a.matchKind === 'league'){
      const table = state.currentTable;
      if(table && table[myId] && table[oppId]){
        table[myId].GF += bonus;
        table[oppId].GA += bonus;
        const oldCat = lmResultCategory(isHome?oldGh:oldGa, isHome?oldGa:oldGh);
        const newCat = lmResultCategory(isHome?newGh:newGa, isHome?newGa:newGh);
        if(oldCat !== newCat){
          if(oldCat==='W'){ table[myId].W--; table[myId].Pts-=3; table[oppId].L--; }
          else if(oldCat==='D'){ table[myId].D--; table[myId].Pts-=1; table[oppId].D--; table[oppId].Pts-=1; }
          else { table[myId].L--; table[oppId].W--; table[oppId].Pts-=3; }
          if(newCat==='W'){ table[myId].W++; table[myId].Pts+=3; table[oppId].L++; }
          else if(newCat==='D'){ table[myId].D++; table[myId].Pts+=1; table[oppId].D++; table[oppId].Pts+=1; }
          else { table[myId].L++; table[oppId].W++; table[oppId].Pts+=3; }
        }
      }
      // Not: galibiyet/mağlubiyet serisi playLeagueMatch içinde bonus öncesi
      // sonuca göre zaten işlendi; olası kategori değişimini geriye dönük
      // olarak güvenle yeniden hesaplayamadığımız için seriye burada dokunmuyoruz.
    }

    // Kontrol edilen oyuncunun istatistiklerine bonus golleri işle
    const compKey = a.matchKind === 'friendly' ? 'friendly' : (a.matchKind === 'league' ? 'league' : null);
    if(compKey && a.sourceMatch){
      const xi = isHome ? a.sourceMatch.homeXI : a.sourceMatch.awayXI;
      const pid = Array.isArray(xi) ? xi[10] : null;
      const p = pid ? state.players[pid] : null;
      if(p){
        ensureStatsShape(p);
        const s = p.stats[compKey] || (p.stats[compKey] = emptyCompStats());
        s.goals = (s.goals||0) + bonus;
      }
    }

    // Maç günü özeti ve geçmişini güncel skorla eşitle
    if(Array.isArray(state.matchDayModal)){
      const entry = state.matchDayModal.find(mm => mm.homeId===a.homeId && mm.awayId===a.awayId);
      if(entry){ entry.gh = newGh; entry.ga = newGa; }
    }
    if(Array.isArray(state.lastMatches)){
      for(let i=state.lastMatches.length-1;i>=0;i--){
        const lm = state.lastMatches[i];
        if(lm.homeId===a.homeId && lm.awayId===a.awayId){ lm.gh=newGh; lm.ga=newGa; break; }
      }
    }
    if(a.sourceMatch && a.sourceMatch._fixtureRef){
      a.sourceMatch._fixtureRef.gh = newGh;
      a.sourceMatch._fixtureRef.ga = newGa;
    }
  } catch(err){ /* bonus düzeltmesi başarısız olsa bile maç akışı kesilmesin */ }
}

function finishLiveMatch(){
  if(liveMatchTimer){ clearInterval(liveMatchTimer); liveMatchTimer = null; }
  const a = liveMatchAnim;
  if(a){
    lmApplyBonusGoalCorrection(a);
    if(typeof showToast === 'function'){
      const ps = a.personalStats || {shots:0, goals:0, passes:0};
      let msg = `Maçtaki performansın: ${ps.shots} şut, ${ps.goals} gol, ${ps.passes} pas.`;
      if(a.userBonusGoals > 0) msg += ` 🌟 ${a.userBonusGoals} bonus gol skora eklendi!`;
      showToast(msg);
    }
  }
  if(typeof dispose3DMatch !== 'undefined') dispose3DMatch();
  liveMatchAnim = null;
  render();
}

let toastQueue = [];
let toastBusy = false;

function showToast(msg){
  toastQueue.push(msg);
  processToastQueue();
}

function processToastQueue(){
  if(toastBusy || toastQueue.length === 0) return;
  toastBusy = true;
  const msg = toastQueue.shift();
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>{
      toastBusy = false;
      processToastQueue();
    }, 250); // fade-out süresi
  }, 1600); // her mesajın ekranda kalma süresi
}
function playerBadge(p){ return `<div class="badge ${tierOf(p.rating)}">${p.rating}</div>`; }
function renderPagination(currentPage, totalPages, onClickFnName, totalItems, pageSize){
  if(totalPages <= 1) return "";
  const pages = [];
  const addPage = n => pages.push(n);
  const windowSize = 2;
  addPage(1);
  for(let p = currentPage-windowSize; p <= currentPage+windowSize; p++){
    if(p > 1 && p < totalPages) addPage(p);
  }
  if(totalPages > 1) addPage(totalPages);
  const uniqueSorted = [...new Set(pages)].sort((a,b)=>a-b);

  let buttonsHtml = `<button ${currentPage<=1?'disabled':''} onclick="${onClickFnName}(${currentPage-1})">‹ Önceki</button>`;
  let prevPage = 0;
  uniqueSorted.forEach(p=>{
    if(prevPage && p - prevPage > 1) buttonsHtml += `<span class="dots">…</span>`;
    buttonsHtml += `<button class="${p===currentPage?'active':''}" onclick="${onClickFnName}(${p})">${p}</button>`;
    prevPage = p;
  });
  buttonsHtml += `<button ${currentPage>=totalPages?'disabled':''} onclick="${onClickFnName}(${currentPage+1})">Sonraki ›</button>`;

  const firstItem = (currentPage-1)*pageSize + 1;
  const lastItem = Math.min(currentPage*pageSize, totalItems);

  return `<div class="pagination">${buttonsHtml}</div>
  <div class="pagination-info">${firstItem}-${lastItem} / ${totalItems} oyuncu · Sayfa ${currentPage} / ${totalPages}</div>`;
}

// ---- Kariyer başlangıcı: bir ülke seçildiğinde, o ülkenin EN ALT ligindeki
// kulüplerden rastgele 2 tanesi oyuncuya teknik direktörlük teklifi sunar —
// her teklifte bir yıllık maaş ve sözleşme süresi (yıl) belirtilir.
function generateSetupOffers(country){
  // En alt kademedeki tüm tier'lerden (TFF 2. Lig A/B gibi paralel gruplar
  // dahil) kulüpleri tek bir havuzda topla, oradan 2 tanesini rastgele seç.
  const bottomIndices = bottomLevelTierIndices(country);
  const pool = [];
  bottomIndices.forEach(tierIdx=>{
    country.tiers[tierIdx].clubs.forEach(name=> pool.push({tierIdx, name}));
  });
  const pickedClubs = [];
  for(let i=0; i<2 && pool.length; i++){
    const idx = Math.floor(Math.random()*pool.length);
    pickedClubs.push(pool.splice(idx,1)[0]);
  }
  setupOffers = pickedClubs.map(({tierIdx, name})=>{
    const id = clubIdFor(country.code, tierIdx, name);
    const club = state.clubs[id];
    if(!club) return null;
    const c = newManagerContractFor(club);
    return { clubId: id, wage: c.wage, years: c.years };
  }).filter(Boolean);
}
// Yeni bir kulüpte göreve başlarken (TD teklifi kabulü gibi) taze bir
// teknik direktörlük sözleşmesi üretir — kulübün bütçesine göre ölçeklenir.
function newManagerContractFor(club){
  const wage = Math.max(20000, Math.round((club.budget * (0.01 + Math.random()*0.015))/5000)*5000);
  const years = randInt(1,3);
  return { clubId: club.id, wage, years, yearsLeft: years };
}
function acceptSetupOffer(clubId){
  const offer = (setupOffers||[]).find(o=>o.clubId===clubId);
  if(!offer) return;
  const club = state.clubs[clubId];
  if(!club) return;
  state.managerContract = { clubId, wage: offer.wage, years: offer.years, yearsLeft: offer.years };
  setupOffers = null;
  selectClub(clubId);
}

/* ---- Kulüp seçildiğinde, kadrodaki oyunculara (henüz sözleşme süresi
   atanmamışsa) rastgele bir sözleşme süresi verilir. Böylece oyunun başında
   kadronuzdaki oyuncuların bir kısmının sözleşmesi birkaç sezon içinde dolar
   ve onları yenilemeniz ya da bırakmanız gerekir — sadece yeni transferlerde
   değil, başlangıç kadrosunda da sözleşme süresi işler. ---- */
const INITIAL_CONTRACT_WEIGHTS = [
  {years:1, weight:12},
  {years:2, weight:26},
  {years:3, weight:30},
  {years:4, weight:20},
  {years:5, weight:12}
];
function assignInitialContracts(club){
  if(!club) return;
  club.squad.forEach(pid=>{
    const p = state.players[pid];
    if(!p || p.contractYears) return;
    const chosen = weightedPick(INITIAL_CONTRACT_WEIGHTS.map(w=>({weight:w.weight, years:w.years})));
    const years = chosen.years;
    p.contractYears = years;
    p.contractUntil = state.year + years;
    tagContractDate(p, years);
  });
}

    let matchPreview = "";
    let headerLabel = "";
    
    if(!nextMatch){
      headerLabel = "Sezon Bitti";
      matchPreview = `<p style="color:var(--ink-dim);font-size:13px;margin:10px 0 0;">Tüm maçlar oynanmıştır.</p>`;
    } else if(nextMatch.type === 'friendly'){
      const oppId = nextMatch.opponent;
      matchPreview = opponentPreviewHtml(state.playerClubId, oppId, true, `Hazırlık Maçı — ${nextMatch.dayName}`);
      headerLabel = `${nextMatch.dateStr} — Hazırlık (${matchNo}/${totalMatches})`;
    } else if(nextMatch.type === 'league' && (nextMatch.home === state.playerClubId || nextMatch.away === state.playerClubId)){
      const h = nextMatch.home;
      const a = nextMatch.away;
      const isHome = h === state.playerClubId;
      const oppId = isHome ? a : h;
      matchPreview = opponentPreviewHtml(state.playerClubId, oppId, isHome, `Lig Maçı — ${nextMatch.dayName}`);
      headerLabel = `${nextMatch.dateStr} — Hafta ${nextMatch.round} (${matchNo}/${totalMatches})`;
    } else if(nextMatch.type === 'league'){
      // Güvenlik ağı: normal akışta artık buraya düşülmemeli çünkü diğer
      // kulüplerin maçları playNextRound içinde otomatik atlanıyor.
      matchPreview = `<p style="color:var(--ink-dim);font-size:13px;margin:10px 0 0;">Bu gün lig müsabakası var fakat siz oynamıyorsunuz — diğer maçlar oynanacak.</p>`;
      headerLabel = `${nextMatch.dateStr} — Lig Günü (${matchNo}/${totalMatches})`;
    } else {
      headerLabel = `${nextMatch.dateStr} — (${matchNo}/${totalMatches})`;
      matchPreview = `<p style="color:var(--ink-dim);font-size:13px;margin:10px 0 0;">Kupada bir maçınız var.</p>`;
    }
    
    const emptyNow = lineupHasEmptySlot(state.playerClubId);
    seasonControlHtml = `
      <div class="panel-head">
        <h2><span class="kickoff-dot"></span>${headerLabel}</h2>
      </div>
      <div style="background:linear-gradient(135deg, rgba(245,185,66,0.1), rgba(167,139,250,0.05)); border-radius:12px; border:2px solid var(--gold); padding:20px; margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div style="flex:1;">
            ${matchPreview}
            <div style="margin-top:16px;">
              <div style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Hazırlık Durumu</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <div style="background:var(--bg);padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:12px;">
                  <span style="color:var(--ink-dim);">Maç Gücü:</span> <span style="color:var(--gold);font-weight:600;">${Math.round(clubStrength(state.playerClubId))}</span>
                </div>
                <div style="background:var(--bg);padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:12px;">
                  <span style="color:var(--ink-dim);">Hazır Oyuncu:</span> <span style="color:var(--green-pos);font-weight:600;">${club.squad.filter(pid => {const p = state.players[pid]; return p && !p.injured && p.suspensionMatches === 0;}).length}/${club.squad.length}</span>
                </div>
              </div>
            </div>
          </div>
          ${nextMatch ? `<button class="btn" style="padding:16px 32px;font-size:16px;font-weight:600;min-height:auto;background:var(--gold);color:#1B1305;border:none;border-radius:8px;cursor:pointer;transition:.2s;" ${emptyNow?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="playNextRound()">⚽ MAÇI OYNA</button>` : ''}
        </div>
      </div>`;
  } else {
    const emptyNow = lineupHasEmptySlot(state.playerClubId);
    seasonControlHtml = `
      <div class="panel-head">
        <h2><span class="kickoff-dot"></span>Sezon Kontrolü</h2>
        <button class="btn" ${emptyNow?'disabled':''} onclick="startSeason()">Sezonu Başlat →</button>
      </div>
      <p style="color:var(--ink-dim);font-size:13px;line-height:1.6;margin:0;">
        ${lastRow ? `Geçen sezon <b style="color:var(--gold)">${club.tierName}</b>'de <b style="color:var(--gold)">${lastRow}.</b> sırada bitirdiniz.` : "İlk sezonuna başlamak için hazırsın."}
        Sezonu başlattığında kendi liginizin fikstürü hafta hafta, maç maç oynanır; diğer ligler ve Şampiyonlar Ligi otomatik simüle edilir.
        Sezon başlamadan önce "Kadro Düzeni" sekmesinden 11'ini dizmeyi unutma — dizilişin maç gücünü doğrudan etkiler.
      </p>`;
  }

  const seasonStats = (() => {
    if (!state.lastMatches.length) return null;
    const myMatches = state.lastMatches.filter(m => !m.friendly && (m.homeId === state.playerClubId || m.awayId === state.playerClubId));
    if (myMatches.length === 0) return null;
    let w = 0, d = 0, l = 0, gf = 0, ga = 0;
    myMatches.forEach(m => {
      const isHome = m.homeId === state.playerClubId;
      const myGoals = isHome ? m.gh : m.ga;
      const oppGoals = isHome ? m.ga : m.gh;
      gf += myGoals;
      ga += oppGoals;
      if (myGoals > oppGoals) w++;
      else if (myGoals < oppGoals) l++;
      else d++;
    });
    const points = w * 3 + d;
    return { w, d, l, gf, ga, matches: myMatches.length, points };
  })();

  const achievementsHtml = seasonStats ? (() => {
    const badges = [];
    if (seasonStats.w >= 5) badges.push({ icon: '⭐', text: 'Kazanış Serisi', color: 'var(--green-pos)' });
    if (seasonStats.gf > seasonStats.ga * 1.2) badges.push({ icon: '🎯', text: 'Atak Ustası', color: 'var(--gold)' });
    if (seasonStats.ga < seasonStats.gf * 0.7) badges.push({ icon: '🛡️', text: 'Savunma Kaleleri', color: 'var(--purple)' });
    if (seasonStats.d >= 3) badges.push({ icon: '🤝', text: 'Denge Ustası', color: 'var(--silver)' });
    if (seasonStats.matches >= 10 && seasonStats.w / seasonStats.matches >= 0.7) badges.push({ icon: '🏆', text: 'Muazzam Sezon', color: 'var(--gold)' });
    
    if (badges.length === 0) return '';
    return `
      <div style="background:linear-gradient(135deg, rgba(245,185,66,0.1), rgba(167,139,250,0.05)); border-radius:12px; border:2px solid var(--gold); padding:16px; margin-bottom:16px;">
        <div style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;">🏅 Sezon Başarıları</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          ${badges.map(b => `
            <div style="background:var(--bg);padding:10px 14px;border-radius:8px;border-left:4px solid ${b.color};display:flex;align-items:center;gap:8px;">
              <span style="font-size:18px;">${b.icon}</span>
              <span style="font-size:12px;color:var(--ink);">${b.text}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  })() : '';

  const statsCardHtml = seasonStats ? `
    <div style="background:linear-gradient(135deg, rgba(52,211,153,0.1), rgba(52,211,153,0.05)); border-radius:12px; border:2px solid var(--green-pos); padding:16px; margin-bottom:16px;">
      <div style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;">📊 Bu Sezon İstatistikleri</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(80px, 1fr));gap:10px;">
        <div style="text-align:center;">
          <div style="font-size:12px;color:var(--ink-dim);">Maç</div>
          <div style="font-size:24px;font-weight:bold;color:var(--ink);">${seasonStats.matches}</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:12px;color:var(--green-pos);">Galibiyet</div>
          <div style="font-size:24px;font-weight:bold;color:var(--green-pos);">${seasonStats.w}</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:12px;color:var(--gold);">Beraberlik</div>
          <div style="font-size:24px;font-weight:bold;color:var(--gold);">${seasonStats.d}</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:12px;color:var(--red-neg);">Mağlubiyet</div>
          <div style="font-size:24px;font-weight:bold;color:var(--red-neg);">${seasonStats.l}</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:12px;color:var(--ink-dim);">Gol Farkı</div>
          <div style="font-size:24px;font-weight:bold;color:var(--ink);">${seasonStats.gf}/${seasonStats.ga}</div>
        </div>
        <div style="text-align:center;background:var(--bg);padding:8px;border-radius:8px;border:1px solid var(--line);">
          <div style="font-size:11px;color:var(--ink-dim);">PUAN</div>
          <div style="font-size:28px;font-weight:bold;color:var(--gold);">${seasonStats.points}</div>
        </div>
      </div>
    </div>
    ${achievementsHtml}
  ` : '';

  const matchesHtml = state.lastMatches.length ? state.lastMatches.slice().reverse().map(m=>
    `<div class="log-entry" style="padding:12px;background:var(--panel-2);border-radius:8px;border-left:4px solid ${m.homeId === state.playerClubId ? (m.gh > m.ga ? 'var(--green-pos)' : m.gh < m.ga ? 'var(--red-neg)' : 'var(--gold)') : 'var(--ink-dim)'};">
      ${m.cl?`<span style="color:var(--gold);font-size:10.5px;margin-right:6px;">🏆 ${CL_STAGE_LABELS[m.stage]||'ŞL'}</span>`:''}${m.el?`<span style="color:var(--silver);font-size:10.5px;margin-right:6px;">🥈 ${CL_STAGE_LABELS[m.stage]||'AL'}</span>`:''}${m.friendly?`<span style="color:var(--ink-dim);font-size:10.5px;margin-right:6px;">⚽ Hazırlık</span>`:''}<span class="desc" style="color:var(--ink)">${m.home} <b class="mono" style="font-size:16px;color:${m.homeId === state.playerClubId ? (m.gh > m.ga ? 'var(--green-pos)' : m.gh < m.ga ? 'var(--red-neg)' : 'var(--gold)') : 'var(--gold)'};">${m.gh}-${m.ga}</b> ${m.away}</span></div>`
  ).join("") : `<div class="empty" style="padding:20px;text-align:center;color:var(--ink-dim);">⏳ Sezon başlamadı henüz. "Sezonu Başlat" butonuna tıkla!</div>`;

  return `
    ${renderHubGrid()}
    ${noteHtml}
    ${contractNoteHtml}
    ${loanNoteHtml}
    ${managerContractNoteHtml}
    ${sponsorNoteHtml}
    ${clNoteHtml}
    ${intlNoteHtml}
    ${euroPlayoffNoteHtml}
    ${elNoteHtml}
    ${coNoteHtml}
    ${windowNoteHtml}
    ${emptySlotWarning}
    ${expiringWarning}
    <div class="panel">${seasonControlHtml}</div>
    ${statsCardHtml}
    ${renderNewsFeedPanel()}
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>⚽ Maç Geçmişi</h2></div>
      ${matchesHtml}
    </div>`;
}

function squadRow(p, isMine){
  if(isMine && negotiatingPid === p.id && negotiationIsRenewal){
    return renewalNegotiationRow(p);
  }
  const cardInfo = p.suspensionMatches>0
    ? `<span style="color:var(--red-neg);font-size:11px;margin-left:6px;">🟥 Cezalı (${p.suspensionMatches} maç)</span>`
    : (p.yellowCards>0 ? `<span style="color:var(--gold);font-size:11px;margin-left:6px;">🟨 x${p.yellowCards}</span>` : "");
  const offerBadge = isMine && state.incomingOffers.some(o=>o.playerId===p.id)
    ? `<span style="color:var(--green-pos);font-size:11px;margin-left:6px;">💰 Teklif Var</span>` : "";
  const contractCell = p.contractYears
    ? `<span class="mono" style="${p.contractYears===1?'color:var(--red-neg);':(p.contractYears===2?'color:var(--amber);':'color:var(--ink);')}" title="${p.contractUntilDate?formatContractEnd(p.contractUntilDate)+"'a kadar":''}">${p.contractYears} yıl</span>`
    : `<span style="color:var(--ink-faint);">—</span>`;
  const renewControl = (isMine && !p.loanFromClub) ? `<button class="btn secondary" style="padding:6px 10px;font-size:11px;" onclick="openRenewal(${p.id})">${p.contractYears?'Yenile':'Sözleşme Yap'}</button>` : "";
  const mi = moraleInfo(p.morale);
  const moraleCell = `<div style="display:flex;flex-direction:column;gap:2px;">
      <span class="mono" style="color:${mi.color};font-size:12.5px;">${mi.emoji} ${p.morale!==undefined?p.morale:70}</span>
      ${mi.text==="Mutsuz" ? `<span style="color:var(--red-neg);font-size:10px;line-height:1.3;">Daha fazla forma şansı istiyor.</span>` : ""}
    </div>`;
  return `<tr class="${isMine?'me':''}">
    <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}${p.loanFromClub?'<span style="color:var(--cyan);font-size:11px;margin-left:6px;">🔄 Kiralık</span>':''}${cardInfo}${offerBadge}</div>
    <div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span></div></div></div></td>
    <td class="mono">${p.potential}</td>
    <td class="mono">${fmtMoney(p.value)}</td>
    <td class="mono">${fmtMoney(p.wage)}/yıl</td>
    <td>${contractCell}</td>
    <td>${moraleCell}</td>
    <td><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${renewControl}${(isMine && !p.loanFromClub) ? `<button class="btn sell" onclick="listPlayerForSale(${p.id})">Sat</button>` : ""}${(isMine && p.loanFromClub) ? `<span style="color:var(--ink-faint);font-size:11px;">Kiralık — Sat/Yenile yapılamaz</span>` : ""}</div></td>
  </tr>`;
}

/* ---- Kadro ekranında satır içi sözleşme yenileme pazarlığı paneli. ---- */
function renewalNegotiationRow(p){
  const wage = negotiationOffer.wage;
  const bonus = negotiationOffer.bonus;
  const displayCost = bonus; // "peşin maliyet" göstergesi (mevcut pazarlık ekranıyla tutarlı) — maaş ayrıca her sezon bütçeden düşülür
  const currentWageBill = clubWageBill(state.playerClubId);
  const availableBudget = state.clubs[state.playerClubId].budget - (currentWageBill - p.wage);
  const canAfford = availableBudget >= (bonus + wage);
  const yearFactorNow = CONTRACT_YEAR_WAGE_FACTOR[negotiationOffer.years] || 1;
  const expectedWageNow = Math.round(p.wage * yearFactorNow);
  const renewOpts = renewalYearOptions(p);
  const isMaxedOut = renewOpts.length === 1 && renewOpts[0] <= (p.contractYears||0);
  const currentYearsLabel = p.contractYears ? `${p.contractYears} yıl${p.contractUntilDate?" ("+formatContractEnd(p.contractUntilDate)+"'a kadar)":""}` : "sözleşmesiz";
  return `<tr class="negotiating">
    <td colspan="7">
      <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:8px 0;">
        <div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · Mevcut maaş: ${fmtMoney(p.wage)}/yıl · Mevcut sözleşme: ${currentYearsLabel}</div></div></div>
        <div>
          <div class="slot-label" style="margin-bottom:3px;">Teklif Edilen Yıllık Maaş</div>
          <input type="text" inputmode="numeric" value="${fmtThousands(wage)}" style="width:130px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('wage', v))">
        </div>
        <div>
          <div class="slot-label" style="margin-bottom:3px;">İmza / Sadakat Bonusu</div>
          <input type="text" inputmode="numeric" value="${fmtThousands(bonus)}" style="width:120px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('bonus', v))">
        </div>
        <div>
          <div class="slot-label" style="margin-bottom:3px;">Yeni Sözleşme Süresi</div>
          <select onchange="setNegotiationYears(this.value)" style="width:110px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" ${isMaxedOut?'disabled':''}>
            ${renewOpts.map(y=>`<option value="${y}" ${negotiationOffer.years===y?'selected':''}>${y} Yıllık</option>`).join("")}
          </select>
          ${isMaxedOut
            ? `<div class="mono" style="font-size:10px;margin-top:3px;color:var(--ink-faint);">Zaten azami sözleşme süresinde (5 yıl) — süre uzatılamıyor, sadece maaş/bonus güncellenebilir.</div>`
            : `<div class="mono" style="font-size:10.5px;margin-top:3px;color:${negotiationOffer.years>=4?'var(--red-neg)':(negotiationOffer.years===3?'var(--amber)':'var(--green-pos)')};">~${fmtMoney(expectedWageNow)}/yıl bekliyor · ${formatContractEnd(computeContractEndDate(negotiationOffer.years))}'a kadar</div>`}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn buy" id="nego-buy-btn" ${canAfford?'':'disabled'} onclick="confirmRenewal(${p.id})">Teklifi Gönder</button>
          <button class="btn secondary" onclick="cancelNegotiation()">Vazgeç</button>
        </div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px;">İmza/sadakat bonusu: <span id="nego-total-cost">${fmtMoney(displayCost)}</span> peşin ödenir, ayrıca yeni yıllık maaş bütçenizden düşülür. Bonservis yok — oyuncu zaten kadronuzda. Sözleşme süresi mevcut kalan süreden daha uzun olacak şekilde sunulur (yenileme gerçekten uzatsın diye); uzun sözleşmeler (4-5 yıl) daha yüksek maaş talebi getirir; oyuncu teklifi reddederse mevcut sözleşmesi aynen devam eder.</div>
    </td>
  </tr>`;
}

function injuredPlayerRow(p){
  const weeksText = p.injuryWeeks ? p.injuryWeeks+" maç" : "-";
  return `<tr>
    <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}</div>
    <div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span></div></div></div></td>
    <td style="color:var(--red-neg);">${p.injuryType || "Sakat"}</td>
    <td class="mono">${weeksText}</td>
    <td class="mono">${fmtMoney(p.value)}</td>
    <td><button class="btn sell" onclick="listPlayerForSale(${p.id})">Sat</button></td>
  </tr>`;
}

function suspendedPlayerRow(p){
  return `<tr>
    <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}</div>
    <div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span></div></div></div></td>
    <td style="color:var(--red-neg);">🟥 Kart Cezası</td>
    <td class="mono">${p.suspensionMatches} maç</td>
    <td class="mono">${fmtMoney(p.value)}</td>
    <td><button class="btn sell" onclick="listPlayerForSale(${p.id})">Sat</button></td>
  </tr>`;
}

function renderSquad(){
  const club = state.clubs[state.playerClubId];
  const allSquad = club.squad.map(id=>state.players[id]).filter(Boolean);
  const fitSquad = allSquad.filter(p=>!p.injured && !(p.suspensionMatches>0)).sort((a,b)=>b.rating-a.rating);
  const injuredSquad = allSquad.filter(p=>p.injured).sort((a,b)=>b.rating-a.rating);
  const suspendedSquad = allSquad.filter(p=>!p.injured && p.suspensionMatches>0).sort((a,b)=>b.suspensionMatches-a.suspensionMatches);
  const rows = fitSquad.map(p=>squadRow(p,true)).join("");
  const injuredRows = injuredSquad.map(p=>injuredPlayerRow(p)).join("");
  const suspendedRows = suspendedSquad.map(p=>suspendedPlayerRow(p)).join("");
  return `<div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>Kadronuz — ${fitSquad.length} oyuncu</h2></div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-6px 0 14px;">"Sat" butonuna bastığınızda oyuncu hemen satılmaz — birkaç kulüpten bonservis teklifi toplanır ve "Teklifler" sekmesinde karşınıza çıkar. Dilediğiniz teklifi kabul edebilir, pazarlık açabilir ya da hepsini reddedebilirsiniz.</p>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Oyuncu</th><th>Potansiyel</th><th>Değer</th><th>Yıllık Maaş</th><th>Sözleşme</th><th>Moral</th><th>Eylem</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">Kadronuzda henüz oyuncu yok.</td></tr>'}</tbody>
      </table>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>Sakat Oyuncular — ${injuredSquad.length}</h2></div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-6px 0 14px;">Sakat oyuncular kadro düzenine eklenemez ve maçlarda oynatılamaz. İyileştiklerinde otomatik olarak ana listeye geri döner.</p>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Oyuncu</th><th>Sakatlık</th><th>Kalan Maç</th><th>Değer</th><th>Eylem</th></tr></thead>
        <tbody>${injuredRows || '<tr><td colspan="5" class="empty">Şu anda sakat oyuncunuz yok.</td></tr>'}</tbody>
      </table>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>Cezalı Oyuncular — ${suspendedSquad.length}</h2></div>

  const availableBudget = state.clubs[state.playerClubId].budget - currentWageBill;
  const canAfford = availableBudget >= (bonus + wage);
  const yearFactorNow = CONTRACT_YEAR_WAGE_FACTOR[negotiationOffer.years] || 1;
  const expectedWageNow = Math.round(p.wage * yearFactorNow);
  return `<tr class="negotiating">
    <td colspan="4">

        <div>
          <div class="slot-label" style="margin-bottom:3px;">Teklif Edilen Yıllık Maaş</div>
          <input type="text" inputmode="numeric" value="${fmtThousands(wage)}" style="width:130px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('wage', v))">
        </div>
        <div>
          <div class="slot-label" style="margin-bottom:3px;">İmza Bonusu</div>
          <input type="text" inputmode="numeric" value="${fmtThousands(bonus)}" style="width:120px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('bonus', v))">

function renderYouthSquad(){
  const club = state.clubs[state.playerClubId];
  const youth = club.youth.map(id=>state.players[id]).filter(Boolean).sort((a,b)=>b.potential-a.potential);
  const rows = youth.map(p=>{
    if(negotiatingPid === p.id && negotiationIsPromotion){
      return promotionNegotiationRow(p);
    }
    const canPromote = p.age >= YOUTH_PROMOTE_AGE;
    const hasOffer = state.incomingOffers.some(o => o.playerId === p.id);
    const offerBadge = hasOffer ? `<span style="color:var(--green-pos);font-size:11px;margin-left:6px;">💰 Teklif Var</span>` : "";
    return `<tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}${offerBadge}</div>
      <div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span></div></div></div></td>
      <td class="mono">${p.potential}</td>
      <td class="mono">${fmtMoney(p.value)}</td>
      <td>${canPromote ? `<button class="btn buy" onclick="openPromotion(${p.id})">A Takıma Çıkar</button>` : `<span style="color:var(--ink-faint);font-size:11.5px;">${YOUTH_PROMOTE_AGE} yaşında çıkarılabilir</span>`}</td>
    </tr>`;
  }).join("");
  return `<div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>Gençlik Takımı — ${youth.length} oyuncu</h2></div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-6px 0 14px;">Bu oyuncular ana kadronun dışındadır, maçlarda kullanılamaz fakat diğer kulüpler tarafından transfer teklifi alabilirler. ${YOUTH_PROMOTE_AGE} yaşına ulaştıklarında A takıma çıkarabilirsiniz. Yetenek Avcılarıyla diğer kulüplerin gençlik takımlarından potansiyelli oyuncuları aktarabilirsiniz.</p>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Oyuncu</th><th>Potansiyel</th><th>Değer</th><th>Eylem</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="empty">Gençlik takımınızda henüz oyuncu yok.</td></tr>'}</tbody>
      </table>

function renderLineup(){
  const clubId = state.playerClubId;
  const club = state.clubs[clubId];
  const lu = getLineup(clubId);
  const squad = club.squad.map(id=>state.players[id]).filter(Boolean).filter(p=>!(p.suspensionMatches>0)).sort((a,b)=>b.rating-a.rating);
  const codes = FORMATIONS[lu.formation];
  const xiStrength = Math.round(clubStrength(clubId));
  const hasEmpty = lineupHasEmptySlot(clubId);
  const assignedIds = new Set(Object.values(lu.assignments).map(String));

 const coords = FORMATION_COORDS[lu.formation] || [];
  const slotsHtml = codes.map((code, idx)=>{
    const specificCode = slotSpecificCode(code, idx, lu.formation);
    const displayCode = slotDisplayCode(code, idx, lu.formation);
    const selectedPid = lu.assignments[idx] || "";
    const selPlayer = selectedPid ? state.players[selectedPid] : null;
    let effText = "-";
    let effClass = "";
    if(selPlayer){
      const eff = effRating(selPlayer, specificCode);
      effText = `${eff} Güç` + (selPlayer.pos !== specificCode ? ` (${posFullLabel(selPlayer.pos)})` : '');
      effClass = selPlayer.pos !== specificCode ? 'penalty' : 'full';
    } else {
      effText = "BOŞ";
      effClass = "penalty";
    }

    const pos = coords[idx] || {x:50,y:50};
    if(idx === 0) pos.y = Math.min(pos.y, 90); // kaleciyi kale çizgisinden biraz öne al
    const cardHtml = selPlayer
      ? miniCardHTML(selPlayer, {isOnPitch:true, clubId, slotIdx:idx, effNote:effText})
      : `<div class="slot-empty-hint">${selectedLineupPid ? 'Yerleştirmek için tıkla' : 'BOŞ'}</div>`;
    return `<div class="pitch-slot" style="left:${pos.x}%; top:${pos.y}%;">
      <div class="slot-drop${selPlayer?'':' slot-empty'}"
        ondragover="onSlotDragOver(event)" ondragleave="onSlotDragLeave(event)"
        ondrop="onSlotDrop(event, '${clubId}', ${idx})"
        ${selPlayer?'':`onclick="onEmptySlotClick('${clubId}', ${idx})"`}>
        <div class="slot-label">${FIFA_POS_SHORT[displayCode] || displayCode} · #${idx+1}</div>
        ${cardHtml}
        <div class="eff ${effClass}">${effText}</div>
      </div>
    </div>`;
  }).join("");

  const catKeys = Object.keys(FORMATION_CATEGORIES);
  const activeCat = FORMATION_CATEGORIES[formationCategory] ? formationCategory : "4";
  const categoryTabs = catKeys.map(k =>
    `<button class="btn secondary ${activeCat===k?'active':''}" onclick="setFormationCategory('${k}')">${FORMATION_CATEGORIES[k].label}</button>`
  ).join(" ");

  const formButtons = FORMATION_CATEGORIES[activeCat].list
    .filter(f => FORMATIONS[f])
    .map(f =>
      `<button class="btn secondary ${lu.formation===f?'active':''}" onclick="setFormation('${clubId}', '${f}')">${f}</button>`
    ).join(" ");

  // Sağ paneldeki kadro listesi: sahaya henüz atanmamış oyuncular.
  const benchPlayers = squad.filter(p => !assignedIds.has(String(p.id)));
  const benchHtml = benchPlayers.length
    ? benchPlayers.map(p => miniCardHTML(p, {isOnPitch:false})).join("")
    : `<div class="side-hint">Kadrodaki tüm uygun oyuncular sahaya dizildi.</div>`;

  return `<div class="panel">
    <div class="panel-head">
      <h2><span class="kickoff-dot"></span>Saha & Taktik Düzeni</h2>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="lineup-strength">11 Gücü: ${xiStrength}</div>
        <button class="btn secondary" onclick="autoFillLineup('${clubId}')">Otomatik Diz</button>
      </div>
    </div>
    ${hasEmpty ? `<div class="banner" style="color:var(--red-neg);border-color:var(--red-neg);">Kadronuzda bu formasyonu doldurmaya yetecek kadar oyuncu yok — bazı pozisyonlar boş kalıyor. Maç/sezon başlatabilmek için formasyonu değiştirin ya da transfer yapın.</div>` : ""}
    <details class="lineup-actions-toggle">
      <summary>Taktik: <strong>${lu.formation}</strong> — değiştirmek için tıkla</summary>
      <div class="lineup-actions" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div><strong>Diziliş Grubu:</strong> ${categoryTabs}</div>
        <div><strong>Taktik:</strong> ${formButtons}</div>
      </div>
    </details>
    <div class="lineup-layout">
      <div class="pitch">
        <div class="pitch-field">${slotsHtml}</div>
      </div>
      <div class="squad-side-panel" ondragover="onBenchDragOver(event)" ondragleave="onBenchDragLeave(event)" ondrop="onBenchDrop(event, '${clubId}')">
        <h3>Kadro (${benchPlayers.length})</h3>
        <div class="side-hint">Sürükleyip sahaya bırak, ya da bir oyuncuya tıklayıp ardından bir slota tıkla.</div>
        <div class="squad-side-list">${benchHtml}</div>
      </div>
    </div>
  </div>`;
}

          <div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px;">Toplam peşin maliyet: <span id="nego-total-cost">${fmtMoney(totalCost)}</span> (bonservis + imza parası). Kulüp, istenen bonservisin belirgin altındaki teklifleri reddedebilir. ${resistanceNow>=25?'<span style="color:var(--red-neg);">Bu oyuncu kulübünüzün seviyesi yüzünden transfere isteksiz görünüyor.</span> ':''}Uzun sözleşmeler (4-5 yıl) daha yüksek maaş talebi ve ekstra pazarlık direnci getirir; kısa sözleşmeler (1-2 yıl) daha kolay kabul edilir.</div>
        </td>
      </tr>`;
    }

    return `<tr>
      <td><div class="name-cell">${playerBadge(p)}<div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}${p.injured?'<span style="color:var(--red-neg);font-size:11px;margin-left:6px;">🩹 Sakat</span>':''}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · ${clubLabel}</div></div></div></td>
      <td class="mono">${p.potential}</td>
      <td class="mono">${fee>0?fmtMoney(fee):'—'}</td>
      <td class="mono">${fmtMoney(p.wage)}/yıl</td>
      <td class="mono">${fmtMoney(p.value)}</td>
      <td><button class="btn buy" ${(p.injured||!winStatus.open)?'disabled':''} onclick="openNegotiation(${p.id})">${p.injured?'Sakat':(winStatus.open?'Teklif Yap':'Pencere Kapalı')}</button></td>
    </tr>`;
  }).join("");

  const paginationHtml = renderPagination(marketPage, totalPages, "setMarketPage", totalItems, MARKET_PAGE_SIZE);

  return `
    <div class="panel">
      <div class="panel-head">
        <h2><span class="kickoff-dot"></span>Serbest Oyuncular (${freeAgents.length})</h2>
      </div>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;">Serbest oyuncular sözleşmesi bulunmayan oyunculardır. İşe alınırken hiçbir bonservis ödemesi yapılmaz.</p>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Oyuncu</th><th>Potansiyel</th><th>Bonservis</th><th>Maaş Beklentisi</th><th>Değer</th><th>Eylem</th></tr></thead>
          <tbody>${freeAgentRows || '<tr><td colspan="6" class="empty">Bu filtreye uygun serbest oyuncu yok.</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2><span class="kickoff-dot"></span>Transfer Pazarı — Satılık Oyuncular (${totalItems})</h2>
      </div>
      ${windowBanner}
      <div class="filters">
        <input type="text" id="market-search-input" placeholder="Oyuncu ara..." value="${marketFilters.q}" oninput="marketFilters.q=this.value; marketPage=1; render();">
       <select onchange="marketFilters.pos=this.value; marketPage=1; render();">
          <option value="ALL" ${marketFilters.pos==='ALL'?'selected':''}>Tüm Pozisyonlar</option>
          <option value="KL" ${marketFilters.pos==='KL'?'selected':''}>Kaleci (KL)</option>
          <option value="DF" ${marketFilters.pos==='DF'?'selected':''}>Stoper (DF)</option>
          <option value="SB" ${marketFilters.pos==='SB'?'selected':''}>Sağ Bek (SĞB)</option>
          <option value="SLB" ${marketFilters.pos==='SLB'?'selected':''}>Sol Bek (SLB)</option>
        <option value="OS" ${marketFilters.pos==='OS'?'selected':''}>Orta Saha (OS)</option>
        <option value="DOS" ${marketFilters.pos==='DOS'?'selected':''}>Defansif Orta Saha (DOS)</option>
        <option value="OOS" ${marketFilters.pos==='OOS'?'selected':''}>Ofansif Orta Saha (OOS)</option>
        <option value="SK" ${marketFilters.pos==='SK'?'selected':''}>Sağ Kanat (SĞK)</option>
        <option value="SLK" ${marketFilters.pos==='SLK'?'selected':''}>Sol Kanat (SLK)</option>
        <option value="FV" ${marketFilters.pos==='FV'?'selected':''}>Santrafor (ST)</option>
      </select>
      <select onchange="marketFilters.sort=this.value; marketPage=1; render();">
        <option value="rating_desc" ${marketFilters.sort==='rating_desc'?'selected':''}>Güç (Yüksek-Düşük)</option>
        <option value="rating_asc" ${marketFilters.sort==='rating_asc'?'selected':''}>Güç (Düşük-Yüksek)</option>
        <option value="value_desc" ${marketFilters.sort==='value_desc'?'selected':''}>Değer (Yüksek-Düşük)</option>
        <option value="value_asc" ${marketFilters.sort==='value_asc'?'selected':''}>Değer (Düşük-Yüksek)</option>
        <option value="age_asc" ${marketFilters.sort==='age_asc'?'selected':''}>Yaş (Gençten Yaşlıya)</option>
      </select>
    </div>
    <p style="color:var(--ink-dim);font-size:12px;margin:-6px 0 14px;">Bonservis kulübe peşin ödenir (serbest oyuncularda 0). İmza parası ve yıllık maaşı sen teklif edersin — oyuncu teklifi kabul ya da reddedebilir.</p>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Oyuncu</th><th>Potansiyel</th><th>Bonservis</th><th>Mevcut Maaş</th><th>Değer</th><th>Eylem</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">Aramaya uygun oyuncu bulunamadı.</td></tr>'}</tbody>
      </table>
    </div>
    ${paginationHtml}
  </div>`;
}

function setLoanFilterPos(pos){ loanFilters.pos = pos; loanPage = 1; render(); }
