// Alt liglere inildikçe yayın/sponsorluk gelirleri gerçek hayattaki gibi hızla
// düşer: 2. lig geliri üst ligin yaklaşık dörtte biri, 3. lig daha da azı kadardır.
function tierIncomeFactor(tierIdx){
  if(tierIdx <= 0) return 1;
  return Math.max(0.06, 0.25 * Math.pow(0.55, tierIdx - 1));
}
function applyLeagueIncome(key, standings){
  const parts = key.split("-");
  const countryCode = parts[0];
  const tierIdx = parseInt(parts[1] || "0", 10);
  const country = countryByCode(countryCode);
  const factor = country ? country.strength : 0.5;
  const tierFactor = tierIncomeFactor(tierIdx);
  standings.forEach((row,idx)=>{
    state.clubs[row.id].budget += Math.round(Math.max(4, 55-idx*2.5)*factor*tierFactor*1000000);
  });
}

function generateRoundRobinPairs(clubIds){
  let arr = clubIds.slice();
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const rounds = [];
  for(let r=0; r<n-1; r++){
    const roundPairs = [];
    for(let i=0;i<n/2;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a!==null && b!==null){
        if(r%2===0) roundPairs.push([a,b]); else roundPairs.push([b,a]);
      }
    }
    rounds.push(roundPairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  const secondHalf = rounds.map(round => round.map(([h,a])=>[a,h]));
  return rounds.concat(secondHalf);
}

/* ================= ŞAMPİYONLAR LİGİ ================= */
const CL_GROUP_COUNT = 8;
const CL_TEAMS_PER_GROUP = 4;
const CL_TOTAL_TEAMS = CL_GROUP_COUNT * CL_TEAMS_PER_GROUP; // 32
const EL_GROUP_COUNT = 8;
const EL_TEAMS_PER_GROUP = 4;
const EL_TOTAL_TEAMS = EL_GROUP_COUNT * EL_TEAMS_PER_GROUP; // 32
const CO_GROUP_COUNT = 8;
const CO_TEAMS_PER_GROUP = 4;
const CO_TOTAL_TEAMS = CO_GROUP_COUNT * CO_TEAMS_PER_GROUP; // 32

// ---- Avrupa kupalarına KATILIM play-off'u: gerçek UEFA formatına benzer
// şekilde, her kupanın kontenjanının bir kısmı doğrudan sıralamayla, geri
// kalanı ise bir ön eleme (play-off) turuyla belirlenir. Play-off'u kaybeden
// kulüpler elenmez — bir alt kupaya (ŞL→AL, AL→KL) garantili katılım hakkı kazanır.
const CL_DIRECT = 24;           // sıralamayla doğrudan ŞL grubuna giren kulüp sayısı
const CL_PLAYOFF_SPOTS = 8;     // play-off'tan ŞL grubuna çıkacak kulüp sayısı (16 aday, 8 eşleşme)
const EL_DIRECT = 16;           // (ŞL kadrosu hariç) sıralamayla doğrudan AL grubuna giren kulüp sayısı
const EL_PLAYOFF_SPOTS = 8;     // play-off'tan AL grubuna çıkacak kulüp sayısı (16 aday, 8 eşleşme)

// Aday listesini (en iyiden en kötüye sıralı) klasik turnuva tohumlamasıyla
// eşleştirir: 1-16, 2-15, ... İki maçlık (iç saha/deplasman) toplam skorla oynanır.
function runEuroPlayoffRound(candidateIds, spotsToFill){
  const n = candidateIds.length;
  const ties = [];
  for(let i=0; i<spotsToFill; i++){
    const idA = candidateIds[i];
    const idB = candidateIds[n-1-i];
    ties.push(playoffTie(idA, idB));
  }
  const winners = ties.map(t=>t.winner);
  const losers = ties.map(t=> t.idA===t.winner ? t.idB : t.idA);
  return { ties, winners, losers };
}

function rankTopTierClubsByForm(){
  const topTierClubs = Object.values(state.clubs).filter(c=>c.tierIdx===0);
  return topTierClubs.slice().sort((a,b)=>{
    const stA = state.standingsByLeague[a.leagueKey];
    const stB = state.standingsByLeague[b.leagueKey];
    const posA = stA ? stA.findIndex(r=>r.id===a.id) : 10;
    const posB = stB ? stB.findIndex(r=>r.id===b.id) : 10;
    const countryA = countryByCode(a.country).strength;
    const countryB = countryByCode(b.country).strength;
    const scoreA = countryA*100 - (posA>=0?posA:10)*3 + (Math.random()-0.5)*8;
    const scoreB = countryB*100 - (posB>=0?posB:10)*3 + (Math.random()-0.5)*8;
    return scoreB - scoreA;
  });
}
// Şampiyonlar Ligi katılımcıları: en iyi CL_DIRECT kulüp doğrudan gruplara
// gider; hemen ardından gelen 16 kulüp play-off oynar, kazanan 8'i son
// kontenjanı doldurur. Play-off'u kaybedenler (8 kulüp) Avrupa Ligi'ne
// garantili katılım hakkı kazanır (bkz. getELQualifiers).
function getCLQualifiers(){
  const ranked = rankTopTierClubsByForm();
  const rankedIds = ranked.map(c=>c.id);
  const direct = rankedIds.slice(0, CL_DIRECT);
  const playoffPool = rankedIds.slice(CL_DIRECT, CL_DIRECT + CL_PLAYOFF_SPOTS*2);
  let playoffResult = null;
  let qualifiers = direct.slice();
  if(playoffPool.length === CL_PLAYOFF_SPOTS*2){
    playoffResult = runEuroPlayoffRound(playoffPool, CL_PLAYOFF_SPOTS);
    qualifiers = qualifiers.concat(playoffResult.winners);
  } else {
    // Yeterli aday yoksa (çok az ülke/kulüp varsa) eski usul: doğrudan en iyi 32.
    qualifiers = rankedIds.slice(0, CL_TOTAL_TEAMS);
  }
  state.clPlayoffResult = playoffResult;
  if(playoffResult && playoffResult.ties.some(t=>t.idA===state.playerClubId || t.idB===state.playerClubId)){
    const won = playoffResult.winners.includes(state.playerClubId);
    state.lastEuroPlayoffNote = won
      ? "Şampiyonlar Ligi play-off'unu kazanıp grup aşamasına yükseldiniz!"
      : "Şampiyonlar Ligi play-off'unda elendiniz, ancak Avrupa Ligi'ne garantili katılım hakkı kazandınız.";
  }
  return qualifiers;
}
/* Avrupa Ligi katılımcıları: Şampiyonlar Ligi play-off'unu kaybedenler
   doğrudan (garantili) kontenjana dahil edilir; kalan yerlerin bir kısmı
   sıralamayla, bir kısmı ise ikinci bir play-off turuyla belirlenir. Bu
   play-off'u kaybedenler Konferans Ligi'ne garantili katılım kazanır. */
function getELQualifiers(excludeIds){
  const excludeSet = new Set(excludeIds||[]);
  const clLosers = ((state.clPlayoffResult && state.clPlayoffResult.losers) || []).filter(id=>!excludeSet.has(id));
  const ranked = rankTopTierClubsByForm().filter(c=>!excludeSet.has(c.id) && !clLosers.includes(c.id));
  const rankedIds = ranked.map(c=>c.id);
  const direct = rankedIds.slice(0, EL_DIRECT);
  const playoffPool = rankedIds.slice(EL_DIRECT, EL_DIRECT + EL_PLAYOFF_SPOTS*2);
  let playoffResult = null;
  let qualifiers = clLosers.concat(direct);
  if(playoffPool.length === EL_PLAYOFF_SPOTS*2){
    playoffResult = runEuroPlayoffRound(playoffPool, EL_PLAYOFF_SPOTS);
    qualifiers = qualifiers.concat(playoffResult.winners);
  } else {
    qualifiers = clLosers.concat(rankedIds.slice(0, Math.max(0, EL_TOTAL_TEAMS - clLosers.length)));
  }
  state.elPlayoffResult = playoffResult;
  if(playoffResult && playoffResult.ties.some(t=>t.idA===state.playerClubId || t.idB===state.playerClubId)){
    const won = playoffResult.winners.includes(state.playerClubId);
    state.lastEuroPlayoffNote = won
      ? "Avrupa Ligi play-off'unu kazanıp grup aşamasına yükseldiniz!"
      : "Avrupa Ligi play-off'unda elendiniz, ancak Konferans Ligi'ne garantili katılım hakkı kazandınız.";
  } else if(clLosers.includes(state.playerClubId)){
    state.lastEuroPlayoffNote = "Şampiyonlar Ligi play-off'unda elendiğiniz için Avrupa Ligi grup aşamasına garantili katıldınız.";
  }
  return qualifiers.slice(0, EL_TOTAL_TEAMS);
}
/* Konferans Ligi katılımcıları: Avrupa Ligi play-off'unu kaybedenler
   garantili katılır, kalan kontenjan sıralamayla doldurulur (bu kademede
   ayrıca bir play-off oynanmaz — gerçek UEFA formatında olduğu gibi
   Konferans Ligi play-off'unu kaybeden kulüp Avrupa'dan tamamen elenir). */
function getCOQualifiers(excludeIds){
  const excludeSet = new Set(excludeIds||[]);
  const elLosers = ((state.elPlayoffResult && state.elPlayoffResult.losers) || []).filter(id=>!excludeSet.has(id));
  const ranked = rankTopTierClubsByForm().filter(c=>!excludeSet.has(c.id) && !elLosers.includes(c.id));
  const rankedIds = ranked.map(c=>c.id);
  const need = Math.max(0, CO_TOTAL_TEAMS - elLosers.length);
  const qualifiers = elLosers.concat(rankedIds.slice(0, need));
  if(elLosers.includes(state.playerClubId)){
    state.lastEuroPlayoffNote = "Avrupa Ligi play-off'unda elendiğiniz için Konferans Ligi grup aşamasına garantili katıldınız.";
  }
  return qualifiers.slice(0, CO_TOTAL_TEAMS);
}

function toKOPairs(arr){

/* ---- Sezon başında Şampiyonlar Ligi kurulumu ----
   Katılımcılar geçen sezonun lig sıralamasına göre belirlenir. Oyuncunun kulübü
   grubundaysa, kendi 3 grup maçı haftalık takvime tek tek eklenir; diğer tüm
   maçlar (rakiplerin birbiriyle oynadığı maçlar) anında simüle edilir. Oyuncu
   turnuvadan elenene ya da şampiyon olana kadar her tur aynı şekilde ilerler. */
function setupChampionsLeagueSeason(){
  state.lastClNote = null;
  state.lastEuroPlayoffNote = null;
  const qualifiers = getCLQualifiers();
  state.lastClQualifiers = qualifiers;
  state.clSeason = {
    year: state.year, active:false, groups:null, myGroupName:null, stage:null,
    roundResults:{playoff:[], r16:[], qf:[], sf:[], final:[]}, myPendingTie:null,
    directR16:[], eliminated:false, winner:null
  };
  if(qualifiers.length < CL_TOTAL_TEAMS) return;

  const shuffled = qualifiers.slice().sort(()=>Math.random()-0.5);
  const groups = [];
  for(let g=0; g<CL_GROUP_COUNT; g++){
    const clubIds = shuffled.slice(g*CL_TEAMS_PER_GROUP, (g+1)*CL_TEAMS_PER_GROUP);
    groups.push({ name:String.fromCharCode(65+g), clubs:clubIds, table:buildEmptyGroupTable(clubIds), fixtures:groupRoundRobinFixtures(clubIds) });
  }
  state.clSeason.groups = groups;

  groups.forEach(g=> g.clubs.forEach(id=>{
    const club = state.clubs[id];
    if(!club) return;
    const cf = countryByCode(club.country).strength;
    club.budget += Math.round(8*cf)*1000000;
  }));

  const myGroup = groups.find(g=>g.clubs.includes(state.playerClubId));
  if(!myGroup){
    state.championsLeague = simulateFullCLFromGroups(groups);
    if(state.championsLeague){
      state.clHistory = state.clHistory || [];
      state.clHistory.unshift({year: state.year, winnerId: state.championsLeague.winner});
      if(state.clHistory.length > 20) state.clHistory = state.clHistory.slice(0,20);
    }
    return;
  }

  state.clSeason.active = true;
  state.clSeason.myGroupName = myGroup.name;
  state.clSeason.stage = 'group';

  groups.forEach(g=>{
    g.fixtures.forEach(f=>{
      if(f.home===state.playerClubId || f.away===state.playerClubId) return;
      const {gh,ga} = simulateMatch(f.home,f.away);
      f.gh=gh; f.ga=ga; f.played=true;
      applyMatchToTable(g.table, f.home, f.away, gh, ga);
      updateBothClubsStats(f.home, f.away, gh, ga, 'cl');
    });
  });
}

function finalizeGroupsAndStartKnockout(){
  const cs = state.clSeason;
  // Yeni format: her grubun 1.si doğrudan Son 16'ya yükselir, 2. ve 3. sırada
  // bitirenler ise Son 16 biletleri için tek maçlık bir Play-Off turu oynar.
  // 4. sırada bitirenler turnuvadan elenir.
  let directSeeds = [];
  let playoffSeeds = [];
  cs.groups.forEach(g=>{
    const st = groupStandings(g);
    g.standings = st;
    directSeeds.push(st[0].id);
    playoffSeeds.push(st[1].id, st[2].id);
  });
  cs.directR16 = directSeeds;
  const qualified = directSeeds.concat(playoffSeeds);
  if(!qualified.includes(state.playerClubId)){
    cs.eliminated = true;
    cs.active = false;
  }
  const shuffledPlayoff = playoffSeeds.slice().sort(()=>Math.random()-0.5);
  const ties = toKOPairs(shuffledPlayoff).map(([h,a])=>createCLTie('playoff', h, a));
  cs.roundResults.playoff = ties;
  cs.stage = 'playoff';
  advancePlayoffRound();
}

/* Play-Off turu: grup 2. ve 3.leri arasında tek maçlık eleme. Grup birincileri
   bu tura hiç katılmadan doğrudan Son 16'ya beklerler (cs.directR16). */
function advancePlayoffRound(){
  const cs = state.clSeason;
  const ties = cs.roundResults.playoff;
  let myTie = null;
  ties.forEach(t=>{
    if(t.home===state.playerClubId || t.away===state.playerClubId){ myTie = t; return; }
    const {gh,ga} = simulateMatch(t.home,t.away);
    t.gh=gh; t.ga=ga; t.played=true;
    t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
    awardKnockoutPrize('playoff', t);
    updateBothClubsStats(t.home, t.away, gh, ga, 'cl');
  });
  if(myTie){
    cs.myPendingTie = {stage:'playoff', tie: myTie};
    insertCLAgendaItem({stage:'playoff', tie: myTie});
  } else {
    // Kulübümüz Play-Off'ta yok: ya grup birincisi olarak doğrudan geçti,
    // ya da grubu 4. bitirip elendi. Her iki durumda da Son 16 eşleşmelerini kur.
    startR16FromPlayoffResults();
  }
}

/* Play-Off galipleri (8 takım) + doğrudan geçen grup birincileri (8 takım)
   birleşip Son 16 eşleşmelerini oluşturur. */
function startR16FromPlayoffResults(){
  const cs = state.clSeason;
  const playoffWinners = cs.roundResults.playoff.map(t=>t.winner);
  const combined = (cs.directR16||[]).concat(playoffWinners);
  const shuffled = combined.slice().sort(()=>Math.random()-0.5);
  const ties = toKOPairs(shuffled).map(([h,a])=>createCLTie('r16', h, a));
  cs.roundResults.r16 = ties;
  cs.stage = 'r16';
  advanceKnockoutRound('r16');
}

function advanceKnockoutRound(stage){
  const cs = state.clSeason;
  const ties = cs.roundResults[stage];
  let myTie = null;
  ties.forEach(t=>{
    if(t.home===state.playerClubId || t.away===state.playerClubId){ myTie = t; return; }
    const {gh,ga} = simulateMatch(t.home,t.away);
    t.gh=gh; t.ga=ga; t.played=true;
    t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
    awardKnockoutPrize(stage, t);
    updateBothClubsStats(t.home, t.away, gh, ga, 'cl');
  });
  if(myTie){
    cs.myPendingTie = {stage, tie: myTie};
    insertCLAgendaItem({stage, tie: myTie});
  } else {
    finishTournamentInstant(stage);
  }
}

function playCLWeek(item){
  const t = item.tie;
  const {gh,ga} = simulateMatch(t.home,t.away);
  t.gh=gh; t.ga=ga; t.played=true;
  state.lastMatches.push({home:state.clubs[t.home].name, away:state.clubs[t.away].name, gh, ga, cl:true, stage:item.stage, homeId:t.home, awayId:t.away});

  if(t.home === state.playerClubId || t.away === state.playerClubId){
    decrementSuspensions(state.playerClubId);
    decrementInjuries(state.playerClubId);
    const xiIds = lineupEffectiveXIIds(state.playerClubId);

    // OYUNCU İSTATİSTİKLERİNİ GÜNCELLE (Şampiyonlar Ligi istatistikleri)
    updatePlayerStats(state.playerClubId, xiIds, t.home===state.playerClubId ? gh : ga, t.home===state.playerClubId ? ga : gh, t.home===state.playerClubId, 'cl');

    xiIds.forEach(pid => {
      if(Math.random()*100 < effectiveInjuryRisk(state.playerClubId)) injurePlayer(pid);
      bookPlayerCards(pid, 'cl');
    });
  }
  updateBothClubsStats(t.home, t.away, gh, ga, 'cl'); // rakip kulübün istatistiklerini de günceller

  if(item.stage==='group'){
    const cs = state.clSeason;
    const myGroup = cs.groups.find(g=>g.name===cs.myGroupName);
    applyMatchToTable(myGroup.table, t.home, t.away, gh, ga);
    checkGroupCompletion();
  } else {
    t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
    awardKnockoutPrize(item.stage, t);
    state.clSeason.myPendingTie = null;
    if(t.winner === state.playerClubId){
      proceedAfterMyWin(item.stage);
    } else {
      state.clSeason.eliminated = true;
      state.clSeason.active = false;
      finishTournamentInstant(item.stage);
    }
  }
}

function proceedAfterMyWin(stage){
  const cs = state.clSeason;
  if(stage==='final'){
    cs.winner = state.playerClubId;
    cs.stage = 'done';
    cs.active = false;
    finalizeCLDisplayAndHistory();
    return;
  }
  if(stage==='playoff'){
    startR16FromPlayoffResults();
    return;
  }
  const nextStageMap = {r16:'qf', qf:'sf', sf:'final'};
  const nextStage = nextStageMap[stage];
  const winners = cs.roundResults[stage].map(t=>t.winner);
  const shuffled = winners.slice().sort(()=>Math.random()-0.5);
  const ties = toKOPairs(shuffled).map(([h,a])=>createCLTie(nextStage, h, a));
  cs.roundResults[nextStage] = ties;
  cs.stage = nextStage;
  advanceKnockoutRound(nextStage);
}

function finishTournamentInstant(fromStage){
  const cs = state.clSeason;
  const order = ['playoff','r16','qf','sf','final'];
  let idx = order.indexOf(fromStage);
  let winners = fromStage==='playoff'
    ? (cs.directR16||[]).concat(cs.roundResults.playoff.map(t=>t.winner))
    : cs.roundResults[fromStage].map(t=>t.winner);
  for(let s=idx+1; s<order.length; s++){
    const stage = order[s];
    const shuffled = winners.slice().sort(()=>Math.random()-0.5);
    const ties = toKOPairs(shuffled).map(([h,a])=>createCLTie(stage,h,a));
    ties.forEach(t=>{
      const {gh,ga} = simulateMatch(t.home,t.away);
      t.gh=gh; t.ga=ga; t.played=true;
      t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
      awardKnockoutPrize(stage, t);
      updateBothClubsStats(t.home, t.away, gh, ga, 'cl');
    });
    cs.roundResults[stage] = ties;
    winners = ties.map(t=>t.winner);
  }
  cs.winner = winners[0];
  cs.stage = 'done';
  finalizeCLDisplayAndHistory();
}

function finalizeCLDisplayAndHistory(){
  const cs = state.clSeason;
  const groupsDisplay = cs.groups.map(g=>({name:g.name, clubs:g.clubs, standings: g.standings || groupStandings(g)}));
  state.championsLeague = {
    year: cs.year,
    groups: groupsDisplay,
    playoff: cs.roundResults.playoff || [],
    r16: cs.roundResults.r16 || [],
    qf: cs.roundResults.qf || [],
    sf: cs.roundResults.sf || [],
    final: (cs.roundResults.final && cs.roundResults.final[0]) || null,
    winner: cs.winner
  };
  state.clHistory = state.clHistory || [];
  state.clHistory.unshift({year: cs.year, winnerId: cs.winner});
  if(state.clHistory.length > 20) state.clHistory = state.clHistory.slice(0,20);
  if(cs.winner === state.playerClubId){
    state.lastClNote = "Tebrikler! Kulübünüz bu sezon Şampiyonlar Ligi'ni kazandı!";
    addPlayerTrophy({type:'cl', icon:'🏆', title:"Şampiyonlar Ligi", subtitle:"Şampiyon"});
  }
}

function simulateFullCLFromGroups(groups){
  groups.forEach(g=>{
    g.fixtures.forEach(f=>{
      if(!f.played){
        const {gh,ga} = simulateMatch(f.home,f.away);
        f.gh=gh; f.ga=ga; f.played=true;
        applyMatchToTable(g.table, f.home, f.away, gh, ga);
        updateBothClubsStats(f.home, f.away, gh, ga, 'cl');
      }
    });
    g.standings = groupStandings(g);
  });
  let seeds = [];
  groups.forEach(g=> seeds.push(g.standings[0].id, g.standings[1].id));
  seeds = seeds.sort(()=>Math.random()-0.5);

  function playRound(teamIds, stage){
    return toKOPairs(teamIds).map(([h,a])=>{
      const {gh,ga} = simulateMatch(h,a);
      const winner = gh>ga?h:(ga>gh?a:(Math.random()<0.5?h:a));
      const tie = {stage,home:h,away:a,gh,ga,played:true,winner};
      awardKnockoutPrize(stage, tie);
      updateBothClubsStats(h, a, gh, ga, 'cl');
      return tie;
    });
  }
  const r16 = playRound(seeds, 'r16');
  const qf = playRound(r16.map(t=>t.winner), 'qf');
  const sf = playRound(qf.map(t=>t.winner), 'sf');
  const final = playRound(sf.map(t=>t.winner), 'final')[0];

  return { year: state.year, groups: groups.map(g=>({name:g.name, clubs:g.clubs, standings:g.standings})), r16, qf, sf, final, winner: final.winner };
}

/* Şampiyonlar Ligi ile aynı mantıkla çalışır: sezon başında ŞL kadrosuna
   giremeyen bir sonraki en iyi 32 kulüp arasından 8 grup + tek maçlık
   eleme turları (Son 16 → Çeyrek Final → Yarı Final → Final) oynanır. */
function setupEuropaLeagueSeason(){
  state.lastElNote = null;
  const qualifiers = getELQualifiers(state.lastClQualifiers || []);
  state.lastElQualifiers = qualifiers;
  state.elSeason = {
    year: state.year, active:false, groups:null, myGroupName:null, stage:null,
    roundResults:{r16:[], qf:[], sf:[], final:[]}, myPendingTie:null,
    eliminated:false, winner:null
  };
  if(qualifiers.length < EL_TOTAL_TEAMS) return;

  const shuffled = qualifiers.slice().sort(()=>Math.random()-0.5);
  const groups = [];
  for(let g=0; g<EL_GROUP_COUNT; g++){
    const clubIds = shuffled.slice(g*EL_TEAMS_PER_GROUP, (g+1)*EL_TEAMS_PER_GROUP);
    groups.push({ name:String.fromCharCode(65+g), clubs:clubIds, table:buildEmptyGroupTable(clubIds), fixtures:groupRoundRobinFixtures(clubIds) });
  }
  state.elSeason.groups = groups;

  groups.forEach(g=> g.clubs.forEach(id=>{
    const club = state.clubs[id];
    if(!club) return;
    const cf = countryByCode(club.country).strength;
    club.budget += Math.round(3*cf)*1000000;
  }));

  const myGroup = groups.find(g=>g.clubs.includes(state.playerClubId));
  if(!myGroup){
    state.europaLeague = simulateFullELFromGroups(groups);
    if(state.europaLeague){
      state.elHistory = state.elHistory || [];
      state.elHistory.unshift({year: state.year, winnerId: state.europaLeague.winner});
      if(state.elHistory.length > 20) state.elHistory = state.elHistory.slice(0,20);
    }
    return;
  }

  state.elSeason.active = true;
  state.elSeason.myGroupName = myGroup.name;
  state.elSeason.stage = 'group';

  groups.forEach(g=>{
    g.fixtures.forEach(f=>{
      if(f.home===state.playerClubId || f.away===state.playerClubId) return;
      const {gh,ga} = simulateMatch(f.home,f.away);
      f.gh=gh; f.ga=ga; f.played=true;
      applyMatchToTable(g.table, f.home, f.away, gh, ga);
      updateBothClubsStats(f.home, f.away, gh, ga, 'el');
    });
  });
}

function insertCOAgendaItem(item){
  for(let i=state.fixtureRoundIdx+1; i<state.fixtureRounds.length; i++){
    const wk = state.fixtureRounds[i];
    if(wk.type==='league' && !wk.co){ wk.co = item; return; }
  }
  state.fixtureRounds.push({type:'league', pairs:[], cl:null, el:null, co:item});
}

function checkCOGroupCompletion(){
  const cs = state.coSeason;
  const myGroup = cs.groups.find(g=>g.name===cs.myGroupName);
  if(!myGroup.fixtures.every(f=>f.played)) return;
  finalizeCOGroupsAndStartKnockout();
}

function finalizeCOGroupsAndStartKnockout(){
  const cs = state.coSeason;
  let seeds = [];
  cs.groups.forEach(g=>{
    const st = groupStandings(g);
    g.standings = st;
    seeds.push(st[0].id, st[1].id);
  });
  if(!seeds.includes(state.playerClubId)){
    cs.eliminated = true;
    cs.active = false;
  }
  seeds = seeds.sort(()=>Math.random()-0.5);
  const ties = toKOPairs(seeds).map(([h,a])=>createCLTie('r16', h, a));
  cs.roundResults.r16 = ties;
  cs.stage = 'r16';
  advanceCOKnockoutRound('r16');
}

function advanceCOKnockoutRound(stage){
  const cs = state.coSeason;
  const ties = cs.roundResults[stage];
  let myTie = null;
  ties.forEach(t=>{
    if(t.home===state.playerClubId || t.away===state.playerClubId){ myTie = t; return; }
    const {gh,ga} = simulateMatch(t.home,t.away);
    t.gh=gh; t.ga=ga; t.played=true;
    t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
    awardCOKnockoutPrize(stage, t);
    updateBothClubsStats(t.home, t.away, gh, ga, 'co');
  });
  if(myTie){
    cs.myPendingTie = {stage, tie: myTie};
    insertCOAgendaItem({stage, tie: myTie});
  } else {
    finishCOTournamentInstant(stage);
  }
}

function playCOWeek(item){
  const t = item.tie;
  const {gh,ga} = simulateMatch(t.home,t.away);
  t.gh=gh; t.ga=ga; t.played=true;
  state.lastMatches.push({home:state.clubs[t.home].name, away:state.clubs[t.away].name, gh, ga, co:true, stage:item.stage, homeId:t.home, awayId:t.away});

  if(t.home === state.playerClubId || t.away === state.playerClubId){
    decrementSuspensions(state.playerClubId);
    decrementInjuries(state.playerClubId);
    const xiIds = lineupEffectiveXIIds(state.playerClubId);

    // OYUNCU İSTATİSTİKLERİNİ GÜNCELLE (Konferans Ligi istatistikleri)
    updatePlayerStats(state.playerClubId, xiIds, t.home===state.playerClubId ? gh : ga, t.home===state.playerClubId ? ga : gh, t.home===state.playerClubId, 'co');

    xiIds.forEach(pid => {
      if(Math.random()*100 < effectiveInjuryRisk(state.playerClubId)) injurePlayer(pid);
      bookPlayerCards(pid, 'co');
    });
  }
  updateBothClubsStats(t.home, t.away, gh, ga, 'co'); // rakip kulübün istatistiklerini de günceller

  if(item.stage==='group'){
    const cs = state.coSeason;
    const myGroup = cs.groups.find(g=>g.name===cs.myGroupName);
    applyMatchToTable(myGroup.table, t.home, t.away, gh, ga);
    checkCOGroupCompletion();
  } else {
    t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
    awardCOKnockoutPrize(item.stage, t);
    state.coSeason.myPendingTie = null;
    if(t.winner === state.playerClubId){
      proceedAfterMyCOWin(item.stage);
    } else {
      state.coSeason.eliminated = true;
      state.coSeason.active = false;
      finishCOTournamentInstant(item.stage);
    }
  }
}

function proceedAfterMyCOWin(stage){
  const cs = state.coSeason;
  if(stage==='final'){
    cs.winner = state.playerClubId;
    cs.stage = 'done';
    cs.active = false;
    finalizeCODisplayAndHistory();
    return;
  }
  const nextStageMap = {r16:'qf', qf:'sf', sf:'final'};
  const nextStage = nextStageMap[stage];
  const winners = cs.roundResults[stage].map(t=>t.winner);
  const shuffled = winners.slice().sort(()=>Math.random()-0.5);
  const ties = toKOPairs(shuffled).map(([h,a])=>createCLTie(nextStage, h, a));
  cs.roundResults[nextStage] = ties;
  cs.stage = nextStage;
  advanceCOKnockoutRound(nextStage);
}

function finishCOTournamentInstant(fromStage){
  const cs = state.coSeason;
  const order = ['r16','qf','sf','final'];
  let idx = order.indexOf(fromStage);
  let winners = cs.roundResults[fromStage].map(t=>t.winner);
  for(let s=idx+1; s<order.length; s++){
    const stage = order[s];
    const shuffled = winners.slice().sort(()=>Math.random()-0.5);
    const ties = toKOPairs(shuffled).map(([h,a])=>createCLTie(stage,h,a));
    ties.forEach(t=>{
      const {gh,ga} = simulateMatch(t.home,t.away);
      t.gh=gh; t.ga=ga; t.played=true;
      t.winner = gh>ga?t.home:(ga>gh?t.away:(Math.random()<0.5?t.home:t.away));
      awardCOKnockoutPrize(stage, t);
      updateBothClubsStats(t.home, t.away, gh, ga, 'co');
    });
    cs.roundResults[stage] = ties;
    winners = ties.map(t=>t.winner);
  }
  cs.winner = winners[0];
  cs.stage = 'done';
  finalizeCODisplayAndHistory();
}

function finalizeCODisplayAndHistory(){
  const cs = state.coSeason;
  const groupsDisplay = cs.groups.map(g=>({name:g.name, clubs:g.clubs, standings: g.standings || groupStandings(g)}));
  state.conferenceLeague = {
    year: cs.year,
    groups: groupsDisplay,
    r16: cs.roundResults.r16 || [],
    qf: cs.roundResults.qf || [],
    sf: cs.roundResults.sf || [],
    final: (cs.roundResults.final && cs.roundResults.final[0]) || null,
    winner: cs.winner
  };
  state.coHistory = state.coHistory || [];
  state.coHistory.unshift({year: cs.year, winnerId: cs.winner});
  if(state.coHistory.length > 20) state.coHistory = state.coHistory.slice(0,20);
  if(cs.winner === state.playerClubId){
    state.lastCoNote = "Tebrikler! Kulübünüz bu sezon Konferans Ligi'ni kazandı!";
    addPlayerTrophy({type:'co', icon:'🥉', title:"Konferans Ligi", subtitle:"Şampiyon"});
  }
}

function simulateFullCOFromGroups(groups){
  groups.forEach(g=>{
    g.fixtures.forEach(f=>{
      if(!f.played){
        const {gh,ga} = simulateMatch(f.home,f.away);
        f.gh=gh; f.ga=ga; f.played=true;
        applyMatchToTable(g.table, f.home, f.away, gh, ga);
        updateBothClubsStats(f.home, f.away, gh, ga, 'co');
      }
    });
    g.standings = groupStandings(g);
  });
  let seeds = [];
  groups.forEach(g=> seeds.push(g.standings[0].id, g.standings[1].id));
  seeds = seeds.sort(()=>Math.random()-0.5);

  function playRound(teamIds, stage){
    return toKOPairs(teamIds).map(([h,a])=>{
      const {gh,ga} = simulateMatch(h,a);
      const winner = gh>ga?h:(ga>gh?a:(Math.random()<0.5?h:a));
      const tie = {stage,home:h,away:a,gh,ga,played:true,winner};
      awardCOKnockoutPrize(stage, tie);
      updateBothClubsStats(h, a, gh, ga, 'co');
      return tie;
    });
  }
  const r16 = playRound(seeds, 'r16');
  const qf = playRound(r16.map(t=>t.winner), 'qf');
  const sf = playRound(qf.map(t=>t.winner), 'sf');
  const final = playRound(sf.map(t=>t.winner), 'final')[0];

  return { year: state.year, groups: groups.map(g=>({name:g.name, clubs:g.clubs, standings:g.standings})), r16, qf, sf, final, winner: final.winner };
}

const SEASON_MONTHS = ["Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık","Ocak","Şubat","Mart"];
function weekMonthLabel(weekIdx){
  const monthIdx = Math.min(SEASON_MONTHS.length-1, Math.floor(weekIdx / 4));
  return SEASON_MONTHS[monthIdx];
}

/* ŞL maçları artık ayrı bir "hafta" olarak eklenmiyor; mevcut lig haftalarından
   birine "Çarşamba" maçı olarak iliştiriliyor (aynı hafta içinde Cumartesi lig +
   Çarşamba Şampiyonlar Ligi oynanıyor — gerçek hayattaki gibi). */
function buildWeeklyAgenda(domesticRounds, clItems, elItems){
  const agenda = domesticRounds.map(pairs=>({type:'league', pairs, cl:null, el:null}));
  if(clItems && clItems.length){
    clItems.forEach((item, i)=>{
      const idealPos = Math.round((i+1) * agenda.length / (clItems.length+1));
      let pos = clamp(idealPos, 0, agenda.length-1);
      while(agenda[pos] && agenda[pos].cl) pos++;
      if(!agenda[pos]) pos = agenda.findIndex(w=>!w.cl);
      if(pos>=0 && agenda[pos]) agenda[pos].cl = item;
    });
  }
  if(elItems && elItems.length){
    elItems.forEach((item, i)=>{
      const idealPos = Math.round((i+1) * agenda.length / (elItems.length+1));
      let pos = clamp(idealPos, 0, agenda.length-1);
      while(agenda[pos] && agenda[pos].el) pos++;
      if(!agenda[pos]) pos = agenda.findIndex(w=>!w.el);
      if(pos>=0 && agenda[pos]) agenda[pos].el = item;
    });
  }
  return agenda;
}

// Sezon başında tüm maçlara tarihler atayıp gün gün ilerletme.
// Not: eski sürümde tur aralığı sabit (2 + 4 = 6 gün) ilerliyordu; bu da
// haftalık bloklar halinde "hep aynı gün" hissi veriyordu. Yeni sürümde tek
// bir takvim imleci (cursor) günden güne ilerliyor ve turlar arası boşluk
// döngüsel olarak değişiyor (6/7/8 gün) — böylece maçlar sezon boyunca
// Cumartesi'ye kilitlenmeden farklı günlere yayılıyor.
function buildDailyFixtures(domesticRounds, clItems, elItems, coItems){
  const fixtures = [];
  // Takvim yılı state.year'e (sezon numarasına) göre hesaplanır — böylece
  // "26/27" sezonundaysanız tarihler de 2026 Ağustos'undan başlar, sabit
  // 2024 değil.
  const seasonStartYear = 2025 + state.year;
  let cursor = new Date(seasonStartYear, 7, 1); // 1 Ağustos başlangıç (preseason)
  const dayOfWeek = (d) => ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][d.getDay()];
  const addDays = (base, n) => { const d = new Date(base); d.setDate(d.getDate() + n); return d; };
  const stampFixture = (obj, date) => Object.assign(obj, {
    date,
    dateStr: date.toLocaleDateString('tr-TR'),
    dayName: dayOfWeek(date)
  });

  // Hazırlık maçları (2 hafta) - haftada 2-3 maç, tek imleç günden güne ilerliyor
  for(let i = 0; i < PRESEASON_WEEKS; i++){
    const others = Object.keys(state.clubs).filter(id=>id!==state.playerClubId);
    const opp = pick(others);
    fixtures.push(stampFixture({ type: 'friendly', opponent: opp }, cursor));
    cursor = addDays(cursor, Math.random() > 0.4 ? 3 : 2); // 2-3 gün aralık
  }

  // Lig maçları: her tur kendi içinde 1-2 güne yayılıyor (ör. Cuma + Cumartesi),
  // turlar arası boşluk ise 6/7/8 gün arasında dönüşümlü — bu yüzden sezon
  // ilerledikçe maç günleri kayıyor, sabit bir güne (hep Cumartesi gibi) takılıp
  // kalmıyor. Takvim tamamen sezon başında, tur tur (gün gün) burada kuruluyor.
  // Not: aralık kasıtlı olarak 7'nin katı DEĞİL (6 gün) — böylece her tur bir
  // önceki turdan bir gün daha erken bir haftanın gününe denk gelir ve 7 tur
  // içinde tüm hafta günlerini gezer (hep Cumartesi'de takılı kalmaz).
  const ROUND_GAP_DAYS = 6;
  domesticRounds.forEach((pairs, roundIdx) => {
    if(roundIdx > 0){
      cursor = addDays(cursor, ROUND_GAP_DAYS);
    }
    pairs.forEach((pair, matchIdx) => {
      const isMyMatch = pair[0] === state.playerClubId || pair[1] === state.playerClubId;
      const dayOffset = matchIdx % 2 === 0 ? 0 : 1; // aynı turun maçları art arda 2 güne yayılır
      const mDate = addDays(cursor, dayOffset);
      fixtures.push(stampFixture({
        type: 'league',
        home: pair[0],
        away: pair[1],
        round: roundIdx + 1,
        isMyMatch: isMyMatch
      }, mDate));
    });
  });

  // CL ve EL maçlarını uygun günlere dağıt (gerçek Date nesnesiyle)
  if(clItems && clItems.length){
    clItems.forEach((item) => {
      const randomDate = new Date(seasonStartYear, 7 + Math.floor(Math.random() * 9), Math.floor(Math.random() * 25) + 1);
      fixtures.push(stampFixture({ type: 'cl', ...item }, randomDate));
    });
  }

  if(elItems && elItems.length){
    elItems.forEach((item) => {
      const randomDate = new Date(seasonStartYear, 7 + Math.floor(Math.random() * 9), Math.floor(Math.random() * 25) + 1);
      fixtures.push(stampFixture({ type: 'el', ...item }, randomDate));
    });
  }

  if(coItems && coItems.length){
    coItems.forEach((item) => {
      const randomDate = new Date(seasonStartYear, 7 + Math.floor(Math.random() * 9), Math.floor(Math.random() * 25) + 1);
      fixtures.push(stampFixture({ type: 'co', ...item }, randomDate));
    });
  }

  // Tarihe göre sırala — dateStr yerine gerçek Date nesnesiyle (eski kod
  // "gün.ay.yıl" formatlı metni new Date(...) ile parse ediyordu, bu da
  // tarayıcıya göre yanlış/NaN sıralamaya yol açabiliyordu).
  fixtures.sort((a, b) => a.date - b.date);

  return fixtures;
}

function buildPreseasonWeeks(){
  const club = state.clubs[state.playerClubId];
  const others = Object.keys(state.clubs).filter(id=>id!==state.playerClubId);
  const weeks = [];
  for(let i=0;i<PRESEASON_WEEKS;i++){
    const opp = pick(others);
    weeks.push({type:'friendly', opponent: opp});
  }
  return weeks;
}

function startSeason(){
  if(state.seasonInProgress) return;
  const club = state.clubs[state.playerClubId];
  if(lineupHasEmptySlot(state.playerClubId)){
    showToast("Kadro düzeninizde boş pozisyon var — sezonu başlatmadan önce 11'inizi eksiksiz doldurun.");
    activeTab = "lineup";
    render();
    return;
  }
  const myLeagueKey = club.leagueKey;
  state.loseStreak = 0;
  state.winStreak = 0;
  state.lastPressQuote = null;
  setBoardExpectation();

  const leagueGroups = {};
  Object.values(state.clubs).forEach(c=>{
    (leagueGroups[c.leagueKey] = leagueGroups[c.leagueKey] || []).push(c.id);
  });

  Object.keys(leagueGroups).forEach(key=>{
    if(key === myLeagueKey) return;
    const res = simulateTier(leagueGroups[key]);
    state.standingsByLeague[key] = res.standings;
    applyLeagueIncome(key, res.standings);
  });

  runSuperCup();
  setupChampionsLeagueSeason();
  setupEuropaLeagueSeason();
  setupConferenceLeagueSeason();

  const myClubIds = shuffleArray(leagueGroups[myLeagueKey]);
  const domesticRounds = generateRoundRobinPairs(myClubIds);
  const clItems = (state.clSeason && state.clSeason.active) ? playerGroupCLFixtures() : [];
  const elItems = (state.elSeason && state.elSeason.active) ? playerGroupELFixtures() : [];
  const coItems = (state.coSeason && state.coSeason.active) ? playerGroupCOFixtures() : [];
  
  // YENİ: Günlük fixture sistemi
  state.fixtureMatches = buildDailyFixtures(domesticRounds, clItems, elItems, coItems);
  state.fixtureMatchIdx = 0;
  
  // Eski sistemde uyumlu olması için
  state.fixtureRounds = [];
  state.fixtureRoundIdx = 0;
  
  state.leagueMatchesPlayed = 0;
  state.winterWindowStartRound = null;
  state.currentTable = {};
  myClubIds.forEach(id => state.currentTable[id] = {id,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
  state.seasonInProgress = true;
  state.lastMatches = [];
  render();
}

function playFriendlyWeek(week){
  const myId = state.playerClubId;
  const oppId = week.opponent;
  const {gh,ga} = simulateMatch(myId, oppId);
  state.lastMatches.push({home:state.clubs[myId].name, away:state.clubs[oppId].name, gh, ga, friendly:true});

  const xiIds = lineupEffectiveXIIds(myId);
  const mySlots = lineupEffectiveXISlots(myId);
  const mySlotMap = {};
  mySlots.forEach(s=>{ mySlotMap[s.id] = s.slotCode; });
  const oppXIIds = aiEffectiveXIIds(oppId);
  const homeEvents = generateTeamGoalEvents(xiIds, gh);
  const awayEvents = generateTeamGoalEvents(oppXIIds, ga);

  // Maç günü modalı - Dostluk maçı
  state.matchDayModal = [{
    home: state.clubs[myId].name,
    away: state.clubs[oppId].name,
    gh, ga,
    homeId: myId,
    awayId: oppId,
    homeXI: xiIds, awayXI: oppXIIds,
    homeEvents, awayEvents,
    homeSlotMap: mySlotMap
  }];

  // Hazırlık maçı: hafif sakatlık riski var ama kart/ceza uygulanmaz.
  decrementSuspensions(myId);
  decrementInjuries(myId);
  xiIds.forEach(pid => {
    if(Math.random()*100 < effectiveInjuryRisk(state.playerClubId)*0.5) injurePlayer(pid);
  });
}
function aiEffectiveXIIds(clubId){
  const club = state.clubs[clubId];
  if(!club) return [];
  const squad = club.squad.map(id=>state.players[id]).filter(p=>p && !p.retired);
  const gk = squad.filter(p=>p.pos==='KL').sort((a,b)=>b.rating-a.rating)[0];
  const outfield = squad.filter(p=>p.pos!=='KL').sort((a,b)=>b.rating-a.rating).slice(0,10);
  return (gk ? [gk.id] : []).concat(outfield.map(p=>p.id));
}
// Bir maçtaki her iki kulübün de (oyuncunun kendi kulübü hariç — o ayrı, gerçek
// kadrosuyla işleniyor) istatistiklerini günceller. AI-vs-AI maçlarda ikisi de,
// oyuncunun dahil olduğu maçlarda ise sadece rakip taraf güncellenir.
function updateBothClubsStats(home, away, gh, ga, compKey){
  if(home !== state.playerClubId){
    updatePlayerStats(home, aiEffectiveXIIds(home), gh, ga, true, compKey);
  }
  if(away !== state.playerClubId){
    updatePlayerStats(away, aiEffectiveXIIds(away), ga, gh, false, compKey);
  }
}
function playLeagueWeek(week){
  const matchDayResults = [];
  week.pairs.forEach(([home,away])=>{
    const {gh,ga} = simulateMatch(home,away);
    applyMatchToTable(state.currentTable, home, away, gh, ga);

    const isMyMatch = home===state.playerClubId || away===state.playerClubId;

    // Kendi maçımsa: her iki takımın da sahaya çıkan 11'ini ve maçtaki gerçek
    // gol/asist olaylarını üretiyoruz — bunlar hem modalda gösterilecek hem de
    // sezon istatistiklerine (aşağıda) birebir aynı şekilde işlenecek.
    let homeXI = null, awayXI = null, homeEvents = null, awayEvents = null, homeSlotMap = null, awaySlotMap = null;
    if(isMyMatch){
      homeXI = home===state.playerClubId ? lineupEffectiveXIIds(home) : aiEffectiveXIIds(home);
      awayXI = away===state.playerClubId ? lineupEffectiveXIIds(away) : aiEffectiveXIIds(away);
      if(home===state.playerClubId){
        homeSlotMap = {};
        lineupEffectiveXISlots(home).forEach(s=>{ homeSlotMap[s.id] = s.slotCode; });
      }
      if(away===state.playerClubId){
        awaySlotMap = {};
        lineupEffectiveXISlots(away).forEach(s=>{ awaySlotMap[s.id] = s.slotCode; });
      }
      homeEvents = generateTeamGoalEvents(homeXI, gh);
      awayEvents = generateTeamGoalEvents(awayXI, ga);
    }

    // Tüm maçları matchDayResults'a ekle
    matchDayResults.push(Object.assign({
      home: state.clubs[home].name,
      away: state.clubs[away].name,
      gh, ga,
      homeId: home,
      awayId: away
    }, isMyMatch ? {homeXI, awayXI, homeEvents, awayEvents, homeSlotMap, awaySlotMap} : {}));
    
    if(isMyMatch){
      state.lastMatches.push({home:state.clubs[home].name,away:state.clubs[away].name,gh,ga});
    }

    // LİG'DEKİ DİĞER TAKIMLARIN OYUNCU İSTATİSTİKLERİ (Gol/Asist/Kaleci krallığı ligin tamamını kapsasın diye)
    [home, away].forEach(clubId=>{
      if(clubId === state.playerClubId) return; // kendi takımım aşağıda gerçek kadrosuyla işleniyor
      if(isMyMatch){
        // Rakip benim maçımdaysa, modalda gösterilen olaylarla birebir aynı istatistikleri işle.
        const xi = clubId===home ? homeXI : awayXI;
        const events = clubId===home ? homeEvents : awayEvents;
        const goalsAgainst = clubId===home ? ga : gh;
        updatePlayerStatsWithEvents(clubId, xi, goalsAgainst, 'league', events);
        return;
      }
      const xi = aiEffectiveXIIds(clubId);
      const isHomeClub = clubId === home;
      const goalsFor = isHomeClub ? gh : ga;
      const goalsAgainst = isHomeClub ? ga : gh;
      updatePlayerStats(clubId, xi, goalsFor, goalsAgainst, isHomeClub, 'league');
    });
    
    // YARALANMA + KART RİSKİ - SADECE KENDİ TAKIMIN SAHAYA ÇIKAN 11'İ İÇİN
    if(isMyMatch){
      state.leagueMatchesPlayed++;
      if(state.leagueMatchesPlayed === 18 && state.winterWindowStartRound === null){
        state.winterWindowStartRound = state.leagueMatchesPlayed;
        showToast("18. lig maçınız oynandı — 2 haftalık kış transfer penceresi açıldı!");
        // ---- Kış transfer penceresi açıldığında da, o ana kadarki lig
        // performansınıza göre başka kulüplerden TD teklifi gelebilir
        // (sezon sonundaki mekanizmayla aynı, farklı bir metinle).
        const midSeasonStandings = Object.values(state.currentTable)
          .sort((a,b)=> (b.Pts-a.Pts) || ((b.GF-b.GA)-(a.GF-a.GA)) || (b.GF-a.GF));
        maybeGenerateJobOffers(midSeasonStandings, {midSeason:true});
      }
      decrementSuspensions(state.playerClubId);
      decrementInjuries(state.playerClubId);
      const xiIds = home===state.playerClubId ? homeXI : awayXI;
      const myEvents = home===state.playerClubId ? homeEvents : awayEvents;
      const myGoalsAgainst = home===state.playerClubId ? ga : gh;
      
      // OYUNCU İSTATİSTİKLERİNİ GÜNCELLE (Lig istatistikleri) — modaldaki olaylarla tutarlı
      updatePlayerStatsWithEvents(state.playerClubId, xiIds, myGoalsAgainst, 'league', myEvents);
      
      xiIds.forEach(pid => {
        if(Math.random()*100 < effectiveInjuryRisk(state.playerClubId)) injurePlayer(pid);
        bookPlayerCards(pid, 'league');
      });

      // ---- MORAL SİSTEMİ ----
      const myGoals = home===state.playerClubId ? gh : ga;
      const oppGoals = home===state.playerClubId ? ga : gh;
      const won = myGoals > oppGoals, lost = myGoals < oppGoals;
      const club = state.clubs[state.playerClubId];
      const xiSet = new Set(xiIds.map(String));
      club.squad.forEach(pid=>{
        const p = state.players[pid];
        if(!p) return;
        if(xiSet.has(String(pid))){
          adjustMorale(pid, 2); // ilk 11 oynamak
        } else if(!p.injured && !(p.suspensionMatches>0)){
          adjustMorale(pid, -1); // yedek kalmak
        }
      });
      if(won){
        state.loseStreak = 0;
        adjustSquadMorale(state.playerClubId, 3); // kazanmak
      } else if(lost){
        state.loseStreak = (state.loseStreak||0) + 1;
        if(state.loseStreak >= 2) adjustSquadMorale(state.playerClubId, -3); // üst üste kaybetmek
      } else {
        state.loseStreak = 0;
      }
      // ---- Başarımlar: galibiyet/yenilmezlik serisi ve farklı galibiyet ----
      state.matchStreaks = state.matchStreaks || {winStreak:0, unbeatenStreak:0};
      const ms = state.matchStreaks;
      if(won){ ms.winStreak++; ms.unbeatenStreak++; }
      else if(lost){ ms.winStreak = 0; ms.unbeatenStreak = 0; }
      else { ms.winStreak = 0; ms.unbeatenStreak++; }
      if(ms.winStreak >= 10) unlockAchievement('on_galibiyet_serisi');
      if(ms.unbeatenStreak >= 20) unlockAchievement('yirmi_yenilmezlik');
      if(won && (myGoals - oppGoals) >= 5) unlockAchievement('buyuk_farkli_galibiyet');
    }
  });
  // Maç günü modal'ını set et
  state.matchDayModal = matchDayResults;
}
function updatePlayerStats(clubId, xiIds, goalsFor, goalsAgainst, isHome, compKey){
  xiIds.forEach(pid => {
    const p = state.players[pid];
    if(!p) return;

    // Stats objesi yoksa oluştur (yarışmaya göre ayrı: league / cl / el)
    ensureStatsShape(p);
    const s = p.stats[compKey] || (p.stats[compKey] = emptyCompStats());

    s.appearances = (s.appearances || 0) + 1;
    bumpLoanAppearances(p);

    if(p.pos === 'KL'){
      // Kaleci: kale örnegi ekle
      if(goalsAgainst === 0){
        s.cleanSheets = (s.cleanSheets || 0) + 1;
      }
      // Her gol başına 1 save (yaklaşık olarak)
      s.saves = (s.saves || 0) + goalsAgainst;
    } else {
      // Outfield: gol atma ihtimali
      const ratingFactor = (p.rating || 70) / 100;
      if(Math.random() < ratingFactor * 0.15 && goalsFor > 0){
        s.goals = (s.goals || 0) + 1;
      }
      // Asist ihtimali
      if(Math.random() < ratingFactor * 0.12 && goalsFor > 0){
        s.assists = (s.assists || 0) + 1;
      }
    }
  });
}

// Bir fikstür kaydının "bizim etkinliğimiz" olup olmadığını belirler: hazırlık
// maçları ve kupa (ŞL/AL) maçları her zaman bize aittir; lig maçlarında ise
// kendi kulübümüzün taraflardan biri olması gerekir. Bunun dışındaki lig
// maçları (bizim ligimizdeki diğer kulüpler arası) artık ayrı bir adım olarak
// gösterilmez — otomatik olarak arka planda oynatılır.
function isPlayerFixtureEvent(match){
  if(!match) return false;
  if(match.type === 'friendly' || match.type === 'cl' || match.type === 'el' || match.type === 'co') return true;
  if(match.type === 'league') return match.home === state.playerClubId || match.away === state.playerClubId;
  return false;
}
// fromIdx'ten itibaren bizim bir sonraki etkinliğimizin (maç/hazırlık/kupa)
// indeksini bulur; sadece önizleme amaçlıdır, state'i değiştirmez.
function nextPlayerFixtureIndex(fromIdx){
  if(!state.fixtureMatches) return -1;
  for(let i = fromIdx; i < state.fixtureMatches.length; i++){
    if(isPlayerFixtureEvent(state.fixtureMatches[i])) return i;
  }
  return -1;
}

/* ================= TAKVİM (GÜN GÜN GÖRÜNÜM) =================
   FC tarzı bir takvim ekranı: bugünden başlayarak önümüzdeki günleri tek
   tek listeler — boş günler "Boş Gün" olarak, bizim maçımızın olduğu
   günler ise rakip/rekabet bilgisiyle görünür. "Devam Et" butonu, mevcut
   playNextRound() akışını tetikler; bu fonksiyon zaten diğer kulüplerin
   maçlarını arka planda otomatik oynatıp bizim bir sonraki maçımıza kadar
   ilerliyor — yani takvimdeki boş günler tek tuşla "atlanmış" olur ve
   sadece bizim maç günümüze gelindiğinde durulur. ---- */
function buildCalendarDays(daysAhead){
  if(!state.fixtureMatches || !state.fixtureMatches.length) return [];
  const idx = Math.min(state.fixtureMatchIdx, state.fixtureMatches.length - 1);
  const anchor = state.fixtureMatches[idx].date;
  const startDate = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  const dayNames = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  // En az `daysAhead` gün göster, ama bizim bir sonraki 3 etkinliğimizi de
  // mutlaka kapsayacak şekilde gerekirse listeyi uzat.
  let lookIdx = idx, myEventsSeen = 0, lastEventDate = startDate;
  while(lookIdx < state.fixtureMatches.length && myEventsSeen < 3){
    if(isPlayerFixtureEvent(state.fixtureMatches[lookIdx])){
      myEventsSeen++;
      lastEventDate = state.fixtureMatches[lookIdx].date;
    }
    lookIdx++;
  }
  const minSpanDays = Math.round((lastEventDate - startDate) / 86400000) + 1;
  const totalDays = Math.max(daysAhead, Math.min(minSpanDays, 60));

  const days = [];
  for(let i = 0; i < totalDays; i++){
    const d = new Date(startDate);
    d.setDate(d.getDate() + i);
    const matchesToday = state.fixtureMatches.filter(m=>{
      const md = m.date;
      return md.getFullYear()===d.getFullYear() && md.getMonth()===d.getMonth() && md.getDate()===d.getDate();
    });
    const myMatch = matchesToday.find(isPlayerFixtureEvent) || null;
    days.push({
      date: d,
      dateStr: d.toLocaleDateString('tr-TR'),
      dayName: dayNames[d.getDay()],
      isFirst: i === 0,
      myMatch,
      otherMatchToday: matchesToday.some(m=>!isPlayerFixtureEvent(m))
    });
  }
  return days;
}

const CAL_TYPE_LABEL = {friendly:'Hazırlık', league:'Lig', cl:'Şampiyonlar Ligi', el:'Avrupa Ligi', co:'Konferans Ligi'};
const CAL_TYPE_ICON = {friendly:'🤝', league:'⚽', cl:'🏆', el:'🥈', co:'🥉'};

function calendarMatchLine(m){
  const myId = state.playerClubId;
  const icon = CAL_TYPE_ICON[m.type] || '⚽';
  const label = CAL_TYPE_LABEL[m.type] || 'Maç';
  let oppId = null, isHome = true;
  if(m.type === 'friendly'){ oppId = m.opponent; isHome = true; }
  else if(m.type === 'league'){ oppId = m.home===myId ? m.away : m.home; isHome = m.home===myId; }
  else { oppId = m.home===myId ? m.away : (m.away===myId ? m.home : null); isHome = m.home===myId; }
  const opp = oppId!=null ? state.clubs[oppId] : null;
  const played = m._played;
  let resultHtml = "";
  if(played && typeof m.gh === 'number' && typeof m.ga === 'number'){
    const myGoals = isHome ? m.gh : m.ga;
    const oppGoals = isHome ? m.ga : m.gh;
    const color = myGoals>oppGoals ? 'var(--green-pos)' : (myGoals<oppGoals ? 'var(--red-neg)' : 'var(--ink-dim)');
    resultHtml = `<span class="mono" style="color:${color};font-weight:700;">${m.gh}-${m.ga}</span>`;
  } else if(played){
    resultHtml = `<span class="mono" style="color:var(--ink-dim);">Oynandı</span>`;
  }
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span>${icon}</span>
    <span style="color:var(--gold);font-weight:600;font-size:12.5px;">${label}</span>
    ${opp ? `<span style="font-size:13px;">${isHome?'İÇ SAHA':'DEPLASMAN'} vs <strong>${opp.name}</strong></span>` : `<span style="font-size:13px;">Kupa maçı</span>`}
    ${resultHtml}
  </div>`;
}

function renderCalendar(){
  if(!state.seasonInProgress || !state.fixtureMatches || !state.fixtureMatches.length){
    return `<div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Takvim</h2></div>
      <div class="empty" style="padding:30px;text-align:center;">Sezon henüz başlamadı — takvim, sezon başladığında burada görünecek.</div>

  }
  const emptyNow = lineupHasEmptySlot(state.playerClubId);
  const days = buildCalendarDays(21);

    const bg = isToday ? 'background:rgba(255,215,0,0.06);' : 'background:rgba(31,42,61,0.35);';
    return `<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;${border}${bg}margin-bottom:6px;">
      <div style="min-width:78px;text-align:center;">
        <div style="font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;">${day.dayName}</div>
        <div class="mono" style="font-size:14px;font-weight:700;color:${isToday?'var(--gold)':'var(--ink)'};">${day.dateStr}</div>
      </div>
      <div style="flex:1;min-width:180px;">
        ${day.myMatch
          ? calendarMatchLine(day.myMatch)
          : (day.otherMatchToday
              ? `<span style="color:var(--ink-faint);font-size:12.5px;">Boş gün · ligde başka maçlar oynanıyor</span>`

      </div>
      ${isToday ? `<span class="strength-pill" style="color:var(--gold);border-color:var(--gold);">BUGÜN</span>` : ''}
    </div>`;
  }).join("");

  return `<div class="panel">
    <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <h2><span class="kickoff-dot"></span>Takvim</h2>
      <button class="btn" style="background:var(--gold);color:#1B1305;border:none;" ${emptyNow?'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="playNextRound()">⏩ Devam Et — Maç Gününe Kadar</button>
    </div>
    ${emptyNow ? `<div class="banner" style="color:var(--red-neg);border-color:var(--red-neg);">Kadro düzeninizde boş pozisyon var — devam etmeden önce 11'inizi doldurun.</div>` : ''}
    <p style="color:var(--ink-dim);font-size:12.5px;margin:-4px 0 14px;">"Devam Et" boş günleri otomatik atlar ve sizi doğrudan bir sonraki maç gününüze getirir — diğer kulüplerin maçları arka planda oynanır.</p>

  </div>`;
}

// Lig puan tablosunu tek bir maç sonucuna göre günceller (hem bizim
// maçlarımız hem de bizim ligimizdeki diğer kulüplerin maçları için ortak).
function applyLeagueTableUpdate(h, a, gh, ga){
  const table = state.currentTable;
  if(!table[h]) table[h] = {id:h, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0};
  if(!table[a]) table[a] = {id:a, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0};

  table[h].P++; table[a].P++;
  table[h].GF += gh; table[h].GA += ga;
  table[a].GF += ga; table[a].GA += gh;

  if(gh > ga){
    table[h].W++; table[h].Pts += 3;
    table[a].L++;
  } else if(gh < ga){
    table[a].W++; table[a].Pts += 3;
    table[h].L++;
  } else {
    table[h].D++; table[h].Pts += 1;
    table[a].D++; table[a].Pts += 1;
  }
}
// Bizim ligimizdeki, bizim katılmadığımız bir maçı arka planda (tek tıkla
// beklemeden) simüle eder; sonucu tabloya işler. "Maç Geçmişi" listesine
// eklenmez — orası sadece bizim kendi maçlarımızı gösterir. Maç günü
// ekranında (o haftanın sonuçları için) gösterilebilsin diye özet bir
// nesne döndürür.
function simulateOtherLeagueMatch(match){
  const {gh, ga} = simulateMatch(match.home, match.away);
  applyLeagueTableUpdate(match.home, match.away, gh, ga);
  const homeName = state.clubs[match.home].name;
  const awayName = state.clubs[match.away].name;
  return { home: homeName, away: awayName, gh, ga, homeId: match.home, awayId: match.away };
}

function playNextRound(){
  if(!state.seasonInProgress) return;
  if(lineupHasEmptySlot(state.playerClubId)){
    showToast("Kadro düzeninizde boş pozisyon var — maç oynatmadan önce 11'inizi eksiksiz doldurun.");
    activeTab = "lineup";
    render();
    return;
  }

  // Daha önce (bir turun geri kalan maçları olarak) erkenden oynatılmış
  // girdileri atla — bunlar zaten sonuçlanmış, tekrar oynatılmamalı.
  while(state.fixtureMatchIdx < state.fixtureMatches.length && state.fixtureMatches[state.fixtureMatchIdx]._played){
    state.fixtureMatchIdx++;
  }

  // YENİ: Günlük sistem
  if(!state.fixtureMatches || state.fixtureMatchIdx >= state.fixtureMatches.length){
    finishSeason();
    render();
    return;
  }

  // Sıradaki bizim etkinliğimize (maç/hazırlık/kupa) gelene kadar, aynı
  // ligdeki diğer kulüplerin maçlarını arka planda otomatik oynat. Bu
  // maçlar -eğer az sonra oynayacağımız kendi maçımızla aynı haftaya
  // (tura) aitse- maç günü ekranında da gösterilecek diye ayrıca tutuluyor.
  const preRoundOthers = [];
  while(state.fixtureMatchIdx < state.fixtureMatches.length){
    const upcoming = state.fixtureMatches[state.fixtureMatchIdx];
    if(upcoming.type === 'league' && !isPlayerFixtureEvent(upcoming)){
      const res = simulateOtherLeagueMatch(upcoming);
      upcoming._played = true;
      if(res) preRoundOthers.push(res);
      state.fixtureMatchIdx++;
      continue;
    }
    break;
  }

  if(state.fixtureMatchIdx >= state.fixtureMatches.length){
    finishSeason();
    render();
    return;
  }

  const match = state.fixtureMatches[state.fixtureMatchIdx];

  if(match.type === 'friendly'){
    playFriendlyMatch(match);
    match._played = true;
    state.fixtureMatchIdx++;
  } else if(match.type === 'league'){
    playLeagueMatch(match);
    match._played = true;
    state.fixtureMatchIdx++;

    // O haftanın (turun) geri kalan tüm lig maçlarını da hemen oynat ve
    // maç günü ekranına ekle — kullanıcı kendi ligindeki o haftanın tüm
    // sonuçlarını tek seferde görsün. CL/EL maçlarına dokunmuyoruz, onlar
    // kendi sırasında oynanır; farklı bir tura veya bir dostluk maçına
    // gelindiğinde tarama durur.
    const myRound = match.round;
    let idx = state.fixtureMatchIdx;
    const roundSummaries = preRoundOthers.slice();
    while(idx < state.fixtureMatches.length){
      const nxt = state.fixtureMatches[idx];
      if(nxt._played){ idx++; continue; }
      if(nxt.type === 'league' && nxt.round === myRound){
        const res = simulateOtherLeagueMatch(nxt);
        nxt._played = true;
        if(res) roundSummaries.push(res);
        idx++;
        continue;
      }
      if(nxt.type === 'league' && nxt.round !== myRound) break;
      if(nxt.type === 'friendly') break;
      idx++; // cl/el gibi diğer etkinlikler — atlamadan sadece geç, dokunma
    }
    if(roundSummaries.length && state.matchDayModal){
      state.matchDayModal = state.matchDayModal.concat(roundSummaries);
    }
  } else if(match.type === 'cl'){
    playCLMatch(match);
    match._played = true;
    state.fixtureMatchIdx++;
  } else if(match.type === 'el'){
    playELMatch(match);
    match._played = true;
    state.fixtureMatchIdx++;
  } else if(match.type === 'co'){
    playCOMatch(match);
    match._played = true;
    state.fixtureMatchIdx++;
  }

  processIncomingOffersDay(); // Gün bazlı yerine hafta bazlı
  processScoutMissionsDay();

  if(state.fixtureMatchIdx >= state.fixtureMatches.length){
    finishSeason();
  }

  // Kendi maçımız gerçek gol/asist verisiyle oynandıysa, sonucu göstermeden
  // önce kısa bir "canlı maç" animasyonu başlat — sonuç zaten yukarıda
  // hesaplanmış durumda, bu sadece o sonucu dakika dakika sahneye koyuyor.
  const myMatchEntry = Array.isArray(state.matchDayModal) ? state.matchDayModal.find(m =>
    (m.homeId === state.playerClubId || m.awayId === state.playerClubId) &&
    (Array.isArray(m.homeEvents) || Array.isArray(m.awayEvents))
  ) : null;
  if(myMatchEntry){
    liveMatchAnim = buildLiveMatchAnim(myMatchEntry);
  }

  render();

  if(liveMatchAnim){
    startLiveMatchTicker();
  }
}

function playFriendlyMatch(match){
  const myId = state.playerClubId;
  const oppId = match.opponent;
  const {gh,ga} = simulateMatch(myId, oppId);
  match.gh = gh; match.ga = ga; // takvim ekranında geçmiş sonucu göstermek için
  state.lastMatches.push({home:state.clubs[myId].name, away:state.clubs[oppId].name, gh, ga, friendly:true, homeId:myId, awayId:oppId});

  const xiIds = lineupEffectiveXIIds(myId);
  const mySlots = lineupEffectiveXISlots(myId);
  const mySlotMap = {};
  mySlots.forEach(s=>{ mySlotMap[s.id] = s.slotCode; });
  const oppXIIds = aiEffectiveXIIds(oppId);
  const homeEvents = generateTeamGoalEvents(xiIds, gh);
  const awayEvents = generateTeamGoalEvents(oppXIIds, ga);

  state.matchDayModal = [{
    home: state.clubs[myId].name,
    away: state.clubs[oppId].name,
    gh, ga,
    homeId: myId,
    awayId: oppId,
    homeXI: xiIds, awayXI: oppXIIds,
    homeEvents, awayEvents,
    homeSlotMap: mySlotMap,
    date: match.dateStr,
    dayName: match.dayName,
    matchKind: 'friendly',
    _fixtureRef: match
  }];

  decrementSuspensions(myId);
  decrementInjuries(myId);
  xiIds.forEach(pid => {
    if(Math.random()*100 < effectiveInjuryRisk(state.playerClubId)*0.5) injurePlayer(pid);
  });
}

function playLeagueMatch(match){
  const [h, a] = [match.home, match.away];
  const {gh, ga} = simulateMatch(h, a);
  match.gh = gh; match.ga = ga; // takvim ekranında geçmiş sonucu göstermek için
  
  const myId = state.playerClubId;
  const isMyMatch = h === myId || a === myId;
  
  const homeName = state.clubs[h].name;
  const awayName = state.clubs[a].name;
  state.lastMatches.push({home:homeName, away:awayName, gh, ga, homeId:h, awayId:a});
  
  if(isMyMatch){
    const xiIds = lineupEffectiveXIIds(myId);
    const mySlots = lineupEffectiveXISlots(myId);
    const mySlotMap = {};
    mySlots.forEach(s=>{ mySlotMap[s.id] = s.slotCode; });
    
    const oppId = h === myId ? a : h;
    const isHome = h === myId;
    const oppXIIds = aiEffectiveXIIds(oppId);
    
    // Stadyum tesisi seviyesi, ev sahibi olunan her lig maçında ekstra
    // maç günü geliri (bilet/konsesyon) sağlar. Taraftar desteği (fanApproval)
    // doluluk oranını belirler: destek yüksekse tribünler dolar ve gelir
    // stadyum seviyesinin izin verdiği maksimuma yaklaşır.
    if(isHome){
      const myClub = state.clubs[myId];
      ensureFacilities(myClub);
      const stadiumLvl = myClub.facilities.stadium||0;
      if(stadiumLvl>0){
        ensureManagerProfile();
        const attendanceRate = stadiumAttendanceRate(state.fanApproval);
        const stadiumIncome = Math.round((stadiumLvl*150000) * attendanceRate * (0.9+Math.random()*0.2));
        myClub.budget += stadiumIncome;
        state.lastStadiumIncome = stadiumIncome;
        state.lastStadiumAttendanceRate = attendanceRate;
      }
    }
    
    const homeEvents = generateTeamGoalEvents(isHome ? xiIds : oppXIIds, isHome ? gh : ga);
    const awayEvents = generateTeamGoalEvents(isHome ? oppXIIds : xiIds, isHome ? ga : gh);
    
    state.matchDayModal = [{
      home: homeName,
      away: awayName,
      gh, ga,
      homeId: h,
      awayId: a,
      homeXI: isHome ? xiIds : oppXIIds,
      awayXI: isHome ? oppXIIds : xiIds,
      homeEvents: isHome ? homeEvents : awayEvents,
      awayEvents: isHome ? awayEvents : homeEvents,
      homeSlotMap: isHome ? mySlotMap : {},
      date: match.dateStr,
      dayName: match.dayName,
      matchKind: 'league',
      round: match.round,
      _fixtureRef: match
    }];
    
    decrementSuspensions(myId);
    decrementInjuries(myId);
    xiIds.forEach(pid => {
      const p = state.players[pid];
      if(p && Math.random()*100 < effectiveInjuryRisk(state.playerClubId)) injurePlayer(pid);
      if(p && Math.random()*100 < YELLOW_CARD_CHANCE) {
        p.yellowCards = (p.yellowCards || 0) + 1;
        if(p.yellowCards >= 2) { p.yellowCards = 0; p.suspensionMatches = 1; }
      }
      if(p && Math.random()*100 < RED_CARD_CHANCE){
        p.suspensionMatches = 3;
        p.yellowCards = 0;
      }
    });
    
    // ---- Galibiyet/mağlubiyet serisi takibi: basın toplantısında "üst üste
    // kaç maçtır kazanıyor/kaybediyorsunuz" tarzı özel sorular için kullanılır.
    const myMatchGoals = isHome ? gh : ga;
    const oppMatchGoals = isHome ? ga : gh;
    if(myMatchGoals > oppMatchGoals){ state.winStreak = (state.winStreak||0)+1; state.loseStreak = 0; }
    else if(myMatchGoals < oppMatchGoals){ state.loseStreak = (state.loseStreak||0)+1; state.winStreak = 0; }
    else { state.winStreak = 0; state.loseStreak = 0; }
    
    updatePlayerStatsWithEvents(myId, xiIds, ga, 'league', homeEvents.concat(awayEvents));
  }
  
  // Tablo güncelle (ortak yardımcı fonksiyon — arka planda oynanan diğer
  // kulüp maçlarıyla aynı mantığı kullanır)
  applyLeagueTableUpdate(h, a, gh, ga);
}

// ---- Sezon sonu TD (teknik direktör) teklifleri ----
// Kulübünüzün o sezonki lig sırasına göre bir "başarı oranı" hesaplanır
// (1 = şampiyon, 0 = son sıra). Bu orana göre bir ihtimalle, sizden daha
// prestijli kulüplerden 3 tanesi sizi kendi başlarına TD olarak getirmek
// ister. Başarı düşük olsa bile küçük bir ihtimal her zaman kalır —
// "kötü gidişata rağmen daha iyi bir takımın seni istemesi" senaryosu.
// Şampiyonluk/yükselme sezonlarında da (hatta daha yüksek ihtimalle) gelebilir;
// render() bu durumda teklif ekranını kutlama ekranının önünde gösterir.
function maybeGenerateJobOffers(standings, opts){
  opts = opts || {};
  const midSeason = !!opts.midSeason;
  const fired = !!opts.fired;
  state.jobOfferModal = null;
  if(!state.playerClubId) return;
  const myClub = state.clubs[state.playerClubId];
  if(!myClub) return;

  const total = standings.length;
  const posIdx = standings.findIndex(r=>r.id===state.playerClubId);
  if(posIdx===-1 || total<2) return;
  const successRatio = clamp(1 - posIdx/(total-1), 0, 1); // 1 = birinci, 0 = son sıra

  // Kovulduysanız teklif gelme ihtimali rastgeleliğe bağlı değildir —
  // yeni bir kulüp bulmanız garanti edilir (aksi halde takımsız kalırdınız).
  if(!fired){
    const baseChance = midSeason ? 0.07 : 0.10; // sezon ortasında biraz daha nadir
    const triggerChance = baseChance + successRatio*0.20;
    if(Math.random() >= triggerChance) return;
  }

  // ---- Kış penceresi tekliflerinde, oyun motoru sezon içi maçları sadece
  // kendi liginizdeki kulüpler için maç maç takip ettiği (diğer ligler sezon
  // başında toplu simüle edildiği) için, sezon ortasında gerçekten "kaldığınız
  // yerden devam" edebilmeniz adına aday kulüpler yalnızca KENDİ LİGİNİZDEN
  // seçilir. Sezon sonu tekliflerinde bu kısıtlama yok, her ülkeden/ligden gelebilir.
  // Kovulduysanız prestij şartı gevşetilir — daha küçük bir kulüpte de olsa
  // mutlaka bir teklif bulmanız gerekir.
  const prestigeGap = fired ? -1000 : 5;
  let candidates = Object.values(state.clubs).filter(c=>
    c.id !== state.playerClubId &&
    c.prestige > myClub.prestige + prestigeGap &&
    (!midSeason || c.leagueKey === myClub.leagueKey)
  );
  const minNeeded = fired ? 1 : 3;
  if(candidates.length < minNeeded) return;

  const pool = candidates.slice();
  const picked = [];
  const idealGap = 20 + successRatio*140; // başarı yüksekse çok daha büyük kulüpler de ilgi gösterebilir
  const wantCount = fired ? Math.min(3, pool.length) : 3;
  for(let i=0;i<wantCount && pool.length;i++){
    const choice = pickWeighted(pool, c=>{
      const gap = c.prestige - myClub.prestige;
      const distance = Math.abs(gap - idealGap);
      return Math.max(1, 220 - distance) + Math.random()*15;
    });
    if(!choice) break;
    picked.push(choice);
    pool.splice(pool.indexOf(choice), 1);
  }
  if(picked.length < minNeeded) return;

  let reason;
  if(fired){
    reason = state.fireReason ? `${state.fireReason} Yeni bir kulüp bulmanız gerekiyor —` : `${myClub.name} ile yollarınız ayrıldı — yeni bir kulüp bulmanız gerekiyor.`;
  } else if(midSeason){
    if(successRatio >= 0.65){
      reason = `${seasonLabel(state.year)} sezonunda ${myClub.countryName} ${myClub.tierName}'de ${posIdx+1}. sıradasınız — kış transfer penceresinde adınız konuşuluyor.`;
    } else if(successRatio >= 0.35){
      reason = `${seasonLabel(state.year)} sezonu ortasında iniş çıkışlı bir tabloya rağmen bazı kulüplerin radarına girdiniz.`;
    } else {
      reason = `${seasonLabel(state.year)} sezonu sizin için zor geçiyor — yine de kış penceresinde bazı kulüpler sizi bir şans olarak görüyor.`;
    }
  } else if(successRatio >= 0.65){
    reason = `${seasonLabel(state.year)} sezonunu ${myClub.countryName} ${myClub.tierName}'de ${posIdx+1}. sırada tamamladınız — performansınız transfer piyasasında konuşuluyor.`;
  } else if(successRatio >= 0.35){
    reason = `${seasonLabel(state.year)} sezonu ${myClub.name} için iniş çıkışlı geçti, yine de bazı kulüplerin gözünden kaçmadınız.`;
  } else {
    reason = `${seasonLabel(state.year)} sezonu ${myClub.name} için zor geçti — buna rağmen bazı kulüpler sizi bir şans olarak görüyor.`;
  }

  state.jobOfferModal = {
    fromClubName: myClub.name,
    reason,
    midSeason,
    fired,
    offers: picked.map(c=>({
      clubId: c.id, clubName: c.name, countryName: c.countryName, leagueName: c.tierName, country: c.country
    }))
  };
}

function acceptJobOffer(clubId){
  const offer = state.jobOfferModal;
  if(!offer) return;
  const target = offer.offers.find(o=>o.clubId===clubId);
  if(!target) return;
  const club = state.clubs[clubId];
  if(!club) return;

  if(offer.midSeason){
    if(!confirm(`${club.name} kulübüne teknik direktör olarak geçmek istediğinize emin misiniz? ${offer.fromClubName} kulübündeki göreviniz hemen sona erecek ve sezona ${club.name} ile kaldığınız yerden devam edeceksiniz.`)) return;
    state.playerClubId = clubId;
    activeTab = "dashboard";
    tableCountry = club.country;
    tableTierIdx = club.tierIdx;
    assignInitialContracts(club);
    autoFillLineup(clubId, {silent:true});
    state.managerContract = newManagerContractFor(club);

    // göre kurulmuştu; kulüp değişince tutarsız kalacağından bu sezon için iptal
    // edilir (henüz oynanmamış olanlar). Zaten oynanmış maçlar/sonuçlar dokunulmadan kalır.
    if(state.fixtureMatches){
      const processed = state.fixtureMatches.slice(0, state.fixtureMatchIdx);
      const remaining = state.fixtureMatches.slice(state.fixtureMatchIdx).filter(m=> m.type!=='cl' && m.type!=='el' && m.type!=='co');
      state.fixtureMatches = processed.concat(remaining);
    }
    state.jobOfferModal = null;
    showToast(`${club.name} kulübüne teknik direktör olarak başladınız — sezona kaldığınız yerden devam ediyorsunuz!`);
    render();
    saveGame(false);
    return;
  }

  if(!offer.fired && !confirm(`${club.name} kulübüne teknik direktör olarak geçmek istediğinize emin misiniz? ${offer.fromClubName} kulübündeki göreviniz sona erecek.`)) return;
  state.playerClubId = clubId;
  activeTab = "dashboard";
  tableCountry = club.country;
  tableTierIdx = club.tierIdx;
  assignInitialContracts(club);
  autoFillLineup(clubId, {silent:true});
  state.managerContract = newManagerContractFor(club);
  state.jobOfferModal = null;
  if(offer.fired){
    state.firedByClub = false;
    state.fireReason = null;
    unlockAchievement('geri_donus');
  }
  showToast(`${club.name} kulübüne teknik direktör olarak başladınız!`);
  render();
  saveGame(false);
}

function finishSeason(){
  const club = state.clubs[state.playerClubId];
  const myLeagueKey = club.leagueKey;
  const standings = Object.values(state.currentTable).sort((a,b)=> (b.Pts-a.Pts) || ((b.GF-b.GA)-(a.GF-a.GA)) || (b.GF-a.GF));
  state.standingsByLeague[myLeagueKey] = standings;
  applyLeagueIncome(myLeagueKey, standings);

  // ---- Kiralıklar: süresi biten kiralık oyuncular sahibi kulübe döner.
  processLoanReturns();

  // ---- Yönetim kurulu değerlendirmesi: sezon başında belirlenen beklentiyle
  // gerçek bitiş sırası karşılaştırılır, menajer itibarı ve taraftar desteği
  // buna göre güncellenir.
  const myFinishPos = standings.findIndex(r=>r.id===state.playerClubId) + 1;
  evaluateBoardExpectation(myFinishPos, standings.length);
  
  // ---- KOVULMA SİSTEMİ: Son sıralarda bitirirsek kovulabiliriz
  if(standings.length > 0){
    const bottomThreshold = Math.ceil(standings.length / 3); // Alt üçte
    if(myFinishPos > standings.length - 2){ // Sondan 2. ve 3. sıra
      const firingChance = myFinishPos === standings.length ? 85 : 60; // Tam last = %85 kovulma
      if(Math.random() * 100 < firingChance){
        state.firedByClub = true;
        state.fireReason = myFinishPos === standings.length 
          ? `Son sırada bitirdiniz — yönetim kurulu sizi mühendislikten ayırdı.`
          : `${myFinishPos}. sırada bitirdiniz — yönetim kurulu sizi görevden aldı.`;
      }
    }
  }

  // ---- Şampiyonluk bonusu: kendi liginizde 1. sırada bitirdiyseniz, normal
  // lig gelirinin üzerine ek bir şampiyonluk primi eklenir ve ekranın
  // ortasında bir bildirim gösterilir. Prim ülke gücüne ve kademeye göre ölçeklenir.
  state.championModal = null;
  if(standings.length && standings[0].id === state.playerClubId){
    const country = countryByCode(club.country);
    const factor = country ? country.strength : 0.5;
    const tierFactor = club.tierIdx === 0 ? 1 : 0.4;
    const bonus = Math.round(randInt(12,22) * factor * tierFactor) * 1000000;
    state.clubs[state.playerClubId].budget += bonus;
    state.championModal = {
      clubName: club.name,
      leagueName: club.tierName,
      countryName: club.countryName,
      amount: bonus
    };
    addPlayerTrophy({type:'league', icon:'🏆', title: club.tierName+" Şampiyonu", subtitle: club.countryName});
    adjustSquadMorale(state.playerClubId, 15); // takımın şampiyon olması
  }

  // ---- Sezon Ödülleri: Ballondor (Yılın Oyuncusu, Altın Ayakkabı, Altın Eldiven)
  showBallondorAwards();

  // ---- Sponsorluk gelirleri: aktif anlaşmaların yıllık geliri bütçeye
  // eklenir; sözleşme süresi biterse yuva tekrar boşa düşer ve dashboard'da
  // tek seferlik bir bildirim gösterilir.
  state.lastSponsorNote = null;
  ensureSponsors(club);
  Object.keys(SPONSOR_CATEGORIES).forEach(catKey=>{
    const deal = club.sponsors[catKey];
    if(!deal) return;
    club.budget += deal.annualIncome;
    deal.yearsLeft--;
    if(deal.yearsLeft <= 0){
      const label = SPONSOR_CATEGORIES[catKey].label;
      state.lastSponsorNote = (state.lastSponsorNote ? state.lastSponsorNote + " " : "") + `${label} anlaşmanız (${deal.name}) sona erdi.`;
      club.sponsors[catKey] = null;
    }
  });

  state.seasonInProgress = false;
  state.fixtureRounds = [];
  state.fixtureRoundIdx = 0;

  state.lastWageNote = null;
  Object.values(state.clubs).forEach(c=>{
    let bill = clubWageBill(c.id);
    if(c.id === state.playerClubId && state.managerContract) bill += state.managerContract.wage;
    if(c.id === state.playerClubId && bill > c.budget){
      state.lastWageNote = `Maaş bordronuz (${fmtMoney(bill)}) bütçenizi aştı — bütçeniz 0'a sabitlendi.`;
    }
    c.budget = Math.max(0, c.budget - bill);
  });

  // ---- Teknik direktörlük sözleşmesi: her sezon sonunda 1 yıl düşülür;
  // süresi biten sözleşme otomatik olarak yeni bir süre ve maaşla yenilenir.
  state.lastManagerContractNote = null;
  if(state.managerContract){
    state.managerContract.yearsLeft--;
    if(state.managerContract.yearsLeft <= 0){
      const newYears = randInt(1,3);
      state.managerContract.years = newYears;
      state.managerContract.yearsLeft = newYears;
      state.lastManagerContractNote = `Teknik direktörlük sözleşmeniz sona erdi — ${newYears} yıllığına, ${fmtMoney(state.managerContract.wage)}/yıl maaşla yenilendi.`;
    }
  }

  state.lastTierNote = null;
  state.promotionModal = null;
  COUNTRIES.forEach(country=>{
    if(country.tiers.length < 2) return;
    const levels = tiersByLevel(country);
    if(levels.length < 2) return;

    for(let li=0; li<levels.length-1; li++){
      const topGroup = levels[li].group;   // [{tier, idx}, ...] — üst kademedeki tier(ler)
      const botGroup = levels[li+1].group; // alt kademedeki tier(ler) — TFF 2. Lig gibi paralel A/B grupları burada birden fazla olabilir

      // ---- Standart durum: üst ve alt kademede tek tier var (çoğu ülke böyle) — eski davranış aynen korunur.
      if(topGroup.length === 1 && botGroup.length === 1){
        const t = topGroup[0].idx, b = botGroup[0].idx;
        const topKey = country.code+"-"+t;
        const botKey = country.code+"-"+b;
        const topStand = state.standingsByLeague[topKey];
        const botStand = state.standingsByLeague[botKey];
        if(!topStand || !botStand) continue;
        const relegated = topStand.slice(-3).map(r=>r.id);
        const topTier = topGroup[0].tier, botTier = botGroup[0].tier;

        // ---- Play-off: otomatik yükselen ilk 2 sıranın ardından, 3.-6.
        // sıradaki 4 takım son yükselme kontenjanı için play-off oynar
        // (yeterli takım varsa). Az takımlı liglerde eski usul (ilk 3 otomatik) korunur.
        let promoted = [];
        let playoffRun = null;
        if(botStand.length >= 6){
          promoted = botStand.slice(0,2).map(r=>r.id);
          const contenders = botStand.slice(2,6).map(r=>r.id);
          playoffRun = runPromotionPlayoff(contenders);
          promoted.push(playoffRun.winnerId);
          state.playoffResultsByLeague[botKey] = playoffRun;
        } else {
          promoted = botStand.slice(0,3).map(r=>r.id);
        }

        relegated.forEach(id=>{ const c=state.clubs[id]; if(c){ c.tierIdx=b; c.tierName=botTier.name; c.leagueKey=botKey; } });
        promoted.forEach(id=>{
          const c=state.clubs[id];
          if(!c) return;
          c.tierIdx=t; c.tierName=topTier.name; c.leagueKey=topKey;
          const bonus = promotionBonusAmount(country, t);
          c.budget += bonus;
          if(id === state.playerClubId){
            const viaPlayoff = !!(playoffRun && playoffRun.winnerId === id);
            state.promotionModal = { clubName: c.name, leagueName: topTier.name, countryName: country.name, amount: bonus, viaPlayoff };
            addPlayerTrophy({type:'promotion', icon:'⬆️', title:"Yükseldi: "+topTier.name, subtitle: country.name});
          }
        });

        // ---- Kulübünüz play-off'a katılıp finali kaybettiyse (yükselemediyse),
        // sonuç ekranını (bracket) ayrı bir bildirimle gösteriyoruz.
        if(playoffRun && playoffRun.contenders.includes(state.playerClubId) && playoffRun.winnerId !== state.playerClubId){
          state.playoffModal = {
            countryName: country.name, leagueName: botTier.name,
            semis: playoffRun.semis, final: playoffRun.final,
            winnerId: playoffRun.winnerId, won: false
          };
        }
        if(state.playerClubId){
          if(relegated.includes(state.playerClubId)){
            state.lastTierNote = `Kulübünüz ${botTier.name}'e (${country.name}) küme düştü.`;
            adjustSquadMorale(state.playerClubId, -15); // kulübün küme düşmesi
          }
          if(promoted.includes(state.playerClubId)) state.lastTierNote = `Tebrikler! Kulübünüz ${topTier.name}'e (${country.name}) yükseldi.`;
        }
        continue;
      }

      // ---- Paralel grup durumu: alt kademede TFF 2. Lig A/B gibi birden
      // fazla eş-seviye tier var. Üst tier tek olmalı (yükselme hedefi net olsun).
      if(topGroup.length === 1 && botGroup.length > 1){
        const t = topGroup[0].idx;
        const topKey = country.code+"-"+t;
        const topTier = topGroup[0].tier;
        const topStand = state.standingsByLeague[topKey];
        const botStandsOk = botGroup.every(g=>state.standingsByLeague[country.code+"-"+g.idx]);
        if(!topStand || !botStandsOk) continue;

        // Üst ligden düşen 3 takım, alt gruplar arasında sırayla (dönüşümlü) paylaştırılır.
        const relegated = topStand.slice(-3).map(r=>r.id);
        relegated.forEach((id,i)=>{
          const target = botGroup[i % botGroup.length];
          const c = state.clubs[id];
          if(c){ c.tierIdx=target.idx; c.tierName=target.tier.name; c.leagueKey=country.code+"-"+target.idx; }
        });

        // Her grubun şampiyonu doğrudan yükselir; kalan kontenjan(lar) için
        // her iki grubun 2. ve 3. sıradaki takımları arasında play-off oynanır.
        const botStandsByGroup = botGroup.map(g=>({ g, stand: state.standingsByLeague[country.code+"-"+g.idx] }));
        const champions = botStandsByGroup.filter(x=>x.stand.length).map(x=>x.stand[0].id);
        const runnerPool = [];
        botStandsByGroup.forEach(x=>{
          if(x.stand[1]) runnerPool.push(x.stand[1].id);
          if(x.stand[2]) runnerPool.push(x.stand[2].id);
        });
        let playoffRun = null;
        let lastSpot = null;
        if(runnerPool.length >= 4){
          const contenders = runnerPool.slice(0,4);
          playoffRun = runPromotionPlayoff(contenders);
          lastSpot = playoffRun.winnerId;
          state.playoffResultsByLeague[country.code+"-"+botGroup[0].idx] = playoffRun;
        } else if(runnerPool.length){
          lastSpot = runnerPool[0];
        }
