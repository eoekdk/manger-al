        const promoted = champions.concat(lastSpot ? [lastSpot] : []);

        promoted.forEach(id=>{
          const c = state.clubs[id];
          if(!c) return;
          c.tierIdx=t; c.tierName=topTier.name; c.leagueKey=topKey;
          const bonus = promotionBonusAmount(country, t);
          c.budget += bonus;
          if(id === state.playerClubId){
            const viaPlayoff = !!(playoffRun && playoffRun.winnerId === id);
            state.promotionModal = { clubName: c.name, leagueName: topTier.name, countryName: country.name, amount: bonus, viaPlayoff };
            addPlayerTrophy({type:'promotion', icon:'⬆️', title:"Yükseldi: "+topTier.name, subtitle: country.name});
          }
        });

        if(playoffRun && playoffRun.contenders.includes(state.playerClubId) && playoffRun.winnerId !== state.playerClubId){
          const myGroup = botGroup.find(g=>state.clubs[state.playerClubId] && state.clubs[state.playerClubId].tierIdx===g.idx) || botGroup[0];
          state.playoffModal = {
            countryName: country.name, leagueName: myGroup.tier.name,
            semis: playoffRun.semis, final: playoffRun.final,
            winnerId: playoffRun.winnerId, won: false
          };
        }
        if(state.playerClubId){
          const myClub = state.clubs[state.playerClubId];
          if(relegated.includes(state.playerClubId) && myClub){
            state.lastTierNote = `Kulübünüz ${myClub.tierName}'e (${country.name}) küme düştü.`;
            adjustSquadMorale(state.playerClubId, -15); // kulübün küme düşmesi
          }
          if(promoted.includes(state.playerClubId)) state.lastTierNote = `Tebrikler! Kulübünüz ${topTier.name}'e (${country.name}) yükseldi.`;
        }
      }
    }
  });

  // Aynı sezonda hem şampiyonluk hem yükselme primi kazanılmışsa (2. ligi
  // şampiyon bitirip üst lige çıkmak gibi), iki ekran üst üste binmesin diye
  // tutarları tek bir şampiyonluk bildiriminde birleştiriyoruz.
  if(state.championModal && state.promotionModal){
    state.championModal.amount += state.promotionModal.amount;
    state.championModal.promotionNote = true;
    state.promotionModal = null;
  }

  // ---- Sezon sonu TD teklifleri: kulübünüzün ligdeki bitiş sırasına göre,
  // sizden daha prestijli 1-3 kulüp sizi teknik direktör olarak görmek
  // isteyebilir. KÖVÜLDÜYSENİZ daha çok teklif gelir!
  if(state.firedByClub){
    maybeGenerateJobOffers(standings, {fired: true}); // Kovulmuşsa yeni bir kulüp bulmanız garantilenir
  } else {
    maybeGenerateJobOffers(standings);
  }

  // ---- Sezon sonu ödülleri (Yılın Oyuncusu / Genç Yeteneği / Sezonun
  // Menajeri) — istatistikler birazdan sıfırlanmadan ÖNCE hesaplanmalı.
  awardSeasonHonors(standings);

  // ---- Şampiyonlar Ligi artık sezon içinde hafta hafta oynanıyor (bkz.
  // setupChampionsLeagueSeason / playCLWeek); burada tekrar simüle edilmez.

  // ---- Sözleşme süreleri: sadece imzalanırken kontrat süresi belirlenmiş
  // oyuncular (contractYears) için her sezon sonunda 1 yıl düşülür.
  // Sözleşmesinin son yılına giren oyuncular için (contractYears 1'e düşünce)
  // interaktif "Sözleşme Son Yılı" ekranı açılır — orada moraline göre
  // oyuncunun yenilemeye ne kadar istekli olduğu görülür ve teklif sunulabilir.
  // O sezon içinde (Kadro sekmesinden ya da bu ekrandan) yenilenmezse, sözleşme
  // süresi 0'a düştüğünde oyuncu otomatik olarak serbest kalır.
  state.lastContractNote = null;
  const myClubForContracts = state.clubs[state.playerClubId];
  if(myClubForContracts){
    const expiredNames = [];
    const finalYearNames = []; // gelecek sezon sözleşmesi bitecek oyuncular — erken uyarı
    const finalYearPids = [];
    myClubForContracts.squad.slice().forEach(pid=>{
      const p = state.players[pid];
      if(!p || !p.contractYears || p.loanFromClub) return;
      p.contractYears--;
      if(p.contractYears === 1){
        adjustMorale(pid, -4);
        finalYearNames.push(p.name);
        finalYearPids.push(pid);
      } else if(p.contractYears <= 0){
        // Sözleşmesi bitti ve son yılında yenilenmedi — oyuncu otomatik serbest kalır
        myClubForContracts.squad = myClubForContracts.squad.filter(id=>id!==pid);
        removeFromLineupAssignments(pid, myClubForContracts.id);
        p.club = null;
        p.contractYears = null;
        p.contractUntil = null;
        p.contractUntilDate = null;
        p.askingPrice = 0;
        if(!state.market.includes(pid)) state.market.push(pid);
        expiredNames.push(p.name);
      }
    });
    
    if(expiredNames.length){
      state.lastContractNote = expiredNames.length===1
        ? `⚠️ ${expiredNames[0]}'in sözleşmesi sona erdi ve yenilenmediği için serbest kaldı.`
        : `⚠️ ${expiredNames.length} oyuncunun sözleşmesi sona erdi ve yenilenmediği için serbest kaldı.`;
    }
    
    if(finalYearNames.length){
      const finalYearMsg = finalYearNames.length===1
        ? `⏰ ${finalYearNames[0]} bu sezon sözleşmesinin son yılına giriyor.`
        : `⏰ ${finalYearNames.length} oyuncu bu sezon sözleşmesinin son yılına giriyor.`;
      state.lastContractNote = state.lastContractNote ? state.lastContractNote + " " + finalYearMsg : finalYearMsg;
    }
    
    // NOT: son yılına giren oyuncular için interaktif yenileme ekranı
    // kaldırıldı — kullanıcı sezon sonu bildirimini (finalYearNames mesajı
    // yukarıda) yeterli buluyor, ekstra popup istemiyor. Sözleşme yenileme
    // hâlâ kadro ekranından elle yapılabilir.
  }

  // ---- Yetenek avcısı sözleşmeleri: oyuncularla aynı mantıkla, her sezon
  // sonunda sözleşme süresinden 1 yıl düşülür. Süresi biten avcı kulüpten ayrılır.
  const myClubForScouts = state.clubs[state.playerClubId];
  if(myClubForScouts && myClubForScouts.scouts){
    const expiredScoutNames = [];
    myClubForScouts.scouts.slice().forEach(scout=>{
      scout.contractYears--;
      if(scout.contractYears <= 0){
        const tier = SCOUT_TIERS[scout.tierIdx];
        expiredScoutNames.push(tier ? tier.name : "Yetenek Avcısı");
        myClubForScouts.scouts = myClubForScouts.scouts.filter(s=>s.id!==scout.id);
      }
    });
    if(expiredScoutNames.length){
      const scoutMsg = expiredScoutNames.length===1
        ? `${expiredScoutNames[0]} Yetenek Avcısı ile sözleşmeniz sona erdi.`
        : `Şu yetenek avcılarıyla sözleşmeniz sona erdi: ${expiredScoutNames.join(", ")}.`;
      state.lastContractNote = state.lastContractNote ? state.lastContractNote + " " + scoutMsg : scoutMsg;
    }
  }

  const DECLINE_BY_AGE = {32:2,33:2,34:3,35:4,36:3,37:3,38:5,39:6,40:5};
  const elite95Candidates = [];
  const elite90Candidates = [];
  const elite85Candidates = [];
  let retireeCount = 0;
  Object.values(state.players).forEach(p=>{
    if(!p.club || p.club==="retired" || p.club==="sold") return;
    p.age++;
    // Not: sakatlık artık sezon sonunda değil, her oynanan maçtan sonra
    // decrementInjuries() ile azalıyor; burada tekrar azaltılmaz.
  p.yellowCards = 0;
    p.yellowThresholdIdx = 0;
    p.directReds = 0;
    p.secondYellowReds = 0;
    p.suspensionMatches = 0;

    if(!p.retireAge) p.retireAge = randInt(35,40);
    if(p.age >= p.retireAge){
      releasePlayer(p.id);
      retireeCount++;
      return;
    }
    if(p.customGrowth && p.customGrowth.seasonsLeft > 0 && p.rating < p.potential){
      p.rating = clamp(p.rating + p.customGrowth.perSeason, p.rating, p.potential);
      p.customGrowth.seasonsLeft--;
      recalcValue(p);
      if(p.customGrowth.seasonsLeft <= 0){ p.potential = p.rating; }
    } else if(p.customGrowth && p.customGrowth.peakLeft > 0){
      p.customGrowth.peakLeft--;
    } else if(p.age <= 29 && p.rating < p.potential && !p.customGrowth){
      const oldRating = p.rating;
      const gap = p.potential - oldRating;
      let newRating = clamp(oldRating + growthAmount(gap), oldRating, p.potential);
      if(p.age < 21) newRating = capYoungHighRating(newRating);
      if(newRating >= 95 && oldRating < 95){
        elite95Candidates.push({p, newRating});
      } else if(newRating >= 90 && oldRating < 90){
        elite90Candidates.push({p, newRating});
      } else if(newRating >= 85 && oldRating < 85){
        elite85Candidates.push({p, newRating});
      } else {
        p.rating = newRating;
        recalcValue(p);
      }
   } else if(p.age >= 32){
      const dec = DECLINE_BY_AGE[p.age] !== undefined ? DECLINE_BY_AGE[p.age] : (6 + randInt(0,3));
      let newRating = p.rating - dec;
      if(p.age >= 40) newRating = clamp(newRating, 40, 63);
      p.rating = clamp(newRating, 40, 99);
      recalcValue(p);
    }
    if(p.age > 31 && !p.customGrowth){ p.potential = p.rating; }
  });
  const allowed95 = Math.random() < 0.08 ? 1 : 0;
  elite95Candidates.sort((a,b)=> b.newRating - a.newRating);
  elite95Candidates.forEach((c, idx)=>{ c.p.rating = idx < allowed95 ? c.newRating : 94; recalcValue(c.p); });
  const allowed90 = Math.random() < 0.5 ? 1 : 0;
  elite90Candidates.sort((a,b)=> b.newRating - a.newRating);
  elite90Candidates.forEach((c, idx)=>{ c.p.rating = idx < allowed90 ? c.newRating : 89; recalcValue(c.p); });
  const allowed85 = randInt(2,5);
  elite85Candidates.sort((a,b)=> b.newRating - a.newRating);
  elite85Candidates.forEach((c, idx)=>{ c.p.rating = idx < allowed85 ? c.newRating : 84; recalcValue(c.p); });

  // ---- Başarım: kendi kadromdaki bir gizli yeteneği (wonderkid) 85+ güce
  // ulaştırmak (yukarıdaki gelişim adımları bittikten sonra kontrol edilir) ----
  (club.squad||[]).forEach(pid=>{
    const p = state.players[pid];
    if(p && p.wonderkid && p.rating >= 85) unlockAchievement('yildiz_yaratici');
  });


  // ---- 20 yaşına kadar A takıma çıkarılmayan gençlik oyuncuları akademiden
  // ayrılır. Mümkünse o pozisyonda açığı olan bir kulübe otomatik olarak
  // serbest transfer (bonservissiz) olurlar; uygun kulüp bulunamazsa serbest
  // oyuncu olarak transfer pazarına düşerler.
  const releasedYouthNames = [];
  Object.values(state.clubs).forEach(c=>{
    const stillYouth = [];
    c.youth.forEach(pid=>{
      const p = state.players[pid];
      if(!p) return;
      if(p.age >= 20){
        p.isYouth = false;
        p.contractYears = null;
        p.contractUntil = null;
        p.contractUntilDate = null;
        const targetClub = findClubWithPositionNeed(p, c.id);
        if(targetClub){
          p.club = targetClub.id;
          targetClub.squad.push(pid);
          const years = randInt(2,4);
          p.contractYears = years;
          p.contractUntil = state.year + years;
          tagContractDate(p, years);
        } else {
          p.club = null;
          if(!state.market.includes(pid)) state.market.push(pid);
        }
        if(c.id === state.playerClubId) releasedYouthNames.push({name:p.name, dest: targetClub ? targetClub.name : null});
      } else {
        stillYouth.push(pid);
      }
    });
    c.youth = stillYouth;
  });
  if(releasedYouthNames.length){
    const parts = releasedYouthNames.map(r => r.dest ? `${r.name} (${r.dest}'a serbest transfer)` : `${r.name} (serbest oyuncu)`);
    const msg = releasedYouthNames.length===1
      ? `${parts[0]} — 20 yaşına geldiği için akademiden ayrıldı.`
      : `${parts.length} genç oyuncu 20 yaşına geldiği için akademiden ayrıldı: ${parts.join(", ")}.`;
    state.lastContractNote = state.lastContractNote ? state.lastContractNote + " " + msg : msg;
  }
  trimMarketOverflow();

  Object.keys(state.lineup).forEach(clubId=>{
    const club = state.clubs[clubId];
    const squadSet = new Set(club ? club.squad : []);
    const lu = state.lineup[clubId];
    Object.keys(lu.assignments).forEach(slot=>{
      if(!squadSet.has(lu.assignments[slot])) delete lu.assignments[slot];
    });
  });

  if(state.market.length > MARKET_HARD_CAP){
    const overflow = state.market.slice(0, state.market.length-MARKET_TARGET_CAP);
    state.market = state.market.slice(state.market.length-MARKET_TARGET_CAP);
    overflow.forEach(pid=>{ delete state.players[pid]; });
  }

  Object.keys(state.clubs).forEach(id=>{
    const club = state.clubs[id];
    ensureFacilities(club);
    // Akademi seviyesi sadece oyuncunun kendi kulübünde ekstra alım (seviye
    // 2'de +1, seviye 4'te +2 genç) ve daha kaliteli genç oyuncular getirir.
    const academyLvl = id===state.playerClubId ? (club.facilities.academy||0) : 0;
    const intake = 3 + Math.floor(academyLvl/ACADEMY_LEVELS_PER_EXTRA_INTAKE);
    for(let i=0;i<intake;i++){
      const yp = generateYouthPlayer(club.country);
      if(academyLvl>0) applyAcademyBoost(yp, academyLvl);
      yp.club = id;
      yp.isYouth = true;
      club.youth.push(yp.id);
    }
    const YOUTH_CAP = 8;
    if(id !== state.playerClubId && club.youth.length > YOUTH_CAP){
      club.youth.sort((a,b)=>{
        const pa = state.players[a], pb = state.players[b];
        return (pb?pb.potential:0) - (pa?pa.potential:0);
      });
      const overflow = club.youth.slice(YOUTH_CAP);
      club.youth = club.youth.slice(0, YOUTH_CAP);
      overflow.forEach(pid=>{ delete state.players[pid]; });
    }
  });

  const allClubIds = Object.keys(state.clubs);
  const aiClubs = allClubIds.filter(id=>id!==state.playerClubId);

  // AI kulüpler önce kendi altyapısından (en güçlü oyuncudan başlayarak) A takıma çıkarır
  aiClubs.forEach(id=>{
    const club = state.clubs[id];
    const cap = club.squadSize || 27;
    if(club.squad.length >= cap) return;
    const eligible = club.youth
      .filter(pid=>{ const p = state.players[pid]; return p && p.age >= YOUTH_PROMOTE_AGE; })
      .sort((a,b)=> state.players[b].rating - state.players[a].rating);
    let needed = cap - club.squad.length;
    for(let i=0;i<eligible.length && needed>0;i++){
      const pid = eligible[i];
      club.youth = club.youth.filter(x=>x!==pid);
      club.squad.push(pid);
      state.players[pid].isYouth = false;
      needed--;
    }
  });

  // ---- Serbest pazarda halihazırda bulunan oyuncular, sezon sonunda AI
  // kulüpler tarafından pozisyon ihtiyacına göre ağırlıklı olarak imzalanır
  // (rastgele silinmek yerine gerçekten başka bir takıma transfer olurlar).
  // Her AI kulüp kendi kadro kapasitesine ulaşana ya da bütçesi yetmeyene
  // kadar pazardan oyuncu almaya devam eder.
  shuffleArray(aiClubs).forEach(id=>{
    const club = state.clubs[id];
    const cap = club.squadSize || 27;
    let guard = 0;
    while(club.squad.length < cap && state.market.length > 0 && guard < 30){
      guard++;
      const weightedItems = state.market.map(pid=>{
        const p = state.players[pid];
        if(!p) return null;
        const posCount = club.squad.filter(sid=>{ const sp=state.players[sid]; return sp && sp.pos===p.pos; }).length;
        const need = clamp(4-posCount, 0.3, 5);
        return { weight: need, pid };
      }).filter(Boolean);
      if(!weightedItems.length) break;
      const chosen = weightedPick(weightedItems);
      if(!chosen) break;
      const pid = chosen.pid;
      const p = state.players[pid];
      if(club.budget < p.value) break; // bu kulübün bütçesi bu turda yetmiyor, sıradaki kulübe geç
      club.budget -= p.value;
      club.squad.push(pid);
      p.club = id;
      state.market = state.market.filter(x=>x!==pid);
    }
  });

  // ---- Kariyer geçmişi / Menajer CV: bu sezonun bir özetini kalıcı listeye
  // ekliyoruz. Kulüp değiştirse, kovulsa da geçmiş kulüplerdeki performansı
  // burada saklanır. state.year henüz artırılmadığı için "year" biten sezonu gösterir.
  recordCareerSeason({
    year: state.year,
    club,
    standings,
    finishPos: myFinishPos,
    champion: !!state.championModal,
    promoted: !!(state.promotionModal || (state.championModal && state.championModal.promotionNote)),
    relegated: !!(state.lastTierNote && state.lastTierNote.includes("küme düştü")),
    fired: !!state.firedByClub
  });

  // ---- Başarımlar: kariyer uzunluğu ve kulüp bütçesi ----
  const seasonsPlayedSoFar = new Set((state.careerHistory||[]).map(e=>e.year)).size;
  if(seasonsPlayedSoFar >= 10) unlockAchievement('on_sezon');
  if(club.budget >= 100000000) unlockAchievement('zengin_kulup');

  // ---- Milli Takım: yaz arasında, 4 yılda bir Dünya Kupası, arada kalan
  // yıllarda ise Kıtasal Şampiyona otomatik olarak simüle edilir. ----
  state.lastInternationalNote = null;
  if(state.year % 4 === 0) runInternationalTournament("world");
  else if(state.year % 4 === 2) runInternationalTournament("continental");

  state.year++;
  state.seasonPlayed = true;
  
  // ---- YENİ SEZONA GEÇILDIĞINDE OYUNCU İSTATİSTİKLERİNİ SIFIRLA ----
  Object.values(state.players).forEach(p=>{
    if(p.stats){
      p.stats = {
        league: emptyCompStats(),
        cl: emptyCompStats(),
        el: emptyCompStats()
      };
    }
  });
  
  resetScoutAvailability();
  youthIntake(false, retireeCount);
  processIncomingOffersWeek();
}

/* ================= TRANSFER PENCERESİ ================= */
/* ---- Transfer penceresi: sezonun ilk 5 haftası (yaz penceresi) ve kulübünüzün
   18. lig maçından sonra başlayan 12 haftalık kış penceresi boyunca açıktır.
   Sezon dışında (bir sonraki sezon başlamadan önce) pencere her zaman açıktır. ---- */
function transferWindowStatus(){
  if(!state.seasonInProgress){
    return {open:true, phase:"offseason", label:"Transfer penceresi açık (sezon arası)."};
  }
  if(state.leagueMatchesPlayed < 5){
    const remaining = 5 - state.leagueMatchesPlayed;
    return {open:true, phase:"summer", label:"Yaz transfer penceresi açık — "+remaining+" hafta kaldı."};
  }
  if(state.winterWindowStartRound !== null){
    const closeRound = state.winterWindowStartRound + 2;
    if(state.leagueMatchesPlayed >= state.winterWindowStartRound && state.leagueMatchesPlayed < closeRound){
      const remaining = closeRound - state.leagueMatchesPlayed;
      return {open:true, phase:"winter", label:"Kış transfer penceresi açık — "+remaining+" hafta kaldı."};
    }
    if(state.leagueMatchesPlayed >= closeRound){
      return {open:false, phase:"closed", label:"Transfer penceresi kapalı — bu sezon için pencereler sona erdi."};
    }
  }
  const remainingMatches = Math.max(0, 18 - state.leagueMatchesPlayed);
  return {open:false, phase:"closed", label:"Transfer penceresi kapalı — 18. lig maçınızdan sonra 2 haftalık kış penceresi açılacak (kalan maç: "+remainingMatches+")."};
}

/* ---- Bir oyuncu için, kadrosunda yer olan ve o pozisyonda görece az
   oyuncusu bulunan (yani "pozisyon açığı" olan) bir kulüp bulur. Akademiden
   serbest kalan gençlerin otomatik transferinde kullanılır. ---- */
function findClubWithPositionNeed(p, excludeClubId){
  const candidates = Object.values(state.clubs).filter(c=>{
    if(c.id===excludeClubId) return false;
    if(c.id===state.playerClubId) return false; // Oyuncunun kendi kulübüne akademi oyuncusu otomatik atanmasın
    return c.squad.length < (c.squadSize||27);
  });
  if(!candidates.length) return null;
  const weightedItems = candidates.map(c=>{
    const posCount = c.squad.filter(pid=>{
      const sp = state.players[pid];
      return sp && sp.pos === p.pos;
    }).length;
    const need = clamp(4 - posCount, 0.3, 5); // az sayıda o pozisyonda oyuncusu olan kulüp daha çok ihtiyaç duyar
    const prestigeFit = 1 + clamp(c.prestige/220, 0, 1);
    return { weight: need*prestigeFit, club: c };
  });
  const chosen = weightedPick(weightedItems);
  return chosen ? chosen.club : null;
}

/* ================= AI TRANSFER TEKLİFLERİ (Kendi kadronuza gelen teklifler) ================= */
/* ---- AI kulüpler, kadronuzdaki oyuncuları rating/potansiyel/yaş/değerine göre
   değerlendirip düzenli olarak (haftalık ve sezon sonlarında) size teklif gönderir.
   Yüksek potansiyelli / genç / güçlü oyuncular daha sık ve daha büyük tekliflere
   konu olur. Teklifler birkaç hafta içinde otomatik olarak düşer. ---- */
function pickInterestedClub(p){
  const value = Math.max(p.value, 50000);
  const candidates = Object.values(state.clubs).filter(c=>{
    if(c.id===state.playerClubId) return false;
    if(c.squad.length >= (c.squadSize||25)+2) return false;
    if(c.budget < value*0.35) return false;
    return true;
  });
  if(!candidates.length) return null;
  const weightedItems = candidates.map(c=>{
    const budgetFit = clamp(c.budget/value, 0.2, 4);
    const prestigeBonus = 1 + clamp(c.prestige/150, 0, 1.6);
    return { weight: budgetFit*prestigeBonus, club: c };
  });
  const chosen = weightedPick(weightedItems);
  return chosen ? chosen.club : null;
}
function maybeGenerateIncomingOffers(){
  const club = state.clubs[state.playerClubId];
  if(!club) return;
  const MAX_PENDING = 12;
  
  // Ana kadro oyuncularına teklif
  club.squad.forEach(pid=>{
    if(state.incomingOffers.length >= MAX_PENDING) return;
    const p = state.players[pid];
    if(!p || p.injured || p.loanFromClub) return;
    if(state.incomingOffers.some(o=>o.playerId===pid)) return;
    // Güç, potansiyel ve yaşa göre ilgi ihtimali
    let chance = 3 + (p.rating-60)*0.22 + Math.max(0,p.potential-p.rating)*0.1;
    if(p.age <= 23) chance += 2.2;
    if(p.age >= 31) chance *= 0.6;
    chance = clamp(chance, 0.5, 20);
    if(Math.random()*100 >= chance) return;
    const buyer = pickInterestedClub(p);
    if(!buyer) return;
    // Değerine, potansiyeline ve yaşına göre teklif bonservisi (bazen değerinin altı, bazen üstü)
    let markup = 0.85 + Math.random()*0.55;
    if(p.potential - p.rating >= 6) markup += 0.15; // yüksek potansiyel primi
    if(p.age <= 21) markup += 0.1; // genç oyuncu primi
    let fee = Math.round((p.value*markup)/100000)*100000;
    fee = Math.max(fee, Math.round(p.value*0.5/100000)*100000);
    state.incomingOffers.push({ id: rid(), playerId: pid, clubId: buyer.id, fee, expiresIn: 3, rejections: 0 });
    addNews(`✍️ ${buyer.name}, ${p.name} için kulübünüze resmi bir teklifle geldi.`, "transfer");
  });
  
  // Gençlik oyuncularına teklif (düşük ihtimal)
  club.youth.forEach(pid=>{
    if(state.incomingOffers.length >= MAX_PENDING) return;
    const p = state.players[pid];
    if(!p) return;
    if(state.incomingOffers.some(o=>o.playerId===pid)) return;
    // Gençlik oyuncuları için çok düşük ihtimal (potansiyel çok yüksekse biraz artar)
    let chance = 1.5;
    if(p.potential >= 85) chance += 1.5;
    if(p.potential >= 90) chance += 2;
    if(Math.random()*100 >= chance) return;
    const buyer = pickInterestedClub(p);
    if(!buyer) return;
    // Gençlik oyuncuları için düşük bonservis
    let fee = Math.round((p.value*0.2)/100000)*100000;
    fee = Math.max(fee, 50000);
    state.incomingOffers.push({ id: rid(), playerId: pid, clubId: buyer.id, fee, expiresIn: 3, rejections: 0 });
    addNews(`✍️ ${buyer.name}, gençlik takımınızdaki ${p.name} için teklif sundu.`, "transfer");
  });
}
function processIncomingOffersWeek(){
  const status = transferWindowStatus();
  if(!status.open){
    if(state.incomingOffers.length) state.incomingOffers = [];
    return;
  }
  state.incomingOffers.forEach(o=>{ o.expiresIn--; });
  state.incomingOffers = state.incomingOffers.filter(o=>{
    const p = state.players[o.playerId];
    return o.expiresIn > 0 && p && p.club === state.playerClubId && state.clubs[o.clubId];
  });
  maybeGenerateIncomingOffers();
}
/* ---- Kulüpler bonservis konusunda anlaşsa bile, oyuncunun kendisi de
   alıcı kulübün sunduğu kişisel şartları (maaş) değerlendirir. Oyuncunun
   mevcut maaşına, alıcı kulübün prestijine/gücüne ve o kulübe gitmeye ne
   kadar istekli olduğuna (transferWillingness) göre bir maaş teklifi
   üretilir ve oyuncu bunu kabul ya da reddedebilir. Reddederse bonservis
   anlaşması olsa dahi transfer gerçekleşmez. ---- */
function computeBuyerWageOffer(p, buyer){
  const sellerClub = state.clubs[p.club];
  const sellerPrestige = sellerClub ? sellerClub.prestige : 0;
  const prestigeGap = (buyer.prestige||0) - sellerPrestige;
  let multiplier = 1.05 + clamp(prestigeGap/220, -0.3, 0.55) + (Math.random()*0.24 - 0.06);
  multiplier = clamp(multiplier, 0.65, 2.2);
  let wage = Math.round((Math.max(p.wage,1) * multiplier)/5000)*5000;
  wage = Math.max(wage, Math.round(p.wage*0.5/5000)*5000, 5000);
  return wage;
}
function acceptIncomingOffer(offerId){
  const offer = state.incomingOffers.find(o=>o.id===offerId);
  if(!offer) return;
  attemptPersonalTerms(offer, offer.fee);
}
/* ---- Bonservis üzerinde anlaşılan bir teklif için oyuncunun kişisel
   şartlar (maaş) görüşmesini simüle eder; kabul ederse transferi
   gerçekleştirir, reddederse teklif bir süre daha masada kalır (tekrar
   denenebilir) ama art arda ikinci reddedişte alıcı kulüp de tamamen
   vazgeçer ve teklif düşer. ---- */
function attemptPersonalTerms(offer, fee){
  const p = state.players[offer.playerId];
  const buyer = state.clubs[offer.clubId];
  if(!p || !buyer){
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    render();
    return;
  }
  const isYouth = p.isYouth;
  const wageOffer = computeBuyerWageOffer(p, buyer);
  const expectedWage = Math.round(Math.max(p.wage,1) * (isYouth ? 1.0 : 1.08));
  const wageRatio = expectedWage>0 ? wageOffer/expectedWage : 1;
  const resistance = transferWillingness(p, buyer.id);
  let acceptChance = (wageRatio - 0.55) * 120 - resistance*0.8;
  acceptChance = clamp(acceptChance, 5, 96);
  const accepted = Math.random()*100 < acceptChance;

  if(accepted){
    executeIncomingOfferSale(offer, fee, wageOffer);
    return;
  }

  offer.personalRejections = (offer.personalRejections||0) + 1;
  const pname = p.name, buyerName = buyer.name;
  if(offer.personalRejections >= 2 || resistance >= 55){
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    if(counterOfferId === offer.id) counterOfferId = null;
    showToast(pname+", "+buyerName+"'ın sunduğu şartları ("+fmtMoney(wageOffer)+"/yıl) yeterli bulmadı ve görüşmeden çekildi — transfer gerçekleşmedi.");
    render();
    return;
  }
  showToast(pname+", "+buyerName+"'ın teklif ettiği "+fmtMoney(wageOffer)+"/yıl maaşta kişisel şartlarda anlaşamadı ("+offer.personalRejections+"/2). Kulüpler bonservis konusunda anlaşsa da oyuncu ikna olmazsa transfer olmaz — tekrar deneyebilirsiniz.");
  render();
}
function executeIncomingOfferSale(offer, fee, wage){
  const p = state.players[offer.playerId];
  const buyer = state.clubs[offer.clubId];
  const myClub = state.clubs[state.playerClubId];
  
  // Gençlik oyuncusu kontrolü
  const isYouth = p && p.isYouth;
  
  if(!p || !buyer || !myClub){
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    render();
    return;
  }
  
  if(!isYouth && p.club !== state.playerClubId){
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    render();
    return;
  }
  
  if(isYouth && !myClub.youth.includes(p.id)){
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    render();
    return;
  }
  
  myClub.budget += fee;
  // ---- Başarım: oyuncuyu aldığın bedelin en az 3 katına satmak ----
  if(p.acquiredFee > 0 && fee >= p.acquiredFee * 3) unlockAchievement('karli_satis');
  
  if(isYouth){
    // Gençlik oyuncusu transferi
    myClub.youth = myClub.youth.filter(id=>id!==p.id);
    buyer.youth.push(p.id);
  } else {
    // Ana kadro oyuncusu transferi
    myClub.squad = myClub.squad.filter(id=>id!==p.id);
    const lu = state.lineup[myClub.id];
    if(lu) Object.keys(lu.assignments).forEach(k=>{ if(lu.assignments[k]===p.id) delete lu.assignments[k]; });
    buyer.squad.push(p.id);
  }
  
  p.club = buyer.id;
  if(wage){ p.wage = wage; }
  if(!isYouth && wage){
    const yrs = randInt(2,4);
    p.contractYears = yrs;
    p.contractUntil = state.year + yrs;
    tagContractDate(p, yrs);
  } else {
    p.contractYears = null;
    p.contractUntil = null;
    p.contractUntilDate = null;
  }
  p.askingPrice = 0;
  const pname = p.name, buyerName = buyer.name;
  state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
  if(counterOfferId === offer.id){ counterOfferId = null; }
  const typeLabel = isYouth ? "(Gençlik)" : "";
  const wageNote = wage ? (" · Yeni maaş: "+fmtMoney(wage)+"/yıl") : "";
  showToast(`🔄 ${pname} ${buyerName}'a satıldı: +${fmtMoney(fee)} ${typeLabel}${wageNote}`);
  render();
}
function rejectIncomingOffer(offerId){
  const offer = state.incomingOffers.find(o=>o.id===offerId);
  if(offer){
    const p = state.players[offer.playerId];
    if(p){
      p.rejectedOfferCount = (p.rejectedOfferCount||0) + 1;
      adjustMorale(p.id, -3); // sürekli transfer tekliflerinin reddedilmesi
      if(p.rejectedOfferCount >= 3) adjustMorale(p.id, -3);
    }
  }
  state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offerId);
  if(counterOfferId === offerId) counterOfferId = null;
  render();
}

/* ---- Gelen tekliflere karşı teklif (pazarlık) sistemi.
   Oyuncu için daha yüksek bir bonservis istersiniz; kulüp bunu kabul ya da
   reddedebilir. Bir kulüp aynı oyuncu için 3 kez karşı teklifinizi reddederse
   transfer görüşmesinden tamamen çekilir. ---- */
let counterOfferId = null;
let counterOfferAmount = 0;
function openCounterOffer(offerId){
  const offer = state.incomingOffers.find(o=>o.id===offerId);
  if(!offer) return;
  counterOfferId = offerId;
  counterOfferAmount = Math.round((offer.fee*1.15)/100000)*100000;
  render();
}
function setCounterOfferAmount(value){
  counterOfferAmount = Math.max(0, parseInt(value) || 0);
}
function cancelCounterOffer(){
  counterOfferId = null;
  render();
}
function submitCounterOffer(offerId){
  const offer = state.incomingOffers.find(o=>o.id===offerId);
  if(!offer) return;
  const p = state.players[offer.playerId];
  const buyer = state.clubs[offer.clubId];
  if(!p || !buyer){ counterOfferId = null; render(); return; }

  const askAmount = Math.max(counterOfferAmount, offer.fee);
  // Kulübün bu oyuncu için ödemeye razı olduğu üst sınır: mevcut teklifinin
  // biraz üzerinde, ama bütçesiyle de sınırlı.
  const buyerCeiling = Math.min(offer.fee * (1.30 + Math.random()*0.25), buyer.budget * 0.85);
  const ratio = askAmount / offer.fee;

  let acceptChance;
  if(askAmount <= offer.fee){
    acceptChance = 96;
  } else if(askAmount <= buyerCeiling){
    acceptChance = clamp(88 - (ratio-1)*70, 30, 92);
  } else {
    acceptChance = clamp(25 - (askAmount-buyerCeiling)/Math.max(buyerCeiling,1)*40, 2, 25);
  }

  const accepted = Math.random()*100 < acceptChance;

  if(accepted){
    counterOfferId = null;
    attemptPersonalTerms(offer, askAmount);
    return;
  }

  offer.rejections = (offer.rejections||0) + 1;
  if(offer.rejections >= 3){
    const pname = p.name, buyerName = buyer.name;
    state.incomingOffers = state.incomingOffers.filter(o=>o.id!==offer.id);
    counterOfferId = null;
    showToast(buyerName+", "+pname+" için ısrarlı pazarlığınız sonrası transfer görüşmesinden çekildi.");
    render();
    return;
  }
  // Kulüp biraz daha iyi bir teklifle geri döner (küçük bir artış)
  const bump = Math.round((offer.fee*(0.03+Math.random()*0.05))/100000)*100000;
  offer.fee = offer.fee + bump;
  counterOfferId = null;
  showToast(buyer.name+", "+fmtMoney(askAmount)+" teklifinizi reddetti ("+offer.rejections+"/3). Yeni teklifleri: "+fmtMoney(offer.fee)+".");
  render();
}

/* ================= TRANSFERS ================= */
function sellPlayer(pid){
  const status = transferWindowStatus();
  if(!status.open){
    showToast("Transfer penceresi kapalı — "+status.label);
    return;
  }
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  const saleValue = Math.round(p.value*0.85);
  const pname = p.name;
  myClub.budget += saleValue;

  // ---- Oyuncu tamamen silinmiyor (releasePlayer emeklilikte kullanılan bir
  // fonksiyon ve oyuncuyu oyundan tamamen kaldırıyordu) — bunun yerine
  // kulüpten ayrılıp serbest oyuncu olarak transfer pazarına düşüyor, böylece
  // istersen daha sonra tekrar transfer edebilirsin.
  myClub.squad = myClub.squad.filter(id=>id!==pid);
  const lu = state.lineup[myClub.id];
  if(lu) Object.keys(lu.assignments).forEach(k=>{ if(lu.assignments[k]===pid) delete lu.assignments[k]; });
  p.club = null;
  p.contractYears = null;
  p.contractUntil = null;
  p.contractUntilDate = null;
  p.askingPrice = 0;
  if(!state.market.includes(pid)) state.market.push(pid);
  state.incomingOffers = state.incomingOffers.filter(o=>o.playerId!==pid);

  showToast(pname+" satıldı: +"+fmtMoney(saleValue)+" (serbest oyuncu olarak transfer pazarında).");
  render();
}

/* ================= KİRALIK TRANSFER SİSTEMİ =================
   Kiralamalar her zaman 1 sezonluktur ve sezon sonunda (processLoanReturns)
   otomatik olarak sahibi kulübe geri döner. Bir oyuncu aynı anda hem
   "benim oyuncum başka yerde kiralık" hem de "başkasının oyuncusu bende
   kiralık" olamaz — p.loanFromClub alanı kimin malı olduğunu, p.club alanı
   ise şu an hangi kulüpte oynadığını tutar.

   Buna ek olarak her kiralamada iki opsiyonel şart belirlenebilir:
   - p.loanWageSharePct: sahibi kulübün maaşın yüzde kaçını üstleneceği
     (0-100). Kalan yüzdeyi kiralayan kulüp öder — bkz. clubWageBill().
   - p.loanBuyOption: {type:'optional'|'mandatory', fee, requiredApps}
     "Opsiyonel" ise kiralayan kulüp istediği an (bu bedelle) oyuncuyu
     kalıcı satın alabilir. "Zorunlu" ise oyuncu bu sezon içinde
     requiredApps kadar maça çıkarsa transfer OTOMATİK ve mecburi olarak
     gerçekleşir (bkz. bumpLoanAppearances / checkLoanMandatoryTrigger). ---- */
function setLoanPage(n){ loanPage = n; render(); }

// Kiralığa göndereceğimiz oyuncu için, o pozisyonda göreli açığı olan ve
// (genelde alt seviye) bir kulüp bulur — pickInterestedClub'a benzer ama
// bonservis yerine kiralık uygunluğuna göre ağırlıklandırır.
function pickLoanDestination(p){
  const myClub = state.clubs[state.playerClubId];
  const candidates = Object.values(state.clubs).filter(c=>{
    if(c.id === state.playerClubId) return false;
    if(c.squad.length >= (c.squadSize||25)+3) return false;
    return true;
  });
  if(!candidates.length) return null;
  const weightedItems = candidates.map(c=>{
    const posCount = c.squad.filter(pid=>{ const sp = state.players[pid]; return sp && sp.pos === p.pos; }).length;
    const need = clamp(4 - posCount, 0.3, 5);
    // Kendinden alt ya da eşit seviyedeki kulüpler kiralık oyuncu almaya daha isteklidir
    const tierFit = c.tierIdx >= myClub.tierIdx ? 1.5 : 0.55;
    return { weight: need*tierFit, club: c };
  });
  const chosen = weightedPick(weightedItems);
  return chosen ? chosen.club : null;
}

function loanFeeFor(p){
  return clamp(Math.round((p.value*0.06)/10000)*10000, 20000, 2000000);
}
function defaultLoanBuyFeeFor(p){
  return Math.max(50000, Math.round((p.value*0.9)/10000)*10000);
}
// 80+ OVR oyuncular kiralık havuzunda "tek tük" (en fazla birkaç tane) yer
// alsın diye kullanılan eşik ve üst sınır. Ayrıca bu oyuncular sadece kendi
// kulübünün muhtemel ilk 11'inde olmayan (bench/rotasyon) oyuncularsa havuza
// girebilir — bkz. renderLoans().
const LOAN_HIGH_OVR_THRESHOLD = 80;
const LOAN_HIGH_OVR_MAX_COUNT = 3;
// Dünyada onbinlerce genç oyuncu olduğu için 80 OVR altındaki kiralanabilir
// havuz da sabit ve düşük bir üst sınıra çekilir — aksi halde havuz devasa
// büyüklükte olurdu. Bkz. renderLoans().
const LOAN_NORMAL_MAX_COUNT = 60;

// Kiralık pazarlık ekranında (loanNegotiation) tutulan geçici teklif.
let loanNegotiation = null; // {pid, direction:'out'|'in', wageSharePct, buyType, buyFee, requiredApps}

function setLoanNegField(field, value){
  if(!loanNegotiation) return;
  if(field==='wageSharePct') value = clamp(parseInt(value,10)||0, 0, 100);
  if(field==='requiredApps') value = clamp(parseInt(value,10)||1, 1, 46);
  if(field==='buyFee') value = Math.max(0, parseInt(value,10)||0);
  if(field==='feeAmount') value = Math.max(0, parseInt(value,10)||0);
  loanNegotiation[field] = value;
  render();
}
function cancelLoanNegotiation(){ loanNegotiation = null; render(); }

// Kiralayan kulübün (kiralığa GÖNDERDİĞİMİZ oyuncu için AI kulüp) teklifi ne
// kadar cazip bulacağını 0-100 arası bir kabul olasılığına çevirir. Sahibi
// (biz) maaşın büyük kısmını üstlenirse ve zorunlu opsiyon dayatmazsa
// kiralayan kulüp daha isteklidir.
function evaluateLoanOutOffer(p, terms){
  let score = 65;
  score += (terms.wageSharePct||0) * 0.45;
  if(terms.buyType === 'mandatory'){
    const feeRatio = p.value>0 ? terms.buyFee/p.value : 1;
    score -= 10; // zorunluluk başlı başına bir yük
    score -= (feeRatio - 0.6) * 25; // bedel pahalıysa daha da isteksiz
  } else if(terms.buyType === 'optional'){
    score += 4;
  }
  // Kiralama bedeli, kiralayan kulübün ödeyeceği peşin ücrettir — talep edilen
  // bedel piyasa değerinin üzerine çıktıkça kiralayan kulüp daha isteksiz olur.
  const baseFee = loanFeeFor(p);
  if(baseFee > 0 && terms.feeAmount != null){
    const loanFeeRatio = terms.feeAmount / baseFee;
    score -= (loanFeeRatio - 1) * 20;
  }
  return clamp(Math.round(score), 8, 95);
}
// Sahibi kulübün (kiralık ALDIĞIMIZ oyuncu için AI kulüp) teklifimizi ne
// kadar cazip bulacağı. Sahibine ne kadar az maaş yükü bırakırsak ve makul
// bir satın alma bedeli sunarsak o kadar isteklidir.
function evaluateLoanInOffer(p, terms){
  let score = 60;
  score -= (terms.wageSharePct||0) * 0.5;
  if(terms.buyType === 'mandatory' || terms.buyType === 'optional'){
    const feeRatio = p.value>0 ? terms.buyFee/p.value : 1;
    score += (feeRatio - 0.8) * 35;
    if(terms.buyType === 'mandatory') score += 12; // garanti satış sahibi için değerli
  }
  // Sunulan kiralama bedeli piyasa değerinin üzerindeyse sahibi kulüp daha isteklidir.
  const baseFee = loanFeeFor(p);
  if(baseFee > 0 && terms.feeAmount != null){
    const loanFeeRatio = terms.feeAmount / baseFee;
    score += (loanFeeRatio - 1) * 20;
  }
  // Kendini kanıtlamış (OVR'i yüksek, gelişimini büyük ölçüde tamamlamış) genç
  // oyuncular kendi liginden çok daha zayıf bir kulübe kiralık gitmek istemez;
  // henüz gelişmekte olan (OVR'i düşük) gençler ise ligi önemsemeden oynama
  // fırsatı arar ve alt liglere gitmeye daha açıktır.
  const myClub = state.clubs[state.playerClubId];
  const ownerClub = state.clubs[p.club];
  if(myClub && ownerClub && typeof myClub.tierIdx === "number" && typeof ownerClub.tierIdx === "number"){
    const tierGap = myClub.tierIdx - ownerClub.tierIdx; // pozitifse benim kulübüm daha alt ligde
    if(tierGap > 0){
      const provenLevel = clamp((p.rating - 68) / 14, 0, 1); // 68 altı hiç kanıtlanmamış, 82+ tamamen kanıtlanmış
      score -= tierGap * provenLevel * 14;
    }
  }
  return clamp(Math.round(score), 5, 95);
}

// Kadromdaki bir oyuncu için kiralık pazarlık ekranını açar.
function loanOutPlayer(pid){
  const status = transferWindowStatus();
  if(!status.open){ showToast("Transfer penceresi kapalı — "+status.label); return; }
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.club !== myClub.id) return;
  if(p.injured){ showToast(p.name+" sakat — kiralığa gönderilemez."); return; }
  if(p.loanFromClub){ showToast(p.name+" zaten başka bir kulüpten kiralık — tekrar kiralanamaz."); return; }
  loanNegotiation = { pid, direction:'out', wageSharePct:0, buyType:'none', buyFee: defaultLoanBuyFeeFor(p), requiredApps:15, feeAmount: loanFeeFor(p) };
  render();
}

// Kiralığa gönderme pazarlığını onaylar: uygun bir kulüp bulunur, teklif
// şartlarına göre kabul/red belirlenir, kabul edilirse transfer uygulanır.
function confirmLoanOut(){
  if(!loanNegotiation || loanNegotiation.direction !== 'out') return;
  const { pid, wageSharePct, buyType, buyFee, requiredApps, feeAmount } = loanNegotiation;
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.club !== myClub.id){ loanNegotiation = null; render(); return; }
  const dest = pickLoanDestination(p);
  if(!dest){ showToast("Şu anda "+p.name+" ile ilgilenen bir kulüp yok."); loanNegotiation = null; render(); return; }
  const terms = { wageSharePct, buyType, buyFee, requiredApps, feeAmount };
  const chance = evaluateLoanOutOffer(p, terms);
  if(Math.random()*100 > chance){
    showToast(dest.name+", "+p.name+" için sunduğunuz kiralık şartlarını kabul etmedi. Daha cazip bir teklif deneyin.");
    loanNegotiation = null;
    render();
    return;
  }
  myClub.squad = myClub.squad.filter(id=>id!==pid);
  removeFromLineupAssignments(pid, myClub.id);
  dest.squad.push(pid);
  p.club = dest.id;
  p.loanFromClub = myClub.id;
  p.loanSeasonsLeft = 1;
  p.loanWageSharePct = wageSharePct;
  p.loanBuyOption = buyType==='none' ? null : { type:buyType, fee:buyFee, requiredApps: buyType==='mandatory' ? requiredApps : null };
  p.loanAppsCount = 0;
  const fee = Math.min(feeAmount, dest.budget);
  if(fee > 0){ dest.budget -= fee; myClub.budget += fee; }
  const optionNote = buyType==='mandatory' ? ` · Zorunlu satın alma: ${requiredApps} maça çıkarsa ${fmtMoney(buyFee)} karşılığında otomatik transfer olur.`
    : buyType==='optional' ? ` · Opsiyonel satın alma bedeli: ${fmtMoney(buyFee)}.` : '';
  addNews(`🔄 ${p.name}, bu sezon için ${dest.name} kulübüne kiralık gönderildi.`, "transfer");
  showToast(p.name+" kiralık olarak "+dest.name+"'a gönderildi"+(fee>0?" (+"+fmtMoney(fee)+" kiralama bedeli)":"")+(wageSharePct>0?" · Maaşın %"+wageSharePct+"'ini siz karşılayacaksınız.":"")+optionNote+" Sezon sonunda otomatik döner.");
  loanNegotiation = null;
  render();
}

// Kiralıkta olan kendi oyuncumu erken geri çağırır (küçük moral bedeliyle).
function recallLoanPlayer(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.loanFromClub !== myClub.id) return;
  const borrower = state.clubs[p.club];
  if(borrower) borrower.squad = borrower.squad.filter(id=>id!==pid);
  removeFromLineupAssignments(pid, p.club);
  myClub.squad.push(pid);
  p.club = myClub.id;
  p.loanFromClub = null;
  p.loanSeasonsLeft = 0;
  p.loanWageSharePct = null;
  p.loanBuyOption = null;
  p.loanAppsCount = 0;
  adjustMorale(pid, -3);
  showToast(p.name+" kiralıktan erken geri çağrıldı.");
  render();
}

// Başka bir kulübün oyuncusu için kiralık pazarlık ekranını açar.
function loanInPlayer(pid){
  const status = transferWindowStatus();
  if(!status.open){ showToast("Transfer penceresi kapalı — "+status.label); return; }
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub) return;
  if(p.loanFromClub){ showToast("Bu oyuncu zaten kiralık statüsünde."); return; }
  if(!p.club || p.club === myClub.id) return;
  loanNegotiation = { pid, direction:'in', wageSharePct:0, buyType:'none', buyFee: defaultLoanBuyFeeFor(p), requiredApps:15, feeAmount: loanFeeFor(p) };
  render();
}

// Kiralık alma pazarlığını onaylar: sahibi kulüp şartları değerlendirir,
// kabul ederse (ve bütçeniz peşin bedeli karşılıyorsa) transfer uygulanır.
function confirmLoanIn(){
  if(!loanNegotiation || loanNegotiation.direction !== 'in') return;
  const { pid, wageSharePct, buyType, buyFee, requiredApps, feeAmount } = loanNegotiation;
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || !p.club || p.club === myClub.id){ loanNegotiation = null; render(); return; }
  const owner = state.clubs[p.club];
  if(!owner){ loanNegotiation = null; render(); return; }
  const fee = feeAmount;
  if(myClub.budget < fee){ showToast("Kiralama bedelini karşılayacak bütçeniz yok. Gerekli: "+fmtMoney(fee)); loanNegotiation = null; render(); return; }
  const terms = { wageSharePct, buyType, buyFee, requiredApps, feeAmount };
  const chance = evaluateLoanInOffer(p, terms);
  if(Math.random()*100 > chance){
    showToast(owner.name+", "+p.name+" için önerdiğiniz kiralık şartlarını kabul etmedi. Daha cazip bir teklif deneyin.");
    loanNegotiation = null;
    render();
    return;
  }
  owner.squad = owner.squad.filter(id=>id!==pid);
  removeFromLineupAssignments(pid, owner.id);
  myClub.squad.push(pid);
  myClub.budget -= fee;
  owner.budget += fee;
  p.club = myClub.id;
  p.loanFromClub = owner.id;
  p.loanSeasonsLeft = 1;
  p.loanWageSharePct = wageSharePct;
  p.loanBuyOption = buyType==='none' ? null : { type:buyType, fee:buyFee, requiredApps: buyType==='mandatory' ? requiredApps : null };
  p.loanAppsCount = 0;
  const optionNote = buyType==='mandatory' ? ` · Zorunlu satın alma: ${requiredApps} maça çıkarsa ${fmtMoney(buyFee)} karşılığında otomatik olarak sizin oyuncunuz olur.`
    : buyType==='optional' ? ` · Dilediğiniz an ${fmtMoney(buyFee)} karşılığında kalıcı satın alma hakkınız var.` : '';
  addNews(`🔄 ${p.name}, bir sezonluğuna ${owner.name}'dan kiralandı.`, "transfer");
  showToast(p.name+" kiralandı! "+fmtMoney(fee)+" kiralama bedeli ödendi"+(wageSharePct>0?" · Maaşın %"+wageSharePct+"'ini "+owner.name+" karşılayacak.":"")+optionNote+" 1 sezon sonunda sahibine döner.");
  loanNegotiation = null;
  render();
}

// Bende kiralık olan bir oyuncuyu sezon bitmeden sahibine erken iade eder.
function returnLoanEarly(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.club !== myClub.id || !p.loanFromClub) return;
  const owner = state.clubs[p.loanFromClub];
  myClub.squad = myClub.squad.filter(id=>id!==pid);
  removeFromLineupAssignments(pid, myClub.id);
  if(owner) owner.squad.push(pid);
  p.club = owner ? owner.id : null;
  p.loanFromClub = null;
  p.loanSeasonsLeft = 0;
  p.loanWageSharePct = null;
  p.loanBuyOption = null;
  p.loanAppsCount = 0;
  showToast(p.name+" sahibi kulübe erken iade edildi.");
  render();
}

// Bende kiralık olan (opsiyonel satın alma şartlı) bir oyuncuyu, sezon
// bitmeden dilediğim an anlaşılan bedelle kalıcı olarak satın alırım.
function exerciseLoanBuyOption(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.club !== myClub.id || !p.loanFromClub) return;
  if(!p.loanBuyOption || p.loanBuyOption.type !== 'optional'){ showToast(p.name+" için opsiyonel satın alma şartı yok."); return; }
  const owner = state.clubs[p.loanFromClub];
  const fee = p.loanBuyOption.fee;
  if(myClub.budget < fee){ showToast("Satın alma bedelini karşılayacak bütçeniz yok. Gerekli: "+fmtMoney(fee)); return; }
  myClub.budget -= fee;
  if(owner) owner.budget += fee;
  p.loanFromClub = null;
  p.loanSeasonsLeft = 0;
  p.loanWageSharePct = null;
  p.loanBuyOption = null;
  p.loanAppsCount = 0;
  addNews(`✅ ${p.name}, kiralık opsiyonu kullanılarak ${fmtMoney(fee)} karşılığında kalıcı olarak ${myClub.name}'e transfer oldu.`, "transfer");
  showToast(p.name+" satın alma opsiyonu kullanıldı — artık kadronuzun kalıcı oyuncusu!");
  render();
}

// Kiralık statüsündeki bir oyuncu maça çıktığında çağrılır (bkz.
// updatePlayerStats / updatePlayerStatsWithEvents). Zorunlu satın alma
// şartı varsa maç sayacını artırır ve şart sağlanınca transferi tetikler.
function bumpLoanAppearances(p){
  if(!p || !p.loanFromClub) return;
  p.loanAppsCount = (p.loanAppsCount||0) + 1;
  checkLoanMandatoryTrigger(p);
}
function checkLoanMandatoryTrigger(p){
  const opt = p.loanBuyOption;
  if(!opt || opt.type !== 'mandatory') return;
  if((p.loanAppsCount||0) < opt.requiredApps) return;
  executeLoanMandatoryBuy(p);
}
// Zorunlu opsiyon şartı sağlandığında oyuncu, kadrosunda bulunduğu (kiralayan)
// kulübe otomatik ve kesin olarak satılır — kulüp bütçesi negatife düşmesin
// diye 0'a kadar sınırlanır, sahibi kulüp her zaman bedelin tamamını alır.
function executeLoanMandatoryBuy(p){
  const owner = state.clubs[p.loanFromClub];
  const buyer = state.clubs[p.club];
  const fee = (p.loanBuyOption && p.loanBuyOption.fee) || 0;
  if(buyer){ buyer.budget = Math.max(0, buyer.budget - fee); }
  if(owner){ owner.budget += fee; }
  const buyerName = buyer ? buyer.name : "yeni kulübü";
  addNews(`🔒 ${p.name}, zorunlu satın alma opsiyonu şartı (${p.loanBuyOption.requiredApps} maç) sağlandığı için ${fmtMoney(fee)} karşılığında otomatik olarak ${buyerName}'e transfer oldu.`, "transfer");
  if((buyer && buyer.id === state.playerClubId) || (owner && owner.id === state.playerClubId)){
    state.lastLoanNote = (state.lastLoanNote ? state.lastLoanNote+" " : "") + `🔒 ${p.name} için zorunlu satın alma opsiyonu devreye girdi — ${fmtMoney(fee)} karşılığında ${buyerName}'in kalıcı oyuncusu oldu.`;
  }
  p.loanFromClub = null;
  p.loanSeasonsLeft = 0;
  p.loanWageSharePct = null;
  p.loanBuyOption = null;
  p.loanAppsCount = 0;
}

// Sezon sonunda tüm kiralıkları bir yıl azaltır; süresi bitenleri otomatik
// olarak sahibi kulübe geri döndürür. finishSeason() içinden çağrılır.
// (Zorunlu satın alma opsiyonu şartı sezon içinde sağlandıysa bumpLoanAppearances
// üzerinden zaten uygulanmış olur ve burada tekrar işlenmez.)
function processLoanReturns(){
  const returnedInNames = [];   // bana geri dönen (benim oyuncum) isimler
  const returnedAwayNames = []; // benden ayrılan (başkasının oyuncusuydu) isimler
  const boughtNames = [];       // sezon içinde/sonunda opsiyonla kalıcı olan isimler
  Object.values(state.players).slice().forEach(p=>{
    if(!p.loanFromClub) return;
    if(!p.club || p.club === "retired" || p.club === "sold"){
      p.loanFromClub = null; p.loanSeasonsLeft = 0; p.loanWageSharePct = null; p.loanBuyOption = null; p.loanAppsCount = 0; return;
    }
    // AI kontrolündeki bir kulüp kiralayan ve elinde opsiyonel satın alma
    // hakkı varsa, sezon sonunda oyuncunun performansına göre bu hakkı
    // kullanıp kullanmayacağına küçük bir olasılıkla karar verir.
    if(p.club !== state.playerClubId && p.loanBuyOption && p.loanBuyOption.type === 'optional'){
      const buyer = state.clubs[p.club];
      const owner = state.clubs[p.loanFromClub];
      const worthIt = p.rating >= 66 && Math.random() < 0.35;
      if(worthIt && buyer && buyer.budget >= p.loanBuyOption.fee){
        const fee = p.loanBuyOption.fee;
        buyer.budget -= fee;
        if(owner) owner.budget += fee;
        if(owner && owner.id === state.playerClubId) boughtNames.push(p.name+" ("+buyer.name+"'e)");
        p.loanFromClub = null; p.loanSeasonsLeft = 0; p.loanWageSharePct = null; p.loanBuyOption = null; p.loanAppsCount = 0;
        return;
      }
    }
    p.loanSeasonsLeft = (p.loanSeasonsLeft||1) - 1;
    if(p.loanSeasonsLeft > 0) return;
    const borrowerClub = state.clubs[p.club];
    const ownerClub = state.clubs[p.loanFromClub];
    if(borrowerClub){
      borrowerClub.squad = borrowerClub.squad.filter(id=>id!==p.id);
      removeFromLineupAssignments(p.id, borrowerClub.id);
      if(borrowerClub.id === state.playerClubId) returnedAwayNames.push(p.name);
    }
    if(ownerClub){
      ownerClub.squad.push(p.id);
      p.club = ownerClub.id;
      if(ownerClub.id === state.playerClubId) returnedInNames.push(p.name);
    } else {
      p.club = null;
      if(!state.market.includes(p.id)) state.market.push(p.id);
    }
    p.loanFromClub = null;
    p.loanSeasonsLeft = 0;
    p.loanWageSharePct = null;
    p.loanBuyOption = null;
    p.loanAppsCount = 0;
  });
  state.lastLoanNote = state.lastLoanNote || null;
  const notes = [];
  if(returnedInNames.length) notes.push(`🔄 Kiralık dönüşü: ${returnedInNames.join(", ")} kulübünüze geri döndü.`);
  if(returnedAwayNames.length) notes.push(`↩️ Kiralık süresi bitti: ${returnedAwayNames.join(", ")} sahibi kulübe geri döndü.`);
  if(boughtNames.length) notes.push(`✅ Opsiyon kullanıldı: ${boughtNames.join(", ")} kalıcı transfer oldu.`);
  if(notes.length) state.lastLoanNote = (state.lastLoanNote ? state.lastLoanNote+" " : "") + notes.join(" ");
}

/* ---- Kadrodan bir oyuncuyu satmak istediğinizde, oyuncuyu doğrudan piyasaya
   düşürmek yerine birkaç kulübe "satılık" olduğunu duyurur ve o kulüplerden
   anında bonservis teklifleri toplarız. Teklifler "Teklifler" sekmesinde
   listelenir; oradan istediğinizi kabul edebilir, pazarlık açabilir ya da
   reddedebilirsiniz — normal gelen tekliflerle aynı akış. ---- */
function listPlayerForSale(pid){
  const status = transferWindowStatus();
  if(!status.open){
    showToast("Transfer penceresi kapalı — "+status.label);
    return;
  }
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub) return;
  if(p.loanFromClub){ showToast(p.name+" kiralık bir oyuncu — satılamaz."); return; }

  const attempts = 3 + Math.floor(Math.random()*2); // 3-4 kulüple görüşmeyi dene
  const usedClubIds = new Set(state.incomingOffers.filter(o=>o.playerId===pid).map(o=>o.clubId));
  let newOffers = 0;
  for(let i=0; i<attempts; i++){
    const buyer = pickInterestedClub(p);
    if(!buyer || usedClubIds.has(buyer.id)) continue;
    usedClubIds.add(buyer.id);
    let markup = 0.85 + Math.random()*0.55;
    if(p.potential - p.rating >= 6) markup += 0.15;
    if(p.age <= 21) markup += 0.1;
    let fee = Math.round((p.value*markup)/100000)*100000;
    fee = Math.max(fee, Math.round(p.value*0.5/100000)*100000);
    state.incomingOffers.push({ id: rid(), playerId: pid, clubId: buyer.id, fee, expiresIn: 3, rejections: 0 });
    newOffers++;
  }

  if(newOffers === 0){
    showToast(p.name+" için şu anda ilgilenen bir kulüp bulunamadı. Birkaç hafta sonra tekrar deneyin.");
    render();
  } else {
    showToast(p.name+" transfer listesine kondu: "+newOffers+" kulüpten teklif geldi. Teklifler sekmesinden seçim yapabilirsiniz.");
    setTab("offers");
  }
}

const CONTRACT_LENGTHS = [1, 2, 3, 4, 5];
/* ---- Uzun sözleşmeler oyuncu için daha büyük bir taahhüttür: 5 yıllık bir
   sözleşme için oyuncu normalden belirgin daha yüksek maaş ister, 4 yıllıkta
   bir tık daha az, 3 yıllıkta daha az... 1-2 yıllık kısa sözleşmelerde ise
   oyuncu daha esnek davranır. Bu çarpan, kabul hesaplamasında referans maaşı
   büyütüp/küçültür. ---- */
const CONTRACT_YEAR_WAGE_FACTOR = { 1: 0.94, 2: 1.00, 3: 1.07, 4: 1.15, 5: 1.25 };

/* ---- Sözleşme YENİLEME ekranında sunulacak süre seçenekleri: oyuncunun
   MEVCUT kalan sözleşme süresinden kesinlikle daha uzun olmalı. Aksi halde
   "yenileme" aslında hiçbir şeyi uzatmamış olur — örn. 1 yılı kalan bir
   oyuncuya 1 yıllık teklif sunmak anlamsızdır, zaten 1 yılı var, sözleşme
   hiç değişmemiş gibi görünür. Bu yüzden burada sadece mevcut süreden BÜYÜK
   seçenekler listelenir (1 yılı kalana 2-3-4-5, 3 yılı kalana 4-5 gibi).
   Oyuncu zaten azami (5 yıl) sürede ise süre artık uzatılamaz; o durumda
   tek seçenek olarak mevcut süre döner (sadece maaş/bonus güncellemesi
   için). ---- */
function renewalYearOptions(p){
  const current = (p && p.contractYears) || 0;
  const longer = CONTRACT_LENGTHS.filter(y => y > current);
  return longer.length ? longer : [Math.min(current || 1, 5)];
}
let negotiatingPid = null;
let negotiationOffer = { wage: 0, bonus: 0, fee: 0, askingPrice: 0, years: 3 };

/* ---- Bonservis pazarlığı: satan kulüp oyuncunun piyasa değerinden daha
   yüksek bir "istenen bonservis" belirler (form/yetenek yükseldikçe daha
   yüksek talep eder). Sen bu rakamın altında ya da üstünde teklif verebilirsin;
   teklif istenenin ne kadar altındaysa kabul ihtimali o kadar düşer. ---- */
function computeAskingPrice(p){
  const markup = 1.12 + clamp((p.rating-55)/100, 0, 0.35) + Math.random()*0.28;
  const asked = Math.max(p.value, Math.round((p.value*markup)/100000)*100000);
  return asked;
}
/* ---- Bazı iyi oyuncular kendi kulüplerinden çok daha düşük prestijli bir
   kulübe (alt kademe, zayıf lig) transfer olmak istemez. Serbest oyuncularda
   da yüksek reyting, düşük prestijli kulüplere karşı isteksizlik yaratır.
   Dönüş değeri 0 (sorun yok) ile ~80+ (neredeyse imkansız) arasında bir
   "direnç" puanıdır; kabul şansından doğrudan düşülür. ---- */
function transferWillingness(p, destClubId){
  const dest = state.clubs[destClubId];
  if(!dest) return 0;
  let resistance = 0;
  if(p.club && state.clubs[p.club]){
    const source = state.clubs[p.club];
    const gap = source.prestige - dest.prestige;
    if(gap > 12){
      const ratingFactor = p.rating>=78 ? 1.6 : (p.rating>=65 ? 1.0 : 0.5);
      resistance += (gap-12) * ratingFactor;
    }
  } else if(!p.club){
    const expectedPrestige = (p.rating-52) * 2.3;
    const gap = expectedPrestige - dest.prestige;
    if(gap > 8 && p.rating >= 66){
      resistance += (gap-8) * 0.85;
    }
  }
  return clamp(resistance, 0, 95);
}

let negotiationIsRenewal = false;
let negotiationIsPromotion = false;
let negotiationIsYouthTransfer = false;
function openNegotiation(pid){
  const status = transferWindowStatus();
  if(!status.open){
    showToast("Transfer penceresi kapalı — "+status.label);
    return;
  }
  const p = state.players[pid];
  if(p && p.injured){
    showToast(p.name+" sakat olduğu için transfer görüşmesi başlatılamaz.");
    return;
  }
  negotiatingPid = pid;
  negotiationIsRenewal = false;
  const isFree = !p.club;
  
  // Eğer daha önce hesaplanmamışsa hesapla ve oyuncuya kaydet — bu sayede teklif verirken sabit kalır
  if(!p.askingPrice){
    p.askingPrice = isFree ? 0 : computeAskingPrice(p);
  }
  
  const startFee = isFree ? 0 : p.value;
  negotiationOffer = { wage: p.wage, bonus: signingBonusFor(p), fee: startFee, askingPrice: p.askingPrice, years: 3 };
  render();
}

function openYouthTransfer(pid){
  const status = transferWindowStatus();
  if(!status.open){
    showToast("Transfer penceresi kapalı — "+status.label);
    return;
  }
  const p = state.players[pid];
  if(!p || !p.isYouth){
    showToast("Bu oyuncu gençlik oyuncusu değil.");
    return;
  }
  
  negotiatingPid = pid;
  negotiationIsRenewal = false;
  negotiationIsYouthTransfer = true;
  
  // Gençlik oyuncuları için düşük bonservis
  const askingPrice = p.potential > 85 ? Math.round(p.value * 0.3) : Math.round(p.value * 0.15);
  p.askingPrice = askingPrice;
  
  const startFee = Math.round(askingPrice * 0.5);
  negotiationOffer = { wage: p.wage, bonus: Math.round(signingBonusFor(p) * 0.7), fee: startFee, askingPrice: askingPrice, years: 3 };
  render();
}
/* ---- Mevcut kadrondaki bir oyuncuyla sözleşme yenileme pazarlığı açar.
   Bonservis yok (zaten senin oyuncun); sadece yeni maaş, imza/sadakat
   bonusu ve yeni sözleşme süresi üzerinden pazarlık yapılır. ---- */
function openRenewal(pid){
  const p = state.players[pid];
  if(!p || p.club !== state.playerClubId) return;
  if(p.loanFromClub){
    showToast(p.name+" kiralık bir oyuncu — sözleşme yenilemesi yapılamaz.");
    return;
  }
  if(p.injured){
    showToast(p.name+" sakat olduğu için şu an sözleşme görüşmesi yapılamaz.");
    return;
  }
  negotiatingPid = pid;
  negotiationIsRenewal = true;
  const renewOpts = renewalYearOptions(p);
  negotiationOffer = { wage: p.wage, bonus: Math.round(signingBonusFor(p)*0.5/5000)*5000, fee: 0, askingPrice: 0, years: renewOpts[0] };
  render();
}
function cancelNegotiation(){
  negotiatingPid = null;
  negotiationIsRenewal = false;
  negotiationIsPromotion = false;
  negotiationIsYouthTransfer = false;
  render();
}
function setNegotiationField(field, value){
  negotiationOffer[field] = Math.max(0, parseInt(value) || 0);
  updateNegotiationDisplay();
}
function setNegotiationYears(value){
  const yrs = parseInt(value) || 1;
  let minYears = 1, maxYears = 5;
  if(negotiationIsRenewal && negotiatingPid != null){
    const p = state.players[negotiatingPid];
    if(p){
      const opts = renewalYearOptions(p);
      minYears = opts[0];
      maxYears = opts[opts.length-1];
    }
  }
  negotiationOffer.years = clamp(yrs, minYears, maxYears);
  render();
}
function updateNegotiationDisplay(){
  if(negotiatingPid == null) return;
  const p = state.players[negotiatingPid];
  if(!p) return;
  const isFree = !p.club;
  const fee = isFree ? 0 : negotiationOffer.fee;
  const totalCost = fee + negotiationOffer.bonus;
  const totalEl = document.getElementById("nego-total-cost");
  if(totalEl) totalEl.textContent = fmtMoney(totalCost);
  const buyBtn = document.getElementById("nego-buy-btn");
  if(buyBtn){
    const canAfford = state.clubs[state.playerClubId].budget >= totalCost;
    buyBtn.disabled = !canAfford;
  }
}
function confirmOffer(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  
  // Gençlik oyuncusu transfer özel işleme
  if(negotiationIsYouthTransfer){
    const isFree = true; // Gençlik oyuncuları serbest olarak sayılır (düşük bonservis)
    const fee = negotiationOffer.fee;
    const wage = negotiationOffer.wage;
    const bonus = negotiationOffer.bonus;
    const totalCost = fee + bonus + wage;
    
    const currentWageBill = clubWageBill(state.playerClubId);
    const availableBudget = myClub.budget - currentWageBill;
    
    if(availableBudget < totalCost){
      showToast("Yeterli bütçe yok! Gerekli: "+fmtMoney(totalCost)+" / Mevcut: "+fmtMoney(availableBudget));
      return;
    }
    
    // Gençlik oyuncusu diğer kulübün gençlik takımından çıkar
    const parentClub = Object.values(state.clubs).find(c => c.youth.includes(pid));
    if(parentClub){
      parentClub.youth = parentClub.youth.filter(x => x !== pid);
    }
    
    // A takıma ekle
    p.isYouth = false;
    p.club = state.playerClubId;
    p.contractYears = negotiationOffer.years;
    p.contractUntil = state.year + negotiationOffer.years;
    tagContractDate(p, negotiationOffer.years);
    p.wage = wage;
    myClub.squad.push(pid);
    myClub.budget -= totalCost;
    p.acquiredFee = fee;
    
    showToast(`🎉 ${p.name} başarıyla transfer edildi! A takıma kaldırıldı.`);
    negotiationIsYouthTransfer = false;
    negotiatingPid = null;
    render();
    return;
  }
  
  const isFree = !p.club;
  const fee = isFree ? 0 : negotiationOffer.fee;
  const wage = negotiationOffer.wage;
  const bonus = negotiationOffer.bonus;
  if(p.injured){
    showToast(p.name+" sakat olduğu için transfer edilemez.");
    negotiatingPid = null;
    render();
    return;
  }
// BONSERVIS ZORUNLU
  if(!isFree && negotiationOffer.askingPrice > 0 && fee === 0){
    showToast("Takimin istediği bonservis: "+fmtMoney(negotiationOffer.askingPrice)+". Bonservis vermelisiniz!");
    return;
  }
  
  // ✅ Maaş bill kontrolü
  const currentWageBill = clubWageBill(state.playerClubId);
  const availableBudget = myClub.budget - currentWageBill;
  const totalCost = fee + bonus + wage;
 
  if(availableBudget < totalCost){
    const needed = totalCost - availableBudget;
    showToast("❌ Yeterli bütçe yok! Bonservis: "+fmtMoney(fee)+" + İmza: "+fmtMoney(bonus)+" + 1 sezon maaş: "+fmtMoney(wage)+" = "+fmtMoney(totalCost)+". \n Toplam bütçe: "+fmtMoney(myClub.budget)+" − Maaş bill: "+fmtMoney(currentWageBill)+" = "+fmtMoney(availableBudget)+" kullanılabilir. \n "+fmtMoney(needed)+" daha gerekli!");
    return;
  }

  const yearFactor = CONTRACT_YEAR_WAGE_FACTOR[negotiationOffer.years] || 1;
  const expectedWage = Math.round(p.wage * yearFactor);
  const wageRatio = expectedWage>0 ? wage / expectedWage : 1;
  const bonusRatio = signingBonusFor(p)>0 ? bonus / signingBonusFor(p) : 1;
  let acceptChance = (wageRatio - 0.6) * 130 + (bonusRatio - 1) * 25;
  // Uzun sözleşme taahhüdü, doğru maaş verilse bile ekstra bir direnç yaratır.
  acceptChance -= (negotiationOffer.years - 2) * 4;

  if(!isFree){
    const feeRatio = negotiationOffer.askingPrice>0 ? fee / negotiationOffer.askingPrice : 1;
    acceptChance += (feeRatio - 1) * 95;
  }
  const resistance = transferWillingness(p, state.playerClubId);
  acceptChance -= resistance;

  acceptChance = clamp(acceptChance, 2, 98);
  const accepted = Math.random()*100 < acceptChance;

  if(!accepted){
    if(resistance >= 40){
      showToast(p.name+" bu seviyedeki bir kulübe transfer olmak istemiyor.");
    } else if(!isFree && fee < negotiationOffer.askingPrice*0.9){
      const sellerName = state.clubs[p.club] ? state.clubs[p.club].name : "Kulüp";
      showToast(sellerName+" bu bonservis teklifini yetersiz buldu (istenen: "+fmtMoney(negotiationOffer.askingPrice)+").");
    } else {
      showToast(p.name+" teklifi reddetti ("+negotiationOffer.years+" yıllık sözleşme için beklenen maaş: "+fmtMoney(expectedWage)+"/yıl). Daha iyi bir teklif dene ya da daha kısa süreli sözleşme öner.");
    }
    if(p.scoutHidden){
      delete state.players[pid];
      removeScoutedPlayerRef(pid);
    }
    negotiatingPid = null;
    render();
    return;
  }

  // ✅ Transfer + 1 sezonluk maaş harcansın
  myClub.budget -= totalCost;
  
  if(!isFree){
    const sellerClub = state.clubs[p.club];
    if(sellerClub){
      sellerClub.budget += fee;
      sellerClub.squad = sellerClub.squad.filter(id=>id!==pid);
      const luSeller = state.lineup[sellerClub.id];
      if(luSeller) Object.keys(luSeller.assignments).forEach(k=>{ if(luSeller.assignments[k]===pid) delete luSeller.assignments[k]; });
    }
  } else {
    state.market = state.market.filter(id=>id!==pid);
  }
  myClub.squad.push(pid);
  p.club = state.playerClubId;
  p.wage = wage;
  p.acquiredFee = fee;
  const contractYears = clamp(negotiationOffer.years || 1, 1, 5);
  p.contractYears = contractYears;
  p.contractUntil = state.year + contractYears;
  tagContractDate(p, contractYears);
  if(p.scoutHidden){
    p.scoutHidden = false;
    removeScoutedPlayerRef(pid);
  }
  if(fee >= 5000000) unlockAchievement('buyuk_transfer');
  negotiatingPid = null;
  showToast(p.name+" anlaşmayı kabul etti! Bonservis: "+fmtMoney(fee)+" · İmza parası: "+fmtMoney(bonus)+" · Yeni maaş: "+fmtMoney(wage)+"/yıl · Sözleşme: "+contractYears+" yıl. Kalan bütçe: "+fmtMoney(myClub.budget));
  render();
}

/* ---- Mevcut kadrodaki bir oyuncuya bedelsiz yeni sözleşme (uzatma) imzalatır. ---- */
/* ---- Sözleşme yenileme teklifini onaylar: bonservis yok, sadece yeni
   maaş + imza/sadakat bonusu + yeni süre üzerinden oyuncu kabul/red kararı
   verir. Kabul ederse maaşı ve sözleşme süresi güncellenir; reddederse
   eski sözleşmesi (mevcut maaş, kalan süre neyse) aynen devam eder. ---- */
function confirmRenewal(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub || p.club !== state.playerClubId){
    negotiatingPid = null; negotiationIsRenewal = false; render(); return;
  }
  const wage = negotiationOffer.wage;
  const bonus = negotiationOffer.bonus;
  // Yenilemede süre her zaman mevcut kalan süreden büyük olmalı; aksi halde
  // sözleşme fiilen uzamamış olur (bkz. renewalYearOptions).
  const renewOpts = renewalYearOptions(p);
  const years = clamp(negotiationOffer.years || renewOpts[0], renewOpts[0], renewOpts[renewOpts.length-1]);

  const currentWageBill = clubWageBill(state.playerClubId);
  const wageBillWithoutThis = currentWageBill - p.wage;
  const availableBudget = myClub.budget - wageBillWithoutThis;
  const totalCost = bonus + wage;

  if(availableBudget < totalCost){
    const needed = totalCost - availableBudget;
    showToast("❌ Yeterli bütçe yok! İmza/sadakat bonusu: "+fmtMoney(bonus)+" + 1 sezon maaş: "+fmtMoney(wage)+" = "+fmtMoney(totalCost)+". Kullanılabilir: "+fmtMoney(availableBudget)+". "+fmtMoney(needed)+" daha gerekli!");
    return;
  }

  const yearFactor = CONTRACT_YEAR_WAGE_FACTOR[years] || 1;
  const expectedWage = Math.round(p.wage * yearFactor);
  const wageRatio = expectedWage>0 ? wage / expectedWage : 1;
  const bonusRatio = signingBonusFor(p)>0 ? bonus / signingBonusFor(p) : 1;
  let acceptChance = (wageRatio - 0.6) * 130 + (bonusRatio - 1) * 15;
  acceptChance -= (years - 2) * 4;
  acceptChance += 15; // kendi kulübünde kalmak, transfer olmaktan daha kolay kabul edilir
  // Moral etkisi: mutlu oyuncu yenilemeye çok daha sıcak bakar, mutsuz oyuncu
  // aynı şartları bile daha kolay reddeder.
  const moraleForRenewal = p.morale !== undefined && p.morale !== null ? p.morale : 70;
  acceptChance += (moraleForRenewal - 50) * 0.6;
  acceptChance = clamp(acceptChance, 3, 98);
  const accepted = Math.random()*100 < acceptChance;

  if(!accepted){
    showToast(p.name+" bu şartlarla yeni sözleşmeyi kabul etmedi ("+years+" yıllık için beklenen maaş: "+fmtMoney(expectedWage)+"/yıl). Daha iyi bir teklif dene — eski sözleşmesi geçerliliğini koruyor.");
    negotiatingPid = null;
    negotiationIsRenewal = false;
    render();
    return;
  }

  myClub.budget -= totalCost;
  const oldWage = p.wage;
  p.wage = wage;
  p.contractYears = years;
  p.contractUntil = state.year + years;
  tagContractDate(p, years);
  adjustMorale(pid, 6); // sözleşme uzatmak
  if(wage > oldWage) adjustMorale(pid, 6); // maaş zammı
  negotiatingPid = null;
  negotiationIsRenewal = false;
  showToast(p.name+" ile yeni sözleşme imzalandı! Yeni maaş: "+fmtMoney(wage)+"/yıl · İmza bonusu: "+fmtMoney(bonus)+" · Süre: "+years+" yıl.");
  render();
}
