/* ---- Milli takım daveti: artık salt "renk" haberi değil, gerçek bir etkisi
   var. Davet edilen oyuncu küçük bir ihtimalle kampta/maçta sakatlanıp
   kulübüne haftalarca kayıp verebilir (mevcut sakatlık sistemi üzerinden);
   sakatlanmazsa gösterdiği performansa göre morali (dolayısıyla formu)
   olumlu ya da olumsuz etkilenerek kulübe döner. Sadece kendi kulübünüzün
   oyuncuları davet edilebilir. ---- */
function maybeNationalTeamCallup(){
  const club = state.clubs[state.playerClubId];
  if(!club || !club.squad.length) return;
  if(Math.random() > NATIONAL_CALLUP_WEEKLY_CHANCE) return;

  const eligible = club.squad
    .map(pid=>state.players[pid])
    .filter(p=>p && !p.injured && !(p.suspensionMatches>0) && p.rating>=NATIONAL_CALLUP_MIN_RATING);
  if(!eligible.length) return;

  // Yüksek güçlü oyuncular daha sık davet edilsin diye ağırlıklı seçim.
  const weighted = eligible.map(p=>({p, w: Math.pow(1.12, p.rating - NATIONAL_CALLUP_MIN_RATING)}));
  const totalW = weighted.reduce((s,x)=>s+x.w, 0);
  let r = Math.random()*totalW, chosen = weighted[0].p;
  for(const x of weighted){ r -= x.w; if(r <= 0){ chosen = x.p; break; } }
  const p = chosen;

  addNews(`🌍 ${p.name} milli takım kadrosuna davet edildi — kulüp içinde gurur verici bir haber.`, "flavor");

  if(Math.random()*100 < NATIONAL_DUTY_INJURY_CHANCE){
    injurePlayer(p.id);
    if(p.injured){ // injurePlayer bazı durumlarda (örn. kulüpte değilse) hiçbir şey yapmayabilir
      adjustMorale(p.id, -6);
      addNews(`🤕 ${p.name} milli takım kampında sakatlandı! ${p.injuryType} (${p.injuryWeeks} maç) — kulübüne üzgün bir şekilde döndü.`, "discipline");
    }
    return;
  }

  const perfRoll = Math.random();
  if(perfRoll < 0.3){
    adjustMorale(p.id, 6);
    addNews(`⭐ ${p.name} milli takım formasıyla harika bir performans sergiledi — kulübüne motive ve formda döndü.`, "award");
  } else if(perfRoll < 0.8){
    adjustMorale(p.id, 3);
    addNews(`🌍 ${p.name}, milli takımdaki maçın ardından gururla kulübüne döndü.`, "flavor");
  } else {
    adjustMorale(p.id, -2);
    addNews(`😕 ${p.name} milli takımda forma şansı bulamadı, sönük bir performansın ardından biraz hayal kırıklığıyla kulübüne döndü.`, "flavor");
  }
}
function maybeBirthdayOrCallup(){
  const club = state.clubs[state.playerClubId];
  if(!club || !club.squad.length) return;
  if(Math.random() < 0.05){
    const pid = club.squad[randInt(0, club.squad.length-1)];
    const p = state.players[pid];
    if(p){
      addNews(`🎂 ${p.name} bugün doğum gününü kutluyor. Soyunma odasında küçük bir kutlama yapıldı.`, "flavor");
      adjustMorale(pid, 2);
    }
  }
  maybeNationalTeamCallup();
}
function maybeGenerateWeeklyNews(matches){
  if(!Array.isArray(matches) || !matches.length) return;
  if(state.championModal || state.promotionModal || state.superCupModal) return;
  const myMatch = matches.find(m=>m.homeId===state.playerClubId || m.awayId===state.playerClubId);
  if(!myMatch || myMatch.matchKind==='friendly' || myMatch.friendly) return;
  if(state.rivalClubId && (myMatch.homeId===state.rivalClubId || myMatch.awayId===state.rivalClubId)){
    handleDerbyResult(myMatch);
  }
  maybeTransferRumor();
  maybeDressingRoomIncident();
  maybeDisciplineScandal();
  maybeRefereeControversy(myMatch);
  maybePlayerUnhappiness();
  maybeBirthdayOrCallup();
}

/* ---- Sezon sonu ödülleri: kendi liginizdeki en iyi performansı gösteren
   oyuncu, en iyi genç yetenek ve (şampiyonluk ya da güçlü bir sezon
   sonrası) Sezonun Menajeri unvanı haber akışına düşer. ---- */
function awardSeasonHonors(standings){
  if(!Array.isArray(standings) || !standings.length) return;
  const club = state.clubs[state.playerClubId];
  if(!club) return;
  const leagueLabel = `${club.countryName} ${club.tierName}`;
  let bestPlayer=null, bestScore=-1, bestYouth=null, bestYouthScore=-1;
  standings.forEach(row=>{
    const c = state.clubs[row.id];
    if(!c) return;
    c.squad.forEach(pid=>{
      const p = state.players[pid];
      if(!p) return;
      ensureStatsShape(p);
      const s = p.stats.league;
      const score = (s.goals||0)*2 + (s.assists||0)*1.3 + (s.appearances||0)*0.3 + (p.rating||0)*0.5;
      if(score > bestScore){ bestScore = score; bestPlayer = p; }
      if(p.age <= 21 && score > bestYouthScore){ bestYouthScore = score; bestYouth = p; }
    });
  });
  if(bestPlayer && bestPlayer.club && state.clubs[bestPlayer.club]){
    const s = bestPlayer.stats.league;
    addNews(`🏆 ${leagueLabel} Yılın Oyuncusu: ${bestPlayer.name} (${state.clubs[bestPlayer.club].name}) — ${s.goals} gol, ${s.assists} asist.`, "award");
    if(bestPlayer.club === state.playerClubId){
      adjustFanApproval(4);
    }
  }
  if(bestYouth && bestYouth.club && state.clubs[bestYouth.club]){
    addNews(`🌟 ${leagueLabel} Yılın Genç Yeteneği: ${bestYouth.name} (${bestYouth.age} yaşında, ${state.clubs[bestYouth.club].name}).`, "award");
  }
  const myFinishPos = standings.findIndex(r=>r.id===state.playerClubId)+1;
  if(myFinishPos === 1){
    addNews(`👔 ${leagueLabel} şampiyonluğunun ardından yönetim kurulu sizi sezonun menajeri ilan etti!`, "award");
    adjustReputation(5);
  } else if(myFinishPos>=2 && myFinishPos<=3 && Math.random()<0.35){
    addNews(`👔 ${leagueLabel}'deki başarılı sezonunuzun ardından adınız "Sezonun Menajeri" adaylarından biri olarak anıldı.`, "award");
    adjustReputation(2);
  }
}
function newsDateLabel(n){
  const season = seasonLabel(n.year);
  return n.week ? `${season} · ${n.week}. hafta` : season;
}
function renderNewsFeedPanel(){
  ensureNewsFeed();
  if(!state.newsFeed.length) return "";
  const rows = state.newsFeed.slice(0, 10).map(n=>{
    const meta = NEWS_TYPE_META[n.type] || NEWS_TYPE_META.flavor;
    return `<div class="log-entry" style="padding:11px 12px;background:var(--panel-2);border-radius:8px;border-left:4px solid ${meta.color};margin-bottom:8px;font-size:12.5px;line-height:1.5;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div><span style="margin-right:6px;">${meta.icon}</span><span style="color:var(--ink)">${n.text}</span></div>
        <div style="flex:0 0 auto;white-space:nowrap;font-size:10.5px;color:var(--ink-dim);margin-top:1px;">${newsDateLabel(n)}</div>

    </div>`;
  }).join("");
  return `<div class="panel">
    <div class="panel-head"><h2><span class="kickoff-dot"></span>📰 Haberler</h2></div>
    ${rows}
  </div>`;
}

/* Kulüp seçim ekranında gösterilecek hat ortalamaları: kaleci hariç, oyuncular
   defans / orta saha / hücum olmak üzere 3 hatta tasnif edilip her hattın
   kadro içindeki ortalama gücü (rating) hesaplanır. */
const LINE_GROUP_OF_POS = {
  KL:"DEF",
  DF:"DEF", SB:"DEF", SLB:"DEF",
  OS:"MID", DOS:"MID", OOS:"MID",
  SK:"ATT", SLK:"ATT", FV:"ATT"
};
function clubLineAverages(club){
  const groups = {DEF:[], MID:[], ATT:[]};
  (club.squad||[]).forEach(pid=>{
    const p = state.players[pid];
    if(!p) return;
    const g = LINE_GROUP_OF_POS[p.pos];
    if(g && groups[g]) groups[g].push(p.rating);
  });
  const avg = arr => arr.length ? Math.round(arr.reduce((s,v)=>s+v,0)/arr.length) : 0;
  return { def: avg(groups.DEF), mid: avg(groups.MID), att: avg(groups.ATT) };
}

// Oyunun ilk (sıfır) durumunun bir kopyası — gerçek veri paketi yüklendiğinde
// dünyayı en baştan, güncel isimlerle yeniden kurmak için kullanılır.
const INITIAL_STATE_JSON = JSON.stringify(state);

/* ================= KAYIT SİSTEMİ (IndexedDB tabanlı) =================
   Bu oyunun dünyası (50 ülke, binlerce kulüp/oyuncu) tam durumu JSON'a
   çevrildiğinde onlarca megabayt tutuyor — bu da tarayıcıların localStorage
   kotasını (genelde ~5-10MB) fazlasıyla aşıyor ve HER kayıt denemesi
   sessizce "QuotaExceededError" ile başarısız oluyordu. Sonuç: sayfa
   yenilendiğinde ilerleme ve istatistikler kayboluyor, hiç kaydedilmemiş
   gibi görünüyordu. Çözüm: kayıtlar artık çok daha yüksek kotalı olan
   IndexedDB'de tutuluyor. Kodun geri kalanı senkron okuma beklediği için
   en son bilinen kayıt ayrıca bellekte (cachedSavePayload) tutulur. */
const SAVE_KEY = "transferMenajer_kayit_v1";
const IDB_DB_NAME = "transferMenajerDB";
const IDB_STORE_NAME = "saves";
let saveTimer = null;
let saveToastTimer = null;
let cachedSavePayload = null; // en son bilinen kayıt paketi (senkron okumalar için)
let idbReady = null;          // IndexedDB bağlantısı (Promise<IDBDatabase>)

function openSaveDB(){
  if(idbReady) return idbReady;
  idbReady = new Promise((resolve, reject) => {
    if(typeof indexedDB === "undefined"){ reject(new Error("IndexedDB desteklenmiyor")); return; }
    const req = indexedDB.open(IDB_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbReady;
}
function idbGetSave(){
  return openSaveDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_NAME, "readonly");
    const req = tx.objectStore(IDB_STORE_NAME).get(SAVE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbPutSave(payload){
  return openSaveDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_NAME, "readwrite");
    tx.objectStore(IDB_STORE_NAME).put(payload, SAVE_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
function idbDeleteSave(){
  return openSaveDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_NAME, "readwrite");
    tx.objectStore(IDB_STORE_NAME).delete(SAVE_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
// Sayfa açılışında (ve kayıt/silme sonrasında) belleğe en güncel kaydı alır.
// Diğer tüm kod senkron çalıştığından gerçek IndexedDB okuması burada,
// tek bir yerde asenkron yapılır; sonucu render() ile ekrana yansıtılır.
function refreshSavedPayloadCache(){
  if(typeof indexedDB === "undefined") return Promise.resolve(null);
  return idbGetSave().then(payload => {
    if(payload && payload.state && payload.state.playerClubId) cachedSavePayload = payload;
    return cachedSavePayload;
  }).catch((e) => { console.error("Kayıt okunamadı:", e); return null; });
}

function storageAvailable(){
  return typeof indexedDB !== "undefined";
}

function showSaveToast(msg, isErr){
  let el = document.getElementById("save-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "save-toast";
    el.className = "save-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = "save-toast show" + (isErr ? " err" : "");
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(()=>{ el.className = "save-toast"; }, 2200);
}

/* ================= KARİYER GEÇMİŞİ / MENAJER CV =================
   Kupa Odası kazanılan kupaları listelerken, bu bölüm her sezonun sonunda
   "hangi kulüpte, hangi ligde, kaçıncı sırada bitirdiniz" bilgisini kalıcı
   bir listeye ekler. Kulüp değiştirseniz ya da kovulsanız bile eski
   kulüplerdeki performansınız burada saklanır — bir menajer CV'si gibi. */
function recordCareerSeason(opts){
  state.careerHistory = state.careerHistory || [];
  const key = opts.year + ":" + opts.club.id;
  if(state.careerHistory.some(e=>e.key===key)) return; // aynı sezon iki kez kaydedilmesin

  const euroTitle = (function(){
    const sources = [
      {arr: state.clHistory, label:"Şampiyonlar Ligi"},
      {arr: state.elHistory, label:"Avrupa Ligi"},
      {arr: state.coHistory, label:"Konferans Ligi"},
      {arr: state.superCupHistory, label:"Süper Kupa"}
    ];
    for(const src of sources){
      const last = (src.arr || [])[0];
      if(last && last.year === opts.year && last.winnerId === opts.club.id) return src.label;
    }
    return null;
  })();

  state.careerHistory.unshift({
    key,
    year: opts.year,
    clubId: opts.club.id,
    clubName: opts.club.name,
    countryName: opts.club.countryName,
    leagueName: opts.club.tierName,
    finishPos: opts.finishPos,
    totalTeams: opts.standings.length,
    champion: opts.champion,
    promoted: opts.promoted,
    relegated: opts.relegated,
    fired: opts.fired,
    euroTitle
  });
  if(state.careerHistory.length > 60) state.careerHistory.length = 60;
}

function unlockAchievement(key){
  if(!ACHIEVEMENTS_CATALOG[key]) return;
  state.achievements = state.achievements || [];
  if(state.achievements.some(a=>a.key===key)) return; // zaten kazanılmış, tekrar tetiklenmesin
  const def = ACHIEVEMENTS_CATALOG[key];
  state.achievements.unshift({key, year: state.year});
  showToast(`🏅 Yeni Başarım: ${def.icon} ${def.title}`);
}

/* ================= KUPA ODASI ================= her kupa/şampiyonluk burada
   kalıcı bir listeye ekleniyor. state ile birlikte otomatik kaydedilir.
   "key" alanı aynı kupanın iki kez eklenmesini engeller. */
function addPlayerTrophy(trophy){
  state.playerTrophies = state.playerTrophies || [];
  const year = trophy.year !== undefined ? trophy.year : state.year;
  const key = trophy.key || (trophy.type+":"+year+":"+state.playerClubId);
  if(state.playerTrophies.some(t=>t.key===key)) return;
  state.playerTrophies.unshift(Object.assign({year, clubName: (state.clubs[state.playerClubId]||{}).name || "", key}, trophy));
  // ---- Başarımlar: kupa türüne ve toplam kupa sayısına göre tetiklenenler ----
  unlockAchievement('ilk_kupa');
  if(state.playerTrophies.length >= 3) unlockAchievement('uc_kupa');
  if(state.playerTrophies.length >= 5) unlockAchievement('bes_kupa');
  if(trophy.type === 'cl') unlockAchievement('sampiyonlar_ligi');
  if(trophy.type === 'el') unlockAchievement('el_sampiyonu');
  if(trophy.type === 'co') unlockAchievement('co_sampiyonu');
  if(trophy.type === 'supercup') unlockAchievement('supercup');
  if(trophy.type === 'league') unlockAchievement('lig_sampiyonu');
  if(trophy.type === 'promotion'){
    unlockAchievement('ilk_terfi');
    const promoCount = state.playerTrophies.filter(t=>t.type==='promotion').length;
    if(promoCount >= 3) unlockAchievement('uc_kez_terfi');
  }
}

// Bu özellik eklenmeden önce kazanılmış olabilecek ŞL/AL/KL/Süper Kupa
// şampiyonluklarını, mevcut geçmiş dizilerinden (clHistory vb.) tarayıp
// geriye dönük olarak playerTrophies listesine işler. Kupa Odası her
// açıldığında çağrılır, bu yüzden eski kayıtlar da otomatik yakalanır.
function syncHistoricalTrophies(){
  const pid = state.playerClubId;
  if(!pid) return;
  const sources = [
    {arr: state.clHistory,       type:'cl',       icon:'🏆', title:'Şampiyonlar Ligi', subtitle:'Şampiyon'},
    {arr: state.elHistory,       type:'el',       icon:'🥈', title:'Avrupa Ligi',       subtitle:'Şampiyon'},
    {arr: state.coHistory,       type:'co',       icon:'🥉', title:'Konferans Ligi',    subtitle:'Şampiyon'},
    {arr: state.superCupHistory, type:'supercup', icon:'⭐', title:'Süper Kupa',        subtitle:'Şampiyon'}
  ];
  sources.forEach(src=>{
    (src.arr || []).forEach(h=>{
      if(h.winnerId !== pid) return;
      addPlayerTrophy({type: src.type, icon: src.icon, title: src.title, subtitle: src.subtitle, year: h.year});
    });
  });
  state.playerTrophies.sort((a,b)=>(b.year||0)-(a.year||0));
}

function collectSavePayload(){
  return {
    v: 1,
    savedAt: Date.now(),
    state,
    activeTab,
    tableCountry,
    tableTierIdx
  };
}

function saveGame(manual){
  if(!storageAvailable()){
    if(manual) showSaveToast("Bu tarayıcıda kayıt depolaması kullanılamıyor", true);
    return false;
  }
  try{
    const payload = collectSavePayload();
    cachedSavePayload = payload; // senkron okumalar (Devam Et vb.) hemen güncellensin
    idbPutSave(payload).then(() => {
      if(manual) showSaveToast("Oyun kaydedildi ✓");
    }).catch((e) => {
      console.error("Kayıt hatası:", e);
      if(manual) showSaveToast("Kayıt başarısız — depolama alanı dolu olabilir", true);
    });
    return true;
  }catch(e){
    console.error("Kayıt hatası:", e);
    if(manual) showSaveToast("Kayıt başarısız — depolama alanı dolu olabilir", true);
    return false;
  }
}

function scheduleAutoSave(){
  if(!state.playerClubId) return;
  if(!storageAvailable()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveGame(false); }, 700);
}

function loadSavedPayload(){
  // Senkron: IndexedDB'nin kendisi asenkron olduğundan, en son bilinen
  // kayıt boot() sırasında (ve her kayıt/silme işleminden sonra) belleğe
  // (cachedSavePayload) alınır; burada sadece o bellek kopyası okunur.
  if(cachedSavePayload && cachedSavePayload.state && cachedSavePayload.state.playerClubId) return cachedSavePayload;
  return null;
}

function applySavedPayload(payload){
  state = payload.state;
  ensureManagerProfile();
  ensureNewsFeed();
  // Eski kayıtlarda tesis verisi olmayabilir — tüm kulüpler için güvenli varsayılan ata.
  Object.values(state.clubs||{}).forEach(c=>{ ensureFacilities(c); ensureSponsors(c); });
  activeTab = payload.activeTab || "dashboard";
  tableCountry = (typeof payload.tableCountry !== "undefined") ? payload.tableCountry : null;
  tableTierIdx = payload.tableTierIdx || 0;
}

function continueSavedGame(){
  const payload = loadSavedPayload();
  if(!payload){ showSaveToast("Kayıtlı oyun bulunamadı", true); return; }
  applySavedPayload(payload);
  render();
}

function confirmNewGame(){
  const hasSave = !!loadSavedPayload();
  if(hasSave && !confirm("Yeni bir oyuna başlarsan mevcut kayıtlı oyunun silinecek. Devam etmek istiyor musun?")) return;
  clearSavedGame();
  location.reload();
}

// Kayıtlı oyunu hem bellekten hem IndexedDB'den siler (senkron çağrılabilir;
// asıl silme arka planda tamamlanır).
function clearSavedGame(){
  cachedSavePayload = null;
  try{ idbDeleteSave().catch(()=>{}); }catch(e){}
}

/* ---- Ana Menü: oyun ilk açıldığında (henüz kulüp seçilmemişken) önce bu
   ekran gösterilir. "Yeni Oyun" ülke/kulüp seçim ekranına geçer; kayıtlı
   oyun varsa "Devam Et" doğrudan devam ettirir. ---- */
let pendingNewGame = false;

function startNewGameFromMenu(){
  const hasSave = !!loadSavedPayload();
  if(hasSave){
    pendingNewGame = true;
    showConfirmModal("Mevcut oyunu sil", "Yeni bir oyuna başlarsan mevcut kayıtlı oyunun silinecek. Emin misin?", "Evet, başla", "İptal",

        clearSavedGame();
        mainMenuScreen = false;
        render();
      },
      () => {

function backToMainMenu(){
  mainMenuScreen = true;
  setupCountry = null;

function manualSave(){ saveGame(true); }

function exportSave(){
  const payload = loadSavedPayload() || (state.playerClubId ? collectSavePayload() : null);
  if(!payload){ showSaveToast("Dışa aktarılacak bir oyun yok", true); return; }
  try{
    const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const club = payload.state.clubs ? payload.state.clubs[payload.state.playerClubId] : null;
    const clubName = club ? club.name.replace(/[^a-z0-9]+/gi,"_") : "kayit";
    a.href = url;
    a.download = "transfer-menajer-" + clubName + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showSaveToast("Kayıt dosyası indirildi ✓");
  }catch(e){
    console.error(e);
    showSaveToast("Dışa aktarma başarısız", true);
  }
}

function triggerImportSave(){
  const input = document.getElementById("save-file-input");
  if(input) input.click();
}

function handleImportFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload || !payload.state || !payload.state.playerClubId) throw new Error("geçersiz dosya");
      if(state.playerClubId && !confirm("Bir kayıt dosyası içe aktarılacak ve mevcut oyunun üzerine yazılacak. Devam edilsin mi?")) { fileInput.value=""; return; }
      applySavedPayload(payload);
      saveGame(false);
      render();
      showSaveToast("Kayıt içe aktarıldı ✓");
    }catch(err){
      console.error(err);
      showSaveToast("Geçersiz kayıt dosyası", true);
    }
    fileInput.value = "";
  };
  reader.readAsText(file);
}

/* ================= UTIL ================= */
function rid(){ return state.nextId++; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function seasonLabel(year){
  const startYY = (25 + year) % 100;
  const endYY = (26 + year) % 100;
  const pad = n => String(n).padStart(2,"0");
  return pad(startYY) + "/" + pad(endYY);
}
function weightedBand8589(){
  const r = Math.random();
  if(r < 0.42) return 85;
  if(r < 0.78) return 86;
  if(r < 0.93) return 87;
  if(r < 0.999) return 88;
  return 89;
}
function capYoungHighRating(rating){
  if(rating < 85) return rating;
  const r = Math.random();
  if(r < 0.0003) return Math.min(rating, 89);
  if(r < 0.005)  return 88;
  if(r < 0.03)   return 87;
  if(r < 0.20)   return 86;
  return 85;
}
const VALUE_CURVE = [
  {r:40, v:15000},
  {r:50, v:120000},
  {r:60, v:700000},
  {r:70, v:5000000},
  {r:80, v:25000000},
  {r:85, v:60000000},
  {r:90, v:130000000},
  {r:95, v:200000000},
  {r:99, v:260000000}
];
function baseValueForRating(rating){
  if(rating <= VALUE_CURVE[0].r) return VALUE_CURVE[0].v;
  for(let i=0;i<VALUE_CURVE.length-1;i++){
    const a = VALUE_CURVE[i], b = VALUE_CURVE[i+1];
    if(rating <= b.r){
      const t = (rating-a.r)/(b.r-a.r);
      return Math.round(a.v + t*(b.v-a.v));
    }
  }
  return VALUE_CURVE[VALUE_CURVE.length-1].v;
}
function growthAmount(gap){
  if(gap >= 12) return randInt(3,6);
  if(gap >= 6)  return randInt(2,4);
  return Math.random() < 0.5 ? 1 : 0;
}
function computeAgeFactor(age, retireAge){
  const ra = retireAge || 37;
  const yearsLeft = clamp(ra - age, 0, 20);
  if(age <= 21) return 1.35 + yearsLeft*0.01;
  if(age <= 24) return 1.15 + yearsLeft*0.02;
  if(age <= 29) return 1.0 + yearsLeft*0.025;
  if(age <= 33) return 0.75 + yearsLeft*0.01;
  return 0.5;
}
function recalcValue(p){
  const ageFactor = computeAgeFactor(p.age, p.retireAge);
  const curveValue = baseValueForRating(p.rating);
  const potentialBonus = Math.max(0, p.potential - p.rating) * 60000;
  const rawValue = curveValue * ageFactor + potentialBonus;
  p.value = Math.max(15000, Math.round(rawValue / 100000) * 100000);
  // NOT: maaş burada artık otomatik güncellenmiyor — oyuncunun değeri/gücü
  // sezon içinde değişse bile maaşı sabit kalır. Maaş sadece oyuncu ilk
  // oluşturulurken (initialWageFor) ya da bir sözleşme pazarlığı/yenilemesi
  // sonucunda değişir.
}
function initialWageFor(value){
  return Math.max(12000, Math.round((value*0.08)/1000)*1000);
}
function weightedPick(items){
  const total = items.reduce((s,i)=>s+i.weight,0);
  let r = Math.random()*total;
  for(const it of items){ if(r<it.weight) return it; r-=it.weight; }
  return items[items.length-1];
}
function fmtMoney(v){
  return "€" + (v>=1000000? (v/1000000).toFixed(1).replace(/\.0$/,"")+"M" : (v/1000).toFixed(0)+"K");
}
// Sayı giriş kutularına yazarken otomatik binlik nokta ayracı ekler (7000000 -> 7.000.000)
function fmtThousands(n){ return Number(n||0).toLocaleString('tr-TR'); }

/* ---- Sözleşme bitiş TARİHİ: contractYears (kaç sezon kaldığı) hâlâ tüm
   oyun mantığının üzerine kurulu olduğu asıl sayaç — sezon sonunda hâlâ o
   düşürülüyor. Ama artık her sözleşme imzalandığı/yenilendiği ANDA gerçek
   takvime bağlı bir bitiş tarihi de hesaplanıp saklanıyor (contractUntilDate),
   böylece "3 yıl kaldı" gibi soyut bir sayı yerine oyuncuya ve kullanıcıya
   "Haz 2029'a kadar" gibi somut, gerçekçi bir tarih gösterebiliyoruz.
   Sözleşmeler gerçek futbolda olduğu gibi her zaman bir sezonun sonunda
   (30 Haziran) biter — imza kışın ya da yazın atılmış olsun fark etmez. ---- */
function currentGameDate(){
  if(state.fixtureMatches && state.fixtureMatches.length && state.fixtureMatchIdx < state.fixtureMatches.length && state.fixtureMatches[state.fixtureMatchIdx] && state.fixtureMatches[state.fixtureMatchIdx].date){
    return state.fixtureMatches[state.fixtureMatchIdx].date;
  }
  return new Date(2025 + state.year, 7, 1); // sezon henüz başlamadıysa: 1 Ağustos (sezon başı)
}
function computeContractEndDate(years){
  if(!years) return null;
  const today = currentGameDate();
  const m = today.getMonth(); // 0=Ocak ... 7=Ağustos
  const thisSeasonEndYear = (m >= 7) ? today.getFullYear() + 1 : today.getFullYear();
  return new Date(thisSeasonEndYear + (years - 1), 5, 30); // 30 Haziran
}
const TR_MONTHS_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function formatContractEnd(date){
  if(!date) return '';
  return TR_MONTHS_SHORT[date.getMonth()] + ' ' + date.getFullYear();
}
/* ---- Bir oyuncuya contractYears atanan HER yerden bunu da çağırıyoruz;
   sözleşme süresini set ettiğiniz p.contractYears satırının hemen altına
   p.contractUntilDate = tagContractDate(p, years); eklemeniz yeterli. ---- */
function tagContractDate(p, years){
  const d = computeContractEndDate(years);
  if(p) p.contractUntilDate = d;
  return d;
}
function formatMoneyInput(el, callback){
  const digits = el.value.replace(/[^\d]/g,'');
  const num = digits ? parseInt(digits,10) : 0;
  const formatted = digits ? fmtThousands(num) : "";
  el.value = formatted;
  callback(num);
}
/* ---- Serbest oyuncu pazarı hedef olarak 20 oyuncu civarında tutulur; sezon
   içinde biraz esneyip 22'ye kadar çıkabilir, bu sınır aşılınca en eski
   girdiler silinerek tekrar 20'ye indirilir. ---- */
const MARKET_TARGET_CAP = 20;
const MARKET_HARD_CAP = 22;
function trimMarketOverflow(){
  if(state.market.length > MARKET_HARD_CAP){
    const overflow = state.market.slice(0, state.market.length-MARKET_TARGET_CAP);
    state.market = state.market.slice(state.market.length-MARKET_TARGET_CAP);
    overflow.forEach(pid=>{ delete state.players[pid]; });
  }
}
function clubWageBill(clubId){
  const club = state.clubs[clubId];
  if(!club) return 0;
  // Kadrodaki oyuncular: eğer oyuncu başka bir kulüpten kiralıksa maaşın
  // sadece BURADAKİ kulübün (kiralayanın) üstlendiği pay kadarı ödenir —
  // kalan pay sahibi kulübün maaş bill'ine ayrıca eklenir (aşağıda).
  const playerWages = club.squad.reduce((s,pid)=>{
    const p=state.players[pid];
    if(!p) return s;
    if(p.loanFromClub){
      const ownerSharePct = clamp(p.loanWageSharePct||0, 0, 100);
      return s + Math.round(p.wage * (100-ownerSharePct) / 100);
    }
    return s + p.wage;
  },0);
  // Kiralığa gönderdiğim ve maaşının bir kısmını üstlendiğim oyuncular
  const loanedOutWageShare = Object.values(state.players).reduce((s,p)=>{
    if(p.loanFromClub === clubId){
      const ownerSharePct = clamp(p.loanWageSharePct||0, 0, 100);
      if(ownerSharePct > 0) return s + Math.round(p.wage * ownerSharePct / 100);
    }
    return s;
  },0);
  const scoutWages = (club.scouts||[]).reduce((s,sc)=>{ const tier=SCOUT_TIERS[sc.tierIdx]; return s + (tier?tier.annualWage:0); },0);
  return playerWages + loanedOutWageShare + scoutWages;
}
function signingBonusFor(p){
  return Math.max(50000, Math.round((p.value*0.03)/100000)*100000);
}
function tierOf(rating){
  if(rating>=85) return "purple";
  if(rating>=75) return "gold";
  if(rating>=65) return "silver";
  return "bronze";
}

// Mevkiye göre 6 temel özelliğin OVR'a göre sapma profili (FV=santrafor, KL=kaleci, vb.)
const FIFA_OUTFIELD_PROFILE = {
  FV:  {PAC:4,  SHO:7,  PAS:-9,  DRI:2,  DEF:-26, PHY:1},
  SK:  {PAC:8,  SHO:-2, PAS:1,   DRI:6,  DEF:-22, PHY:-7},
  SLK: {PAC:8,  SHO:-2, PAS:1,   DRI:6,  DEF:-22, PHY:-7},
  OOS: {PAC:-1, SHO:3,  PAS:7,   DRI:6,  DEF:-19, PHY:-9},
  OS:  {PAC:-4, SHO:-6, PAS:7,   DRI:2,  DEF:-1,  PHY:2},
  DOS: {PAC:-6, SHO:-11,PAS:3,   DRI:-3, DEF:9,   PHY:7},
  SB:  {PAC:6,  SHO:-15,PAS:0,   DRI:-2, DEF:5,   PHY:-2},
  SLB: {PAC:6,  SHO:-15,PAS:0,   DRI:-2, DEF:5,   PHY:-2},
  DF:  {PAC:-5, SHO:-21,PAS:-7,  DRI:-11,DEF:11,  PHY:9}
};
const FIFA_GK_PROFILE = {DIV:2, HAN:0, KIC:-9, REF:3, SPD:-16, POS:1};
// Kartlarda gösterilecek mevki kısaltmaları (oyunun diğer yerlerindeki kısaltmalarla aynı)
const FIFA_POS_SHORT = {KL:"KL", DF:"DF", SB:"SĞB", SLB:"SLB", OS:"OS", DOS:"DOS", OOS:"OOS", SK:"SĞK", SLK:"SLK", FV:"ST"};

// Oyuncu id'sine bağlı deterministik rastgelelik (her render'da aynı özellikleri üretir)
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function computeFifaStats(p){
  if(p._fcCache && p._fcCache.r === p.rating) return p._fcCache.stats;
  const rng = mulberry32(p.id*9301 + 49297);
  const r = p.rating;
  const stats = {};
  const profile = p.pos === "KL" ? FIFA_GK_PROFILE : (FIFA_OUTFIELD_PROFILE[p.pos] || FIFA_OUTFIELD_PROFILE.OS);
  Object.keys(profile).forEach(k=>{
    const variance = Math.round((rng()-0.5)*10); // -5..+5
    stats[k] = clamp(r + profile[k] + variance, 20, 99);
  });
  p._fcCache = {r, stats};
  return stats;
}

function fifaCardColors(rating){
  if(rating>=90) return {c1:"#F8F5EA", c2:"#D9C77A", text:"#3A2F10", accent:"#B08D2E", label:"İKON"};
  if(rating>=85) return {c1:"#6B4FC2", c2:"#2E1E5E", text:"#F3F0FF", accent:"#C9B6FF", label:"ÖZEL"};
  if(rating>=75) return {c1:"#C89A2E", c2:"#5C4008", text:"#FFF7E0", accent:"#F5D98A", label:"ALTIN"};
  if(rating>=65) return {c1:"#9AA3AE", c2:"#454C55", text:"#F3F4F6", accent:"#E1E5E9", label:"GÜMÜŞ"};
  return {c1:"#B9814C", c2:"#5A3A1E", text:"#FBEEDD", accent:"#E9BE8F", label:"BRONZ"};
}

    ? [["UÇ",stats.DIV],["TUT",stats.HAN],["VUR",stats.KIC],["REF",stats.REF],["HIZ",stats.SPD],["POZ",stats.POS]]
    : [["HIZ",stats.PAC],["ŞUT",stats.SHO],["PAS",stats.PAS],["DRI",stats.DRI],["DEF",stats.DEF],["FİZ",stats.PHY]];

    <div class="fc-top">

    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;">
      ${flag?`<span style="font-size:14px;">${flag}</span>`:""}

function genName(countryCode){
  const groupIdx = countryCode ? COUNTRY_NAME_GROUP[countryCode] : undefined;
  const g = (groupIdx !== undefined) ? NAME_GROUPS[groupIdx] : pick(NAME_GROUPS);
  if(g.pairsByCountry){
    const pairs = (countryCode && g.pairsByCountry[countryCode]) ? g.pairsByCountry[countryCode] : pick(Object.values(g.pairsByCountry));
    const pr = pick(pairs);
    return pr[0]+" "+pr[1];
  }
  return pick(g.first)+" "+pick(g.last);
}
function clubIdFor(countryCode, tierIdx, name){ return "club_"+countryCode+"_"+tierIdx+"_"+name.replace(/[^a-zA-Z0-9]/g,""); }
function countryByCode(code){ return COUNTRIES.find(c=>c.code===code); }
// ---- Kademe (level) yardımcıları: Normalde her tier kendi index'i kadar bir
// kademeyi temsil eder (0=en üst). Ama TFF 2. Lig gibi aynı kademede paralel
// gruplar (A/B) olan ülkelerde birden fazla tier aynı "level" değerini paylaşır
// (tier.level alanı ile belirtilir). Bu fonksiyonlar hiyerarşiyi (yükselme/
// düşme) index yerine bu level değerine göre hesaplamayı sağlar.
function tierLevelOf(tier, idx){ return (tier && tier.level !== undefined) ? tier.level : idx; }
function tiersByLevel(country){
  const map = {};
  country.tiers.forEach((tier, idx)=>{
    const lvl = tierLevelOf(tier, idx);
    (map[lvl] = map[lvl] || []).push({tier, idx});
  });
  return Object.keys(map).map(Number).sort((a,b)=>a-b).map(lvl=>({level:lvl, group:map[lvl]}));
}
function bottomLevelTierIndices(country){
  const levels = tiersByLevel(country);
  return levels.length ? levels[levels.length-1].group.map(g=>g.idx) : [];
}
function countryFlag(code){ const c = countryByCode(code); return c ? c.flag : "🏳️"; }

const CREST_STOPWORDS = new Set(["FC","CF","SC","AC","AS","CD","CA","UD","RC","US","SK","BK","IF","IK","VfB","VfL","TSV","TSG","RB","AFC","CS","JS","MC","MS","USM","ASO","EGS","ES"]);
function clubInitials(name){
  let words = name.split(/\s+/).filter(w => w && !CREST_STOPWORDS.has(w) && !/^\d/.test(w));
  if(words.length===0) words = name.split(/\s+/);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return (words[0]||name).substring(0,2).toUpperCase();
}
function shadeColor(hex, percent){
  const n = parseInt(hex.slice(1),16);
  const amt = Math.round(2.55*percent);
  let r = (n>>16)+amt, g = (n>>8 & 0x00FF)+amt, b = (n & 0x0000FF)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return "#"+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
const crestCache = {};

  const key = club.id+"_"+size;

  const initials = clubInitials(club.name);
  const c1 = club.color;
  const c2 = shadeColor(club.color, -22);
  const h = Math.round(size*1.15);
  const svg = `<span class="crest" style="width:${size}px;height:${h}px;"><svg viewBox="0 0 100 116" width="${size}" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${club.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <path d="M50 3 L95 19 L95 56 C95 89 74 108 50 114 C26 108 5 89 5 56 L5 19 Z" fill="url(#g${club.id})" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>

      let weakestIdx = 0;
      club.squad.forEach((pid, idx)=>{
        if(state.players[pid].rating < state.players[club.squad[weakestIdx]].rating) weakestIdx = idx;
      });
      const removedId = club.squad[weakestIdx];
      delete state.players[removedId];
      const potential = (def.potential !== undefined) ? def.potential
        : (def.age <= 23 ? clamp(def.rating + randInt(2,6), def.rating, 99) : def.rating);
      const retireAge = (def.retireAge !== undefined) ? def.retireAge
        : clamp(def.age + randInt(3,8), def.age+1, 41);
      const p = {
        id: rid(), name: def.name, age: def.age, pos: def.pos, posLabel: (POSITIONS.find(x=>x.code===def.pos)||{}).label || def.pos,
        rating: def.rating, potential, value:0, wage:0, club:id, wonderkid:false, retireAge, morale: randInt(65,85)
      };
      const nation = countryByCode(def.country || entry.country);
      if(nation){ p.countryCode = nation.code; p.countryName = nation.name; p.flag = nation.flag; }
      if(def.growthSeasons !== undefined){
        p.customGrowth = { seasonsLeft: def.growthSeasons, perSeason: def.growthPerSeason || 1, peakLeft: def.peakSeasons || 0 };
      }
      recalcValue(p);
      p.wage = initialWageFor(p.value);
      state.players[p.id] = p;
      club.squad[weakestIdx] = p.id;
    });
  });
}

const AGE_WEIGHTS = [
  {age:16,weight:3},{age:17,weight:7},{age:18,weight:20},{age:19,weight:23},
  {age:20,weight:20},{age:21,weight:14},{age:22,weight:8},{age:23,weight:5}
];

function computeTotalInitialSlots(){
  let total = 0;
  COUNTRIES.forEach(country=>{
    country.tiers.forEach((tier, tierIdx)=>{
      const squadSize = tierIdx===0 ? 24 : 20;
      total += tier.clubs.length * squadSize;
    });
  });
  return total;
}
function buildInitialRatingPool(){
  const totalSlots = computeTotalInitialSlots();
  const pool = [];
  RATING_TIERS.forEach(t=>{
    for(let i=0;i<t.count;i++){
      if(t.min===85 && t.max===89) pool.push(weightedBand8589());
      else pool.push(randInt(t.min,t.max));
    }
  });
  while(pool.length < totalSlots){
    const base = Math.pow(Math.random(), 1.1);
    pool.push(clamp(Math.round(48 + base*24), 48, 72));
  }
  pool.sort((a,b)=>b-a);
  initialRatingPool = pool;
}
function clubPrestigeScore(country, tierIdx, isBig){
  let score = country.strength * 100;
  if(tierIdx === 0) score += 40; else score -= tierIdx * 25;
  if(isBig) score += 35;
  return score;
}
function assignSquadFromPool(pool, squadSize){
  const picks = [];
  for(let i=0;i<squadSize;i++){
    if(pool.length===0){ picks.push(randInt(52,68)); continue; }
    const windowSize = Math.min(pool.length, Math.max(squadSize*2, 24));
    const r = Math.pow(Math.random(), 1.5);
    const idx = Math.min(windowSize-1, Math.floor(r*windowSize));
    picks.push(pool.splice(idx,1)[0]);
  }
  return diversifySquadRatings(picks);
}
// Havuzun büyük kısmı dar bir aralıkta (özellikle zayıf takımlar için 52-68 dolgu
// değerleri) üretildiğinden, aynı takıma çok sayıda birebir aynı OVR düşebiliyordu
// (örn. bir takımda 9 tane 52). Bu fonksiyon bir kadro içinde aynı değeri 2'den
// fazla tekrar eden oyuncuları hafifçe (ama rastgele) farklılaştırır; genel güç
// seviyesi neredeyse aynı kalır ama sayılar artık tekdüze görünmez.
function diversifySquadRatings(picks){
  const counts = {};
  return picks.map(r=>{
    counts[r] = (counts[r]||0) + 1;
    if(counts[r] <= 2) return r;
    const spread = Math.min(2 + counts[r], 9);
    const jitter = randInt(-spread, spread);
    return clamp(r + jitter, 40, 94);
  });
}

function generatePlayer({minAge=18,maxAge=32,skew=0.62,wonderkidChance=0.03,ageWeights=null,presetRating=null,register=true,countryCode=null}={}){
  const pos = weightedPick(POSITIONS);
  let age = ageWeights ? weightedPick(ageWeights.map(a=>({...a}))).age : randInt(minAge,maxAge);
  let rating, isWonderkid = false;
  if(presetRating !== null){
    rating = presetRating;
    isWonderkid = (rating >= 82 && age <= 19);
  } else {
    let base = Math.pow(Math.random(), skew);
    rating = Math.round(56 + base*32);
    if(Math.random() < wonderkidChance && age <= 19){
      rating = clamp(rating + randInt(6,13), 60, 94);
      isWonderkid = true;
    }
    rating = clamp(rating, 45, 94);
  }
  if(age < 21) rating = capYoungHighRating(rating);
  const headroom = Math.max(0, Math.round((23-age)*2.1 + randInt(0,9)));
  let potential = clamp(rating + headroom, rating, 99);
  if(isWonderkid) potential = clamp(potential + randInt(3,8), potential, 99);
  if(age > 26) potential = rating;
  const retireAge = randInt(35,40);
  const p = { id: rid(), name: genName(countryCode), age, pos: pos.code, posLabel: pos.label, rating, potential, value: 0, wage: 0, club: null, wonderkid: isWonderkid, retireAge, morale: randInt(65,85) };
  const nationCode = countryCode || pick(COUNTRIES).code;
  const nation = countryByCode(nationCode);
  if(nation){ p.countryCode = nation.code; p.countryName = nation.name; p.flag = nation.flag; }
  recalcValue(p);
  p.wage = initialWageFor(p.value);
  if(register) state.players[p.id] = p;
  return p;
}
function injurePlayer(pid){
  const p = state.players[pid];
  if(!p || p.injured || !p.club || p.club === "retired" || p.club === "sold") return;
  
  const injuryTypes = INJURY_TYPES.map(i => ({...i, weight: i.chance}));
  const injury = weightedPick(injuryTypes);
  const days = randInt(injury.minDays, injury.maxDays);
  const weeks = Math.ceil(days / 7);
  
  p.injured = true;
  p.injuryWeeks = weeks;
  p.injuryType = injury.name;

  // Sakatlanınca kadro düzeninden (varsa) otomatik çıkar
  const lu = state.lineup[p.club];
  if(lu) Object.keys(lu.assignments).forEach(k=>{ if(lu.assignments[k]===pid) delete lu.assignments[k]; });

  showToast(p.name+" yaralandi! "+injury.name+" ("+weeks+" maç)");
}

// Oyuncu cezalı hale geldiğinde kadro düzeninden (varsa) otomatik çıkar (sakatlıkla aynı mantık)
function removeFromLineupAssignments(pid, clubId){
  const lu = state.lineup[clubId];
  if(lu) Object.keys(lu.assignments).forEach(k=>{ if(String(lu.assignments[k])===String(pid)) delete lu.assignments[k]; });
}

// Yarışmaya göre (lig / şl / al) ayrı istatistik tutuyoruz.
// Eski kayıtlarda p.stats düz bir obje olabilir (goals/assists/... doğrudan üstte) —
// bu durumda eski verileri lig istatistiklerine taşıyoruz.
function emptyCompStats(){ return {goals:0, assists:0, appearances:0, saves:0, yellowCards:0, redCards:0, cleanSheets:0}; }
function ensureStatsShape(p){
  if(!p.stats || !p.stats.league || !p.stats.cl || !p.stats.el || !p.stats.co){
    const old = p.stats || {};
    p.stats = {
      league: old.league || {
        goals: old.goals||0, assists: old.assists||0, appearances: old.appearances||0,
        saves: old.saves||0, cleanSheets: old.cleanSheets||0,
        yellowCards: old.yellowCards||0, redCards: old.redCards||0
      },
      cl: old.cl || emptyCompStats(),
      el: old.el || emptyCompStats(),
      co: old.co || emptyCompStats()
    };
  }
}

function bookPlayerCards(pid, compKey){
  const p = state.players[pid];
  if(!p || !p.club || p.club === "retired" || p.club === "sold") return;
  ensureStatsShape(p);
  const s = p.stats[compKey] || (p.stats[compKey] = emptyCompStats());

  const roll = Math.random()*100;
  if(roll < RED_CARD_CHANCE){
    // Direkt kırmızı kart
    p.directReds = (p.directReds||0) + 1;
    const banLen = directRedBanLength(p.directReds);
    p.suspensionMatches = (p.suspensionMatches||0) + banLen;
    s.redCards = (s.redCards||0) + 1;
    removeFromLineupAssignments(pid, p.club);
    showToast(p.name+" direkt kırmızı kart gördü! ("+p.directReds+". kez) "+banLen+" maç ceza.");
    return;
  }
  if(roll < RED_CARD_CHANCE + YELLOW_CARD_CHANCE){
    if(Math.random()*100 < SECOND_YELLOW_CHANCE){
      // Aynı maçta 2. sarıdan kırmızı
      p.secondYellowReds = (p.secondYellowReds||0) + 1;
      p.suspensionMatches = (p.suspensionMatches||0) + 1;
      s.redCards = (s.redCards||0) + 1;
      removeFromLineupAssignments(pid, p.club);
      showToast(p.name+" aynı maçta 2. sarı kartını gördü, kırmızıya döndü! 1 maç ceza.");
      return;
    }
    p.yellowCards = (p.yellowCards||0) + 1;
    s.yellowCards = (s.yellowCards||0) + 1;
    p.yellowThresholdIdx = p.yellowThresholdIdx || 0;
    let triggered = false;
    let threshold = nextYellowThreshold(p.yellowThresholdIdx);
    while(p.yellowCards >= threshold){
      const banLen = yellowBanLengthForThreshold(threshold);
      p.suspensionMatches = (p.suspensionMatches||0) + banLen;
      p.yellowThresholdIdx++;
      threshold = nextYellowThreshold(p.yellowThresholdIdx);
      triggered = true;
    }
    if(triggered){
      removeFromLineupAssignments(pid, p.club);
      showToast(p.name+" "+p.yellowCards+". sarı kartına ulaştı! Ceza uygulandı.");
    } else {
      showToast(p.name+" sarı kart gördü. (Toplam: "+p.yellowCards+")");
    }
  }
}
function decrementSuspensions(clubId){
  const club = state.clubs[clubId];
  if(!club) return;
  club.squad.forEach(pid=>{
    const p = state.players[pid];
    if(p && p.suspensionMatches > 0) p.suspensionMatches--;
  });
}
/* Sakatlık artık takvim haftasına değil, kulübün oynadığı maç sayısına göre azalır.
   Her maçtan sonra çağrılır: kaç maç sakat kalacağı 1 azalır, 0'a inince oyuncu iyileşir. */
function decrementInjuries(clubId){
  const club = state.clubs[clubId];
  if(!club) return;
  club.squad.forEach(pid=>{
    const p = state.players[pid];
    if(p && p.injured && p.injuryWeeks > 0){
      p.injuryWeeks--;
      if(p.injuryWeeks <= 0){
        p.injured = false;
        p.injuryType = null;
        p.injuryWeeks = 0;
        showToast(p.name+" sakatlığı bitti, kadroya geri döndü!");
      }
    }
  });
}

function seedOpeningSuperCup(){

}

/* ================= GERÇEK VERİ PAKETİ İÇE AKTARMA =================
   Ayrı bir tarayıcı aracıyla (thesportsdb.com'dan) üretilen JSON paketini
   yükleyip COUNTRIES'teki sahte kulüp isimlerini gerçekleriyle değiştirir
   ve REAL_PLAYERS_BY_CLUB'a gerçek oyuncu kadrolarını ekler. Paket formatı:
   { clubNames: { "TR": ["Galatasaray","Fenerbahçe",...], ... },
     realPlayers: [ {country:"TR", tierIdx:0, club:"Galatasaray",
                      players:[{name,pos,age,rating,country?}]} , ... ] }
*/
function triggerRealDataUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const pack = JSON.parse(ev.target.result);
        applyRealDataPack(pack);
      }catch(err){
        alert('Geçersiz veri paketi dosyası: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function applyRealDataPack(pack){
  let appliedCountries = 0, appliedPlayers = 0, appliedClubs = 0;

  if(pack.clubNames){
    Object.keys(pack.clubNames).forEach(code=>{
      const country = countryByCode(code);
      const names = pack.clubNames[code];
      if(!country || !country.tiers[0] || !Array.isArray(names) || !names.length) return;
      country.tiers[0].clubs = names.slice();
      appliedCountries++;
      appliedClubs += names.length;
    });
  }

  if(Array.isArray(pack.realPlayers)){
    const touchedKeys = new Set(pack.realPlayers.map(e=>`${e.country}|${e.tierIdx}|${e.club}`));
    for(let i=REAL_PLAYERS_BY_CLUB.length-1;i>=0;i--){
      const e = REAL_PLAYERS_BY_CLUB[i];
      if(touchedKeys.has(`${e.country}|${e.tierIdx}|${e.club}`)) REAL_PLAYERS_BY_CLUB.splice(i,1);
    }
    pack.realPlayers.forEach(entry=>{
      REAL_PLAYERS_BY_CLUB.push(entry);
      appliedPlayers += (entry.players || []).length;
    });
  }

  if(appliedCountries === 0 && appliedPlayers === 0){
    alert('Bu dosyada uygulanacak geçerli veri bulunamadı.');
    return;
  }

  // Dünyayı sıfırdan, güncel isim ve kadrolarla yeniden kur.
  state = JSON.parse(INITIAL_STATE_JSON);
  setupWorld();
  seedOpeningSuperCup();
  render();
  alert(`Veri paketi uygulandı!\n${appliedCountries} ülke güncellendi (${appliedClubs} kulüp)\n${appliedPlayers} gerçek oyuncu eklendi`);
}

let rdStats = { clubs:0, players:0 };
let rdCancelled = false;
let rdRunning = false;
const RD_CONCURRENCY = 4;

function rdSleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function rdRunWithConcurrency(items, limit, worker){
  let idx = 0;
  async function runner(){
    while(idx < items.length){
      if(rdCancelled) return;
      const my = idx++;
      await worker(items[my], my);
    }
  }
  const runners = [];
  for(let i=0;i<Math.min(limit, items.length);i++) runners.push(runner());
  await Promise.all(runners);
}
function rdApiKey(){
  const el = document.getElementById('rd-api-key');
  const v = el ? el.value.trim() : '';
  return v || '123';
}
function rdTsdbUrl(path){
  return `https://www.thesportsdb.com/api/v1/json/${rdApiKey()}/${path}`;
}
async function rdFetchJSON(url, attempts = 3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    if(rdCancelled) throw new Error('İptal edildi');
    try{
      const res = await fetch(url);
      if(res.status === 429) throw new Error('HTTP 429 (rate limit)');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }catch(e){
      lastErr = e;
      try{
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
        const res2 = await fetch(proxyUrl);
        if(res2.status === 429) throw new Error('Proxy HTTP 429 (rate limit)');
        if(!res2.ok) throw new Error('Proxy HTTP ' + res2.status);
        return await res2.json();
      }catch(e2){ lastErr = e2; }
    }
    if(i < attempts-1) await rdSleep(500 + i*700);
  }
  throw lastErr || new Error('Bilinmeyen hata');
}
async function rdFetchOpenFootballTeams(code){
  const slug = RD_OPENFOOTBALL_LEAGUES[code];
  if(!slug) return null;
  const url = `https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/${slug}.json`;
  const res = await fetch(url);
  if(!res.ok) return null;
  const data = await res.json();
  const names = new Set();
  (data.matches || []).forEach(m=>{ if(m.team1) names.add(m.team1); if(m.team2) names.add(m.team2); });
  return Array.from(names);
}
async function rdResolveTeamId(name){
  try{
    const data = await rdFetchJSON(rdTsdbUrl(`searchteams.php?t=${encodeURIComponent(name)}`));
    const teams = (data && data.teams) || [];
    if(teams.length) return teams[0].idTeam;
  }catch(e){}
  const simplified = name.replace(/\b(FC|CF|AFC|SK|SC|CD|UD|RC|AC|1\.)\b/gi,'').replace(/\s+/g,' ').trim();
  if(simplified && simplified !== name){
    try{
      const data2 = await rdFetchJSON(rdTsdbUrl(`searchteams.php?t=${encodeURIComponent(simplified)}`));
      const teams2 = (data2 && data2.teams) || [];
      if(teams2.length) return teams2[0].idTeam;
    }catch(e){}
  }
  return null;
}
function rdLog(msg, cls){
  const el = document.getElementById('rd-log');
  if(!el) return;
  const line = document.createElement('div');
  if(cls) line.style.color = cls === 'ok' ? 'var(--green-pos)' : cls === 'err' ? 'var(--red-neg)' : cls === 'warn' ? 'var(--gold)' : 'var(--cyan)';
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function rdSetProgress(pct, text){
  const bar = document.getElementById('rd-bar');
  const status = document.getElementById('rd-status');
  if(bar) bar.style.width = pct + '%';
  if(status) status.textContent = text;
}
async function rdProcessTeam(code, teamRef){
  const name = (typeof teamRef === 'string') ? teamRef : teamRef.strTeam;
  let idTeam = (typeof teamRef === 'string') ? null : teamRef.idTeam;
  if(!idTeam) idTeam = await rdResolveTeamId(name);

  let players = [], playerErr = null;
  if(idTeam){
    try{
      const playersData = await rdFetchJSON(rdTsdbUrl(`lookup_all_players.php?id=${idTeam}`));
      players = (playersData && playersData.player) || [];
    }catch(e){ playerErr = e; }
  }
  const mappedPlayers = players.slice(0, 22).map(p=>{
    const entry = { name: p.strPlayer, pos: rdMapPosition(p.strPosition), age: rdGuessAge(p.dateBorn), rating: rdGuessRating() };
    const nationCode = rdMapNation(p.strNationality);
    if(nationCode) entry.country = nationCode;
    return entry;
  }).filter(p=>p.name);

  if(!rdLive.clubNames[code]) rdLive.clubNames[code] = [];
  rdLive.clubNames[code].push(name);
  rdStats.clubs++;
  if(mappedPlayers.length){
    rdLive.realPlayers.push({ country: code, tierIdx: 0, club: name, players: mappedPlayers });
    rdStats.players += mappedPlayers.length;
    rdLog(`  ✓ ${name} — ${mappedPlayers.length} oyuncu`, 'ok');
  }else if(!idTeam){
    rdLog(`  ⚠ ${name} — TheSportsDB'de eşleşen takım bulunamadı, sadece isim eklendi`, 'warn');
  }else if(playerErr){
    rdLog(`  ⚠ ${name} — kadro alınamadı (${playerErr.message}), sadece kulüp adı eklendi`, 'warn');
  }else{
    rdLog(`  ⚠ ${name} — API bu takım için kadro döndürmedi, sadece kulüp adı eklendi`, 'warn');
  }
}
async function rdBuildAndApply(){
  const selected = Array.from(document.querySelectorAll('.rd-country-check:checked')).map(cb=>cb.value);
  if(selected.length === 0){ alert('En az bir ülke seç.'); return; }

  rdRunning = true; rdCancelled = false;
  rdLive = { clubNames:{}, realPlayers:[] };
  rdStats = { clubs:0, players:0 };
  const logEl = document.getElementById('rd-log');
  if(logEl) logEl.innerHTML = '';
  document.getElementById('rd-start-btn').disabled = true;
  document.getElementById('rd-cancel-btn').style.display = 'inline-block';

  rdLog(rdApiKey() === '123'
    ? 'ℹ Ücretsiz test anahtarı (123) kullanılıyor — bazı liglerde sonuç sayısı kısıtlı olabilir.'
    : '✓ Kişisel API anahtarı kullanılıyor — sonuçlar kısıtlanmamalı.', rdApiKey()==='123' ? 'warn' : 'ok');

  for(let ci = 0; ci < selected.length; ci++){
    if(rdCancelled) break;
    const code = selected[ci];
    const league = RD_COUNTRY_LEAGUES[code];
    rdSetProgress(Math.round((ci/selected.length)*100), `${league.name} işleniyor (${ci+1}/${selected.length}) — toplam ${rdStats.clubs} kulüp, ${rdStats.players} oyuncu`);
    rdLog(`\n=== ${league.name} ===`, 'club');

    let teams, sourceLabel;
    if(RD_OPENFOOTBALL_LEAGUES[code]){
      try{
        const ofNames = await rdFetchOpenFootballTeams(code);
        if(ofNames && ofNames.length){ teams = ofNames; sourceLabel = 'openfootball (sınırsız)'; }
      }catch(e){}
    }
    if(!teams){
      let teamsData;
      try{
        teamsData = await rdFetchJSON(rdTsdbUrl(`search_all_teams.php?l=${league.q}`));
      }catch(e){
        rdLog(`  Lig bulunamadı, atlanıyor: ${e.message}`, 'err');
        continue;
      }
      teams = ((teamsData && teamsData.teams) || []).slice(0, 24);
      sourceLabel = 'TheSportsDB';
    }
    if(teams.length === 0){ rdLog('  Kulüp bulunamadı, atlanıyor.', 'warn'); continue; }
    rdLog(`  ${sourceLabel} üzerinden ${teams.length} kulüp bulundu, kadrolar çekiliyor...`);

    let done = 0;
    await rdRunWithConcurrency(teams, RD_CONCURRENCY, async (team)=>{
      if(rdCancelled) return;
      await rdProcessTeam(code, team);
      done++;
      rdSetProgress(Math.round(((ci + done/teams.length)/selected.length)*100), `${league.name} (${done}/${teams.length}) — toplam ${rdStats.clubs} kulüp, ${rdStats.players} oyuncu`);
    });
  }

  rdSetProgress(100, rdCancelled ? 'Durduruldu, uygulanıyor...' : 'Tamamlandı, uygulanıyor...');
  rdLog(`\nTOPLAM: ${rdStats.clubs} kulüp, ${rdStats.players} oyuncu.${rdCancelled ? ' (erken durduruldu)' : ''}`, 'ok');

  document.getElementById('rd-start-btn').disabled = false;
  document.getElementById('rd-cancel-btn').style.display = 'none';
  rdRunning = false;

  if(rdStats.clubs > 0){
    closeLiveDataModal();
    applyRealDataPack(rdLive);
  }else{
    alert('Uygulanacak veri toplanamadı.');
  }
}

const YOUTH_PROMOTE_AGE = 16;
const YOUTH_AGE_WEIGHTS = [{age:15,weight:3},{age:16,weight:5},{age:17,weight:4}];
function generateYouthPlayer(countryCode){
  const pos = weightedPick(POSITIONS);
  const age = weightedPick(YOUTH_AGE_WEIGHTS.map(a=>({...a}))).age;
  let base = Math.pow(Math.random(), 1.7);
  let rating = Math.round(45 + base*20);
  let isWonderkid = false;
  if(Math.random() < 0.05){
    rating = clamp(rating + randInt(4,9), 45, 70);
    isWonderkid = true;
  }
  rating = clamp(rating, 45, 70);
  const headroom = Math.max(0, Math.round((23-age)*1.5 + randInt(0,7)));
  let potential = clamp(rating + headroom, rating, 92);
  if(isWonderkid) potential = clamp(potential + randInt(2,6), potential, 95);
  const retireAge = randInt(35,40);
  const p = { id: rid(), name: genName(countryCode), age, pos: pos.code, posLabel: pos.label, rating, potential, value: 0, wage: 0, club: null, wonderkid: isWonderkid, retireAge, morale: randInt(65,85) };
  const nationCode = countryCode || pick(COUNTRIES).code;
  const nation = countryByCode(nationCode);
  if(nation){ p.countryCode = nation.code; p.countryName = nation.name; p.flag = nation.flag; }
  recalcValue(p);
  p.wage = initialWageFor(p.value);
  state.players[p.id] = p;
  return p;
}
// Akademi tesisi seviyesine göre yeni üretilen genç oyuncunun mevcut
// gücünü ve potansiyelini biraz yükseltir; değer/maaş yeniden hesaplanır.
function applyAcademyBoost(p, academyLvl){
  if(!p || !academyLvl) return;
  p.rating = clamp(Math.round(p.rating + academyLvl*ACADEMY_RATING_PER_LEVEL), 45, 92);
  p.potential = clamp(Math.round(p.potential + academyLvl*ACADEMY_POTENTIAL_PER_LEVEL), p.rating, 95);
  recalcValue(p);
  p.wage = initialWageFor(p.value);
}
function seedYouthSquad(clubId){
  const club = state.clubs[clubId];
  if(!club) return;
  const count = randInt(3,6);
  for(let i=0;i<count;i++){
    const p = generateYouthPlayer(club.country);
    p.club = clubId;
    p.isYouth = true;
    club.youth.push(p.id);
  }
}
/* ---- Gençlik takımından A takıma çıkarma artık otomatik değil, kısa bir
   sözleşme pazarlığı gerektirir: maaş, imza bonusu ve sözleşme süresi teklif
   edersiniz; genç oyuncu bu fırsatı çoğunlukla değerlendirir ama şartlar
   çok düşükse reddedebilir. ---- */
function openPromotion(pid){
  const p = state.players[pid];
  if(!p) return;
  if(p.age < YOUTH_PROMOTE_AGE){
    showToast(p.name+" henüz "+YOUTH_PROMOTE_AGE+" yaşına gelmedi, A takıma çıkarılamaz.");
    return;
  }
  negotiatingPid = pid;
  negotiationIsPromotion = true;
  negotiationIsRenewal = false;
  negotiationOffer = { wage: p.wage, bonus: Math.round(signingBonusFor(p)*0.3/5000)*5000, fee: 0, askingPrice: 0, years: 3 };
  render();
}
function confirmPromotion(pid){
  const p = state.players[pid];
  const myClub = state.clubs[state.playerClubId];
  if(!p || !myClub){
    negotiatingPid = null; negotiationIsPromotion = false; render(); return;
  }
  const wage = negotiationOffer.wage;
  const bonus = negotiationOffer.bonus;
  const years = clamp(negotiationOffer.years || 1, 1, 5);

  const currentWageBill = clubWageBill(state.playerClubId);
  const availableBudget = myClub.budget - currentWageBill;
  const totalCost = bonus + wage;

  if(availableBudget < totalCost){
    const needed = totalCost - availableBudget;
    showToast("❌ Yeterli bütçe yok! İmza bonusu: "+fmtMoney(bonus)+" + 1 sezon maaş: "+fmtMoney(wage)+" = "+fmtMoney(totalCost)+". Kullanılabilir: "+fmtMoney(availableBudget)+". "+fmtMoney(needed)+" daha gerekli!");
    return;
  }

  const yearFactor = CONTRACT_YEAR_WAGE_FACTOR[years] || 1;
  const expectedWage = Math.round(p.wage * yearFactor);
  const wageRatio = expectedWage>0 ? wage / expectedWage : 1;
  const bonusRatio = signingBonusFor(p)>0 ? bonus / signingBonusFor(p) : 1;
  let acceptChance = (wageRatio - 0.5) * 110 + (bonusRatio - 1) * 10;
  acceptChance -= (years - 2) * 3;
  acceptChance += 35; // gençler A takıma çıkma fırsatını çoğunlukla değerlendirir
  acceptChance = clamp(acceptChance, 15, 99);
  const accepted = Math.random()*100 < acceptChance;

  if(!accepted){
    showToast(p.name+" bu şartlarla A takıma çıkmayı kabul etmedi ("+years+" yıllık için beklenen maaş: "+fmtMoney(expectedWage)+"/yıl). Daha iyi bir teklif dene.");
    negotiatingPid = null;
    negotiationIsPromotion = false;
    render();
    return;
  }

  myClub.budget -= totalCost;
  myClub.youth = myClub.youth.filter(id=>id!==pid);
  myClub.squad.push(pid);
  p.isYouth = false;
  p.wage = wage;
  p.contractYears = years;
  p.contractUntil = state.year + years;
  tagContractDate(p, years);
  negotiatingPid = null;
  negotiationIsPromotion = false;
  showToast(p.name+" A takıma çıktı! Yeni maaş: "+fmtMoney(wage)+"/yıl · İmza bonusu: "+fmtMoney(bonus)+" · Sözleşme: "+years+" yıl ("+formatContractEnd(p.contractUntilDate)+"'a kadar).");
  render();
}
// ---- Alt liglere indikçe başlangıç bütçesi de gerçekçi biçimde hızla
// küçülür (gelir faktörüyle benzer bir çürüme eğrisi, ama tabanı biraz daha
// yüksek tutulur ki en alt kademe kulüpleri de oynanabilir kalsın).
function tierBudgetFactor(tierIdx){
  if(tierIdx<=0) return 1;
  return Math.max(0.045, 0.42 * Math.pow(0.5, tierIdx-1));
}
// Ülkeler arası para farkını gerçekçi kılan eğri. Ülke gücü (0.3 - 1.0)
// burada ÜSTEL olarak işleniyor: Top-5 lig (güç ~1.0) neredeyse
// değişmeden kalırken, orta seviye ligler (güç ~0.55, ör. Mısır, Polonya,
// Çin) hem 1. hem 2. ligde çok daha mütevazı paralara iniyor, en zayıf
// futbol ülkeleri (güç ~0.3, ör. Gabon, Yeni Zelanda) ise 1. ligde bile
// birkaç milyonluk kulüplerle sınırlı kalıyor. Gerçek hayatta Premier
// Lig ile küçük bir federasyon arasındaki fark doğrusal değil, katbekat
// büyüktür — bu yüzden düz çarpım yerine üstel eğri kullanılıyor.
function countryMoneyFactor(strength){
  return Math.pow(strength, 3.2);
}
function createClub(name, country, tierIdx, tier, colorIdx){
  const id = clubIdFor(country.code, tierIdx, name);
  const leagueKey = country.code+"-"+tierIdx;
  const strength = country.strength;
  const cf = countryMoneyFactor(strength);
  let loM, hiM, isBig = false, tierFactor = 1;
  if(tierIdx===0 || tierIdx===1){
    // Kulüpler kendi lig tablosundaki sıralarına göre 3 kademeye ayrılır:
    // en iyi takımlar en yüksek, orta grup bir tık altı, alt grup iki tık
    // altı bütçeyle başlar (liste isimleri güçlüden zayıfa doğru sıralı
    // kabul edilir). Bu üç kademe TÜM ülkelerde aynı baz aralıkla
    // başlar, gerçek farkı aşağıdaki ülke-parası eğrisi (cf) yaratır.
    const rankIdx = tier.clubs.indexOf(name);
    const n = tier.clubs.length;
    const third = Math.max(1, Math.ceil(n/3));
    const rank = rankIdx < third ? 0 : (rankIdx < third*2 ? 1 : 2);
    isBig = tierIdx===0 && rank===0;
    const RANGES = [[260,420],[130,260],[55,130]]; // en iyi / bir tık altı / iki tık altı
    loM = RANGES[rank][0];
    hiM = RANGES[rank][1];
    tierFactor = tierIdx===0 ? 1 : tierBudgetFactor(1);
  } else if(tierIdx===2){
    // 3. lig kasıtlı olarak çok zayıf tutulur: bütçe hiçbir zaman 2M'yi
    // geçemez, oyuncu kötü bir kadroyla işe başlayıp yükselmek zorunda kalır.
    // Not: burada üstel eğri (cf) değil, ülke gücü doğrudan (moneyMult
    // olarak strength) kullanılıyor — zaten tavan 2M'ye sabitli olduğu
    // için üstel eğri zayıf ülkelerde her kulübü aynı tabana yapıştırıp
    // çeşitliliği yok ederdi.
    loM = 1; hiM = 2;
  } else {
    loM = 90; hiM = 220;
    tierFactor = tierBudgetFactor(tierIdx);
  }
  const moneyMult = tierIdx===2 ? strength : cf*tierFactor;
  // NOT: yuvarlama en sonda, tam para birimi üzerinden yapılıyor — aksi
  // halde çok zayıf ülkelerde (küçük çarpan) ara adımda milyon cinsinden
  // yuvarlama her şeyi sıfıra düşürüp bütün kulüpleri aynı taban değere
  // ("floor") sabitlerdi ve hiç çeşitlilik kalmazdı.
  let budget = Math.round(randInt(loM,hiM) * moneyMult * 1000000 / 10000) * 10000;
  if(tierIdx===2){
    budget = Math.min(budget, 2000000);
    budget = Math.max(budget, 250000);
  } else {
    budget = Math.max(budget, 250000);
  }
  const squadSize = tierIdx===0 ? 27 : 20;
  state.clubs[id] = {

  if(typeof club.facilities.academy !== "number") club.facilities.academy = 0;

function getLineup(clubId){
  if(!state.lineup[clubId]) state.lineup[clubId] = { formation:"4-4-2", assignments:{} };
  return state.lineup[clubId];
}
const POS_COMPAT = {
  DF:["DF","SB","SLB"], SB:["DF","SB","SLB"], SLB:["DF","SB","SLB"],
  OS:["OS","DOS","OOS","SK","SLK"], DOS:["OS","DOS","OOS","SK","SLK"], OOS:["OS","DOS","OOS","SK","SLK"],
  SK:["OS","DOS","OOS","SK","SLK"], SLK:["OS","DOS","OOS","SK","SLK"],
  KL:["KL"], FV:["FV"]
};
/* Her mevkinin ait olduğu kabaca "hat" - uyumsuz eşleşmelerde ceza, hatlar birbirinden
   ne kadar uzaksa o kadar ağır olsun diye kullanılır (bkz. effRating). */
const POS_LINE = {
  KL:"GK",
  DF:"DEF", SB:"DEF", SLB:"DEF",
  OS:"MID", DOS:"MID", OOS:"MID", SK:"MID", SLK:"MID",
  FV:"FWD"
};
const POS_LINE_ORDER = ["GK","DEF","MID","FWD"];

function slotSpecificCode(baseCode, idx, formation){
  // "OS" kodlu slotlar formasyondaki derinliğine göre asıl mevkiye (Defansif/Ofansif
  // Orta Saha ya da düz Orta Saha) çevrilir, böylece oyuncu eşleştirmesi ve güç hesabı
  // ekranda görünen etiketle birebir aynı mevkiyi baz alır.
  if(baseCode !== "OS") return baseCode;
  const coords = FORMATION_COORDS[formation];
  const codes = FORMATIONS[formation];
  if(!coords || !codes) return baseCode;
  const centralOSIdx = codes.map((c,i)=>i).filter(i => codes[i] === "OS");
  const ys = [...new Set(centralOSIdx.map(i=>coords[i].y))].sort((a,b)=>a-b); // küçükten büyüğe (ileriden geriye)
  if(ys.length <= 1){
    // Tek çizgi: sahadaki genel derinliğe göre karar ver
    const allY = codes.map((c,i)=>coords[i] ? coords[i].y : null).filter(y=>y!==null).slice(1); // KL hariç
    const minY = Math.min(...allY), maxY = Math.max(...allY);
    const mid = (minY+maxY)/2;
    const myY = coords[idx].y;
    if(myY > mid + 4) return "DOS";
    if(myY < mid - 4) return "OOS";
    return "OS";
  }
  const myY = coords[idx].y;
  if(myY === ys[ys.length-1]) return "DOS"; // en geride
  if(myY === ys[0]) return "OOS"; // en ilerde
  return "OS"; // aradaki çizgi(ler)
}
/* Saha ekranında gösterilen etiket artık eşleştirmede kullanılan kodla birebir aynı. */
function slotDisplayCode(baseCode, idx, formation){
  return slotSpecificCode(baseCode, idx, formation);
}
function effRating(player, slotCode){
  if(player.pos === slotCode) return player.rating;
  const compat = POS_COMPAT[slotCode] || [slotCode];
  if(compat.includes(player.pos)) return Math.round(player.rating*0.95);
  const slotLine = POS_LINE[slotCode];
  const playerLine = POS_LINE[player.pos];
  // Kaleci diğer tüm hatlardan tamamen kopuk bir yetenek seti gerektirir
  if(slotLine === "GK" || playerLine === "GK"){
    return Math.max(1, Math.round(player.rating*0.12));
  }
  const dist = Math.abs(POS_LINE_ORDER.indexOf(slotLine) - POS_LINE_ORDER.indexOf(playerLine));
  if(dist === 1) return Math.round(player.rating*0.70); // komşu hat: örn. stoper orta sahada
  if(dist >= 2) return Math.round(player.rating*0.45); // iki hat uzak: örn. stoper santrafor rolünde
  return Math.round(player.rating*0.82);
}

function assignSlot(clubId, slotIdx, playerId){
  const lu = getLineup(clubId);
  const club = state.clubs[clubId];
  const codes = FORMATIONS[lu.formation];
  // Seçilen oyuncu başka bir slotta zaten varsa oradan çıkar; o slot aşağıda
  // otomatik olarak başka bir oyuncuyla dolduruluyor (boş kalmasın diye).
  const vacatedSlots = [];
  Object.keys(lu.assignments).forEach(k=>{
    if(String(lu.assignments[k]) === String(playerId) && String(k) !== String(slotIdx)){
      delete lu.assignments[k];
      vacatedSlots.push(parseInt(k));
    }
  });
  if(playerId) lu.assignments[slotIdx] = playerId; else delete lu.assignments[slotIdx];

  if(vacatedSlots.length){
    const squad = club.squad.map(id=>state.players[id]).filter(Boolean).filter(p=>!(p.suspensionMatches>0) && !p.injured);
    vacatedSlots.forEach(vIdx=>{
      const code = codes[vIdx];
      if(!code) return;
      const specificCode = slotSpecificCode(code, vIdx, lu.formation);
      const used = new Set(Object.values(lu.assignments).map(String));
      const compat = POS_COMPAT[specificCode] || [specificCode];
      let candidates = squad.filter(p=>!used.has(String(p.id)) && p.pos===specificCode).sort((a,b)=>b.rating-a.rating);
      if(candidates.length===0) candidates = squad.filter(p=>!used.has(String(p.id)) && compat.includes(p.pos)).sort((a,b)=>b.rating-a.rating);
      if(candidates.length===0) candidates = squad.filter(p=>!used.has(String(p.id))).sort((a,b)=>b.rating-a.rating);
      if(candidates.length>0) lu.assignments[vIdx] = candidates[0].id;
    });
  }
  render();
}
function autoFillLineup(clubId, opts){

const squad = club.squad.map(id=>state.players[id]).filter(Boolean).filter(p=>!(p.suspensionMatches>0) && !p.injured);
  const used = new Set();
  const assignments = {};
  codes.forEach((code, idx)=>{
    const specificCode = slotSpecificCode(code, idx, lu.formation);
    const compat = POS_COMPAT[specificCode] || [specificCode];
    let candidates = squad.filter(p=>!used.has(p.id) && p.pos===specificCode).sort((a,b)=>b.rating-a.rating);
    if(candidates.length===0) candidates = squad.filter(p=>!used.has(p.id) && compat.includes(p.pos)).sort((a,b)=>b.rating-a.rating);
    if(candidates.length===0) candidates = squad.filter(p=>!used.has(p.id)).sort((a,b)=>b.rating-a.rating);

  });
  lu.assignments = assignments;
  if(!opts || !opts.silent) render();
}

/* ================= SEASON SIMULATION ================= */
// ---- Tesis Yükseltmeleri: antrenman tesisinin takım gücüne ve sakatlık
// direncine kattığı bonusu buradan okuyoruz, böylece clubStrength ve
// sakatlık kontrolleri her zaman güncel seviyeyi kullanır.
function facilityStrengthBonus(club){
  if(!club || !club.facilities) return 0;
  return (club.facilities.training||0) * FACILITY_STRENGTH_PER_LEVEL;
}
function effectiveInjuryRisk(clubId){
  const club = state.clubs[clubId];
  const lvl = (club && club.facilities && club.facilities.training) || 0;
  return INJURY_RISK * (1 - lvl*FACILITY_INJURY_REDUCTION_PER_LEVEL);
}
function clubStrength(clubId){
  const club = state.clubs[clubId];
  if(!club) return 50;
  const squad = club.squad.map(id=>state.players[id]).filter(Boolean);
  if(squad.length===0) return 50;
  const trainingBonus = facilityStrengthBonus(club);
  if(clubId===state.playerClubId){
    const xi = lineupEffectiveXI(clubId);
    if(xi.length>0) return xi.reduce((s,r)=>s+r,0)/xi.length + trainingBonus;
  }
  const top = [...squad].sort((a,b)=>b.rating-a.rating).slice(0,11);
  return top.reduce((s,p)=>s+p.rating,0)/top.length + trainingBonus;
}
function poisson(lambda){
  let L = Math.exp(-lambda), k=0, p=1;
  do{ k++; p*=Math.random(); }while(p>L);
  return k-1;
}
function simulateMatch(home, away){
  const sh = clubStrength(home), sa = clubStrength(away);
  const lamH = clamp(1.35 + (sh-sa)*0.045, 0.25, 4.3);
  const lamA = clamp(1.05 + (sa-sh)*0.045, 0.2, 3.8);
  return { gh: poisson(lamH), ga: poisson(lamA) };
}
// Ağırlıklı rastgele seçim: her aday kendi ağırlığı oranında seçilme şansına sahip.
function pickWeighted(candidates, weightFn){
  if(!candidates.length) return null;
  const weights = candidates.map(c=>Math.max(0.01, weightFn(c)));
  const total = weights.reduce((s,w)=>s+w,0);
  let r = Math.random()*total;
  for(let i=0;i<candidates.length;i++){
    r -= weights[i];
    if(r<=0) return candidates[i];
  }
  return candidates[candidates.length-1];
}
// Gol/asist atma ihtimalinde mevkiye göre ağırlıklar (santrafor en yüksek, kaleci neredeyse hiç).
const GOAL_POS_WEIGHT = { FV:10, SK:5, SLK:5, OOS:4, OS:3, DOS:1.5, SB:1.3, SLB:1.3, DF:1, KL:0.05 };
const ASSIST_POS_WEIGHT = { OOS:6, SK:6, SLK:6, OS:5, FV:3, DOS:3, SB:2.5, SLB:2.5, DF:1.5, KL:0.05 };
// Bir takımın sahaya çıkan 11'i içinden, atılan gol sayısı kadar golcü ve
// (çoğunlukla) birer asistçi belirler — maç günü ekranında gösterilecek gerçek olaylar bunlar.
function generateTeamGoalEvents(xiIds, goalCount){
  const players = (xiIds||[]).map(id=>state.players[id]).filter(Boolean);
  const events = [];
  if(players.length===0) return events;
  for(let i=0;i<goalCount;i++){
    const scorer = pickWeighted(players, p=>(GOAL_POS_WEIGHT[p.pos]||1) * ((p.rating||70)/70));
    if(!scorer) break;
    let assistId = null;
    if(Math.random() < 0.78){
      const assistCandidates = players.filter(p=>p.id!==scorer.id);
      const assister = pickWeighted(assistCandidates, p=>(ASSIST_POS_WEIGHT[p.pos]||1) * ((p.rating||70)/70));
      if(assister) assistId = assister.id;
    }
    events.push({ scorerId: scorer.id, assistId });
  }
  return events;
}
// Kesinleşmiş gol/asist olaylarını (generateTeamGoalEvents çıktısı) oyuncu sezon
// istatistiklerine işler — maç günü ekranında gösterilenle sezon istatistikleri
// (gol krallığı vb.) birebir tutarlı olsun diye rastgele updatePlayerStats yerine kullanılır.
function updatePlayerStatsWithEvents(clubId, xiIds, goalsAgainst, compKey, events){
  (xiIds||[]).forEach(pid => {
    const p = state.players[pid];
    if(!p) return;
    ensureStatsShape(p);
    const s = p.stats[compKey] || (p.stats[compKey] = emptyCompStats());
    s.appearances = (s.appearances || 0) + 1;
    bumpLoanAppearances(p);
    if(p.pos === 'KL'){
      if(goalsAgainst === 0) s.cleanSheets = (s.cleanSheets || 0) + 1;
      s.saves = (s.saves || 0) + goalsAgainst;
    }
  });
  (events||[]).forEach(ev=>{
    const scorer = state.players[ev.scorerId];
    if(scorer){
      ensureStatsShape(scorer);
      const s = scorer.stats[compKey] || (scorer.stats[compKey] = emptyCompStats());
      s.goals = (s.goals || 0) + 1;
    }
    if(ev.assistId){
      const assister = state.players[ev.assistId];
      if(assister){
        ensureStatsShape(assister);
        const s2 = assister.stats[compKey] || (assister.stats[compKey] = emptyCompStats());
        s2.assists = (s2.assists || 0) + 1;
      }
    }
  });
}
function applyMatchToTable(table, home, away, gh, ga){
  table[home].P++; table[away].P++;
  table[home].GF+=gh; table[home].GA+=ga;
  table[away].GF+=ga; table[away].GA+=gh;
  if(gh>ga){ table[home].W++; table[home].Pts+=3; table[away].L++; }
  else if(gh<ga){ table[away].W++; table[away].Pts+=3; table[home].L++; }
  else { table[home].D++; table[away].D++; table[home].Pts++; table[away].Pts++; }
}
function simulateTier(clubIds){
  const table = {};
  clubIds.forEach(id=>table[id]={id,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
  const myMatches = [];
  for(let i=0;i<clubIds.length;i++){
    for(let j=0;j<clubIds.length;j++){
      if(i===j) continue;
      const home = clubIds[i], away = clubIds[j];
      const {gh,ga} = simulateMatch(home,away);
      applyMatchToTable(table, home, away, gh, ga);
      if(home===state.playerClubId || away===state.playerClubId){
        myMatches.push({home:state.clubs[home].name,away:state.clubs[away].name,gh,ga});
      }
    }
  }
  return { standings: Object.values(table).sort((a,b)=> (b.Pts-a.Pts) || ((b.GF-b.GA)-(a.GF-a.GA)) || (b.GF-a.GF)), myMatches };
}
// ---- Play-off sistemi: bir alt ligde otomatik yükselme sıralarının hemen
// altında kalan (örn. 3.-6. sıra) takımlar arasında, üst lige çıkacak son
// kontenjan için mini bir eleme turnuvası oynanır. Her eşleşme iki maçlık
// (deplasman/iç saha) toplam skor usulüyle belirlenir; berabere biterse
// kazanan penaltı atışlarıyla (küçük bir güç avantajıyla, ağırlıklı rastgele) belirlenir.
function playoffTie(idA, idB){
  const leg1 = simulateMatch(idA, idB); // idA iç sahada
  const leg2 = simulateMatch(idB, idA); // idB iç sahada (rövanş)
  const aggA = leg1.gh + leg2.ga;
  const aggB = leg1.ga + leg2.gh;
  let winner, pk = null;
  if(aggA > aggB) winner = idA;
  else if(aggB > aggA) winner = idB;
  else {
    const sA = clubStrength(idA), sB = clubStrength(idB);
    const pWinA = clamp(0.5 + (sA-sB)*0.01, 0.35, 0.65);
    winner = Math.random() < pWinA ? idA : idB;
    const loserPk = randInt(2,4);
    const winnerPk = loserPk + randInt(1,2);
    pk = winner===idA ? `${winnerPk}-${loserPk}` : `${loserPk}-${winnerPk}`;
  }
  return { idA, idB, leg1, leg2, aggA, aggB, winner, pk };
}
// contenders: standings sırasına göre [3.sıra, 4.sıra, 5.sıra, 6.sıra] kulüp id'leri.
// Klasik play-off tohumlaması: 3-6 ve 4-5 yarı final, kazananlar finalde karşılaşır.
function runPromotionPlayoff(contenders){
  const [c3, c4, c5, c6] = contenders;
  const semi1 = playoffTie(c3, c6);
  const semi2 = playoffTie(c4, c5);
  const final = playoffTie(semi1.winner, semi2.winner);
  return { contenders, semis:[semi1, semi2], final, winnerId: final.winner };
}
