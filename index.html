    }).join("");

    return `<div class="panel" style="margin-bottom:14px;">
      <div class="panel-head"><h2>${cat.icon} ${cat.label}</h2></div>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:-6px 0 14px;">${cat.desc}</p>
      ${tierCards}
    </div>`;
  }).join("");

  return `
    <div class="panel-head" style="margin-bottom:4px;"><h2><span class="kickoff-dot"></span>Sponsorluk Anlaşmaları</h2></div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin:-4px 0 14px;">İmza bonusu anında bütçenize eklenir, yıllık gelir ise her sezon sonunda otomatik yatırılır. Bir kategoride aynı anda tek anlaşma yürütebilirsiniz.</p>
    ${categoryHtml}
  `;
}

function renderScouts(){
  const club = state.clubs[state.playerClubId];

  // Sözleşme seçenekleri (her seviye için imzalama kartı, ya da mevcut sözleşme durumu)
  const contractHtml = SCOUT_TIERS.map((tier, idx) => {
    const active = club.scouts.find(s => s.tierIdx === idx);
    if(active){
      const yearsLeft = active.contractYears;
      const findPct = Math.round(clamp(0.55 + tier.quality*0.45, 0.1, 0.98)*100);
      const pickerOpen = scoutPickerFor === active.id;
      const pendingMission = (state.scoutMissions||[]).find(m => m.scoutId === active.id);
      let statusHtml;
      if(active.usedThisSeason){
        statusHtml = `<span class="tier-pill" style="border-color:var(--ink-faint);color:var(--ink-dim);">Bu sezon kullanıldı</span>`;
      } else if(pendingMission){
        const missionContinent = CONTINENTS.find(c=>c.key===pendingMission.continent);
        statusHtml = `<span class="tier-pill" style="border-color:var(--ink-faint);color:var(--ink-dim);">🧭 ${missionContinent?missionContinent.flag:''} ${missionContinent?missionContinent.name:''} — sonuç ${pendingMission.weeksLeft} hafta içinde</span>`;
      } else if(pickerOpen){
        statusHtml = "";
      } else {
        statusHtml = `<button class="btn buy" onclick="openScoutContinentPicker(${active.id})">🔎 Kıta Seç ve Gönder</button>`;
      }
      const pickerHtml = (!active.usedThisSeason && !pendingMission && pickerOpen) ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
        ${CONTINENTS.map(c=>{
          const affordable = club.budget >= c.scoutCost;
          return `<button class="btn buy" style="padding:7px 14px;font-size:11.5px;" ${affordable?'':'disabled'} onclick="sendScoutToContinent(${active.id},'${c.key}')">${c.flag} ${c.name} · ${fmtMoney(c.scoutCost)}</button>`;
        }).join("")}
        <button class="btn secondary" style="padding:7px 14px;font-size:11.5px;" onclick="closeScoutContinentPicker()">Vazgeç</button>
      </div>` : "";
      return `<div style="background:var(--panel);border:1px solid var(--gold-dim);border-radius:8px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div>
            <div class="pname" style="margin-bottom:3px;">${tier.name} <span class="tier-pill" style="margin-left:6px;">Sözleşmeli</span></div>
            <div class="pmeta">Yıllık maaş: ${fmtMoney(tier.annualWage)} · Kalan sözleşme: <strong>${yearsLeft} yıl</strong> · Bulma şansı: ~%${findPct} / aday</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${statusHtml}
          </div>
        </div>
        ${pickerHtml}
      </div>`;
    }
    const canAfford = (clubWageBill(state.playerClubId) + tier.annualWage) <= club.budget;
    const selectId = `scoutYears_${idx}`;
    return `<div style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <div class="pname" style="margin-bottom:3px;">${tier.name}</div>
          <div class="pmeta">Yıllık maaş: ${fmtMoney(tier.annualWage)} · Sezon başına 1 kıtaya gönderim · en fazla 6 gizli yetenek</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="${selectId}" style="background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:8px 10px;border-radius:6px;font-family:'Inter',sans-serif;font-size:12.5px;">
            ${[1,2,3,4,5].map(y=>`<option value="${y}">${y} yıl (${fmtMoney(tier.annualWage*y)})</option>`).join("")}
          </select>
          <button class="btn buy" ${canAfford ? '' : 'disabled'} onclick="hireScout(${idx}, document.getElementById('${selectId}').value)">${canAfford ? 'Sözleşme Yap' : 'Yetersiz Bütçe'}</button>
        </div>
      </div>
    </div>`;
  }).join("");

  // Sonuçlanan bulguları göster (kıta bazında gizli yetenekler)
  const resultsHtml = state.scoutResults.map(res => {
    const tier = SCOUT_TIERS[res.tierIdx];
    const continent = CONTINENTS.find(c => c.key === res.continent);
    const players = res.foundPlayers.map(pid => state.players[pid]).filter(Boolean);
    if(players.length === 0) return "";
    const playersList = players.map(p => {
      const isNegotiating = negotiatingPid === p.id;
      const ownerClub = p.club ? state.clubs[p.club] : null;
      const clubLabel = ownerClub ? ownerClub.name : "";
      if(isNegotiating){
        const bonus = negotiationOffer.bonus;
        const wage = negotiationOffer.wage;
        const offeredFee = negotiationOffer.fee;
        const totalCost = offeredFee + bonus;
        const canAfford = state.clubs[state.playerClubId].budget >= totalCost;
        const resistanceNow = transferWillingness(p, state.playerClubId);
        const yearFactorNow = CONTRACT_YEAR_WAGE_FACTOR[negotiationOffer.years] || 1;
        const expectedWageNow = Math.round(p.wage * yearFactorNow);
        return `<div style="margin:6px 0;padding:10px;background:rgba(245,185,66,0.05);border-radius:6px;border-left:2px solid var(--gold);">
          <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;">
            <div class="name-cell"><div><div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag ? p.flag+' ' : ''}${p.name}</div><div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · ${clubLabel ? clubLabel+' · ' : ''}Gizli Yetenek · Beklenen maaş: ${fmtMoney(p.wage)}/yıl</div></div></div>
            <div>
              <div class="slot-label" style="margin-bottom:3px;">Kulübün İstediği Bonservis</div>
              <div class="mono" style="color:var(--amber);">${fmtMoney(negotiationOffer.askingPrice)}</div>
            </div>
            <div>
              <div class="slot-label" style="margin-bottom:3px;">Teklif Edilen Bonservis</div>
              <input type="text" inputmode="numeric" value="${fmtThousands(offeredFee)}" style="width:140px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('fee', v))">
            </div>
            <div>
              <div class="slot-label" style="margin-bottom:3px;">Teklif Edilen Yıllık Maaş</div>
              <input type="text" inputmode="numeric" value="${fmtThousands(wage)}" style="width:130px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('wage', v))">
            </div>
            <div>
              <div class="slot-label" style="margin-bottom:3px;">İmza Parası</div>
              <input type="text" inputmode="numeric" value="${fmtThousands(bonus)}" style="width:120px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;" oninput="formatMoneyInput(this, v=>setNegotiationField('bonus', v))">
            </div>
            <div>
              <div class="slot-label" style="margin-bottom:3px;">Sözleşme Süresi</div>
              <select onchange="setNegotiationYears(this.value)" style="width:110px;background:var(--bg-alt);border:1px solid var(--line-strong);color:var(--ink);padding:6px 8px;border-radius:6px;">
                ${CONTRACT_LENGTHS.map(y=>`<option value="${y}" ${negotiationOffer.years===y?'selected':''}>${y} Yıllık</option>`).join("")}
              </select>
              <div class="mono" style="font-size:10.5px;margin-top:3px;color:${negotiationOffer.years>=4?'var(--red-neg)':(negotiationOffer.years===3?'var(--amber)':'var(--green-pos)')};">~${fmtMoney(expectedWageNow)}/yıl bekliyor · ${formatContractEnd(computeContractEndDate(negotiationOffer.years))}'a kadar</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn buy" id="nego-buy-btn" ${canAfford?'':'disabled'} onclick="confirmOffer(${p.id})">Teklifi Gönder</button>
              <button class="btn secondary" onclick="cancelNegotiation()">Vazgeç</button>
            </div>
          </div>
          <div style="font-size:11.5px;color:var(--ink-faint);margin-top:6px;">Toplam peşin maliyet: <span id="nego-total-cost">${fmtMoney(totalCost)}</span> (bonservis + imza parası). ${clubLabel ? clubLabel+' istenen bonservisin belirgin altındaki teklifleri reddedebilir. ' : ''}${resistanceNow>=25?'<span style="color:var(--red-neg);">Bu oyuncu kulübünüzün seviyesi yüzünden transfere isteksiz görünüyor.</span> ':''}Teklifi reddederse bu yetenek kaybolur.</div>
        </div>`;
      }
      return `<div style="margin:6px 0;padding:8px;background:rgba(245,185,66,0.05);border-radius:6px;border-left:2px solid var(--gold);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div>
            <div class="pname" data-pid="${p.id}" onclick="openPlayerCard(${p.id})" style="cursor:pointer;">${p.flag ? p.flag+' ' : ''}${p.name}${p.wonderkid?'<span class="wonderkid-tag">YETENEK</span>':''}</div>
            <div class="pmeta">${p.age} yaş · <span class="pos-pill">${posFullLabel(p.pos)}</span> · Potansiyel ${p.potential} · ${p.countryName || ''}${clubLabel ? ' · '+clubLabel : ''} · Gizli Yetenek${ownerClub ? ' · Bonservis ~'+fmtMoney(p.askingPrice||p.value) : ''}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn buy" style="padding:6px 12px;font-size:11px;" onclick="openNegotiation(${p.id})">İlgilendir</button>
            <button class="btn secondary" style="padding:6px 12px;font-size:11px;" onclick="discardScoutPlayer(${res.id}, ${p.id})">Pas Geç</button>
          </div>
        </div>
      </div>`;
    }).join("");

    return `<div class="panel">
      <div class="panel-head" style="align-items:flex-start;gap:14px;">
        <h2>${tier.name} Avcı Sonuçları · ${continent ? continent.flag+' '+continent.name : ''} (${players.length} gizli yetenek)</h2>
      </div>
      ${playersList}
    </div>`;
  }).join("");

  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>Yetenek Avcısı Sözleşmeleri</h2></div>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;line-height:1.6;">Yetenek avcılarıyla, oyuncularınızla yaptığınız gibi 1-5 yıllık sözleşme imzalayın. Yıllık maaş sözleşme boyunca sabit kalır ve her sezon sonunda diğer maaşlarla birlikte bütçenizden düşülür. Sözleşmeli her avcıyı sezon başına bir kez seçtiğiniz bir kıtaya gönderebilirsiniz; her gönderimin, kıtanın uzaklığına/zorluğuna göre değişen ayrı bir seyahat ücreti vardır (Avrupa ${fmtMoney(CONTINENTS.find(c=>c.key==='europe').scoutCost)} gibi en ucuzken, Okyanusya ${fmtMoney(CONTINENTS.find(c=>c.key==='oceania').scoutCost)} ile en pahalısıdır) ve gönderim anında bütçenizden peşin düşülür. O kıtadan, transfer pazarında olmayan, kimsenin bilmediği en fazla 6 gizli yetenek adayı bulup getirir. Transfer ettiğiniz aday oyuna kalıcı olarak eklenir; pas geçtiğiniz ya da reddedilen teklifler sonucu adaylar kaybolur.</p>
      <p style="color:var(--ink-faint);font-size:11px;margin:0 0 14px;line-height:1.6;">Kıta gönderim ücretleri: ${CONTINENTS.map(c=>`${c.flag} ${c.name} ${fmtMoney(c.scoutCost)}`).join(" · ")}</p>
      ${contractHtml}
    </div>
    ${resultsHtml || '<div class="panel"><div class="panel-head"><h2>Sonuçlar</h2></div><div class="empty">Henüz hiç yetenek avcısı sonucu yok. Bir avcıyı bir kıtaya gönderin.</div></div>'}
  `;
}

// compKey: 'league' | 'cl' | 'el' — her yarışmanın istatistiklerini ayrı gösterir.
function setStatsSubView(compKey, view){
  statsSubView[compKey] = view;
  render();
}
function renderStatsBlock(compKey, titlePrefix, clubIds){
  const scopeClubIds = clubIds || [state.playerClubId];
  const playerStats = Object.values(state.players)
    .filter(p => scopeClubIds.includes(p.club) && !p.retired)
    .map(p => {
      ensureStatsShape(p);
      const stats = p.stats[compKey] || emptyCompStats();
      return {...p, ...stats};
    })
    .sort((a, b) => b.goals - a.goals);

  const keepers = playerStats.filter(p => p.pos === 'KL');
  const outfield = playerStats.filter(p => p.pos !== 'KL');
  
  const topScorers = outfield.slice(0, 10);
  const topAssisters = outfield.slice().sort((a, b) => b.assists - a.assists).slice(0, 10);
  const keeperStats = keepers.map(k => ({
    ...k,
    matchRating: k.appearances > 0 ? ((k.cleanSheets / k.appearances) * 100).toFixed(1) : 0
  })).sort((a, b) => b.cleanSheets - a.cleanSheets).slice(0, 10);

  const disciplineTable = playerStats.filter(p => p.yellowCards > 0 || p.redCards > 0).sort((a, b) => (b.redCards * 2 + b.yellowCards) - (a.redCards * 2 + a.yellowCards));

  const scorersTable = topScorers.length > 0 ? `
    <table>
      <thead>
        <tr>
          <th style="text-align:left;">Oyuncu</th>
          <th>Pozisyon</th>
          <th>Gol</th>
          <th>Asist</th>
          <th>Maç</th>
          <th>Ort.</th>
        </tr>
      </thead>
      <tbody>
        ${topScorers.map((p, i) => `
          <tr ${p.id === state.selectedSquadMember ? 'class="me"' : ''}>
            <td style="text-align:left;">
              <div class="name-cell">
                <span class="badge bronze">${i+1}</span>
                <span style="cursor:pointer;" onclick="openPlayerCard(${p.id})">${p.flag} ${p.name}</span>
              </div>
            </td>
            <td><span class="pos-pill">${posFullLabel(p.pos)}</span></td>
            <td><b>${p.goals}</b></td>
            <td><b>${p.assists}</b></td>
            <td>${p.appearances}</td>
            <td><b>${(p.appearances > 0 ? (p.goals / p.appearances).toFixed(2) : 0)}</b></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  ` : '<div class="empty" style="padding:30px;">Henüz hiç gol atılmamış</div>';

  const assistsTable = topAssisters.length > 0 ? `
    <table>
      <thead>
        <tr>
          <th style="text-align:left;">Oyuncu</th>
          <th>Pozisyon</th>
          <th>Asist</th>
          <th>Gol</th>
          <th>Maç</th>
          <th>Ort.</th>
        </tr>
      </thead>
      <tbody>
        ${topAssisters.map((p, i) => `
          <tr ${p.id === state.selectedSquadMember ? 'class="me"' : ''}>
            <td style="text-align:left;">
              <div class="name-cell">
                <span class="badge silver">${i+1}</span>
                <span style="cursor:pointer;" onclick="openPlayerCard(${p.id})">${p.flag} ${p.name}</span>
              </div>
            </td>
            <td><span class="pos-pill">${posFullLabel(p.pos)}</span></td>
            <td><b>${p.assists}</b></td>
            <td>${p.goals}</td>
            <td>${p.appearances}</td>
            <td><b>${(p.appearances > 0 ? (p.assists / p.appearances).toFixed(2) : 0)}</b></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  ` : '<div class="empty" style="padding:30px;">Henüz hiç asist yapılmamış</div>';

  const keepersTable = keeperStats.length > 0 ? `
    <table>
      <thead>
        <tr>
          <th style="text-align:left;">Kaleci</th>
          <th>Maç</th>
          <th>Kale Örnegi</th>
          <th>Başarı %</th>
          <th>Sarı Kart</th>
          <th>Kırmızı Kart</th>
        </tr>
      </thead>
      <tbody>
        ${keeperStats.map((k, i) => `
          <tr ${k.id === state.selectedSquadMember ? 'class="me"' : ''}>
            <td style="text-align:left;">
              <div class="name-cell">
                <span class="badge" style="color:var(--purple);border-color:var(--purple);background:rgba(167,139,250,0.1);">🥅</span>
                <span style="cursor:pointer;" onclick="openPlayerCard(${k.id})">${k.flag} ${k.name}</span>
              </div>
            </td>
            <td>${k.appearances}</td>
            <td><b>${k.cleanSheets}</b></td>
            <td><b style="color:${k.matchRating >= 50 ? 'var(--green-pos)' : 'var(--amber)'}">${k.matchRating}%</b></td>
            <td style="color:var(--amber);">${k.yellowCards}</td>
            <td style="color:var(--red-neg);">${k.redCards}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  ` : '<div class="empty" style="padding:30px;">Kadroda kaleci yok</div>';

  const disciplineTableHtml = disciplineTable.length > 0 ? `
    <table>
      <thead>
        <tr>
          <th style="text-align:left;">Oyuncu</th>
          <th>Pozisyon</th>
          <th>Maç</th>
          <th style="color:var(--amber);">Sarı Kart</th>
          <th style="color:var(--red-neg);">Kırmızı Kart</th>
          <th>Toplam Ceza</th>
        </tr>
      </thead>
      <tbody>
        ${disciplineTable.map(p => `
          <tr ${p.id === state.selectedSquadMember ? 'class="me"' : ''}>
            <td style="text-align:left;">
              <span style="cursor:pointer;" onclick="openPlayerCard(${p.id})">${p.flag} ${p.name}</span>
            </td>
            <td><span class="pos-pill">${posFullLabel(p.pos)}</span></td>
            <td>${p.appearances}</td>
            <td style="color:var(--amber);"><b>${p.yellowCards}</b></td>
            <td style="color:var(--red-neg);"><b>${p.redCards}</b></td>
            <td><b>${p.redCards * 2 + p.yellowCards}</b></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  ` : '<div class="empty" style="padding:30px;">Kayıtlı ceza yok</div>';

  const SCREENS = {
    scorers:    { label:"Gol Krallığı",         icon:"⚽", html: scorersTable },
    assists:    { label:"Asist Krallığı",       icon:"🎯", html: assistsTable },
    keepers:    { label:"Kaleci İstatistikleri", icon:"🥅", html: keepersTable },
    discipline: { label:"Disiplin",             icon:"🟨", html: disciplineTableHtml }
  };

  const view = statsSubView[compKey];

  // Bir alt-ekran açıksa: sadece o tabloyu ve üstünde bir geri butonu göster.
  if(view && SCREENS[view]){
    const scr = SCREENS[view];
    return `
    <div class="panel">
      <div class="panel-head" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="back-link" onclick="setStatsSubView('${compKey}', null)">← Geri</button>
        <h2 style="margin:0;"><span class="kickoff-dot"></span>${titlePrefix} ${scr.label}</h2>
      </div>
      ${scr.html}
    </div>`;
  }

  // Varsayılan: sadece 4 buton — tıklanınca ilgili istatistik ekranı açılır.
  return `
    <div class="panel">
      <div class="panel-head"><h2><span class="kickoff-dot"></span>${titlePrefix} İstatistikler</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-save-primary" onclick="setStatsSubView('${compKey}','scorers')">⚽ Gol Krallığı</button>
        <button class="btn-save-primary" onclick="setStatsSubView('${compKey}','assists')">🎯 Asist Krallığı</button>
        <button class="btn-save-primary" onclick="setStatsSubView('${compKey}','keepers')">🥅 Kaleci İstatistikleri</button>
        ${disciplineTable.length > 0 ? `<button class="btn-save-ghost" onclick="setStatsSubView('${compKey}','discipline')">🟨 Disiplin</button>` : ''}
      </div>
    </div>`;
}


function render(){
  // Bir arama kutusuna yazarken innerHTML tamamen yenilendiği için input'un
  // odağı kayboluyordu; render öncesi odaklı elemanı ve imleç konumunu
  // kaydedip render sonrası aynı id'li elemana geri yüklüyoruz.
  const activeEl = document.activeElement;
  const focusId = (activeEl && activeEl.id) ? activeEl.id : null;
  const selStart = (activeEl && typeof activeEl.selectionStart === "number") ? activeEl.selectionStart : null;
  const selEnd = (activeEl && typeof activeEl.selectionEnd === "number") ? activeEl.selectionEnd : null;

  if(!state.playerClubId){
    document.body.classList.remove("has-club");
    if(settingsScreen) renderSettings();
    else if(mainMenuScreen) renderMainMenu();
    else renderSetup();
    restoreFocus(focusId, selStart, selEnd);
    return;
  }
  document.body.classList.add("has-club");
  let content = "";
  if(activeTab === "dashboard") content = renderDashboard();
  else if(activeTab === "calendar") content = renderCalendar();
  else if(activeTab === "squad") content = renderSquad();
  else if(activeTab === "youthsquad") content = renderYouthSquad();
  else if(activeTab === "lineup") content = renderLineup();
  else if(activeTab === "market") content = renderMarket();
  else if(activeTab === "loans") content = renderLoans();
  else if(activeTab === "shop") content = renderShop();
  else if(activeTab === "stadium") content = renderStadium();
  else if(activeTab === "facilities") content = renderFacilities();
  else if(activeTab === "trophies") content = renderTrophyRoom();
  else if(activeTab === "career") content = renderCareerHistory();
  else if(activeTab === "scouts") content = renderScouts();

function restoreFocus(focusId, selStart, selEnd){

// GERÇEK 3D LIVE MATCH ANIMATION (Three.js)
// ------------------------------------------------------------
// Fizik/oyun mantığı (oyuncu AI hareketleri, top sahipliği, sınırlar,
// şut/pas çözümlemesi) tamamen aynı 2 boyutlu "saha piksel uzayında"
// (liveCanvas.width x liveCanvas.height) çalışmaya devam eder — bu blok
// sadece o durumu her karede gerçek bir 3D sahneye (kamera, oyuncu
// modelleri, top, kaleler) çevirip render eder.
// ============================================

let liveCanvas = null;
let liveCanvasCtx = null; // artık kullanılmıyor (geriye dönük uyumluluk için tutuluyor)
let liveMatchAnimationId = null;
let liveMatchPlayers = [];
let liveMatchBall = { x: 0, y: 0, vx: 0.5, vy: 0.3, spin: 0 };
let matchFrameTime = 0;
let lmUserPlayer = null;
let lmJoystick = { active:false, baseX:0, baseY:0, dx:0, dy:0 };
let lmBallOwner = null;

let lmBallCooldownUntil = 0;

let lmControlsBoundGlobal = false;
let lmCharging = false;

// 3D sahne durumu — tek bir obje altında toplanır, dispose3DMatch ile temizlenir
let lm3D = null;
const LM3D_LEN = 105;   // saha uzunluğu (kale-kale), dünya birimi
const LM3D_WID = 68;    // saha genişliği (taç-taç), dünya birimi
const LM3D_BORDER = 9;  // çizgilerin dışındaki yeşil kenar payı

// Saha piksel koordinatını (liveCanvas.width/height'a göre) 3D dünya
// koordinatına çevirir.
function lm3DToWorld(px, py){
  const w = (liveCanvas && liveCanvas.width) || 1;
  const h = (liveCanvas && liveCanvas.height) || 1;
  return {
    x: (px / w - 0.5) * LM3D_LEN,
    z: (py / h - 0.5) * LM3D_WID
  };
}

// Saha dokusunu (çim + çizgiler) tek seferlik bir canvas'a çizip texture olarak döner.
function lm3DBuildPitchTexture(){
  const texW = 1024;
  const texH = Math.round(texW * (LM3D_WID + LM3D_BORDER*2) / (LM3D_LEN + LM3D_BORDER*2));
  const cnv = document.createElement('canvas');
  cnv.width = texW; cnv.height = texH;
  const c = cnv.getContext('2d');

  // px/dünya-birimi oranı
  const scale = texW / (LM3D_LEN + LM3D_BORDER*2);
  const ox = texW/2, oy = texH/2; // merkez (saha ortası)
  const toPx = (wx, wz) => ({ x: ox + wx*scale, y: oy + wz*scale });

  // Çim şeritleri (koyu/açık yeşil, biçilmiş görünüm)
  const stripeCount = 12;
  for(let i=0;i<stripeCount;i++){
    c.fillStyle = i % 2 === 0 ? '#3c9a1f' : '#348a1a';
    const x0 = i * (texW/stripeCount);
    c.fillRect(x0, 0, texW/stripeCount + 1, texH);
  }
  c.fillStyle = 'rgba(255,255,255,0.025)';
  for(let i=0;i<600;i++){
    c.fillRect(Math.random()*texW, Math.random()*texH, 2, 2);
  }

  // Çizgiler
  c.strokeStyle = 'rgba(255,255,255,0.92)';
  c.lineWidth = 3;
  c.lineCap = 'round';

  const topLeft = toPx(-LM3D_LEN/2, -LM3D_WID/2);
  const botRight = toPx(LM3D_LEN/2, LM3D_WID/2);
  c.strokeRect(topLeft.x, topLeft.y, botRight.x-topLeft.x, botRight.y-topLeft.y);

  // Orta çizgi + orta daire
  c.beginPath();
  c.moveTo(ox, topLeft.y);
  c.lineTo(ox, botRight.y);
  c.stroke();
  c.beginPath();
  c.arc(ox, oy, 9.15*scale, 0, Math.PI*2);
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.beginPath(); c.arc(ox, oy, 3.5, 0, Math.PI*2); c.fill();

  // Ceza sahaları + kale önü + penaltı noktası (her iki uçta)
  const bigW = 16.5*scale, bigH = 40.3*scale;
  const smallW = 5.5*scale, smallH = 18.3*scale;
  const leftX = toPx(-LM3D_LEN/2, 0).x;
  const rightX = toPx(LM3D_LEN/2, 0).x;
  c.strokeRect(leftX, oy-bigH/2, bigW, bigH);
  c.strokeRect(rightX-bigW, oy-bigH/2, bigW, bigH);
  c.strokeRect(leftX, oy-smallH/2, smallW, smallH);
  c.strokeRect(rightX-smallW, oy-smallH/2, smallW, smallH);
  c.fillStyle = 'rgba(255,255,255,0.9)';
  [leftX + 11*scale, rightX - 11*scale].forEach(px=>{
    c.beginPath(); c.arc(px, oy, 3, 0, Math.PI*2); c.fill();
  });

  const tex = new THREE.CanvasTexture(cnv);
  tex.anisotropy = 4;
  return tex;
}

// Bir kale çerçevesi (direkler + üst direk + basit file) inşa eder.
function lm3DBuildGoal(sideDir){
  const g = new THREE.Group();
  const goalW = 7.32, goalH = 2.44, goalD = 2.2;
  const postMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x222222, roughness:0.35 });
  const postGeo = new THREE.CylinderGeometry(0.07,0.07,goalH,8);
  const crossGeo = new THREE.CylinderGeometry(0.07,0.07,goalW,8);

  const postL = new THREE.Mesh(postGeo, postMat);
  postL.position.set(0, goalH/2, -goalW/2);
  const postR = new THREE.Mesh(postGeo, postMat);
  postR.position.set(0, goalH/2, goalW/2);
  const cross = new THREE.Mesh(crossGeo, postMat);
  cross.rotation.x = Math.PI/2;
  cross.rotation.z = Math.PI/2;
  cross.position.set(0, goalH, 0);
  g.add(postL, postR, cross);

  // Basit file (yarı saydam arka + yan panel)
  const netMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.16, side:THREE.DoubleSide, wireframe:true });
  const backNet = new THREE.Mesh(new THREE.PlaneGeometry(goalW, goalH, 8, 4), netMat);
  backNet.position.set(sideDir * goalD, goalH/2, 0);
  backNet.rotation.y = Math.PI/2;
  const topNet = new THREE.Mesh(new THREE.PlaneGeometry(goalD, goalW, 4, 8), netMat);
  topNet.position.set(sideDir * goalD/2, goalH, 0);
  topNet.rotation.x = Math.PI/2;
  g.add(backNet, topNet);

  g.position.set(sideDir * LM3D_LEN/2, 0, 0);
  g.rotation.y = sideDir > 0 ? Math.PI : 0;
  return g;
}

// Forma dokusu — iki şerit, yaka ve küçük amblem ile gerçekçi bir kit görünümü
function lm3DJerseyTexture(colorInt, darkHex){
  const baseHex = '#' + colorInt.toString(16).padStart(6,'0');
  const cnv = document.createElement('canvas');
  cnv.width = 128; cnv.height = 128;
  const c = cnv.getContext('2d');
  c.fillStyle = baseHex; c.fillRect(0,0,128,128);
  c.fillStyle = 'rgba(255,255,255,0.5)';
  c.fillRect(22, 0, 16, 128);
  c.fillRect(90, 0, 16, 128);
  c.fillStyle = darkHex;
  c.fillRect(0, 0, 128, 12);
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(30, 34, 8, 0, Math.PI*2); c.fill();
  c.fillStyle = darkHex;
  c.beginPath(); c.arc(30, 34, 5, 0, Math.PI*2); c.fill();
  return new THREE.CanvasTexture(cnv);
}

function lm3DNumberTexture(number, dark){
  const cnv = document.createElement('canvas');
  cnv.width = 64; cnv.height = 64;
  const c = cnv.getContext('2d');
  c.fillStyle = dark;
  c.beginPath(); c.arc(32,32,30,0,Math.PI*2); c.fill();
  c.fillStyle = '#fff';
  c.font = 'bold 32px Arial';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(String(number), 32, 34);
  return new THREE.CanvasTexture(cnv);
}

// Tek bir oyuncu için 3D model (basit hiyerarşik figür) inşa eder.
function lm3DBuildPlayerMesh(team, role, number){

      new THREE.CylinderGeometry(0.085,0.1,0.72,6),
      new THREE.MeshStandardMaterial({ color: '#e8e8e8', roughness:0.7 })
    );
    leg.position.y = -0.36;
    leg.castShadow = true;
    pivot.add(leg);
    return pivot;
  }
  const legL = makeLeg(); legL.position.x = -0.11;

  const jerseyMat = new THREE.MeshStandardMaterial({ map: lm3DJerseyTexture(jerseyColor, jerseyDark), roughness:0.6 });
  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.26,0.32,0.62,10),
    jerseyMat
  );
  torso.position.y = 1.06;
  torso.castShadow = true;
  group.add(torso);

  // Kollar
  const armMat = jerseyMat;
  const armGeo = new THREE.CylinderGeometry(0.07,0.08,0.5,6);
  const armL = new THREE.Mesh(armGeo, armMat); armL.position.set(-0.33,1.12,0); armL.rotation.z = 0.28; armL.castShadow = true;
  const armR = new THREE.Mesh(armGeo, armMat); armR.position.set(0.33,1.12,0); armR.rotation.z = -0.28; armR.castShadow = true;
  group.add(armL, armR);

  // Kafa
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.16,10,10),

  );
  head.position.y = 1.55;
  head.castShadow = true;

  const hair = new THREE.Mesh(

    new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 })
  );
  hair.position.y = 1.58;
  group.add(hair);

  // Forma numarası (her zaman kameraya bakan sprite)
  const numSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lm3DNumberTexture(number, jerseyDark), transparent:true }));
  numSprite.position.set(0, 1.08, -0.34);
  numSprite.scale.set(0.34,0.34,0.34);
  group.add(numSprite);

  // Kontrol edilen oyuncu için altın halka
  const controlRing = new THREE.Mesh(

  );

  controlRing.position.y = 0.02;

  );
  ownerRing.rotation.x = -Math.PI/2;
  ownerRing.position.y = 0.018;
  ownerRing.visible = false;
  group.add(ownerRing);

  return { group, legL, legR, armL, armR, controlRing, ownerRing };
}

// Top için basit siyah-beyaz desenli küre + gölgesi
function lm3DBuildBall(){
  const cnv = document.createElement('canvas');
  cnv.width = 128; cnv.height = 128;
  const c = cnv.getContext('2d');
  c.fillStyle = '#f5f5f0'; c.fillRect(0,0,128,128);

  // Klasik siyah beşgenler — kabaca dağıtılmış, gerçek bir topa sarıldığında tanıdık desen verir
  function pentagon(cx, cy, r, rot){
    c.beginPath();
    for(let i=0;i<5;i++){
      const ang = rot + i * (Math.PI*2/5) - Math.PI/2;
      const px = cx + Math.cos(ang)*r, py = cy + Math.sin(ang)*r;
      if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    c.closePath();
    c.fillStyle = '#161616';
    c.fill();
  }
  pentagon(32, 30, 17, 0.3);
  pentagon(96, 26, 16, 1.1);
  pentagon(20, 92, 16, 2.0);
  pentagon(90, 96, 17, 0.7);
  pentagon(64, 62, 18, 0.5);
  c.strokeStyle = 'rgba(0,0,0,0.15)';
  c.lineWidth = 1;
  c.strokeRect(0,0,128,128);

  const tex = new THREE.CanvasTexture(cnv);
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.32,20,20),
    new THREE.MeshStandardMaterial({ map: tex, roughness:0.35, metalness:0.05 })
  );
  ball.castShadow = true;
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.3,14),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.4, depthWrite:false })
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.scale.set(1,0.6,1);
  shadow.position.y = 0.01;
  return { mesh: ball, shadow };
}

// Tribün dokusu — rastgele renkli koltuk noktacıklarından oluşan tekrarlanabilir bir desen
// Akşam maçı hissi veren gradyan gökyüzü (üstte lacivert, ufuğa doğru sıcak stadyum parıltısı) + yıldızlar
function lm3DBuildSkyTexture(){
  const cnv = document.createElement('canvas');
  cnv.width = 512; cnv.height = 512;
  const c = cnv.getContext('2d');
  const grad = c.createLinearGradient(0,0,0,512);
  grad.addColorStop(0, '#040810');
  grad.addColorStop(0.45, '#0d1b2e');
  grad.addColorStop(0.78, '#1c3350');
  grad.addColorStop(1, '#3d5470');
  c.fillStyle = grad;
  c.fillRect(0,0,512,512);
  // Yıldızlar
  c.fillStyle = 'rgba(255,255,255,0.8)';
  for(let i=0;i<160;i++){
    const y = Math.random()*300;
    c.globalAlpha = 0.25 + Math.random()*0.6;
    c.fillRect(Math.random()*512, y, 1.4, 1.4);
  }
  c.globalAlpha = 1;
  return new THREE.CanvasTexture(cnv);
}

function lm3DCrowdTexture(){
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 64;
  const c = cnv.getContext('2d');
  c.fillStyle = '#141b26';
  c.fillRect(0,0,256,64);
  const colors = ['#2b3a55','#3d4f70','#c0392b','#2980b9','#f1c40f','#ecf0f1','#27ae60'];
  for(let y=4;y<64;y+=6){
    for(let x=0;x<256;x+=5){
      if(Math.random() < 0.72){
        c.fillStyle = colors[Math.floor(Math.random()*colors.length)];
        c.fillRect(x + Math.random()*2, y + Math.random()*2, 3, 4);
      }
    }
  }
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// Tribünler + aydınlatma direkleri + korner bayrakları — sahanın çevresindeki atmosfer
function lm3DBuildStadium(){
  const group = new THREE.Group();
  const crowdTexLong = lm3DCrowdTexture(); crowdTexLong.repeat.set(10,2);
  const crowdTexShort = lm3DCrowdTexture(); crowdTexShort.repeat.set(6,2);
  const standMatLong = new THREE.MeshStandardMaterial({ map: crowdTexLong, roughness:0.9 });
  const standMatShort = new THREE.MeshStandardMaterial({ map: crowdTexShort, roughness:0.9 });

  // Yan tribünler (taç çizgileri boyunca, hafif geriye eğik)
  [-1,1].forEach(dir=>{
    const stand = new THREE.Mesh(new THREE.BoxGeometry(LM3D_LEN+26, 13, 9), standMatLong);
    stand.position.set(0, 6, dir*(LM3D_WID/2 + 15));
    stand.rotation.x = dir>0 ? -0.26 : 0.26;
    group.add(stand);
  });

  // Kale arkası tribünler
  [-1,1].forEach(dir=>{
    const stand = new THREE.Mesh(new THREE.BoxGeometry(9, 12, LM3D_WID+18), standMatShort);
    stand.position.set(dir*(LM3D_LEN/2 + 13), 5.5, 0);
    stand.rotation.z = dir>0 ? 0.24 : -0.24;
    group.add(stand);
  });

  // Aydınlatma direkleri (4 köşe) — lamba başlığı sahaya bakar, hafif sıcak ışık verir
  const poleMat = new THREE.MeshStandardMaterial({ color:0x2a2f36, roughness:0.6 });
  const lampMat = new THREE.MeshBasicMaterial({ color:0xfff6d8 });
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dx,dz])=>{
    const poleX = dx*(LM3D_LEN/2 + 20), poleZ = dz*(LM3D_WID/2 + 20);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,24,8), poleMat);
    pole.position.set(poleX, 12, poleZ);
    group.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(5,2.4,1.2), lampMat);
    lamp.position.set(poleX, 24, poleZ);
    lamp.lookAt(0, 15, 0);
    group.add(lamp);
    const glow = new THREE.PointLight(0xfff2cc, 0.5, 70);
    glow.position.set(poleX, 23, poleZ);
    group.add(glow);
  });

  // Korner bayrakları
  const flagMat = new THREE.MeshBasicMaterial({ color:0xff5533, side:THREE.DoubleSide });
  const poleThinMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.5 });
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dx,dz])=>{
    const cx = dx*(LM3D_LEN/2 - 0.3), cz = dz*(LM3D_WID/2 - 0.3);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,1.0,6), poleThinMat);
    pole.position.set(cx, 0.5, cz);
    group.add(pole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.2), flagMat);
    flag.position.set(cx + 0.14, 0.92, cz);
    group.add(flag);
  });

  return group;
}

      moveTimer: Math.random() * 120,
      legOffset: Math.random() * Math.PI * 2
    });
  });

  liveMatchBall = {
    x: liveCanvas.width / 2,
    y: liveCanvas.height / 2,
    vx: 0.5,
    vy: 0.3,
    spin: 0,
    height: 0
  };

  // Kullanıcının yönettiği oyuncuyu işaretle (kendi takımının santraforu)
  const controlledIdx = isUserHome === false ? 21 : 10;
  lmUserPlayer = liveMatchPlayers[controlledIdx] || null;
  if(lmUserPlayer) lmUserPlayer.controlled = true;
  lmBallOwner = null;
  lmBallCooldownPlayer = null;
  lmBallCooldownUntil = 0;
  lmPrevOwner = null;
  lmUserFlashUntil = 0;
  lmLastPass = null;
  lmJoystick = { active:false, baseX:0, baseY:0, dx:0, dy:0 };

  // ---- 3D sahne kurulumu ----
  if(typeof THREE === 'undefined'){
    // Three.js CDN'den yüklenemediyse (ağ engeli vb.) sessizce eski davranışa düş —
    // fizik/kontroller yine çalışır, sadece görsel render atlanır.
    lm3D = null;
    animate3DMatch();
    return;
  }

  const renderer = new THREE.WebGLRenderer({ canvas: liveCanvas, antialias:true });
  renderer.setSize(liveCanvas.width, liveCanvas.height, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = lm3DBuildSkyTexture();
  scene.fog = new THREE.Fog(0x0d1b2b, 60, 170);

  const camera = new THREE.PerspectiveCamera(64, liveCanvas.width / Math.max(1,liveCanvas.height), 0.1, 500);

  scene.add(new THREE.AmbientLight(0xa8bcd8, 1.0));
  const sun = new THREE.DirectionalLight(0xfff3d6, 0.9);
  sun.position.set(40, 70, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -LM3D_LEN/2 - 10;
  sun.shadow.camera.right = LM3D_LEN/2 + 10;
  sun.shadow.camera.top = LM3D_WID/2 + 10;
  sun.shadow.camera.bottom = -LM3D_WID/2 - 10;
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = 150;
  sun.shadow.bias = -0.0015;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x3fa7ff, 0.25);
  rim.position.set(-40, 30, -30);
  scene.add(rim);

  // Saha
  const pitchTex = lm3DBuildPitchTexture();
  const pitchMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(LM3D_LEN + LM3D_BORDER*2, LM3D_WID + LM3D_BORDER*2),
    new THREE.MeshStandardMaterial({ map: pitchTex, roughness:0.95 })
  );
  pitchMesh.rotation.x = -Math.PI/2;
  pitchMesh.receiveShadow = true;
  scene.add(pitchMesh);

  scene.add(lm3DBuildGoal(-1));
  scene.add(lm3DBuildGoal(1));
  scene.add(lm3DBuildStadium());

  // Oyuncu modelleri
  const playerMeshes = liveMatchPlayers.map(p => {
    const m = lm3DBuildPlayerMesh(p.team, p.role, p.number + 1);
    scene.add(m.group);
    return m;
  });

  // Top
  const ballParts = lm3DBuildBall();
  scene.add(ballParts.mesh, ballParts.shadow);

  // Nişan halkası (şut için basılı tutulduğunda kale ağzında belirir)
  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.55,0.72,28),
    new THREE.MeshBasicMaterial({ color:0xffd700, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false })
  );
  reticle.rotation.x = -Math.PI/2;
  reticle.visible = false;
  scene.add(reticle);

  // Pas izi çizgisi
  const passLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const passLine = new THREE.Line(passLineGeo, new THREE.LineDashedMaterial({ color:0xffffff, dashSize:1.2, gapSize:0.8, transparent:true, opacity:0 }));
  scene.add(passLine);

  lm3D = {
    renderer, scene, camera, pitchMesh,
    playerMeshes, ballParts, reticle, passLine,
    camX: 0, camZ: 0
  };

  const resizeHandler = () => {
    if (!liveCanvas || !lm3D) return;
    liveCanvas.width = container.clientWidth;
    liveCanvas.height = container.clientHeight;
    lm3D.renderer.setSize(liveCanvas.width, liveCanvas.height, false);
    lm3D.camera.aspect = liveCanvas.width / Math.max(1, liveCanvas.height);
    lm3D.camera.updateProjectionMatrix();
  };
  lm3D.resizeHandler = resizeHandler;
  window.addEventListener('resize', resizeHandler);

  animate3DMatch();
}

function animate3DMatch() {
  if (!liveCanvas) return;

  liveMatchAnimationId = requestAnimationFrame(animate3DMatch);
  matchFrameTime++;

  const w = liveCanvas.width;
  const h = liveCanvas.height;

  // Oyuncuları güncelle (AI hareketi / kullanıcı joystick'i)
  liveMatchPlayers.forEach(player => {
    if(player.controlled){
      // Kullanıcının joystick ile yönettiği oyuncu
      if(Math.hypot(lmJoystick.dx, lmJoystick.dy) > 0.08){
        player.x += lmJoystick.dx * player.speed * 1.3;
        player.y += lmJoystick.dy * player.speed * 1.3;
        player.angle = Math.atan2(lmJoystick.dy, lmJoystick.dx);
      }
    } else {
      player.moveTimer++;

      // Oyuncuyu topu takip ettir
      const ballDist = Math.hypot(liveMatchBall.x - player.x, liveMatchBall.y - player.y);

      if (ballDist < 160 && Math.random() < 0.012) {
        player.targetX = liveMatchBall.x + (Math.random() - 0.5) * 70;
        player.targetY = liveMatchBall.y + (Math.random() - 0.5) * 70;
      }

      if (player.moveTimer > 170) {
        const range = player.role === 'GK' ? 30 : 85;
        let biasX = 0;
        if(player.role !== 'GK' && lmBallOwner){
          const forwardDir = player.team === 'home' ? 1 : -1;
          biasX = lmBallOwner.team === player.team ? forwardDir * 42 : -forwardDir * 36;
        }
        player.targetX = player.baseX + biasX + (Math.random() - 0.5) * range;
        player.targetY = player.baseY + (Math.random() - 0.5) * range;
        player.moveTimer = 0;
      }

      // Hedefe doğru hareket
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 2) {
        player.x += (dx / dist) * player.speed;
        player.y += (dy / dist) * player.speed;
        player.angle = Math.atan2(dy, dx);
      }
    }

    // Saha sınırları
    const margin = 45;
    player.x = Math.max(margin, Math.min(w - margin, player.x));
    player.y = Math.max(margin, Math.min(h - margin, player.y));
  });

  // ===== Top sahipliği: en yakın oyuncu topu ayağında tutar, takımlar birbirine
  // gerçekçi pas trafiği oluşturur; kullanıcıya pas önceliklidir =====
  if(!lmBallOwner){
    let claimant = null, bestDist = 26;
    liveMatchPlayers.forEach(p=>{
      if(p === lmBallCooldownPlayer && matchFrameTime < lmBallCooldownUntil) return;
      const d = Math.hypot(liveMatchBall.x - p.x, liveMatchBall.y - p.y);
      if(d < bestDist){ bestDist = d; claimant = p; }
    });
    if(claimant) lmBallOwner = claimant;
  }
  if(lmBallOwner !== lmPrevOwner && lmBallOwner === lmUserPlayer){
    lmUserFlashUntil = matchFrameTime + 26;
  }
  lmPrevOwner = lmBallOwner;

  // ===== Baskı / top kapma: topa sahip oyuncuya yakından yaklaşan bir rakip
  // onu üzerinden alabilir — artık topu tutmak tehlikesiz değil, savunma
  // baskısı gerçek bir risk oluşturuyor =====
  if(lmBallOwner){
    const owner = lmBallOwner;
    let tackler = null, tacklerDist = 32;
    liveMatchPlayers.forEach(p=>{
      if(p.team === owner.team || p.role === 'GK') return;
      if(p === lmBallCooldownPlayer && matchFrameTime < lmBallCooldownUntil) return;
      const d = Math.hypot(p.x - owner.x, p.y - owner.y);
      if(d < tacklerDist){ tacklerDist = d; tackler = p; }
    });
    if(tackler && Math.random() < 0.03){
      const dx = tackler.x - owner.x, dy = tackler.y - owner.y;
      const dd = Math.hypot(dx, dy) || 1;
      liveMatchBall.vx = (dx / dd) * 2.4 + (Math.random() - 0.5) * 1.4;
      liveMatchBall.vy = (dy / dd) * 2.4 + (Math.random() - 0.5) * 1.4;
      liveMatchBall.height = 0;
      lmBallCooldownPlayer = owner;
      lmBallCooldownUntil = matchFrameTime + 16;
      lmBallOwner = null;
      if(owner === lmUserPlayer && liveMatchAnim){
        lmPushFeed(liveMatchAnim, `<span style="color:var(--ink-dim);">${liveMatchAnim.minute}' Rakip oyuncu topu ayağından aldı.</span>`);
      }
    }
  }
  if(lmBallOwner){
    const owner = lmBallOwner;
    liveMatchBall.x = owner.x + Math.cos(owner.angle) * 22;
    liveMatchBall.y = owner.y + Math.sin(owner.angle) * 22;
    liveMatchBall.vx = 0;
    liveMatchBall.vy = 0;
    const margin2 = 40;
    liveMatchBall.x = Math.max(margin2, Math.min(liveCanvas.width - margin2, liveMatchBall.x));
    liveMatchBall.y = Math.max(margin2, Math.min(liveCanvas.height - margin2, liveMatchBall.y));
    if(owner !== lmUserPlayer){
      if(Math.random() < 0.02){
        // En uygun takım arkadaşını bul — kullanıcıya pas önceliklidir
        let receiver = null, bestScore = -Infinity;
        liveMatchPlayers.forEach(p=>{
          if(p === owner || p.team !== owner.team) return;
          const d = Math.hypot(p.x - owner.x, p.y - owner.y);
          if(d > 260 || d < 40) return;
          let score = 300 - d;
          if(p === lmUserPlayer) score += 160;
          if(score > bestScore){ bestScore = score; receiver = p; }
        });
        if(receiver){
          const dx = receiver.x - liveMatchBall.x, dy = receiver.y - liveMatchBall.y;
          const dist = Math.hypot(dx, dy) || 1;
          const power = 6 + Math.random() * 1.5;
          liveMatchBall.vx = (dx / dist) * power;
          liveMatchBall.vy = (dy / dist) * power;
          liveMatchBall.height = power * 1.6;
          lmBallCooldownPlayer = owner;
          lmBallCooldownUntil = matchFrameTime + 20;
          lmLastPass = { fx: owner.x, fy: owner.y, team: owner.team, start: matchFrameTime };
          lmBallOwner = null;
        }
      } else if(Math.random() < 0.006){
        // Topu ileri sür/bırak — sonsuza kadar yapışık kalmasın
        const ang = owner.angle + (Math.random() - 0.5) * 0.8;
        liveMatchBall.vx = Math.cos(ang) * (1.4 + Math.random());
        liveMatchBall.vy = Math.sin(ang) * (1.4 + Math.random());
        lmBallCooldownPlayer = owner;
        lmBallCooldownUntil = matchFrameTime + 12;
        lmBallOwner = null;
      }
    }
  } else {
    // Top
    updateBall(liveCanvas.width, liveCanvas.height);
  }

  // Pas/Şut butonlarının durumunu topa sahip olup olmadığına göre güncelle
  if(matchFrameTime % 6 === 0){
    const hasBall = lmBallOwner === lmUserPlayer;
    const passBtn = document.getElementById('lm-pass-btn');
    const shootBtn = document.getElementById('lm-shoot-btn');
    if(passBtn) passBtn.classList.toggle('lm-btn-disabled', !hasBall);
    if(shootBtn) shootBtn.classList.toggle('lm-btn-disabled', !hasBall);
  }

  if(lm3D) lm3DSyncScene();
}

// Fizik durumundan (liveMatchPlayers/liveMatchBall) 3D sahnedeki model
// konumlarını, kamerayı ve efektleri günceller, ardından render eder.
function lm3DSyncScene(){
  const { scene, camera, renderer, playerMeshes, ballParts, reticle, passLine } = lm3D;

  // Oyuncular
  liveMatchPlayers.forEach((player, idx) => {
    const m = playerMeshes[idx];
    if(!m) return;
    const wp = lm3DToWorld(player.x, player.y);
    m.group.position.set(wp.x, 0, wp.z);

    // Yönü: bir sonraki adımdaki hedef noktaya bakacak şekilde (sign hatasından bağımsız, güvenli)
    const lookPx = player.x + Math.cos(player.angle) * 10;
    const lookPy = player.y + Math.sin(player.angle) * 10;
    const lookWorld = lm3DToWorld(lookPx, lookPy);
    m.group.lookAt(lookWorld.x, 0, lookWorld.z);

    // Bacak sallanma animasyonu
    const legSwing = Math.sin(matchFrameTime * 0.15 + player.legOffset) * 0.5;
    m.legL.rotation.x = legSwing;
    m.legR.rotation.x = -legSwing;
    m.armL.rotation.x = -legSwing * 0.75;
    m.armR.rotation.x = legSwing * 0.75;

    // Kontrol/sahiplik halkaları
    m.controlRing.visible = !!player.controlled;
    if(player.controlled && matchFrameTime < lmUserFlashUntil){
      const ft = 1 - (lmUserFlashUntil - matchFrameTime) / 26;
      m.controlRing.scale.setScalar(1 + ft*0.9);
      m.controlRing.material.opacity = 0.95 * (1 - ft) + 0.5;
    } else {
      m.controlRing.scale.setScalar(1);
      m.controlRing.material.opacity = 0.95;
    }
    m.ownerRing.visible = (!player.controlled && player === lmBallOwner);
  });

  // Top
  const ballWorld = lm3DToWorld(liveMatchBall.x, liveMatchBall.y);
  const ballY = 0.32 + (liveMatchBall.height || 0) / 6;
  ballParts.mesh.position.set(ballWorld.x, ballY, ballWorld.z);
  ballParts.mesh.rotation.x += 0.15 + (liveMatchBall.spin||0)*0.01;
  ballParts.mesh.rotation.z += 0.05;
  const shrink = Math.max(0.35, 1 - (liveMatchBall.height||0) * 0.02);
  ballParts.shadow.position.set(ballWorld.x, 0.01, ballWorld.z);
  ballParts.shadow.scale.set(shrink, shrink*0.6, shrink);
  ballParts.shadow.material.opacity = Math.max(0.08, 0.4 - (liveMatchBall.height||0)*0.01);

  // Nişan halkası (şut için basılı tutulurken)
  if(lmCharging && lmUserPlayer && lmBallOwner === lmUserPlayer){
    const goalWx = lmUserPlayer.team === 'home' ? LM3D_LEN/2 : -LM3D_LEN/2;
    const aimZ = (lmJoystick.dy || 0) * 3.4;
    const t = (Math.sin(matchFrameTime * 0.35) + 1) / 2;
    reticle.position.set(goalWx, 0.03, aimZ);
    reticle.scale.setScalar(1 + t*0.18);
    reticle.material.opacity = 0.55 + t*0.35;
    reticle.visible = true;
  } else {
    reticle.visible = false;
  }

  // Pas izi
  if(lmLastPass && matchFrameTime - lmLastPass.start < 18){
    const t = (matchFrameTime - lmLastPass.start) / 18;
    const fromW = lm3DToWorld(lmLastPass.fx, lmLastPass.fy);
    const pts = [
      new THREE.Vector3(fromW.x, 0.06, fromW.z),
      new THREE.Vector3(ballWorld.x, 0.06, ballWorld.z)
    ];
    passLine.geometry.setFromPoints(pts);
    passLine.computeLineDistances();
    passLine.material.color.set(lmLastPass.team === 'home' ? 0x0099ff : 0xff3c3c);
    passLine.material.opacity = 0.6 * (1 - t);
  } else {
    passLine.material.opacity = 0;
  }

  // Kamera: mobil futbol oyunlarındaki gibi sahaya yakın, alçak, topu HEM uzunlamasına
  // HEM enlemesine takip eden dinamik "aksiyon kamerası". Gol anında kaleye doğru
  // dramatik bir yakınlaşma yapılır.
  const inGoalZoom = lm3D.goalZoomUntil && matchFrameTime < lm3D.goalZoomUntil;
  if(inGoalZoom){
    const goalWx = lm3D.goalZoomSide === 'home' ? LM3D_LEN/2 - 6 : -LM3D_LEN/2 + 6;
    lm3D.camX = THREE.MathUtils.lerp(lm3D.camX || 0, goalWx, 0.09);
    camera.position.set(lm3D.camX, 12, LM3D_WID/2 * 0.55);
    camera.lookAt(goalWx, 1.5, 0);
  } else {
    const targetX = THREE.MathUtils.clamp(ballWorld.x * 0.9, -LM3D_LEN/2 + 8, LM3D_LEN/2 - 8);
    const targetZ = THREE.MathUtils.clamp(ballWorld.z * 0.55, -LM3D_WID/2 + 6, LM3D_WID/2 - 6);
    lm3D.camX = THREE.MathUtils.lerp(lm3D.camX || 0, targetX, 0.07);
    lm3D.camZ = THREE.MathUtils.lerp(lm3D.camZ || 0, targetZ, 0.07);
    const back = LM3D_WID/2 * 0.62 + 15;
    camera.position.set(lm3D.camX, 15.5, lm3D.camZ + back);
    camera.lookAt(lm3D.camX, 1.3, lm3D.camZ);
  }

  renderer.render(scene, camera);
}

function updateBall(w, h) {
  liveMatchBall.x += liveMatchBall.vx;
  liveMatchBall.y += liveMatchBall.vy;

  // Saha sınırları
  if (liveMatchBall.x < 35 || liveMatchBall.x > w - 35) {
    liveMatchBall.vx *= -0.8;
    liveMatchBall.x = Math.max(35, Math.min(w - 35, liveMatchBall.x));
  }
  if (liveMatchBall.y < 35 || liveMatchBall.y > h - 35) {
    liveMatchBall.vy *= -0.8;
    liveMatchBall.y = Math.max(35, Math.min(h - 35, liveMatchBall.y));
  }

  // Hava direnci
  liveMatchBall.vx *= 0.99;
  liveMatchBall.vy *= 0.99;

  // Yükseklik: vuruş/pas anında verilen ivmeye göre yükselir, sonra yere doğru söner —
  // gerçek bir "vuruş yayı" hissi verir. Yere değince hız varsa hafifçe sekiyor.
  const speed = Math.hypot(liveMatchBall.vx, liveMatchBall.vy);
  const wasAirborne = (liveMatchBall.height || 0) > 0.6;
  liveMatchBall.height = (liveMatchBall.height || 0) * 0.965;
  if(liveMatchBall.height < 0.6 && wasAirborne && speed > 1.5){
    liveMatchBall.height = Math.min(6, speed * 0.55); // sekme
  } else if(liveMatchBall.height < 0.05){
    liveMatchBall.height = 0;
  }

  // Spin
  liveMatchBall.spin += 0.1;
}

function dispose3DMatch() {
  if (liveMatchAnimationId) {
    cancelAnimationFrame(liveMatchAnimationId);
    liveMatchAnimationId = null;
  }
  if(lm3D){
    if(lm3D.resizeHandler) window.removeEventListener('resize', lm3D.resizeHandler);
    try {
      lm3D.scene.traverse(obj=>{
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material){
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach(mat=>{ if(mat.map) mat.map.dispose(); mat.dispose(); });
        }
      });
      lm3D.renderer.dispose();
      lm3D.renderer.forceContextLoss();
    } catch(err){ /* temizlik başarısız olsa bile maç akışı kesilmesin */ }
    lm3D = null;
  }
  liveCanvas = null;
  liveCanvasCtx = null;
  liveMatchPlayers = [];
  lmUserPlayer = null;
  lmBallOwner = null;
  lmBallCooldownPlayer = null;
  lmBallCooldownUntil = 0;
  lmPrevOwner = null;
  lmUserFlashUntil = 0;
  lmLastPass = null;
  lmJoystick = { active:false, baseX:0, baseY:0, dx:0, dy:0 };
  lmCharging = false;
}


// ============================================
// DOKUNMATİK KONTROLLER (joystick + pas + şut) — mobil için "kendi oyuncunu oynama"
// ------------------------------------------------------------
// ŞUT artık basılı-tut/bırak ile GÜÇ, joystick yönüyle NİŞAN alınan gerçek bir
// mini-oyun: sonucu (gol/kurtarış/direk/auta) gerçekten hesaplanıyor ve —
// sırası gelen bir takım golüyse ya da elindeki Altın Fırsat bonus hakkıysa —
// maçın gerçek gidişatını etkiliyor. PAS ise "Ritim" barını doldurup şut
// isabetini ve bonus şut hakkını artırıyor.
// ============================================

function lmResolveShot(power) {
  if (lmBallOwner !== lmUserPlayer || !lmUserPlayer || !liveCanvas) return;
  const a = liveMatchAnim;
  power = Math.max(0.1, Math.min(1, power));

  const aimY = lmJoystick.dy || 0; // -1..1, nişan (kaleye dikey konum)
  const cornerBias = Math.min(1, Math.abs(aimY) * 1.4);

  const goalX = lmUserPlayer.team === 'home' ? liveCanvas.width - 20 : 20;
  const goalY = liveCanvas.height / 2 + aimY * 100;
  const dx = goalX - liveMatchBall.x;
  const dy = goalY - liveMatchBall.y;
  const dist = Math.hypot(dx, dy) || 1;
  const shotSpeed = 7 + power * 5;
  liveMatchBall.vx = (dx / dist) * shotSpeed;
  liveMatchBall.vy = (dy / dist) * shotSpeed;
  liveMatchBall.height = 4 + power * 22;
  lmBallCooldownPlayer = lmUserPlayer;
  lmBallCooldownUntil = matchFrameTime + 22;
  lmLastPass = { fx: lmUserPlayer.x, fy: lmUserPlayer.y, team: lmUserPlayer.team, start: matchFrameTime };
  lmBallOwner = null;

  if (!a) return;
  a.personalStats.shots++;

  const pending = lmFindPendingOwnGoal(a);
  const powerFactor = 1 - Math.abs(power - 0.72) * 0.9; // ~%72 güçte en isabetli
  const momentumBonus = (a.momentum || 0) / 100 * 0.18;
  const riskBonus = cornerBias * 0.22; // köşeye nişan almak zorsa da isabet olursa daha değerli

  let chance;
  if (pending) {
    chance = 0.5 + powerFactor * 0.22 + momentumBonus + riskBonus * 0.5;
  } else if ((a.bonusAttemptsLeft || 0) > 0) {
    chance = 0.24 + powerFactor * 0.18 + momentumBonus + riskBonus * 0.3;
  } else {
    chance = 0.1 + powerFactor * 0.08 + momentumBonus * 0.5;
  }
  chance = Math.max(0.05, Math.min(0.93, chance));

  const success = Math.random() < chance;

  if (success) {
    a.personalStats.goals++;
    if (pending) {
      lmApplyGoalEvent(a, pending, true);
    } else if ((a.bonusAttemptsLeft || 0) > 0) {
      lmApplyBonusGoal(a);
    } else {
      // takıma zaten öngörülen gol kalmadı — yine de güzel bir vuruştu
      lmPushFeed(a, `<span style="color:var(--ink-dim);">${a.minute}' Şutun kaleciye çok yakındı ama takımın için ekstra gol hakkı kalmadı.</span>`);
    }
  } else {
    const roll = Math.random();
    const kind = roll < 0.5 ? 'save' : (roll < 0.78 ? 'post' : 'wide');
    lmApplyMiss(a, kind);
  }
}

function lmPass() {
  if (lmBallOwner !== lmUserPlayer || !lmUserPlayer || !liveCanvas) return;
  let target = null, bestDist = Infinity;
  liveMatchPlayers.forEach(p => {
    if (p === lmUserPlayer || p.team !== lmUserPlayer.team) return;
    const d = Math.hypot(p.x - lmUserPlayer.x, p.y - lmUserPlayer.y);
    if (d < bestDist) { bestDist = d; target = p; }
  });
  if (!target) return;
  const dx = target.x - liveMatchBall.x;
  const dy = target.y - liveMatchBall.y;
  const dist = Math.hypot(dx, dy) || 1;
  const power = 6 + Math.random() * 1.5;
  liveMatchBall.vx = (dx / dist) * power;
  liveMatchBall.vy = (dy / dist) * power;
  liveMatchBall.height = power * 1.6;
  lmBallCooldownPlayer = lmUserPlayer;
  lmBallCooldownUntil = matchFrameTime + 20;
  lmLastPass = { fx: lmUserPlayer.x, fy: lmUserPlayer.y, team: lmUserPlayer.team, start: matchFrameTime };
  lmBallOwner = null;

  const a = liveMatchAnim;
  if (a) {
    a.personalStats.passes++;
    const before = a.momentum || 0;
    a.momentum = Math.min(100, before + 9);
    if (before < 100 && a.momentum >= 100) {
      a.momentum = 35;
      a.bonusAttemptsLeft = (a.bonusAttemptsLeft || 0) + 1;
      lmPushFeed(a, `<span style="color:var(--gold);">🔥 Ritmin doldu — bonus şut hakkı kazandın!</span>`);
      lmShowBanner('🔥 RİTİM DOLDU!', { hold: 900 });
    }
    lmRefreshStatusDOM(a);
  }
}

function setupLiveMatchTouchControls() {
  const base = document.getElementById('lm-joystick-base');
  const knob = document.getElementById('lm-joystick-knob');
  const shootBtn = document.getElementById('lm-shoot-btn');
  const passBtn = document.getElementById('lm-pass-btn');
  const powerBar = document.getElementById('lm-power-bar');
  const powerFill = document.getElementById('lm-power-fill');
  if (!base || !knob) return;
  const maxDist = 26;

  function applyKnob(clientX, clientY) {
    let dx = clientX - lmJoystick.baseX;
    let dy = clientY - lmJoystick.baseY;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    lmJoystick.dx = dx / maxDist;
    lmJoystick.dy = dy / maxDist;
  }

  function startJoystick(clientX, clientY) {
    lmJoystick.active = true;
    const rect = base.getBoundingClientRect();
    lmJoystick.baseX = rect.left + rect.width / 2;
    lmJoystick.baseY = rect.top + rect.height / 2;
    applyKnob(clientX, clientY);
  }

  function endJoystick() {
    lmJoystick.active = false;
    lmJoystick.dx = 0;
    lmJoystick.dy = 0;
    knob.style.transform = 'translate(0px, 0px)';
  }

  base.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    startJoystick(t.clientX, t.clientY);
  }, { passive: false });
  base.addEventListener('touchmove', (e) => {
    if (!lmJoystick.active) return;
    e.preventDefault();
    const t = e.touches[0];
    applyKnob(t.clientX, t.clientY);
  }, { passive: false });
  base.addEventListener('touchend', endJoystick);
  base.addEventListener('touchcancel', endJoystick);
  base.addEventListener('mousedown', (e) => { e.preventDefault(); startJoystick(e.clientX, e.clientY); });

  // ---- ŞUT: basılı tut = güç doldur, bırak = vur ----
  const MAX_CHARGE_MS = 900;
  let chargeStartAt = 0;
  let charging = false;
  let chargeRAF = null;

  function chargeLoop() {
    if (!charging) return;
    const elapsed = Date.now() - chargeStartAt;
    const pct = Math.min(100, (elapsed / MAX_CHARGE_MS) * 100);
    if (powerFill) powerFill.style.width = pct + '%';
    chargeRAF = requestAnimationFrame(chargeLoop);
  }

  function beginCharge(e) {
    e.preventDefault();
    e.stopPropagation();
    if (lmBallOwner !== lmUserPlayer) return;
    charging = true;
    lmCharging = true;
    chargeStartAt = Date.now();
    if (powerBar) powerBar.classList.add('lm-power-visible');
    chargeLoop();
  }

  function releaseCharge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!charging) return;
    charging = false;
    lmCharging = false;
    if (chargeRAF) cancelAnimationFrame(chargeRAF);
    const elapsed = Date.now() - chargeStartAt;
    const power = Math.max(0.1, Math.min(1, elapsed / MAX_CHARGE_MS));
    if (powerBar) powerBar.classList.remove('lm-power-visible');
    if (powerFill) powerFill.style.width = '0%';
    lmResolveShot(power);
    shootBtn.classList.add('lm-shoot-pop');
    setTimeout(() => shootBtn.classList.remove('lm-shoot-pop'), 300);
  }

  if (shootBtn) {
    shootBtn.addEventListener('touchstart', beginCharge, { passive: false });
    shootBtn.addEventListener('mousedown', beginCharge);
    shootBtn.addEventListener('touchend', releaseCharge, { passive: false });
    shootBtn.addEventListener('touchcancel', releaseCharge, { passive: false });
    shootBtn.addEventListener('mouseup', releaseCharge);
    shootBtn.addEventListener('mouseleave', () => { if (charging) releaseCharge(); });
  }

  if (passBtn) {
    const doPass = (e) => {
      e.preventDefault();
      e.stopPropagation();
      lmPass();
      passBtn.classList.add('lm-shoot-pop');
      setTimeout(() => passBtn.classList.remove('lm-shoot-pop'), 300);
    };
    passBtn.addEventListener('touchstart', doPass, { passive: false });
    passBtn.addEventListener('click', doPass);
  }

  // Fare ile sürüklemeyi takip eden pencere seviyesi dinleyiciler — sadece bir kez bağlanır
  if (!lmControlsBoundGlobal) {
    lmControlsBoundGlobal = true;
    window.addEventListener('mousemove', (e) => {
      if (!lmJoystick.active) return;
      const k = document.getElementById('lm-joystick-knob');
      if (!k) { lmJoystick.active = false; return; }
      let dx = e.clientX - lmJoystick.baseX;
      let dy = e.clientY - lmJoystick.baseY;
      const dist = Math.hypot(dx, dy);
      const md = 26;
      if (dist > md) { dx = (dx / dist) * md; dy = (dy / dist) * md; }
      k.style.transform = `translate(${dx}px, ${dy}px)`;
      lmJoystick.dx = dx / md;
      lmJoystick.dy = dy / md;
    });
    window.addEventListener('mouseup', () => {
      if (!lmJoystick.active) return;
      lmJoystick.active = false;
      lmJoystick.dx = 0;
      lmJoystick.dy = 0;
      const k = document.getElementById('lm-joystick-knob');
      if (k) k.style.transform = 'translate(0px, 0px)';
    });
  }
}

  render();

  refreshSavedPayloadCache().then(() => { render(); });
})();
